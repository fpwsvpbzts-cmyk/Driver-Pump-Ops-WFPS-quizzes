<script>
(function () {
  const LETTERS = 'ABCDEF';
  const STORE = 'do-quiz-v1';
  const TITLES = {};
  SOURCES.QUIZ.forEach(c => TITLES[c.ch] = c.title);

  // Question ids: quizzes keep the original "ch-n" ids so earlier progress carries over; tests use "T-ch-n"
  const Q = {};
  const ids = { QUIZ: {}, TEST: {} };
  ['QUIZ', 'TEST'].forEach(src => SOURCES[src].forEach(c => {
    ids[src][c.ch] = c.qs.map(q => {
      const id = (src === 'TEST' ? 'T-' : '') + c.ch + '-' + q.n;
      Q[id] = Object.assign({ src: src, ch: c.ch }, q);
      return id;
    });
  }));
  const chaptersOf = src => src === 'BOTH'
    ? [...new Set([...SOURCES.QUIZ, ...SOURCES.TEST].map(c => c.ch))].sort((a, b) => a - b)
    : SOURCES[src].map(c => c.ch);
  const idsFor = (src, ch) => {
    const srcs = src === 'BOTH' ? ['QUIZ', 'TEST'] : [src];
    let out = [];
    srcs.forEach(s => Object.keys(ids[s]).forEach(k => { if (ch === 'all' || +k === ch || (ch === 'range' && +k >= rng.from && +k <= rng.to)) out = out.concat(ids[s][k]); }));
    return out;
  };

  let saved = { answers: {}, hist: {}, src: 'QUIZ', scope: 'all' };
  try { saved = Object.assign(saved, JSON.parse(localStorage.getItem(STORE)) || {}); } catch (e) {}
  const answers = saved.answers;
  let src = ['QUIZ', 'TEST', 'BOTH'].includes(saved.src) ? saved.src : 'QUIZ';
  let scope = saved.scope;
  const allChs = chaptersOf('BOTH');
  let rng = saved.rng && allChs.includes(saved.rng.from) && allChs.includes(saved.rng.to) ? saved.rng : { from: allChs[0], to: allChs[allChs.length - 1] };
  const okScope = s => s === 'all' || s === 'stats' || s === 'range' || chaptersOf(src).includes(s);
  if (!okScope(scope)) scope = 'all';
  // hist keeps every attempt (t = tries, c = correct, w = wrong) and is not cleared by Reset or Retry missed
  const hist = saved.hist || {};
  Object.keys(answers).forEach(id => { if (Q[id] && !hist[id]) { const ok = answers[id] === Q[id].a; hist[id] = { t: 1, c: ok ? 1 : 0, w: ok ? 0 : 1, s: ok ? 1 : 0 }; } });
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ answers, hist, src, scope, rng })); } catch (e) {} };

  let order = [], optOrder = {};
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const shuffleArr = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const isRight = id => answers[id] === Q[id].a;
  const stat = list => { const a = list.filter(id => id in answers).length; return a ? list.filter(isRight).length + '/' + a : list.length + ' q'; };

  function buildScope(shuffle) {
    const isStats = scope === 'stats';
    document.querySelector('.bar').hidden = isStats;
    document.querySelector('.progress').hidden = isStats;
    $('list').hidden = isStats;
    $('stats').hidden = !isStats;
    if (isStats) { order = []; renderStats(); renderNav(); return; }
    let list = idsFor(src, scope);
    const multi = scope === 'all' || scope === 'range';
    const count = multi ? +$('count').value : 0;
    if (count > 0) { list = shuffleArr(list).slice(0, count); shuffle = true; }
    order = shuffle ? shuffleArr(list) : list;
    optOrder = {};
    order.forEach(id => { const idx = Q[id].o.map((_, i) => i); optOrder[id] = shuffle ? shuffleArr(idx) : idx; });
    $('count').hidden = !multi;
    $('rangeBox').hidden = scope !== 'range';
    render();
  }

  function renderNav() {
    const sb = $('sources'); sb.innerHTML = '';
    [['QUIZ', 'Quizzes'], ['TEST', 'Tests'], ['BOTH', 'Both']].forEach(([v, label]) => {
      const b = document.createElement('button');
      b.className = 'src'; b.setAttribute('aria-pressed', src === v);
      b.innerHTML = esc(label) + '<small>' + stat(idsFor(v, 'all')) + '</small>';
      b.onclick = () => {
        if (src === v) return;
        src = v;
        if (!okScope(scope)) scope = 'all';
        save(); $('filter').value = 'all'; buildScope(false);
      };
      sb.appendChild(b);
    });
    const tabs = $('tabs'); tabs.innerHTML = '';
    const make = (value, label, title) => {
      const b = document.createElement('button');
      b.className = 'tab'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', scope === value); b.title = title;
      b.innerHTML = esc(label) + '<small>' + stat(idsFor(src, value)) + '</small>';
      b.onclick = () => { scope = value; save(); $('filter').value = 'all'; buildScope(false); b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); };
      tabs.appendChild(b);
    };
    const sb2 = document.createElement('button');
    sb2.className = 'tab stats-tab'; sb2.setAttribute('role', 'tab'); sb2.setAttribute('aria-selected', scope === 'stats'); sb2.title = 'Statistics';
    const ov = summarize(idsFor(src, 'all'));
    sb2.innerHTML = 'Stats<small>' + (ov.att ? Math.round(ov.acc * 100) + '%' : 'none yet') + '</small>';
    sb2.onclick = () => { scope = 'stats'; save(); buildScope(false); };
    tabs.appendChild(sb2);
    make('all', 'All', 'All chapters');
    const rb = document.createElement('button');
    rb.className = 'tab range-tab'; rb.setAttribute('role', 'tab'); rb.setAttribute('aria-selected', scope === 'range'); rb.title = 'Pick a range of chapters';
    rb.innerHTML = 'Range<small>Ch ' + rng.from + ' to ' + rng.to + '</small>';
    rb.onclick = () => { scope = 'range'; save(); $('filter').value = 'all'; buildScope(false); };
    tabs.appendChild(rb);
    chaptersOf(src).forEach(ch => make(ch, 'Ch ' + ch, TITLES[ch] || ''));
  }

  function card(id, n) {
    const q = Q[id], r = answers[id], done = r !== undefined;
    const el = document.createElement('div');
    el.className = 'q' + (done ? (r === q.a ? ' right' : ' wrong') : '');
    const tag = src === 'BOTH' ? '<span class="tag ' + q.src + '">' + (q.src === 'TEST' ? 'Test' : 'Quiz') + '</span>' : '';
    const where = (scope === 'all' || scope === 'range') ? 'Chapter ' + q.ch + ', question ' + q.n + ' ' : (src === 'BOTH' ? 'Question ' + q.n + ' ' : '');
    el.innerHTML = '<div class="qhead"><span class="num">' + n + '</span><p class="prompt">' + esc(q.p) + '</p></div>' +
      '<div class="page">' + tag + where + (q.pg ? '[p. ' + esc(q.pg) + ']' : '') + '</div>';
    const opts = document.createElement('div'); opts.className = 'opts';
    optOrder[id].forEach((oi, k) => {
      const b = document.createElement('button'); b.className = 'opt';
      b.innerHTML = '<span class="l">' + LETTERS[k] + '</span><span>' + esc(q.o[oi]) + '</span>';
      if (done) { b.disabled = true; if (oi === q.a) b.classList.add('correct'); else if (oi === r) b.classList.add('chosen-wrong'); }
      b.onclick = () => {
        answers[id] = oi;
        const h = hist[id] || (hist[id] = { t: 0, c: 0, w: 0, s: 0 });
        if (h.s === undefined) h.s = 0;
        h.t++; if (oi === q.a) { h.c++; h.s++; } else { h.w++; h.s = 0; }
        save(); el.replaceWith(card(id, n)); updateStats();
      };
      opts.appendChild(b);
    });
    el.appendChild(opts);
    if (done) {
      const p = document.createElement('p');
      if (r === q.a) { p.className = 'fb good'; p.textContent = 'Correct.'; }
      else { p.className = 'fb bad'; p.textContent = 'Incorrect. Answer: ' + LETTERS[optOrder[id].indexOf(q.a)] + ', ' + q.o[q.a]; }
      el.appendChild(p);
    }
    return el;
  }

  function render() {
    const f = $('filter').value, list = $('list');
    const srcName = { QUIZ: 'Quizzes', TEST: 'Tests', BOTH: 'Quizzes + Tests' }[src];
    $('scopeTitle').textContent = srcName + ': ' + (scope === 'all' ? 'All chapters' : scope === 'range' ? (rng.from === rng.to ? 'Chapter ' + rng.from : 'Chapters ' + rng.from + ' to ' + rng.to) : 'Chapter ' + scope + (TITLES[scope] ? ', ' + TITLES[scope] : ''));
    list.innerHTML = '';
    const shown = order.filter(id => {
      const r = answers[id];
      if (f === 'unanswered') return r === undefined;
      if (f === 'missed') return r !== undefined && !isRight(id);
      if (f === 'correct') return isRight(id);
      return true;
    });
    if (!shown.length) {
      const msg = { unanswered: 'Every question here is answered.', missed: 'No missed questions here.', correct: 'No correct answers yet.' }[f] || 'No questions.';
      list.innerHTML = '<div class="empty">' + msg + ' Switch the filter to All questions to see the full set.</div>';
    }
    shown.forEach((id, i) => list.appendChild(card(id, i + 1)));
    updateStats();
  }

  function updateStats() {
    const ans = order.filter(id => id in answers).length, right = order.filter(isRight).length;
    $('score').innerHTML = right + '/' + ans + ' <small>answered ' + ans + ' of ' + order.length + '</small>';
    $('prog').style.width = (order.length ? ans / order.length * 100 : 0) + '%';
    const old = document.querySelector('.done'); if (old) old.remove();
    if (ans === order.length && order.length) {
      const d = document.createElement('div'); d.className = 'done';
      d.textContent = 'Finished: ' + right + ' of ' + order.length + ' (' + Math.round(right / order.length * 100) + '%).' + (right < order.length ? ' Use Retry missed to go again.' : '');
      $('list').appendChild(d);
    }
    renderNav();
  }

  $('filter').onchange = render;
  $('count').onchange = () => buildScope(false);
  [$('rFrom'), $('rTo')].forEach(sel => {
    sel.innerHTML = allChs.map(c => '<option value="' + c + '">' + c + '</option>').join('');
  });
  $('rFrom').value = rng.from; $('rTo').value = rng.to;
  const onRange = changed => {
    let f = +$('rFrom').value, to = +$('rTo').value;
    if (f > to) { if (changed === 'from') to = f; else f = to; }
    rng = { from: f, to: to }; $('rFrom').value = f; $('rTo').value = to;
    save(); $('filter').value = 'all'; buildScope(false);
  };
  $('rFrom').onchange = () => onRange('from');
  $('rTo').onchange = () => onRange('to');
  $('shuffle').onclick = () => buildScope(true);
  function summarize(list) {
    let seen = 0, att = 0, cor = 0;
    list.forEach(id => { const h = hist[id]; if (h && h.t) { seen++; att += h.t; cor += h.c; } });
    return { total: list.length, seen, att, cor, acc: att ? cor / att : 0 };
  }
  const MIN = 5;
  const level = s => s.seen < MIN ? (s.seen ? 'few' : 'none') : s.acc >= 0.85 ? 'good' : s.acc >= 0.7 ? 'ok' : 'bad';
  const LEVEL_TEXT = { good: 'Strong', ok: 'Getting there', bad: 'Needs work', few: 'Too few answered', none: 'Not started' };
  const pct = x => Math.round(x * 100) + '%';

  // A missed question stays on the review list until it is answered correctly twice in a row
  const streak = id => { const h = hist[id]; return h.s !== undefined ? h.s : (answers[id] === Q[id].a ? 1 : 0); };
  const needsReview = id => hist[id] && hist[id].w > 0 && streak(id) < 2;
  const pagesOf = pg => {
    const out = []; if (!pg) return out;
    String(pg).split(',').forEach(part => {
      const m = part.match(/(\d+)\s*-\s*(\d+)/);
      if (m) { for (let p = +m[1]; p <= +m[2]; p++) out.push(p); }
      else { const n = part.match(/\d+/); if (n) out.push(+n[0]); }
    });
    return out;
  };
  function reviewPlan(list) {
    const byCh = {};
    list.filter(needsReview).forEach(id => {
      const q = Q[id], ps = pagesOf(q.pg); if (!ps.length) return;
      const c = byCh[q.ch] || (byCh[q.ch] = { ch: q.ch, pages: {}, qs: 0 });
      c.qs++;
      ps.forEach(p => c.pages[p] = (c.pages[p] || 0) + 1);
    });
    return Object.values(byCh).map(c => {
      const ps = Object.keys(c.pages).map(Number).sort((a, b) => a - b), ranges = [];
      ps.forEach(p => {
        const r = ranges[ranges.length - 1];
        if (r && p - r.to <= 2) { r.to = p; r.n += c.pages[p]; } else ranges.push({ from: p, to: p, n: c.pages[p] });
      });
      return { ch: c.ch, qs: c.qs, ranges };
    }).sort((a, b) => b.qs - a.qs || a.ch - b.ch);
  }

  function practice(ch, filter) {
    scope = ch; save(); $('filter').value = filter; buildScope(false); window.scrollTo(0, 0);
  }

  function renderStats() {
    const srcName = { QUIZ: 'Quizzes', TEST: 'Tests', BOTH: 'Quizzes + Tests' }[src];
    $('scopeTitle').textContent = srcName + ': Statistics';
    const box = $('stats');
    const ov = summarize(idsFor(src, 'all'));
    const rows = chaptersOf(src).map(ch => Object.assign({ ch }, summarize(idsFor(src, ch))));
    if (!ov.att) {
      box.innerHTML = '<div class="empty">No answers yet for ' + esc(srcName.toLowerCase()) + '. Answer some questions and your results by chapter will show up here.</div>';
      return;
    }
    const ranked = rows.filter(r => r.seen >= MIN).sort((a, b) => a.acc - b.acc);
    const weak = ranked.filter(r => r.acc < 0.85).slice(0, 3);
    const strong = ranked.filter(r => r.acc >= 0.85).slice().reverse().slice(0, 3);
    let html = '<div class="kpis">' +
      '<div class="kpi"><b>' + pct(ov.acc) + '</b><span>accuracy across all attempts</span></div>' +
      '<div class="kpi"><b>' + ov.seen + '<em> of ' + ov.total + '</em></b><span>questions answered at least once</span></div>' +
      '<div class="kpi"><b>' + ov.att + '</b><span>total attempts</span></div></div>';
    html += '<div class="focus"><div class="fcol"><h3>Focus on</h3>' +
      (weak.length ? weak.map(r => '<button class="fitem bad" data-ch="' + r.ch + '"><span>Ch ' + r.ch + ' ' + esc(TITLES[r.ch] || '') + '</span><b>' + pct(r.acc) + '</b></button>').join('')
        : '<p class="muted">' + (ranked.length ? 'Nothing below 85% so far.' : 'Answer at least ' + MIN + ' questions in a chapter to rank it.') + '</p>') +
      '</div><div class="fcol"><h3>Doing well</h3>' +
      (strong.length ? strong.map(r => '<button class="fitem good" data-ch="' + r.ch + '"><span>Ch ' + r.ch + ' ' + esc(TITLES[r.ch] || '') + '</span><b>' + pct(r.acc) + '</b></button>').join('')
        : '<p class="muted">No chapter at 85% or higher yet.</p>') + '</div></div>';
    const plan = reviewPlan(idsFor(src, 'all'));
    html += '<h3>Pages to review</h3>';
    if (plan.length) {
      html += '<p class="muted">Based on questions you have missed. A page drops off once you answer its questions correctly twice in a row. Chapters with the most missed questions are listed first.</p><div class="plan">' +
        plan.map(c => '<div class="planrow"><div class="planhead"><span class="chname">Ch ' + c.ch + ' ' + esc(TITLES[c.ch] || '') + '</span><span class="muted">' + c.qs + ' question' + (c.qs > 1 ? 's' : '') + '</span></div><div class="chips">' +
          c.ranges.map(r => '<span class="chip' + (r.n >= 3 ? ' hot' : '') + '">' + (r.from === r.to ? 'p. ' + r.from : 'pp. ' + r.from + ' to ' + r.to) + ' <em>' + r.n + ' missed</em></span>').join('') +
          '</div><button class="planbtn" data-ch="' + c.ch + '">Practice missed</button></div>').join('') + '</div>';
    } else html += '<p class="muted">Nothing to review right now. Missed questions will add their pages here.</p>';
    html += '<h3>By chapter</h3><p class="muted legend"><span class="sw good"></span>85% and up <span class="sw ok"></span>70 to 84% <span class="sw bad"></span>under 70%. Chapters need ' + MIN + ' answered questions for a rating.</p><div class="chrows">';
    rows.forEach(r => {
      const lv = level(r);
      let split = '';
      if (src === 'BOTH') {
        const qz = summarize(ids.QUIZ[r.ch] || []), ts = summarize(ids.TEST[r.ch] || []);
        split = '<span class="split">Quiz ' + (qz.att ? pct(qz.acc) : 'n/a') + ', Test ' + (ts.att ? pct(ts.acc) : 'n/a') + '</span>';
      }
      html += '<div class="chrow ' + lv + '">' +
        '<div class="chhead"><span class="chname">Ch ' + r.ch + ' ' + esc(TITLES[r.ch] || '') + '</span><span class="lvl">' + LEVEL_TEXT[lv] + '</span></div>' +
        '<div class="meter"><span style="width:' + (r.att ? r.acc * 100 : 0) + '%"></span></div>' +
        '<div class="chfoot"><span>' + (r.att ? '<b>' + pct(r.acc) + '</b> correct (' + r.cor + ' of ' + r.att + ' attempts)' : 'No attempts yet') + '</span>' +
        '<span>' + r.seen + ' of ' + r.total + ' seen</span>' + split + '</div>' +
        '<div class="chbtns"><button data-ch="' + r.ch + '" data-f="missed">Practice missed</button><button data-ch="' + r.ch + '" data-f="unanswered">Unanswered</button></div>' +
        '</div>';
    });
    html += '</div>';
    const missed = idsFor(src, 'all').filter(id => hist[id] && hist[id].w > 0)
      .sort((a, b) => hist[b].w - hist[a].w || (hist[a].c / hist[a].t) - (hist[b].c / hist[b].t)).slice(0, 10);
    html += '<h3>Most missed questions</h3>';
    html += missed.length ? '<ol class="missed">' + missed.map(id => {
      const q = Q[id], h = hist[id];
      return '<li><p class="prompt">' + esc(q.p) + '</p><p class="muted">' + (q.src === 'TEST' ? 'Test' : 'Quiz') + ', Chapter ' + q.ch + ', question ' + q.n +
        (q.pg ? ' [p. ' + esc(q.pg) + ']' : '') + '. Missed ' + h.w + ' of ' + h.t + ' tries.</p><p class="ans">Answer: ' + esc(q.o[q.a]) + '</p></li>';
    }).join('') + '</ol>' : '<p class="muted">No missed questions yet.</p>';
    html += '<p class="muted clearrow">Statistics count every attempt, including retries, and are kept when you use Reset or Retry missed. <button id="clearStats">Clear statistics</button></p>';
    box.innerHTML = html;
    box.querySelectorAll('.planbtn').forEach(b => b.onclick = () => practice(+b.dataset.ch, 'missed'));
    box.querySelectorAll('.fitem').forEach(b => b.onclick = () => practice(+b.dataset.ch, 'all'));
    box.querySelectorAll('.chbtns button').forEach(b => b.onclick = () => practice(+b.dataset.ch, b.dataset.f));
    $('clearStats').onclick = () => {
      if (!confirm('Clear statistics for ' + srcName.toLowerCase() + '? Your current answers stay.')) return;
      idsFor(src, 'all').forEach(id => delete hist[id]); save(); renderStats(); renderNav();
    };
  }

  $('reset').onclick = () => { order.forEach(id => delete answers[id]); save(); $('filter').value = 'all'; buildScope(false); };
  $('retry').onclick = () => {
    const missed = order.filter(id => id in answers && !isRight(id));
    if (!missed.length) return;
    missed.forEach(id => { delete answers[id]; optOrder[id] = shuffleArr(optOrder[id]); });
    save(); order = shuffleArr(missed); $('filter').value = 'all'; render(); window.scrollTo(0, 0);
  };
  buildScope(false);
})();
</script>
</body>
</html>
