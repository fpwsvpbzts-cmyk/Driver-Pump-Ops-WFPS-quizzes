 dedicated to the sites", "Implementation of large-diameter hose (LDH)", "The presence of a Water Supply Group Supervisor"], "a": 1}, {"n": 26, "p": "The alternating supply operation in the direct pumping method ends when:", "pg": "437", "o": ["all tenders are empty.", "an attack pumper's intake is full.", "the need for water at the incident is satisfied.", "the pressure in the supply line becomes too low."], "a": 2}, {"n": 27, "p": "What is the primary advantage of using nurse tenders in water shuttle operations?", "pg": "438", "o": ["Accessibility to tenders in rural areas", "Large tank capacity that reduces the need for refills", "Efficient delivery through the direct pumping method", "Ability to switch between supplying the attack pumper"], "a": 1}, {"n": 28, "p": "What is the advantage of placing portable tanks near the incident scene in water shuttle operations?", "pg": "438", "o": ["Improves drafting capabilities for tenders", "Reduces the need for dump site pumpers", "Provides additional space for dump site operations", "Eliminates the need for backing up or turning around"], "a": 3}, {"n": 29, "p": "What is a primary disadvantage of using portable tanks for dump site supply?", "pg": "438", "o": ["Limited water storage capacity", "Inability to establish a constant water supply", "Lack of venting system for proper air circulation", "Requires substantial working space for dump site operations"], "a": 3}, {"n": 30, "p": "Discharge and hoseline may be employed for pumping water into a portable tank or nurse tender when:", "pg": "439", "o": ["discharge pressure is insufficient.", "there is limited tank capacity available.", "the tender is not equipped with a dump valve.", "hoseline needs to be controlled at the point of delivery."], "a": 2}, {"n": 31, "p": "What precaution should be taken when pumping into portable tanks using hoselines?", "pg": "439", "o": ["Baffle the water tank to prevent overflow", "Secure the hoselines discharging into the tank", "Maintain a firm grip on the open butt of the hoseline", "Increase the flow rate to expedite the emptying process"], "a": 1}, {"n": 32, "p": "What type of dump site operation should be used only when relatively low flow rates (less than 300 gpm [1 200 L/min]) are needed?", "pg": "439", "o": ["Single portable tank", "Nurse tender", "Direct pumping", "Multiple portable tank"], "a": 2}, {"n": 33, "p": "What type of water tending method is used when relatively low flow rates (less than 300 gpm [1 200 L/min]) are needed?", "pg": "439 - 440", "o": ["Multi-tank", "Nurse tender", "Direct pumping", "Single portable tank"], "a": 3}, {"n": 34, "p": "Which style of portable tank is most commonly used and can be mounted on an apparatus?", "pg": "440", "o": ["Folding tank", "Self-supporting tank", "Frameless water tank", "Assembled framework tank"], "a": 0}, {"n": 35, "p": "What is a distinguishing feature of a self-supporting or frameless water tank?", "pg": "440", "o": ["It can be folded and mounted on an apparatus", "It requires assembly of framework at the scene", "It utilizes a floating collar to regulate water capacity", "It has a hose connection near its bottom for drafting"], "a": 2}, {"n": 36, "p": "What is the recommended capacity of a portable tank in relation to the water tank on the supplying apparatus?", "pg": "440", "o": ["At least 100 gallons (400 L) larger", "At least 200 gallons (800 L) larger", "At least 300 gallons (1 200 L) larger", "At least 500 gallons (2 000 L) larger"], "a": 3}, {"n": 37, "p": "The goal of a multi-tank operation is to:", "pg": "440", "o": ["keep the tank farthest from the attack pumper full.", "keep all tanks at the same water level for efficiency.", "constantly rotate water between all tanks in the operation.", "keep the tank from which the attack pumper is drafting full."], "a": 3}, {"n": 38, "p": "Parallel jet siphons should be used in portable tank operations when:", "pg": "441", "o": ["connecting tanks with a hard intake hose or PVC/aluminum pipe.", "conditions deteriorate and a new dump site needs to be prepared.", "the dump site pumper cannot supply enough water for all jet siphons.", "operations require more than three tanks and water flows are over 500 gpm."], "a": 3}, {"n": 39, "p": "In drafting operations from a static water supply, what should the D/O consider when positioning the fill site pumper?", "pg": "442", "o": ["Distance from the dump site pumper", "Rate at which tenders are being filled", "Minimum lift required to maximize flow", "Availability of high-volume portable pumps"], "a": 2}, {"n": 40, "p": "How should jurisdictions standardize their tenders at the fill site?", "pg": "443", "o": ["Utilize multiple hoselines for each tender intake", "Use one size hose (MDH or LDH) for all connections", "Position the water tender at the rear of the apparatus", "Control flow from the fill site pumper using discharge gates"], "a": 1}, {"n": 41, "p": "What is the role of the \"make-and-break\" team at the fill site?", "pg": "443", "o": ["Monitoring gate valves and manifolds during the operation", "Assisting the D/O in connecting the pumper to the water supply", "Operating the circulating line to maintain prime and prevent overheating", "Establishing and removing connections between the water source and tank"], "a": 3}, {"n": 42, "p": "How should tender D/Os proceed when entering the fill site?", "pg": "444", "o": ["The entrance to the fill site must be in reverse", "Stop when driver's door is perpendicular to the traffic cone", "Connect the fill hose to the direct tank fill intake(s) before stopping", "Stop when the driver's door is parallel to the traffic cone or marking device"], "a": 3}, {"n": 43, "p": "All personnel working at the fill site should monitor ground conditions to:", "pg": "444", "o": ["prevent spillage of water during the operation.", "determine if relocation of the site is necessary.", "ensure proper coordination and instructional clarity.", "assess the effects of temperature and terrain on the operation."], "a": 3}, {"n": 44, "p": "What is the effect of decreasing the trip time on the water shuttle flow rate?", "pg": "447", "o": ["It will increase exponentially", "It will increase proportionally", "It will decrease exponentially", "It will decrease proportionally"], "a": 1}, {"n": 45, "p": "How can the flow rate for a specific tender be calculated using field tests?", "pg": "448", "o": ["Subtract the amount of water the tender dumped from the amount it can carry in its tank", "Divide the amount of water the tender dumped by the time it took to complete the round trip", "Multiply the amount of water the tender dumped by the time it took to complete the round trip", "Measure the time it takes for the tender to complete a round trip from the dump site to the fill site"], "a": 1}, {"n": 46, "p": "According to NFPA 1010, which of the following systems/components should be included in the visual and operational checks of mobile water supply apparatus?", "pg": "449", "o": ["HVAC system", "Electrical system", "Suspension system", "Water tank and other extinguishing agent levels"], "a": 3}, {"n": 47, "p": "When performing visual and operational checks, the D/O should verify that the water tank is:", "pg": "449", "o": ["full.", "empty.", "leaking.", "partially filled."], "a": 0}, {"n": 48, "p": "When operating the rapid dump system, what should the D/O do after discharging a limited amount of water?", "pg": "449", "o": ["Refill the tank", "Shut down the pump", "Engage the foam system", "Leave the dump valve open"], "a": 0}]}, {"ch": 13, "title": "Foam Types and Systems", "qs": [{"n": 1, "p": "What is the purpose of washing PPE gear after every use when foam has been used?", "pg": "464", "o": ["Prevent damage to equipment", "Degrade the foam concentrate residue", "Reduce the need for professional cleaning", "Eliminate the need for proper flushing procedures"], "a": 0}, {"n": 2, "p": "What adverse chronic health effects have been found in humans and animals due to the ingredients in aqueous film-forming foam (AFFF)?", "pg": "465", "o": ["Olfactory fatigue", "Allergic reactions", "Irritation of internal tissue", "Deep and long-time problems such as cancer"], "a": 3}, {"n": 3, "p": "Why should foam concentrates, solutions, or finished foam NOT be discharged into any body of water?", "pg": "466", "o": ["Do not biodegrade", "Can be harmful to aquatic life", "Cause excessive foam buildup", "Increase oxygen levels in the water"], "a": 1}, {"n": 4, "p": "What requirement do many jurisdictions have regarding the use of foam?", "pg": "466", "o": ["Testing foam samples for biodegradability", "Disposing of foam in designated containers", "Limiting foam use to emergency situations only", "Reporting foam usage to local or state environmental protection office"], "a": 3}, {"n": 5, "p": "Which agent cools a fire and surrounding structures while releasing a warm vapor instead of deadly steam?", "pg": "467", "o": ["AFFF foam", "Encapsulator", "Gelling agent", "Durable agent"], "a": 1}, {"n": 6, "p": "Which alternative agent retains its fire retarding properties longer than Class A foam and is nontoxic and biodegradable?", "pg": "467", "o": ["Durable", "Surfactants", "Encapsulator", "Hydrocarbon-based"], "a": 0}, {"n": 7, "p": "What is the purpose of hydrocarbon surfactants in Class A foam?", "pg": "468", "o": ["Reduce the effectiveness of the foam", "Increase the surface tension of water", "Create insulation qualities in the foam", "Improve penetration and effectiveness"], "a": 3}, {"n": 8, "p": "Which system entrains compressed air with small amounts of water to create a useable foam agent?", "pg": "468", "o": ["Aerating foam system", "Solid stream nozzle system", "High-expansion device system", "Compressed air foam system (CAFS)"], "a": 3}, {"n": 9, "p": "As the percentage of Class A foam concentrate increases, the drain time of foam bubbles:", "pg": "469", "o": ["increases.", "decreases.", "remains the same.", "becomes unpredictable."], "a": 0}, {"n": 10, "p": "What is foam expansion?", "pg": "469", "o": ["The change in color of foam solution after aeration", "The increase in volume of foam solution after aeration", "The reduction in volume of foam solution after aeration", "The decrease in quality of foam concentrate after aeration"], "a": 1}, {"n": 11, "p": "According to the NFPA 11, what is the air/solution ratio for low-expansion foam?", "pg": "469", "o": ["Up to 20 parts finished foam for every part of foam solution", "Up to 200 parts finished foam for every part of foam solution", "20:1 up to 200:1", "200:1 up to 1,000:1"], "a": 0}, {"n": 12, "p": "What is a common application of Class A wet foam?", "pg": "470", "o": ["Vertical surfaces", "45 degree sloped surfaces", "Areas that require maximum penetration", "Surface of a fuel pool of flammable liquid"], "a": 2}, {"n": 13, "p": "Which of the following best describes the characteristics of dry foam?", "pg": "470", "o": ["Low water content and low air content", "High water content and low air content", "Low water content and high air content", "High water content and high air content"], "a": 2}, {"n": 14, "p": "The bubbles in a Class A foam blanket begin to break down upon application allowing:", "pg": "470", "o": ["expansion, absorbing the heat.", "the release water, wetting the fuel.", "an increase in size, smothering the fire.", "the blanket to solidify, blocking the fire."], "a": 1}, {"n": 15, "p": "Class B foam is primarily used to suppress fires involving:", "pg": "470", "o": ["gases.", "metals.", "solid materials.", "flammable or combustible liquids."], "a": 3}, {"n": 16, "p": "What are the two main types of bases that Class B foam concentrates consist of?", "pg": "470", "o": ["Water and oil", "Oil and protein", "Synthetic or silicon", "Synthetic or protein"], "a": 3}, {"n": 17, "p": "What is the typical proportion range for Class B foams?", "pg": "471", "o": ["1% to 3%", "1% to 6%", "3% to 6%", "3% to 9%"], "a": 1}, {"n": 18, "p": "For which type of fuels is a foam concentration typically at 1% or 3%?", "pg": "471", "o": ["Solid fuels", "Polar solvents", "Gaseous fuels", "Hydrocarbon fuels"], "a": 3}, {"n": 19, "p": "What is the recommended concentration for polar solvents based on manufacturer recommendations?", "pg": "471", "o": ["1% or 2%", "1% or 3%", "3% or 6%", "6% or 9%"], "a": 2}, {"n": 20, "p": "What factors influence application rate of Class B foam?", "pg": "471", "o": ["The color of the foam and the wind direction", "The type of concentrate used and the fuel involved", "The temperature of the foam and the time of the day", "The size of the fire and the type of foam delivery system"], "a": 1}, {"n": 21, "p": "How can the application rate of class B foam from a specific nozzle be calculated?", "pg": "472", "o": ["Adding the flow rate to the fire area", "Dividing the flow rate by the fire area", "Multiplying the flow rate with the fire area", "Subtracting the flow rate from the fire area"], "a": 1}, {"n": 22, "p": "When encapsulants are used with a foam injection system, how can the foam agent be adjusted for a specific fire?", "pg": "472", "o": ["Using different types of foam concentrates", "Adding additional agents to the foam concentrate", "Adjusting the temperature of the foam injection system", "Changing the foam proportion on the system control panel"], "a": 3}, {"n": 23, "p": "Why must plastic pails used for foam storage remain airtight?", "pg": "473", "o": ["Ensure easy storage on fire apparatus", "Withstand the corrosive nature of foam concentrates", "Prevent a skin from forming on the concentrate surface", "Facilitate direct inducting of foam concentrate using an eductor"], "a": 2}, {"n": 24, "p": "What is the most common size of foam concentrate barrel?", "pg": "473", "o": ["25 gallon (100 L)", "35 gallon (140 L)", "45 gallon (180 L)", "55 gallon (220 L)"], "a": 3}, {"n": 25, "p": "What is the purpose of using totes for foam storage in some fire departments or industrial facilities?", "pg": "473", "o": ["Store foam concentrate in small quantities", "Facilitate easy transport of foam concentrate barrels", "Meet the storage requirements of aircraft rescue fire fighting (ARFF)", "Enable deployment of large quantities of foam during large-scale incidents"], "a": 3}, {"n": 26, "p": "How does a Venturi effect achieve foam proportioning?", "pg": "474", "o": ["Mixing water and foam concentrate in a tank", "Introducing air into the foam solution at the nozzle", "Injecting foam concentrate into a pressurized water stream", "Creating a flow of water across an orifice at a right angle to the flow"], "a": 3}, {"n": 27, "p": "Which type of foam proportioning system imparts pressure on the foam solution using the main fire pump?", "pg": "474", "o": ["Tank mixing system", "Bernoulli effect system", "Low-energy foam system", "Pressurized proportioning device system"], "a": 2}, {"n": 28, "p": "Where is the foam concentrate positioned in the self-educting foam nozzle system?", "pg": "475", "o": ["Attached to the hoseline", "At the pump panel discharge", "Diluted by the deflector plates in the nozzle", "At the point where personnel operate the nozzle"], "a": 3}, {"n": 29, "p": "What advantage does the self-educting master stream foam nozzle have over standard foam nozzle eductors?", "pg": "475", "o": ["It requires a higher pressure drop", "It allows for much greater reach capabilities", "It produces a less proportioned foam solution", "It can deliver flows up to 250 gpm (950 L/min)"], "a": 1}, {"n": 30, "p": "What is the primary difference between portable in-line eductors and installed in-line eductor systems?", "pg": "475", "o": ["The method of foam induction", "The type of foam concentrate used", "The location of the eductor on the apparatus", "The compatibility with Class A or B foam concentrates"], "a": 2}, {"n": 31, "p": "What is the advantage of a bypass proportioner in an installed in-line eductor system?", "pg": "476", "o": ["Reduce friction loss across the eductor", "Inject foam solution directly at the nozzle", "Proportion very low concentrations of class A foam", "Accommodate foam concentrates through a metering valve"], "a": 0}, {"n": 32, "p": "How is the foam concentrate ratio controlled in variable-flow variable-rate direct injection systems?", "pg": "476", "o": ["Adjusting the water flow through the fire pump", "Flow restricting devices in the proportioning system", "The speed of the positive displacement foam concentrate pump", "Monitoring the foam concentrate level in the atmospheric pressure foam tanks"], "a": 2}, {"n": 33, "p": "In variable-flow variable rate injection systems, where should the foam injection point be located in relation to the apparatus piping?", "pg": "476", "o": ["Anywhere within the piping system", "Adjacent to the foam concentrate pump", "After the distribution to manifolds or multiple pump discharges", "Before any distribution to manifolds or multiple pump discharges"], "a": 3}, {"n": 34, "p": "What advantage does the flow of concentrate in a variable-flow demand-type balanced pressure proportioner system have?", "pg": "477", "o": ["Matches pressure demand", "Requires frequent flushing", "Allows for recirculation of product", "Discharges only from a single outlet"], "a": 0}, {"n": 35, "p": "What equipment is required for batch mixing or the dump-in method of foam proportioning?", "pg": "477", "o": ["Variable-speed mechanism", "Venturi-type proportioning device", "Specialized foam mixing equipment", "Regular fire apparatus and its water tank"], "a": 3}, {"n": 36, "p": "Which is NOT a tactical advantage of a Compressed Air Foam System (CAFS)?", "pg": "479", "o": ["Increase the reach of the fire stream", "Produce big, durable uniform air bubbles", "Produce small, durable uniform air bubbles", "Reduce the weight of hoselines containing foam solution"], "a": 1}, {"n": 37, "p": "What component attaches to the discharge side of the pump in a CAFS?", "pg": "479", "o": ["Rotary air compressor", "Standard centrifugal fire pump", "Variable flow rate sensing proportioner", "Direct injection foam proportioning system"], "a": 3}, {"n": 38, "p": "What is a limitation of CAFS?", "pg": "479", "o": ["Requires close proximity in order to be effective", "Increased purchase price and maintenance costs of new apparatus", "Hoselines weigh more than those containing low-energy foam solution", "Foam produced does not adhere to a fuel's surface as well as low-energy foam"], "a": 1}, {"n": 39, "p": "When using low-energy foam systems the aeration and discharge functions are completed by a:", "pg": "479", "o": ["handline nozzle.", "aerating foam nozzle.", "master stream appliance.", "standard fire fighting nozzle."], "a": 1}, {"n": 40, "p": "What type of nozzles break the foam solution into droplets while using the agitation of water droplets moving through air to achieve foaming action?", "pg": "480", "o": ["Fog nozzles", "Smooth bore nozzles", "Venturi action nozzles", "Expansion concentrate nozzles"], "a": 0}, {"n": 41, "p": "What is a characteristic of air-aspirating foam nozzles?", "pg": "480", "o": ["Lacks the reach of a standard fog nozzle", "Provide medium agent expansion and long reach", "Specifically designed for Class A foam application", "Produce foam with expansion ratios from 2:1 up to 4:1"], "a": 0}, {"n": 42, "p": "Which types of master stream appliances can be used to deliver foam?", "pg": "481", "o": ["Smooth bore nozzles", "Semi-automatic nozzles", "Mechanical blower nozzles", "Fixed flow and automatic fog nozzles"], "a": 3}, {"n": 43, "p": "High-expansion foam generators:", "pg": "481", "o": ["produce foam with high air content.", "generate foam for handline operations.", "induce air into the foam solution by Venturi action.", "are smaller and shorter than other foam-producing nozzles."], "a": 0}, {"n": 44, "p": "What is the importance of matching the rated flow between the eductor and nozzle when assembling and operating a foam eductor?", "pg": "481", "o": ["Minimizes air leaks at fittings", "Prevents excessive back pressure", "Ensures no pickup of foam concentrate", "Maintains the proper pickup of foam concentration"], "a": 3}, {"n": 45, "p": "What pressure at the eductor is generally recommended by the manufacturer?", "pg": "482", "o": ["50 to 100 psi (345 to 690 kPa)", "100 to 150 psi (690 to 1 035 kPa)", "150 to 200 psi (1 035 to 1 380 kPa)", "200 to 250 psi (1 380 to 1 725 kPa)"], "a": 2}, {"n": 46, "p": "What should be done to ensure the readiness of eductors after each use?", "pg": "482", "o": ["Increase the inlet pressure to create a stronger Venturi effect", "Set the metering valves to draw a higher percentage of foam concentrate", "Adjust the length of the pick-up tube to sit higher above the liquid surface", "Use a bucket of water to immerse the foam pickup tube until the water flows clear"], "a": 3}, {"n": 47, "p": "Why is it recommended to flush foam concentrates from the equipment as soon as the foam equipment stops at an incident or training?", "pg": "483", "o": ["Prevent corrosion on the equipment", "Conserve foam concentrate for future use", "Improve the efficiency of the foam system", "Avoid clogging of the foam injection equipment"], "a": 0}, {"n": 48, "p": "Proper procedure for flushing or bleeding foam injection equipment on an apparatus may include:", "pg": "483", "o": ["loosening the backflow check valve inside the eductor following use.", "following proper procedure for flushing and draining of foam nozzles.", "turning off the foam pump and flowing clean water through apparatus piping.", "using cleaning solutions to clear out any residual concentrate via the pickup tube."], "a": 2}, {"n": 49, "p": "What should be done to clean portable proportioner equipment after each use?", "pg": "483", "o": ["Remove the backflow check valve from the eductor", "Use a cleaning solution to remove residual concentrate", "Drain the foam from the pump housing/discharge houses", "Flush with fresh water to clear out any residual concentrate"], "a": 3}]}, {"ch": 14, "title": "Pumping Apparatus Testing", "qs": [{"n": 1, "p": "What is the purpose of preservice testing for pumping apparatus?", "pg": "493", "o": ["Verify that the powertrain meets safety regulations", "Determine the resale value of the pumping apparatus", "Ensure the purchaser is satisfied with the pump's appearance", "Assess the pump and powertrain's performance under extreme conditions"], "a": 3}, {"n": 2, "p": "When are acceptance tests commonly performed for fire apparatus?", "pg": "493 - 494", "o": ["Before the delivery to the purchaser", "During the manufacturer's testing phase", "Throughout the preservice testing period", "After the final acceptance by the purchaser"], "a": 0}, {"n": 3, "p": "Who is primarily responsible for conducting manufacturer or certification tests for fire apparatus?", "pg": "494", "o": ["District driver/operators", "Fire Department testing committee", "Organizations that test to the UL Solutions", "Organizations that test to the NFPA standards"], "a": 2}, {"n": 4, "p": "In the road test, the apparatus must accelerate to 35 mph from a standing start within:", "pg": "494", "o": ["10 seconds.", "15 seconds.", "25 seconds.", "30 seconds."], "a": 2}, {"n": 5, "p": "What is one of the minimum standards an apparatus must meet during a road test?", "pg": "494", "o": ["Achieve a speed of 20 mph (30 km/h) within 20 seconds", "Achieve a top speed of 55 mph (90 km/h) on public roadways", "Attain a speed of 25 mph (40 km/h) both forward and reverse", "Come to a full stop from 20 mph (30 km/h) within 35 feet (10.5 m)"], "a": 3}, {"n": 6, "p": "To ensure a fire pump can withstand high-pressure pumping demands, the fire pump case and associated piping must endure a hydrostatic test of:", "pg": "494", "o": ["350 psi (2 450 kPa) for 10 minutes.", "500 psi (3 500 kPa) for 3 minutes.", "500 psi (3 500 kPa) for 10 minutes.", "750 psi (5 250 kPa) for 5 minutes."], "a": 2}, {"n": 7, "p": "The purpose of acceptance testing for fire apparatus is to:", "pg": "495", "o": ["ensure the fire hose has been hydrostatically tested.", "demonstrate the validity of the manufacturer's warranty.", "ensure the apparatus conforms to bid specifications at delivery.", "review procedures with representatives from the manufacturer."], "a": 2}, {"n": 8, "p": "Which of the following is NOT one of the certification tests required for apparatus equipped with a fire pump rated from 750 gpm (3 000 L/min) up to 3,000 gpm (12 000 L/min)?", "pg": "495", "o": ["Pumping test", "Engine speed check", "Fire hose inspection test", "Pressure control system test"], "a": 2}, {"n": 9, "p": "In jurisdictions higher than 2,000 feet (600 m) above sea level, what additional test should be performed during acceptance testing?", "pg": "496", "o": ["Water tank-to-pump", "Gauge and flowmeter", "Pump priming system", "Pumping engine overload"], "a": 3}, {"n": 10, "p": "What action should the D/O take to prepare the apparatus for the pumping test?", "pg": "496", "o": ["Check the apparatus fluid levels", "Inspect the intake piping for any leaks", "Adjust the discharge pressure for optimal performance", "Open a discharge valve to allow pump pressure to equalize"], "a": 0}, {"n": 11, "p": "During a performace test, what is the maximum lift for pumps rated at 1,500 gpm (6 000 L/min) or less?", "pg": "496", "o": ["6 feet (2 m)", "8 feet (2.5 m)", "10 feet (3 m)", "12 feet (3.6 m)"], "a": 2}, {"n": 12, "p": "What is the range of acceptable air temperature during pump testing?", "pg": "497", "o": ["-10°F (-23°C) to 100°F (38°C)", "0°F (-18°C) to 110°F (43°C)", "20°F (-7°C) to 90°F (32°C)", "30°F (-1°C) to 120°F (49°C)"], "a": 1}, {"n": 13, "p": "What action should be taken if the scribed mark on the hoseline moves more than 3/8 inch (9 mm) from the coupling during testing?", "pg": "497", "o": ["Stop the test and replace the hose", "Remove the mark and continue testing", "Continue the test and monitor the movement", "Increase the pressure to stabilize the coupling"], "a": 0}, {"n": 14, "p": "How does net pump discharge pressure change when operating at draft?", "pg": "498", "o": ["Fluctuates depending on the height of the lift", "Exceeds the pressure displayed on the discharge gauge", "Decreases due to the additional pressure from the intake hose", "Remains the same as the pressure displayed on the discharge gauge"], "a": 1}, {"n": 15, "p": "What is the specified accuracy percentage requirement for a flowmeter when indicating flow during pump testing?", "pg": "498", "o": ["Within 2%", "Within 5%", "Within 10%", "Within 15%"], "a": 1}, {"n": 16, "p": "Which equipment is required if a flowmeter is not used during performance tests on fire department pumpers?", "pg": "498", "o": ["Gauge with a range of 0 to at least 400 psi (2 800 kPa)", "Hand tachometer with a range of o to at least 400 psi (2 800 kPa)", "Smooth bore nozzles and air chamber rated from 0 to at least 160 psi (1 100 kPa)", "Pitot tube with knife edge and air chamber rated from 0 to at least 160 psi (1 100 kPa)"], "a": 3}, {"n": 17, "p": "Why should valves and nozzles be opened and closed slowly during service testing?", "pg": "499", "o": ["Avoid water leakage", "Conserve water usage", "Prevent water hammer", "Increase water pressure"], "a": 2}, {"n": 18, "p": "Why should the engine throttle be operated slowly during service testing?", "pg": "499", "o": ["Conserve fuel", "Reduce noise levels", "Increase water flow rate", "Prevent sudden pressure changes"], "a": 3}, {"n": 19, "p": "What is the purpose of a pump shift indicator test during pump control testing?", "pg": "500", "o": ["Verify the pressure and rpm mode", "Ensure the parking brake is engaged", "Verify the pump can engage without issues", "Check the interlock for engine speed control"], "a": 2}, {"n": 20, "p": "What component should be tested when the chassis engine drives the pump and electric system or when the apparatus has electronic engine throttle controls?", "pg": "500", "o": ["Indicator lights in the cab", "Pump and roll capabilities", "Parking brake functionality", "Interlock for engine speed control"], "a": 3}, {"n": 21, "p": "When should the D/O conduct an engine speed check during testing?", "pg": "500", "o": ["Before starting any further testing", "Before conducting any fluid level checks", "After having the apparatus evaluated by a qualified mechanic", "After ensuring all fluid levels are within manufacturer's recommendations"], "a": 3}, {"n": 22, "p": "What should be done if the engine fails to run at the correct speed (+/- 50 rpm) during the engine speed check?", "pg": "500", "o": ["Adjust the fluid levels and repeat the engine speed check", "Continue with further testing and monitor the engine performance", "Consult the manufacturer's recommendations for troubleshooting steps", "Have the apparatus evaluated by a qualified mechanic before further testing"], "a": 3}, {"n": 23, "p": "Why is a vacuum test conducted during the performance testing of an apparatus?", "pg": "500", "o": ["Assess the functionality of the intake hose", "Evaluate the performance of the discharge valves", "Measure the maximum vacuum pressure the pump can achieve", "Check for air leaks in the priming device, pump, and intake hose"], "a": 3}, {"n": 24, "p": "What action should be taken if the pump fails to reach 22 in Hg (75 kPa) during the vacuum test?", "pg": "500", "o": ["Adjust the pressure on the discharge valve", "Remove the apparatus from service for repairs", "Conduct additional troubleshooting on the intake hose", "Proceed with the rest of the performance test as planned"], "a": 1}, {"n": 25, "p": "What is the purpose of the pumping test?", "pg": "502", "o": ["Check the functionality of the pressure gauges", "Measure the fuel consumption of the apparatus", "Determine the water flow rate from the nozzles", "Evaluate the overall operation of the engine and fire pump"], "a": 3}, {"n": 26, "p": "An apparatus technician should take a minimum of _____ readings during a 20 minute pump test at 100% rated capacity.", "pg": "502", "o": ["three", "five", "seven", "ten"], "a": 1}, {"n": 27, "p": "What action should be taken if any unusual vibration or performance defect is encountered during the pumping test?", "pg": "502", "o": ["Document and report the issue", "Repeat the test with different nozzles", "Continue the test while monitoring the defect", "Adjust the engine throttle to stabilize performance"], "a": 0}, {"n": 28, "p": "When performing an overload test on a 750 gpm (3 000 L/min) pump, the first test should be conducted by pumping at _____ net pump pressure for at least 5 minutes.", "pg": "502", "o": ["50% rated capacity at 150 psi (1 050 kPa)", "100% rated capacity at 165 psi (1 100 kPa)", "150% rated capacity at 150 psi (1 050 kPa)", "200% rated capacity at 165 psi (1 100kPa)"], "a": 1}, {"n": 29, "p": "When does the pressure control test typically occur in relation to the pumping test?", "pg": "502", "o": ["During the overload test", "Before the pumping test", "Immediately after the overload test", "While the pump is set up from the pumping test"], "a": 3}, {"n": 30, "p": "What should be done if the readings between the flowmeter and pitot gauge exceed the allowed margin during the operational test?", "pg": "502", "o": ["Repair or replace the flowmeter", "Conduct additional calibration tests", "Adjust the flow rate using the nozzle control", "Increase the pressure on the discharge lines"], "a": 0}, {"n": 31, "p": "What is the purpose of a tank-to-pump flow test for apparatus with an onboard water tank?", "pg": "503", "o": ["Assess the condition of the onboard water tank", "Evaluate the performance of the tank refill system", "Determine the maximum achievable flow rate from the tank", "Verify that the piping between the tank and pump can supply the minimum required water amount"], "a": 3}, {"n": 32, "p": "What should be done if the jurisdiction specifies higher flows for the tank-to-pump flow test?", "pg": "503", "o": ["Follow the jurisdiction's specified flows during testing", "Stick to the NFPA minimum flow rates for consistency", "Consult the manufacturer for recommended flow rates", "Increase the tank capacity to meet the higher flow requirements"], "a": 0}, {"n": 33, "p": "What should be done once the internal intake relief valve on the test pumper opens during testing?", "pg": "503", "o": ["Record the pressure at which the valve actuates", "Measure the flow rate from the intake relief valve", "Adjust the discharge pressure from the supply pumper", "Disconnect the discharge hoseline from the second pumper"], "a": 0}, {"n": 34, "p": "Why should the recorded pressure from the internal intake relief valve be compared with past test results and operating procedures?", "pg": "503", "o": ["Determine the accuracy of the relief valve", "Ensure compliance with national requirements", "Evaluate the performance of the supply pumper", "Identify any necessary adjustments to the valve setting"], "a": 3}, {"n": 35, "p": "What should be done upon completion of testing in regards to fluid levels?", "pg": "503", "o": ["Record any losses in fluid levels", "Refill all fluid levels to their maximum capacity", "Drain and replace all fluids used during the testing", "Conduct a thorough inspection of the fluid reservoirs"], "a": 0}, {"n": 36, "p": "What action should be taken if the pumper achieves results less than 90% of its original capabilities?", "pg": "503", "o": ["Repeat the testing process to confirm the results", "Consult with the manufacturer for further instructions", "Follow all AHJ protocols and procedures for reporting the failure", "Proceed with regular operations and monitor the pumper's performance"], "a": 2}, {"n": 37, "p": "If a pump fails to meet the requirements of a service test, which of the following issues should be investigated as a possible cause of the problem?", "pg": "504", "o": ["Nozzle properly sized", "Transmission in wrong gear", "Engine governor is on automatic", "Excessive air leaks on the discharge side of the pump"], "a": 1}]}, {"ch": 15, "title": "Introduction to Aerial Fire Apparatus", "qs": [{"n": 1, "p": "Which aerial device design creates a constant safe route from a position away from the fire apparatus to the ground?", "pg": "518", "o": ["Water tower", "Aerial ladder", "Articulating aerial platform", "Telescoping aerial platform"], "a": 1}, {"n": 2, "p": "In which position is an aerial device the weakest?", "pg": "518", "o": ["Fully extended at low elevations", "Fully extended at a steep elevation", "Partially extended parallel to the center line of the vehicle", "Partially extended perpendicular to the center line of the vehicle"], "a": 0}, {"n": 3, "p": "Which structural component(s) provide strength to an aerial ladder?", "pg": "519", "o": ["Rungs", "Beams", "Trunnion", "Torque Box"], "a": 1}, {"n": 4, "p": "What design feature of aerial ladders gives ladders maximum strength with minimum weight?", "pg": "519", "o": ["Rung locks", "Trunnion pins", "Truss construction", "Solid beam construction"], "a": 2}, {"n": 5, "p": "Aerial ladders designed and built with _____ provide greater strength than those with older designs.", "pg": "519", "o": ["K-bracing", "V-bracing", "double rungs", "locking pawls"], "a": 0}, {"n": 6, "p": "What does NFPA 1900 require at the tip of an aerial ladder?", "pg": "521", "o": ["Attachment points", "Pinnable waterway", "Directional spotlight", "Step(s) for a working firefighter"], "a": 3}, {"n": 7, "p": "Which of the following may cause the fly sections to separate and collapse on an aerial device?", "pg": "521", "o": ["Supporting the tip of the device", "Rotating the device when loaded", "Applying a tip load when at less than full extension", "Operating the device below the level of the turntable"], "a": 0}, {"n": 8, "p": "What is the required minimum load capacity at the tip of an aerial ladder regardless of elevation, extension, or rotation?", "pg": "521", "o": ["150 pounds (70 kg)", "250 pounds (110 kg)", "500 pounds (225 kg)", "750 pounds (340 kg)"], "a": 1}, {"n": 9, "p": "Which of the following is true about minimum load capacity of an aerial ladder?", "pg": "522", "o": ["Load ratings are listed on a plate attached to the base section", "Minimum tip load must hold constant in any operating position", "Minimum tip load assumes a static load with no water discharge", "Load rating requirements are greater for steel ladders than for aluminum ladders"], "a": 1}, {"n": 10, "p": "Which of the following statements about elevating platforms is correct?", "pg": "524", "o": ["A protective water fog curtain nozzle is required on the bottom of the platform", "A kickplate no less than 24 inches (600 mm) high must be located at floor level", "Firefighters access and egress the platform by stepping over the solid side railing", "All elevating platforms must have a minimum load capacity of 250 pounds (110 kg)"], "a": 0}, {"n": 11, "p": "What is the primary difference between aerial ladder platforms and telescoping aerial platforms?", "pg": "525", "o": ["Telescoping aerial platforms are not intended for climbing", "Telescoping aerial platforms can access areas not reachable with aerial ladders", "Telescoping platforms have the advantage of reaching \"up and over\" an obstacle", "Aerial ladder platforms are limited to two sections, telescoping platforms may have three or more"], "a": 0}, {"n": 12, "p": "Which aerial device design allows it to reach up and over to access areas not reachable by other aerial devices?", "pg": "526", "o": ["Aerial ladder", "Aerial ladder platform", "Articulating aerial platform", "Telescoping aerial platform"], "a": 2}, {"n": 13, "p": "The D/O controls the movement of a water tower and its elevated master stream from:", "pg": "527", "o": ["a control panel at the pedestal or tip of the aerial device.", "a remote attached to the pump panel with a heavy-duty cable.", "a wireless remote at the apparatus or at the command position.", "a control panel at the cab, rear of the apparatus, or pump panel."], "a": 3}, {"n": 14, "p": "NFPA 1900 establishes that a quint (quintuple fire apparatus) must have five features: water tank, ground ladders, fire pump, _____, and an aerial device or elevated platform.", "pg": "527", "o": ["portable water tank(s)", "supply and attack hose", "hydraulic extrication tools", "technical rescue equipment"], "a": 1}, {"n": 15, "p": "When positioning a quint (quintuple fire apparatus), which factor takes top priority?", "pg": "528", "o": ["Length of the hose lay", "Position of the fire pump", "Position of the aerial device", "Number of responders available"], "a": 2}, {"n": 16, "p": "Which statement about tractor-drawn aerial (TDA), or tillered trucks, is correct?", "pg": "528", "o": ["Tractor-drawn aerials can perform sharp U-turns", "The D/O steers both front and rear wheels through a hydraulic linkage", "Tractor-drawn aerials are less maneuverable than single-straight vehicles", "D/Os must be careful to avoid jackknifing the tiller, especially during positioning"], "a": 0}, {"n": 17, "p": "Hydraulic systems create motion and power by:", "pg": "529", "o": ["harnessing the thermal energy of the heated hydraulic fluid.", "flowing fluid through a pipe or hose to cause a turbine to rotate.", "using a compressor to stream air through fluid in a closed system.", "applying pressure to an incompressible liquid inside a closed circuit."], "a": 3}, {"n": 18, "p": "In most aerial apparatus, power to drive the hydraulic system pump is supplied by:", "pg": "529", "o": ["a ring-and-pinon drive.", "a rotary pump connected to the rear drive wheel.", "an electric motor powered by a vehicle-mounted generator.", "a power take-off (PTO) located on the vehicle’s transmission."], "a": 3}, {"n": 19, "p": "Which type of hydraulic valves prevent fluid from flowing backward through a component and act as a safety feature in case a leak develops?", "pg": "530", "o": ["Relief valves", "Diverter valves", "Pilot holding valves", "Counterbalance valves"], "a": 2}, {"n": 20, "p": "What acts as a safety means to prevent the stabilization and aerial device hydraulic systems from operating at the same time?", "pg": "530", "o": ["Relief valve", "Holding valve", "Selector valve", "Actuator manifold"], "a": 2}, {"n": 21, "p": "The hydraulic selector valve (also known as the transfer or diverter valve) is a three-way valve that directs hydraulic fluid to:", "pg": "530", "o": ["the control panel or the pump panel.", "the drive train or the auxiliary power.", "the apparatus transmission or the power take-off.", "the stabilizer control valves or the aerial device control valves."], "a": 3}, {"n": 22, "p": "Which hydraulic valves send the flow of fluid to control movement of mechanical parts of the device, such as to extend and retract?", "pg": "531", "o": ["Relief valves", "Actuator valves", "Indicating valves", "Counterbalance valves"], "a": 1}, {"n": 23, "p": "In the event of an apparatus power failure, hydraulic system counterbalance valves ensure:", "pg": "531", "o": ["a device will lower slowly and gently to the bedded position.", "a cylinder will remain in position until moved by the operator.", "the stabilization and aerial device systems will not operate at the same time.", "the apparatus’s weight is shifted off the suspension and onto the stabilizers."], "a": 1}, {"n": 24, "p": "Where can the D/O find information about the quantity of hydraulic fluid required by the aerial hydraulic system of an individual apparatus?", "pg": "531", "o": ["The fluid data plate in the cab", "On the ladder switching panel placard", "The hydraulic chart on the pump panel", "The vehicle registration card in the cab"], "a": 0}, {"n": 25, "p": "Which statement about aerial device stabilization systems is correct?", "pg": "532", "o": ["Stabilizer arms take most of the apparatus' weight off the suspension and onto the stabilizers", "Stabilizer arms serve as additional reinforcement to the apparatus chassis, suspension system, and axles", "The stabilization system endures the aerial device moves smoothly even through varying hydraulic system pressures", "When deployed, stabilizer arms align within the footprint of the apparatus for efficient staging at the incident location"], "a": 0}, {"n": 26, "p": "Which aerial apparatus mechanical system widens the footprint of the apparatus to make the vehicle solid and stable on the ground?", "pg": "532", "o": ["Hydraulic system", "Stabilization system", "Mechanical interlock system", "Leaf spring suspension system"], "a": 1}, {"n": 27, "p": "Which statement about aerial device cable systems is correct?", "pg": "533", "o": ["Torque seals are placed on the cable adjustment nuts to assist with visual inspections", "Cables are designed with wear indicators to show when they should be adjusted or replaced", "Sheaves are paired cables that work in tandem to create opposing actions, such as extend/retract", "The fly sections of most aerial devices extend and retract by the action of counterbalance cylinders"], "a": 0}, {"n": 28, "p": "What components prevent metal-to-metal contact of aerial device components during extension and retraction?", "pg": "534", "o": ["Pulleys and sheaves", "Torque seals and nuts", "Slides, glides, and rollers", "Rings, gaskets, and spindles"], "a": 2}, {"n": 29, "p": "What determines the force the hydraulic fluid exerts in the cylinders?", "pg": "535", "o": ["Piston speed and fluid viscosity", "Cylinder size and hydraulic fluid volume", "Hydraulic system temperature and piston material", "Hydraulic system pressure and piston surface area"], "a": 3}, {"n": 30, "p": "What feature of an aerial apparatus hoisting cylinder slows the downward travel of the aerial device in case of a leak or system blowout and allows the aerial device to settle down?", "pg": "535", "o": ["Diverter valve", "Electronic interlocks", "Piston rod, or sealing rings", "Bleed-down valve or metering holes"], "a": 3}, {"n": 31, "p": "In most aerial device designs, extension cylinders extend and retract the fly sections by:", "pg": "536", "o": ["extending and retracting a series of cables and pulleys.", "applying hydraulic fluid pressure to a ram inside a piston housing.", "pushing/pulling the fly using a trunnion attached to the base of each section.", "forcing compressed air into paired extension cylinders on the underside of each section."], "a": 0}, {"n": 32, "p": "What features track the position of modern extension cylinders to measure hydraulic cylinder stroke?", "pg": "536", "o": ["Sight-glass ports", "Fluid flow rate meters", "Wire-actuated encoders", "Cylinder pressure gauges"], "a": 2}, {"n": 33, "p": "Which of the following hydraulic systems may cause an elevated platform to move on its own when the system is in the automatic setting?", "pg": "536", "o": ["Leveling system", "Elevating system", "Extension system", "Stabilizing system"], "a": 0}, {"n": 34, "p": "Where is the typical location of the primary control station of an aerial device?", "pg": "536", "o": ["In the cab", "On the turntable", "At the pump panel", "At the tip of the device"], "a": 1}, {"n": 35, "p": "Which statement about aerial device controls is correct?", "pg": "536", "o": ["The turntable control station must be able to override the platform control station", "The deadman switch on the pedestal immediately stops all aerial device movement", "Aerial ladder and aerial ladder platform controls are typically located at the pump panel", "The override switch bypasses the pedestal controls to operate hydraulic actuators manually"], "a": 0}, {"n": 36, "p": "What component(s) limit pressure build up in the aerial apparatus hydraulic system, preventing damage from over-pressurization?", "pg": "538", "o": ["Actuators", "Relief valves", "Counterbalance valves", "Exchange-type coolers"], "a": 1}, {"n": 37, "p": "Which of the following is a limitation of aerial collision protection systems?", "pg": "538", "o": ["The system will only recognize preprogrammed items", "Collision protection is limited in dark or low visibility environments", "The system may need to be overridden to properly position the ladder or platform", "The system is not active when water is flowing in an aerial waterway or ladder pipe"], "a": 0}, {"n": 38, "p": "Which of the following can cause damage to a pre-piped waterway?", "pg": "538", "o": ["Rotating the device when the waterway is flowing water", "Pressurizing the waterway when the nozzle remains closed", "Retracting the aerial device when the waterway is closed at both ends", "Flowing water when the device is deployed perpendicular to the axis of the apparatus"], "a": 2}, {"n": 39, "p": "What safety device located on the pedestal of an aerial apparatus prevents unintentional activation of the aerial controls?", "pg": "538", "o": ["Locking pawl", "Override switch", "Deadman switch", "Stabilizer interlock"], "a": 2}, {"n": 40, "p": "How can a firefighter at any aerial device control station immediately stop all aerial device movement?", "pg": "538", "o": ["Engage the locking pawl", "Engage an emergency stop switch", "Enable the override switch or valve", "Disengage the engine starter switch"], "a": 1}, {"n": 41, "p": "Which aerial device switch is used to disable the controls when the operator is away from the control station?", "pg": "538", "o": ["Override switch", "Momentary switch", "Master aerial switch", "Remote actuator switch"], "a": 2}, {"n": 42, "p": "Which switch increases engine rpm to allow for a quicker response from the hydraulic system when operating the aerial device?", "pg": "538", "o": ["High-idle switch", "Engine starter switch", "Emergency pump switch", "Emergency power unit (EPU) switch"], "a": 0}, {"n": 43, "p": "Which safety indicator reads the front-to-back or longitudinal angle of the apparatus after stabilization and indicates whether that angle is safe or not?", "pg": "539", "o": ["Alignment indicator", "Slope level indicator", "Grade level indicator", "Wire-actuated encoder"], "a": 2}, {"n": 44, "p": "The slope level indicator reads the _____ after stabilization and indicates whether that angle is safe or not.", "pg": "539", "o": ["elevation angle of the aerial device", "side-to-side or lateral angle of the apparatus", "front-to-back or longitudinal angle of the apparatus", "absolute, accurate position of the hydraulic lifting cylinder(s)"], "a": 1}, {"n": 45, "p": "Internal combustion engine powered auxiliary hydraulic pumps on aerial apparatus:", "pg": "542", "o": ["supply water to the pump during water shuttle operations.", "can run full-time to retract, rotate, lower and bed the aerial.", "can be used to continue operations in case of a failed hydraulic system.", "are commonly used in quints to supplement power during pumping operations."], "a": 1}, {"n": 46, "p": "Which aerial device safety system prevents the aerial device from rotating over the short-jacked side?", "pg": "542", "o": ["Deadman switch", "Stabilizer interlock", "Short-jack interlock", "Master aerial switch"], "a": 2}, {"n": 47, "p": "Which aerial device interlock allows the aerial device to operate only after the parking brakes have been set and the transmission goes into neutral?", "pg": "542", "o": ["Aerial device override", "Tiller operator interlock", "Aerial function interlock", "Aerial/stabilizer interlock"], "a": 2}, {"n": 48, "p": "What feature(s) of an aerial apparatus allow a malfunctioning device to be stowed so the apparatus can be moved to an AHJ-identified repair facility?", "pg": "543", "o": ["High-idle switch", "Engine starter switch", "Aerial function interlocks", "Hydraulic system overrides"], "a": 3}, {"n": 49, "p": "Use of aerial device system overrides must be authorized by:", "pg": "543", "o": ["an officer or chief officer.", "a certified aerial operator.", "a trained service technician.", "a manufacturer's representative."], "a": 0}, {"n": 50, "p": "What statement about aerial apparatus water delivery systems is correct?", "pg": "546", "o": ["The bed ladder pipe is attached between the rungs of the bed (base) section of the aerial ladder", "Since the piping runs through the turntable, a telescoping waterway system has only a 180-degree range of operation", "Pinnable telescoping waterway systems allow the master stream monitor to be located at almost any point along the length of the ladder", "Most elevating platforms also include at least one 2½ inch (65 mm) discharge in the platform, allowing handlines to be stretched from the platform if necessary"], "a": 3}, {"n": 51, "p": "An aerial device fixed breathing air system links an air outlet fitting at the tip of the ladder or in the platform to:", "pg": "548", "o": ["breathing air cylinders mounted at the bottom of the aerial device.", "breathing air cylinders secured to the side of the bed section or elevated platform.", "an air compressor located at the rear of the apparatus powered by a small internal combustion engine.", "a cascade system of breathing air refill cylinders contained in the air supply unit (ASU) deployed to the scene."], "a": 0}, {"n": 52, "p": "Aerial device voice communication systems permit firefighters at the tip of the aerial device to communicate with:", "pg": "549", "o": ["the pump operator at the pump panel.", "the D/O at the aerial operator’s position.", "the tactical commander at the incident command post.", "any responders using the radio channel assigned for the incident."], "a": 1}, {"n": 53, "p": "Which type of electrical generation equipment on aerial apparatus have the capacity to provide power for scene lighting?", "pg": "550", "o": ["Power inverters", "Portable generators", "Step-up transformers", "Vehicle-mounted generators"], "a": 3}, {"n": 54, "p": "Which statement about vehicle-mounted generators on aerial apparatus is correct?", "pg": "551", "o": ["Vehicle-mounted power sources typically have 12- or 24-volt capabilities", "Fixed generators have electrical distribution (breaker) panels and load displays", "Vehicle-mounted generators provide a power capacity comparable to portable units", "Junction boxes are required to be placed in line between vehicle-mounted generators and electrical equipment"], "a": 1}, {"n": 55, "p": "Which statement about lighting and electrical distribution equipment is correct?", "pg": "551", "o": ["Fixed lights are generally mounted to the apparatus turntable above the control pedestal", "Junction boxes are used to condition line current when connecting one power cord to another", "Recommended electrical power cord lengths should not exceed 50 feet (15 m) per reel or cord", "Lights placed at the end of the aerial device help D/Os and spotters see nighttime obstructions"], "a": 3}, {"n": 56, "p": "NFPA 1900 requires aerial apparatus to be equipped with which of the following pieces of portable equipment?", "pg": "554", "o": ["Ladder belts", "Lockout/tagout kit", "Battery-operated saws", "Thermal imaging cameras"], "a": 0}]}, {"ch": 16, "title": "Positioning Aerial Apparatus", "qs": [{"n": 1, "p": "When can personnel first assess the best positions for aerial apparatus at incidents involving target hazards in their jurisdiction?", "pg": "563", "o": ["When taking training drives", "During preincident planning", "When staging at the nearest intersection", "During travel after dispatch to the location"], "a": 1}, {"n": 2, "p": "What type of deployment places the maximum amount of stress on an aerial device?", "pg": "564", "o": ["Long extensions at low angles", "Partial extension at high angles", "Operations over the body of the apparatus", "Operations away from the short-jacked side"], "a": 0}, {"n": 3, "p": "What is the preferred way for the D/O of an aerial device to develop positioning strategies?", "pg": "565", "o": ["Participation in departmental pre-planning events", "Practicing IFSTA-approved skills on the training ground", "Enrolling in NFPA-sponsored continuing education courses", "Joining tabletop exercises sponsored by a state fire academy"], "a": 0}, {"n": 4, "p": "Pre-planning for aerial positioning should identify a structure’s _____, especially in older or poorly maintained buildings.", "pg": "565", "o": ["floor plans", "collapse zones", "exterior lighting", "emergency exits"], "a": 1}, {"n": 5, "p": "Which of the following considerations may hinder aerial apparatus setup?", "pg": "565", "o": ["Increased building security", "Maximum building occupancy", "Decreased local water pressure", "County/municipal zoning classification"], "a": 0}, {"n": 6, "p": "When positioning an aerial apparatus for any service call, the D/O should attempt to maneuver the apparatus _____ closest to the building.", "pg": "565", "o": ["tailboard", "turntable", "stabilizers", "driver's side"], "a": 1}, {"n": 7, "p": "What is a consideration when an aerial apparatus is positioned facing an uphill grade?", "pg": "566", "o": ["Additional stress is placed on the hydraulic system", "The tip of the aerial device may not reach full extension", "Additional lengths of hose will be required to supply fire streams", "Compartments and other items on the rear of the apparatus will be higher"], "a": 3}, {"n": 8, "p": "The cab doors and front compartments of an aerial apparatus may be out of reach if the apparatus is:", "pg": "566", "o": ["parked on a crowned roadway.", "short-jacked on the driver’s side.", "positioned facing a downhill grade.", "positioned parallel to the angle of operation."], "a": 2}, {"n": 9, "p": "What may be a limitation of an aerial apparatus with only two stabilizers at the rear of the vehicle?", "pg": "566", "o": ["It may not be possible to level the apparatus if facing downhill", "The reach of the apparatus may be limited if operating off the rear", "The operator may have a restricted view of the tip of the aerial device", "The apparatus may not be able to respond to incidents on bridges/elevated roadways"], "a": 0}, {"n": 10, "p": "What may assist a D/O in properly positioning apparatus when the aerial is the first-arriving apparatus at the scene?", "pg": "567", "o": ["Municipal traffic codes, regulations, and ordinances", "NFPA 1901, Standard for Automotive Fire Apparatus", "Departmental standard operating procedures (SOPs)", "NFPA 1091, Standard for Traffic Incident Management"], "a": 2}, {"n": 11, "p": "The footprint of a structure that can be covered/reached with the tip of the aerial ladder or elevating platform, is the:", "pg": "567", "o": ["tip swing.", "scrub area.", "aerial reach.", "operating envelope."], "a": 1}, {"n": 12, "p": "For moving personnel or victims, D/Os should position aerial apparatus:", "pg": "568", "o": ["upwind from smoke.", "to maximize aerial extension.", "on the A side of the structure.", "to operate facing into the wind."], "a": 0}, {"n": 13, "p": "Aerial apparatus operating master streams should be positioned:", "pg": "568", "o": ["in low-lying areas.", "to discharge with the wind.", "close to the command post.", "to discharge perpendicular to the wind."], "a": 1}, {"n": 14, "p": "Which of the following weather conditions can place dynamic load(s) on an aerial device by forcing movement the apparatus was NOT designed to handle effectively?", "pg": "568", "o": ["Heavy rains", "Snowy ground", "Moderate to high winds", "Near-freezing temperatures"], "a": 2}, {"n": 15, "p": "When operating in high wind conditions, the D/O should position an aerial apparatus:", "pg": "568", "o": ["in low-lying areas.", "downwind of the structure.", "to minimize necessary extension.", "to operate perpendicular to the wind."], "a": 2}, {"n": 16, "p": "Where can D/Os find manufacturer’s predetermined maximum wind speed recommendation for safe operation of an aerial device?", "pg": "568", "o": ["Apparatus vehicle registration", "Departmental SOPs or preplans", "Apparatus load chart or operator’s manual", "Vehicle specifications tag on the door frame"], "a": 2}, {"n": 17, "p": "What effect may heavy rains or thunderstorms have on aerial apparatus positioning?", "pg": "568", "o": ["Water may wash away ground that supports pavement where the aerial apparatus positions", "Rainwater can cool hydraulic cylinders, causing them to contract and reducing aerial device reach", "Storms create noise and radio interference, requiring the apparatus to be positioned near the command post", "Rain may generate steam that reduces visibility for the operator and personnel working at the tip of the aerial device"], "a": 0}, {"n": 18, "p": "What may affect stabilizing an apparatus on snowy or icy surfaces?", "pg": "568", "o": ["The ground may thaw and become unstable", "Paved surfaces may become brittle and crack", "Cold hydraulic cylinders are less likely to shift", "Stabilizers will not operate properly in freezing temperatures"], "a": 0}, {"n": 19, "p": "Asphalt surfaces may soften and become unstable during:", "pg": "568", "o": ["extreme heat.", "heavy water flow.", "sudden cold snaps.", "multi-apparatus responses."], "a": 0}, {"n": 20, "p": "It will be easier to reach the ground with an aerial platform operating off the rear of the apparatus if the apparatus is positioned with the:", "pg": "570", "o": ["rear of the apparatus uphill.", "rear of the apparatus downhill.", "driver’s side of the apparatus furthest from the incident scene.", "driver’s side of the apparatus nearest the crown of the roadway."], "a": 0}, {"n": 21, "p": "The expression “Look up and Live” reminds aerial apparatus D/Os to:", "pg": "571", "o": ["check for overhead hazards when positioning and deploying aerial apparatus.", "embrace a confident attitude that all deployments will have a positive outcome.", "research load limits in the operator’s manual before deploying personnel or equipment.", "maintain continuous visual contact with personnel operating on elevated ladders or platforms."], "a": 0}, {"n": 22, "p": "What guideline should be followed when positioning and operating aerial apparatus near overhead power, telephone, or cable TV lines?", "pg": "571", "o": ["Treat any wires as energized", "Shield the aerial device with a salvage cover", "Ensure the aerial device is grounded using a steel cable or grounding strap", "Have a utility representative confirm the lines are disconnected before deploying the aerial device"], "a": 0}, {"n": 23, "p": "OSHA mandates a clearance between an aerial device and overhead electric lines less than 350 kilovolts to be:", "pg": "571", "o": ["10 feet (3 m)", "20 feet (6 m)", "50 feet (15 m)", "100 feet (30 m)"], "a": 1}, {"n": 24, "p": "When positioning an apparatus, what hazards are identified by vault hatches, manhole covers, and sewer grates?", "pg": "572", "o": ["Flood zones", "Underground voids", "Electrically charged soils", "Compromised asphalt surfaces"], "a": 1}, {"n": 25, "p": "How can a D/O know locations where a deployed stabilizer may punch through a surface into an underground void?", "pg": "572", "o": ["Municipal utility and roadway maps", "Topographical surface slope surveys", "Preincident planning and scene size-up", "Contact the Department of Transportation for your jurisdiction"], "a": 2}, {"n": 26, "p": "What is the most versatile position for a rear-mounted aerial apparatus at a scene?", "pg": "572", "o": ["Backed into the scene", "Facing toward the scene", "Driver's side parallel to the scene", "\"Quartering away\" at a 45-degree angle"], "a": 0}, {"n": 27, "p": "Which type of aerial apparatus has less tail swing because the aerial device beds over the cab?", "pg": "572", "o": ["Mid-mount", "Rear-mount", "Front-mount", "Angle-mount"], "a": 1}, {"n": 28, "p": "Why is a mid-mount aerial apparatus better at handling compared to a rear-mount apparatus?", "pg": "573", "o": ["Larger scrub area", "Reduced tail swing", "Taller turntable height", "Lower center of gravity"], "a": 3}, {"n": 29, "p": "The stability of aerial apparatus can be improved by operating the aerial device in line with the _____ axis.", "pg": "573", "o": ["elevation", "centerline", "longitudinal", "purpendicular"], "a": 2}, {"n": 30, "p": "An aerial apparatus is most stable when the aerial device operates:", "pg": "573", "o": ["fully extended at maximum elevation.", "directly over the front or rear of the vehicle.", "perpendicular to the longitudinal axis of the apparatus.", "with the tip of the apparatus at or below the level of the turntable."], "a": 1}, {"n": 31, "p": "The aerial reach for an apparatus with a mid-mount turntable is the greatest:", "pg": "574", "o": ["off the rear of the apparatus.", "off the sides of the apparatus.", "when the apparatus is facing downhill.", "when the apparatus is facing the incident."], "a": 1}, {"n": 32, "p": "Tractor-drawn aerial apparatus become more stable when the apparatus is jackknifed with the tractor approximately _____ from in-line with the tiller.", "pg": "575", "o": ["30 degrees", "45 degrees", "60 degrees", "90 degrees"], "a": 2}, {"n": 33, "p": "Which statement about short-jacking an aerial apparatus (positioning when stabilizers are NOT set all the way out) is correct?", "pg": "575", "o": ["The D/O must position the truck so one set of stabilizers can fully extend", "Only tractor-drawn apparatus (tillered trucks) may be short-jacked when stabilizing", "Stabilizers are extended approximately the same distance on both sides of the apparatus", "The aerial device can only be extended approximately 15 degrees over the short-jacked side"], "a": 0}, {"n": 34, "p": "How can the D/O reduce torsion (twisting) stress on the aerial device when the apparatus must be positioned on an incline?", "pg": "576", "o": ["Extend the aerial device to its full length", "Short-jack the apparatus on the downhill side", "Spot the turntable downhill from the point of operation", "Limit rotation to 15 degrees on either side of the chassis centerline"], "a": 2}, {"n": 35, "p": "When positioning an aerial apparatus at a building that has been exposed to severe fire conditions or has otherwise been weakened:", "pg": "579", "o": ["do not position over manholes or storm drains.", "do not park within the building’s collapse zone.", "keep the aerial device at least 25 feet above the roof or parapet.", "spot the apparatus to act as a shield between bystanders and the incident scene."], "a": 1}, {"n": 36, "p": "If a fire has the potential to grow or to spread to exposures, the apparatus must be placed:", "pg": "579", "o": ["as close as possible to the water supply.", "so it cannot be trapped by advancing fire.", "in a position to shield the command post with a fog curtain.", "in a position to protect all possible exposures with master streams."], "a": 1}, {"n": 37, "p": "An aerial device can be used to evaluate a building for signs of structural collapse, which may include falling bricks and mortar, sagging roofs, and:", "pg": "580", "o": ["bulging walls.", "breaking windows.", "broken doors or locks.", "sagging gutters or siding."], "a": 0}, {"n": 38, "p": "When responding to an incident on a roadway, where and how should the apparatus be positioned?", "pg": "581", "o": ["To act as a shield between traffic and firefighters working the incident", "Alongside the incident to serve as a traffic barrier to close adjacent lanes", "To visually screen the incident scene from view of oncoming lane(s) of traffic", "Beyond the incident scene to minimize risk to firefighters accessing the apparatus"], "a": 0}, {"n": 39, "p": "When responding to an incident on a road or highway, turn the apparatus’ front wheels:", "pg": "581", "o": ["away from open traffic lanes.", "away from working firefighters.", "to the right if parked facing uphill.", "so they are in line with the vehicle’s center axis."], "a": 1}, {"n": 40, "p": "When an aerial apparatus is being used to complete a technical rescue, the D/O should position the apparatus:", "pg": "582", "o": ["150 to 200 feet (45 to 60 m) behind the scene to act as a visual shield from bystanders.", "away from the operation, but close enough to provide easy access to carried equipment.", "an adequate distance from any terrain that could cause the apparatus to lose its stability.", "as close as possible to the scene to minimize the scrub area for faster unloading of victims."], "a": 2}, {"n": 41, "p": "If an aerial device must be raised across a railroad track, after receiving a halt confirmation, keep the aerial device at least _____ above the level of the rails.", "pg": "582", "o": ["12 feet (3 m)", "15 feet (4.5 m)", "25 feet (7.5 m)", "30 feet (9 m)"], "a": 2}, {"n": 42, "p": "Which of the following statements correctly describes how multiple apparatus should be positioned when working on a bridge or overpass?", "pg": "583", "o": ["Stagger apparatus in different lanes without parking side-by-side", "Position apparatus in a single line to allow vehicles and traffic a means to pass", "Park the working aerial apparatus on the span, and support vehicles on solid ground", "Park support vehicles on the span, spot the working aerial apparatus on solid ground"], "a": 0}, {"n": 43, "p": "Where may wind conditions at a bridge be more severe?", "pg": "583", "o": ["On the top", "In low-lying swales below", "On either side of the access", "If two large roads intersect below"], "a": 0}, {"n": 44, "p": "Which road surfaces are likely to be the first to freeze during cold weather?", "pg": "583", "o": ["Newly-laid dark asphalt", "Striated (grooved) concrete", "Bridges and elevated sections", "Wind-scrubbed straight stretches"], "a": 2}, {"n": 45, "p": "In which of the following situations should the D/O stop the apparatus well short of the incident scene?", "pg": "583", "o": ["Technical rescue operations", "Hazardous material incidents", "Incidents on elevated roadways", "Fire responses in freezing weather"], "a": 1}, {"n": 46, "p": "When responding to hazardous materials incidents, avoid positioning the apparatus:", "pg": "583", "o": ["on grooved paved surfaces.", "over manholes or storm drains.", "on the outside of other apparatus.", "upwind and/or uphill of the incident."], "a": 1}, {"n": 47, "p": "An aerial apparatus and device providing access or rescuing passengers over a wing of an aircraft should be positioned:", "pg": "585", "o": ["up and over the body of the aircraft.", "on either side behind the tail section.", "as directed by the aircraft flight crew.", "as if providing access to a building roof."], "a": 3}, {"n": 48, "p": "During an aircraft incident, the D/O may position the aerial apparatus near where the emergency aircraft stops while avoiding spotting in a position that:", "pg": "586", "o": ["may interfere with airport tower communications.", "obstructs the view of runway surveillance cameras.", "hinders deployment of the aircraft emergency slides.", "prevents the aircraft from taxiing away from spilled jet fuel."], "a": 2}, {"n": 49, "p": "When operating at petroleum storage tank fires, the apparatus should be positioned upwind and:", "pg": "586", "o": ["near the pump station.", "outside the dike’s walls.", "off of the access roadway.", "at least 75 feet away from the tank."], "a": 1}]}, {"ch": 17, "title": "Stabilizing the Aerial Apparatus", "qs": [{"n": 1, "p": "Where is the center of gravity of an aerial apparatus with the aerial device in the stowed position?", "pg": "597", "o": ["In the gravity circle directly below the outline of turntable", "Along the midline of the chassis, between the front and rear axles", "Parallel to the front axle of a mid-mount apparatus, the rear axle of a rear-mount apparatus", "At the midpoint between the engine and the hydraulic pump (pump panel on a quint apparatus)"], "a": 1}, {"n": 2, "p": "Raising the aerial device without proper stabilization is NOT recommended because of the hazardous situation created by:", "pg": "597", "o": ["potential distraction of fire service personnel.", "torsion stresses placed on the vehicle chassis.", "the inherent flexibility of the suspension and tires.", "the strain placed on the hydraulic pump when operating both systems."], "a": 2}, {"n": 3, "p": "If an unstabilized aerial apparatus device elevates from the cradle, the stress on the _____ may exceed design limits.", "pg": "598", "o": ["suspension", "hydraulic pump", "hoisting cylinders", "apparatus chassis"], "a": 0}, {"n": 4, "p": "Aerial apparatus manufacturers recommend the stabilizers be used to take weight off the apparatus suspension:", "pg": "598", "o": ["each time the apparatus elevates.", "when staged and awaiting assignment.", "if a master stream will introduce torsional stress.", "when personnel will be working from the aerial device."], "a": 0}, {"n": 5, "p": "How can a D/O increase the base of stability of an aerial apparatus?", "pg": "598", "o": ["Deploy the stabilizers", "Set the parking brake", "Extend only the front of the apparatus", "Operate within 15 degrees of centerline"], "a": 0}, {"n": 6, "p": "A rotating apparatus should remain stable as long as the gravity circle does not extend past:", "pg": "598", "o": ["the longitudinal axis of the apparatus.", "half of the maximum extension distance.", "the base of stability formed by the stabilizers.", "the wheelbase rectangle formed by the axles."], "a": 2}, {"n": 7, "p": "In a short-jacked apparatus, the gravity circle extends beyond the base of stability formed by the stabilizers:", "pg": "599", "o": ["on the short-jacked side.", "away from the short-jacked side.", "during device rotation maneuvers.", "when the device is raised above 15 degrees."], "a": 0}, {"n": 8, "p": "When an aerial apparatus is short-jacked, extending the aerial device on the short-jacked side will likely:", "pg": "599", "o": ["overturn the apparatus.", "cause the apparatus to slide.", "damage the extension cylinders.", "twist and warp the aerial device."], "a": 0}, {"n": 9, "p": "Which of the following may decrease the stability of an aerial apparatus parked on a lateral grade?", "pg": "599", "o": ["Activating and deactivating the PTO", "Raising and extending over an obstacle", "Raising the aerial device over the lower side", "Extending the aerial device over the higher side"], "a": 2}, {"n": 10, "p": "What information is contained in the manufacturer's load chart for an aerial apparatus?", "pg": "599", "o": ["The actual tip load capability of the aerial device", "The maximum payload, including personnel and equipment", "The gross vehicle weight and weight on each axle or tandem", "The weight of the aerial device and permanently fastened equipment"], "a": 0}, {"n": 11, "p": "Where is the engagement switch for the PTO or hydraulic system usually located on an aerial apparatus?", "pg": "601", "o": ["In the cab", "On the pedestal", "At the stabilizer controls", "At the rear control panel"], "a": 0}, {"n": 12, "p": "Which aerial apparatus procedures will depend on the type of transmission and whether the apparatus has a fire pump?", "pg": "601", "o": ["Engaging and disengaging PTOs", "Extending and lowering the stabilizers", "Positioning and spotting the apparatus", "Lowering and stowing the aerial device"], "a": 0}, {"n": 13, "p": "If the D/O determines the aerial device will operate in conjunction with the apparatus pump, when should the D/O engage the PTO?", "pg": "601", "o": ["Before the pump is engaged", "Before final positioning is complete", "Immediately after the pump is activated", "After handlines have begun to flow water"], "a": 2}, {"n": 14, "p": "What is the first step in setting the aerial apparatus stabilizers?", "pg": "606", "o": ["Coordinating aerial and pumping operations", "Engaging the PTO system to deploy the stabilizers", "Assessing the area as safe and appropriate for stabilization", "Chocking the apparatus wheels and placing stabilizer plates"], "a": 2}, {"n": 15, "p": "How should wheel chocks be placed before stabilizing an aerial apparatus?", "pg": "607", "o": ["Against the downhill side of front or rear wheels if on a longitudinal grade", "In front of front wheels and behind rear wheels, tight against the tire tread", "In front of and behind each tire with an inch of space for the apparatus to move", "Tightly against front and back of rear wheels of apparatus with rear-mount turntables"], "a": 2}, {"n": 16, "p": "A spotter can assist the D/O with positioning to safely deploy stabilizers by using:", "pg": "607", "o": ["a hand-held inclinometer to find the most level site.", "a pike pole to estimate the travel path of the stabilizers.", "traffic cones to route personnel around the deployment area.", "a Halligan tool to clear obstructions or debris from the surface."], "a": 1}, {"n": 17, "p": "When should cribbing be used to assist with aerial ladder stabilization?", "pg": "607", "o": ["Only by trained personnel as a last resort", "Routinely over level concrete curbs and walkways", "When positioning on hard dry ground or sturdy pavement", "When responding to a vehicle incident on a raised roadway"], "a": 0}, {"n": 18, "p": "Aerial stabilizer controls are typically found on the rear step, _____, or the midship of the vehicle.", "pg": "608", "o": ["pedestal", "dashboard", "cab console", "tailboard area"], "a": 3}, {"n": 19, "p": "Operating the aerial apparatus stabilizing controls can automatically regulate:", "pg": "608", "o": ["brake locks.", "ground lighting.", "engine idle speed.", "interlock overrides."], "a": 2}, {"n": 20, "p": "In stabilizing an aerial apparatus, when are stabilizer plates (jack plates, stabilizer pads) put into position?", "pg": "608", "o": ["As the spotter estimates the travel path of each stabilizer arm", "When the stabilizer beams reach their final extended positions", "After the wheels are chocked, before stabilizer beams are extended", "When the D/O determines the ground is soft, icy, or otherwise unstable"], "a": 1}, {"n": 21, "p": "As the aerial apparatus stabilizers are lowered onto the stabilizer pads, the D/O should:", "pg": "609", "o": ["watch overhead for obstructions or contact as the apparatus is lifted.", "begin preparing the aerial device for deployment by releasing bed locks.", "look at the contact area to ensure no damage or injury is going to occur by moving the beam or the jacks.", "watch the level gauges to ensure the apparatus is lifted uniformly front-to-rear and side-to-side throughout the process."], "a": 2}, {"n": 22, "p": "Some aerial apparatus allow for partial extension of the stabilizer arms, a process known as:", "pg": "610", "o": ["jack-knifing.", "side-loading.", "short-jacking.", "gravity circling."], "a": 2}, {"n": 23, "p": "In which of the following situations do the load and range of safe movement capabilities of an aerial apparatus significantly decrease?", "pg": "610", "o": ["When flowing water during waterway operations", "When the aerial device is deployed to its full working height", "When stabilizer extension arms are not fully extended (short-jacking)", "When a tractor-drawn apparatus is positioned with the tractor at an angle to the trailer"], "a": 2}, {"n": 24, "p": "The ideal location to stabilize an aerial apparatus is near-level pavement and:", "pg": "610", "o": ["within five degrees laterally and longitudinally on the level gauge.", "within two degrees laterally and longitudinally on the level gauge.", "leveled longitudinally on the level gauge, and within two degrees laterally.", "leveled laterally on the level gauge, and within two degrees longitudinally."], "a": 1}, {"n": 25, "p": "When operating an aerial apparatus on level ground, which stabilizers should be lowered first?", "pg": "610", "o": ["Both stabilizers on the operator’s side", "It makes no difference which side lowers first", "The stabilizers anticipated to bear the greatest stress load", "Both stabilizers on the side closest to the area of operation"], "a": 1}, {"n": 26, "p": "What may occur if one aerial apparatus stabilizer is fully activated alone?", "pg": "610", "o": ["Warping of the turntable base", "Undue stresses to the PTO pump", "Damage to the chassis and torque box", "Need for recalibration of the level gauges"], "a": 2}, {"n": 27, "p": "On even terrain, when the stabilizers make contact with the ground, how should the D/O raise the vehicle to its working position?", "pg": "611", "o": ["Alternate front and back jack pairs", "Alternate between jacks on the sides", "Fully raise the working side, then the non-working side", "Fully raise the non-working side, then the working side"], "a": 1}, {"n": 28, "p": "When operating on even terrain, the D/O should ensure _____ firmly contact the ground and bear weight.", "pg": "611", "o": ["all tires", "rear tires", "all stabilizers", "working-side stabilizers"], "a": 2}, {"n": 29, "p": "What type of aerial apparatus stabilizers extend straight down from the vehicle chassis?", "pg": "612", "o": ["H-jack stabilizers", "Box-type stabilizers", "Under-slung stabilizers", "Fulcrum-type stabilizers"], "a": 3}, {"n": 30, "p": "When stabilizing on uneven terrain, which type of unevenness is easier to correct?", "pg": "612", "o": ["Lateral unevenness (side to side)", "Longitudinal unevenness (end to end)", "Both can be corrected up to 10% (6 degrees)", "Neither can be corrected on any grade above 3% (2 degrees)"], "a": 0}, {"n": 31, "p": "When stabilizing on uneven terrain, many manufacturers of aerial devices recommend lowering the stabilizers on the _____ side of the vehicle first.", "pg": "613", "o": ["uphill", "working", "downhill", "non-working"], "a": 0}, {"n": 32, "p": "Where can aerial apparatus D/Os find the maximum longitudinal grades at which the device can be positioned and operate safely?", "pg": "614", "o": ["Vehicle control placard on the inside door of the cab", "Apparatus load charts at the turntable operator's position", "The written policies and procedures of their department or AHJ", "The manufacturers' instructions for their particular apparatus or device"], "a": 3}, {"n": 33, "p": "To minimize the stresses on the aerial device, when setting up on a longi
