tudinal grade, position the apparatus to operate the aerial device:", "pg": "614", "o": ["at as high an angle as possible.", "at 90 degrees from the midline of the vehicle.", "directly over the front or rear of the apparatus.", "at a low angle as far as possible from the turntable."], "a": 2}, {"n": 34, "p": "Which situation should be avoided as it reduces the stabilizer’s ability to make solid contact with the ground?", "pg": "615", "o": ["Icy patches", "Compacted gravel", "Crowned roadways", "Bare concrete paving"], "a": 0}, {"n": 35, "p": "On which terrain condition must the D/O constantly monitor the stabilizers and be prepared to lower them further for maximum ground contact?", "pg": "615", "o": ["Frozen ground", "Raised roadways", "Cold asphalt paving", "Hot concrete surfaces"], "a": 0}, {"n": 36, "p": "After stabilizers are fully deployed, the D/O must ensure they are:", "pg": "615", "o": ["level and plumb.", "resistance tested.", "locked and stable.", "marked and flagged."], "a": 2}, {"n": 37, "p": "What is included on many aerial apparatus stabilizers to safeguard against the dropping or drift of the jacks?", "pg": "616", "o": ["Stabilizer pads", "Blocks or chocks", "Manual locking systems", "Pneumatic check valves"], "a": 2}, {"n": 38, "p": "What is the first operation when operating two-part box stabilizers?", "pg": "616", "o": ["Engage the interlocks and manual locking systems", "Place the stabilizer pads where the jacks will ultimately rest", "Extend the parallel extension arms to their maximum travel distance", "Lower the stabilization jack to raise the vehicle to a level operating position"], "a": 2}, {"n": 39, "p": "Before raising the stabilizers, the D/O should:", "pg": "618", "o": ["remove and stow the wheel chocks.", "have a spotter map the travel path with a pike pole.", "confirm hydraulic fluid levels and pressures are within specifications.", "check around the apparatus to make sure personnel and equipment stand clear."], "a": 3}, {"n": 40, "p": "In which order should the D/O raise the stabilizers?", "pg": "618", "o": ["In the reverse order of deployment", "In the same order as they were deployed", "Raise the working side first, then non-working side", "Raise the rear stabilizers first, then front stabilizers"], "a": 0}, {"n": 41, "p": "Once the stabilizer raising procedure concludes, the D/O should return the selector valve to the neutral position and:", "pg": "618", "o": ["turn off the vehicle engine.", "disengage the PTO system.", "bed and lock the aerial device.", "engage manual stabilizer locks."], "a": 1}]}, {"ch": 18, "title": "Operating Aerial Apparatus", "qs": [{"n": 1, "p": "Other department members may need to communicate apparatus movement instructions to the driver/operator through verbal commands and/or:", "pg": "627", "o": ["Morse code.", "hand signals.", "flashing lights.", "air horn blasts."], "a": 1}, {"n": 2, "p": "What must the D/O rely on if they cannot maintain visual contact with the aerial device?", "pg": "629", "o": ["Personnel working at the tip", "Electronic positioning sensors", "One or more trained spotter(s)", "Turntable and lifting cylinder positions"], "a": 2}, {"n": 3, "p": "Where is the primary control position for the aerial operator?", "pg": "629", "o": ["Midship on the operator's side", "At the upper platform controls", "At the lower turntable controls", "At the operator's seat in the cab"], "a": 2}, {"n": 4, "p": "Who must staff the primary control position any time the aerial device is in operation?", "pg": "629", "o": ["A Firefighter II or paramedic", "Both a trained operator and an officer", "A trained operator or a trained spotter", "A trained and authorized aerial operator"], "a": 3}, {"n": 5, "p": "Where is the secondary control position of an elevating platform?", "pg": "629", "o": ["At the turntable", "On the platform", "In the vehicle cab", "With the stabilizer controls"], "a": 1}, {"n": 6, "p": "What must occur whenever the aerial device is being operated from the secondary position?", "pg": "630", "o": ["Disable primary controls during aerial operations", "Station an operator at the primary control station", "Provide continuous radio narrative of aerial operations", "Maintain a 50 foot (15 m) clear zone around the apparatus"], "a": 1}, {"n": 7, "p": "What are secondary controls on an aerial ladder intended to be used for?", "pg": "630", "o": ["Elevating and rotating only", "Retracting, rotating, and lowering only", "Fine-tuning positioning close to the objective", "Moving the ladder through full range of motion"], "a": 2}, {"n": 8, "p": "What feature displays the safe load at various positions of the aerial device?", "pg": "631", "o": ["Door jamb placard", "Load limit indicator", "Aerial device interlock", "Chassis level indicator"], "a": 1}, {"n": 9, "p": "When estimating the weight on an aerial device, the operator can substitute _____ for the weight of a firefighter with gear.", "pg": "631", "o": ["200 pounds (90 kg)", "250 pounds (110 kg)", "300 pounds (135 kg)", "350 pounds (160 kg)"], "a": 1}, {"n": 10, "p": "Aerial devices are often rated for higher tip load capacities as:", "pg": "631", "o": ["water flow increases.", "wind speeds increase.", "elevation angles increase.", "elevation angles decrease."], "a": 2}, {"n": 11, "p": "Aerial devices are at their weakest when operated at:", "pg": "632", "o": ["high angles and long extensions.", "low elevation and long extension.", "angles perpendicular to the chassis.", "a partially elevated and extended position."], "a": 1}, {"n": 12, "p": "Aerial operators can find load information for aerial apparatus in the operator's manual and:", "pg": "632", "o": ["placarded on the turntable.", "in the appendix of NFPA 1900.", "in the AHJ policies and procedures.", "near the primary elevation cylinder."], "a": 0}, {"n": 13, "p": "What operation must be performed before conducting aerial operations?", "pg": "632", "o": ["Engage the pump", "Stabilize the apparatus", "Test breathing air system", "Deploy supporting handlines"], "a": 1}, {"n": 14, "p": "In what order should telescoping aerial operations be conducted?", "pg": "633", "o": ["Elevate, rotate, extend", "Elevate, extend, rotate", "Rotate, extend, elevate", "Rotate, elevate, extend"], "a": 0}, {"n": 15, "p": "Because of the forces generated, all movements of a telescoping aerial device must be:", "pg": "633", "o": ["short, quick, and precise.", "made in gradual increments.", "slow, smooth, and controlled.", "conducted as one continuous sweep."], "a": 2}, {"n": 16, "p": "What type of aerial apparatus is equipped with only a master stream nozzle at the end of the upper boom?", "pg": "634", "o": ["Water tower", "Water cannon", "Aerial monitor", "Pinnable waterway"], "a": 0}, {"n": 17, "p": "What type of aerial apparatus equipped with a master steam nozzle is also designed to carry firefighters and equipment?", "pg": "634", "o": ["Water tower", "Aerial platform", "Hydraulic boom lift", "Deck-mounted monitor"], "a": 1}, {"n": 18, "p": "In what position should articulating platforms be operated?", "pg": "634", "o": ["Forward of the turntable", "Downhill of the apparatus", "Off the rear of the vehicle", "Perpendicular to the chassis"], "a": 0}, {"n": 19, "p": "What determines the operational speed of an aerial device with hydraulic controls?", "pg": "634", "o": ["The hydraulic control governor setting", "The overall volume of the hydraulic system", "The idle speed (rpms) of the vehicle engine", "The amount a control lever is pushed or pulled"], "a": 3}, {"n": 20, "p": "Drivers of articulating aerial devices must be continuously aware of the position of the _____, as well as the working end of the device.", "pg": "634", "o": ["stabilizer beams and jacks", "target on the master stream", "firefighters deploying hand lines", "elbow joint between the boom sections"], "a": 3}, {"n": 21, "p": "When a pre-piped aerial ladder waterway is in rescue mode, the monitor is secured to the:", "pg": "636", "o": ["turntable.", "ladder tip.", "midsection.", "base section."], "a": 2}, {"n": 22, "p": "An aerial pre-piped ladder waterway with the monitor secured at the tip of the ladder is in _____ mode.", "pg": "636", "o": ["rescue", "defense", "elevated", "waterway"], "a": 3}, {"n": 23, "p": "Operators have a greater ability to place the aerial ladder and monitor in a position that maximizes the stream’s effectiveness when the monitor is:", "pg": "636", "o": ["secured to the mid-section.", "attached to the lower section.", "placed at the tip of the ladder.", "mounted on the apparatus deck."], "a": 2}, {"n": 24, "p": "What should the D/O do before a pre-piped aerial waterway is charged with water?", "pg": "636", "o": ["Verify that the supply line has adequate flow", "Increase the apparatus engine speed (RPMs)", "Maneuver the device to its final operating position", "Double-check that the monitor is locked in position"], "a": 3}, {"n": 25, "p": "Detachable waterways on aerial ladders are supplied by a _____ down the center of the ladder rungs.", "pg": "637", "o": ["3 inch (77 mm) or smaller hose", "3 inch (77 mm) coupled aluminum pipe", "5 inch (127 mm) or larger hose", "6 inch (152 mm) hard suction line"], "a": 0}, {"n": 26, "p": "Detachable waterway master stream devices mounted on aerial ladders are operated and controlled by:", "pg": "637", "o": ["adjusting a-frame support poles.", "electronic controls at the turntable.", "halyard ropes controlled from the ground.", "setting the orientation before deployment."], "a": 2}, {"n": 27, "p": "Which of the following may cause reactions that may result in shock loading that can damage an aerial ladder with a detachable waterway?", "pg": "638", "o": ["Sustained moderate winds", "A firefighter moving down the ladder", "Sudden pressure changes to the water flow", "Adjusting the direction of the master stream"], "a": 2}, {"n": 28, "p": "How far can ladders with detachable ladder pipe appliances restrict the sideways movement of the nozzle to either side of the center?", "pg": "639", "o": ["5 degrees", "15 degrees", "30 degrees", "45 degrees"], "a": 1}, {"n": 29, "p": "What is the preferred aerial device for placing firefighters at the master steam deployment position?", "pg": "640", "o": ["Elevating platform apparatus", "Long span articulating water tower", "Straight ladder with pre-piped waterway", "Straight ladder with detachable waterway"], "a": 0}, {"n": 30, "p": "What type of aerial device provides firefighters with breathing air, a heat shield, and secondary controls?", "pg": "640", "o": ["Water towers", "Straight ladders", "Ladder plaforms", "Elevating platforms"], "a": 3}, {"n": 31, "p": "What conditions call for the operator to immediately lower the aerial apparatus and keep personnel inside a building or inside the enclosed cab?", "pg": "641", "o": ["High wind", "Extreme heat", "Thunderstorms", "Decreased visibility"], "a": 2}, {"n": 32, "p": "The apparatus load chart can provide information about operating aerial apparatus in:", "pg": "641", "o": ["heavy rain.", "high winds.", "fire exposure.", "extreme heat."], "a": 1}, {"n": 33, "p": "What weather-related condition adversely affects stability, lessens the working load capacity, and significantly reduces rescue capability of an aerial device?", "pg": "643", "o": ["Ice", "Fog", "Rain", "Heat"], "a": 0}, {"n": 34, "p": "Due to the added weight, what is the maximum allowable ice build-up limit on the surface of an aerial device?", "pg": "643", "o": ["1/10 inch (2.5 mm)", "1/4 inch (6 mm)", "3/8 inch (10 mm)", "1/2 inch (12 mm)"], "a": 1}, {"n": 35, "p": "The D/O should be prepared to reposition the device when the danger of exposure to _____ is evident.", "pg": "645", "o": ["lightning", "high winds", "snow and ice", "extreme heat"], "a": 3}, {"n": 36, "p": "Discoloration, disfiguration, deformed welds, or improper operation of the aerial device can be signs of:", "pg": "645", "o": ["heat damage.", "torsion stress.", "shock loading.", "overload damage."], "a": 0}, {"n": 37, "p": "When heat damage is noted, or even suspected on an aerial device, it must be removed from service immediately and:", "pg": "645", "o": ["inspected and/or repaired.", "decommissioned and retired.", "destroyed or rendered unusable.", "all rivets and connectors replaced."], "a": 0}, {"n": 38, "p": "What circumstance requires use of the auxiliary hydraulic pump to operate an aerial device?", "pg": "646", "o": ["Leaking hydraulic fluid", "High hydraulic oil temperature", "Failure of the main hydraulic pump", "Using the emergency power unit (EPU)"], "a": 2}, {"n": 39, "p": "The emergency power unit (EPU) is an electric pump designed to _____ in the event of a mechanical failure.", "pg": "646", "o": ["circulate and cool the aerial apparatus hydraulic fluid", "operate the aerial device through its full range of motion", "lower and bed the aerial device and retract the stabilizers", "assist the hydraulic pump during high-demand operations"], "a": 2}, {"n": 40, "p": "Which statement about the aerial device emergency power unit (EPU) is correct?", "pg": "646", "o": ["The apparatus engine powers the EPU", "The EPU is not designed for continuous use", "EPUs have similar size and power as PTO driven hydraulic pumps", "The EPU runs components at the same speed as the hydraulic pump"], "a": 1}, {"n": 41, "p": "When operating an aerial device on a grade, the driver/operator should stabilize the apparatus so that the level indicator is:", "pg": "647", "o": ["in the red section.", "in the green section.", "at a 45-degree angle.", "parallel to the ground."], "a": 1}, {"n": 42, "p": "When operating an aerial device on a grade, in which direction should the D/O position the aerial device to keep beams parallel to the ground?", "pg": "647", "o": ["Over the cab or rear", "Perpendicular to the grade", "To either side of the apparatus", "At a 90-degree angle to the cab"], "a": 0}, {"n": 43, "p": "How can a D/O determine if an aerial apparatus can be safely deployed for below grade operations?", "pg": "648", "o": ["See guidelines in NFPA 1900", "Test range of motion during training", "Consult the on-scene Incident Commander", "Consult the manufacturer’s operating guide"], "a": 3}, {"n": 44, "p": "Special rescue operations are commonly required for_____ operations.", "pg": "649", "o": ["below-grade aerial", "basement ventilation", "industrial fire defense", "master stream deployment"], "a": 0}, {"n": 45, "p": "How can an aerial device assist with special rescue operations?", "pg": "649", "o": ["Anchor and hold unstable elements at the scene", "Create a high-point anchor for a rope rescue system", "Lift and move rescuers and victims from below grade", "Act as an inclined plane to move equipment to the site"], "a": 1}, {"n": 46, "p": "Which type of aerial device is well-suited to below-grade rescue as it can reach out, down, and under the surface on which the apparatus is parked?", "pg": "649", "o": ["Telescoping aerial platform", "Tractor-drawn aerial (TDA) ladder", "Three-section telescoping aerial ladder", "Three-boom articulating aerial platform"], "a": 3}, {"n": 47, "p": "During a structure fire, an aerial apparatus should be positioned _____ when possible and applicable.", "pg": "650", "o": ["at the A side of the structure", "on the corner of the structure", "near the incident command post", "close to a hydrant or other water source"], "a": 1}, {"n": 48, "p": "What should be the last movement when approaching a structure with the aerial device?", "pg": "652", "o": ["Lowering the device to the final position", "Rotating the device to optimal alignment", "Extending the device to reach the objective", "Raising the device to the operating position"], "a": 0}, {"n": 49, "p": "Personnel must climb, ride, and work on the apparatus and device using the _____ method.", "pg": "652", "o": ["feet first placement", "straight arm support", "straight leg horizontal", "three points of contact"], "a": 3}, {"n": 50, "p": "Any personnel climbing the ladder or riding in the platform must equip themselves with:", "pg": "653", "o": ["flexible climbing boots.", "helmet-mounted LED lights.", "Type P, Class 2 safety vests.", "a fall restraint ladder belt and tether."], "a": 3}, {"n": 51, "p": "Fall protection tethers must only be secured to:", "pg": "654", "o": ["designated anchor points.", "supporting cables or pulleys.", "the ladder tip or the platform.", "structural features of the device."], "a": 3}, {"n": 52, "p": "What type of hazard is presented by wire ropes and cables on aerial devices?", "pg": "654", "o": ["Trip and fall", "Falling object", "Pinch and crush", "Ergonomic stress"], "a": 2}, {"n": 53, "p": "The aerial device should never be operated within _____ of an overhead power line that is energized from 600 to 50,000 volts.", "pg": "655", "o": ["5 feet (1.5 m)", "10 feet (3 m)", "25 feet (7.5 m)", "50 feet (15 m)"], "a": 1}, {"n": 54, "p": "Aerial devices must maintain _____ clearance from high-voltage transmission lines that transport electricity over 50,000 volts.", "pg": "655", "o": ["10 feet (3 m)", "20 feet (6 m)", "50 feet (15 m)", "100 feet (30 m)"], "a": 2}, {"n": 55, "p": "Before climbing up to the tiller seat, tiller operators should always check:", "pg": "658", "o": ["the position of the light bar.", "the air pressure in the tiller tires.", "the travel route planned by the operator.", "the direction of travel of the tiller wheels."], "a": 3}, {"n": 56, "p": "Tiller operators rely on communication with the _____ to coordinate routes, directions, and destination information.", "pg": "658", "o": ["D/O", "navigator", "dispatcher", "commander"], "a": 0}, {"n": 57, "p": "Tiller operators communicate with the D/O by means of:", "pg": "658", "o": ["hand signals.", "flashing lights.", "speaker and microphone headset systems.", "communication relayed through a dispatcher."], "a": 2}, {"n": 58, "p": "If a tiller apparatus is NOT equipped with headsets, D/Os and tiller operators communicate through:", "pg": "658", "o": ["light flashes.", "horn signals.", "hand signals.", "colored lights."], "a": 1}, {"n": 59, "p": "What can be a result of over-tillering, turning the tiller steering wheel when there is no need to steer?", "pg": "658", "o": ["Visibility is reduced for the tiller operator", "The fuel efficiency of the apparatus decreases", "It is harder for the D/O to maintain solid control", "It imposes undue stresses on the chassis and axles"], "a": 2}, {"n": 60, "p": "What driving condition makes it harder to see hazards, reducing response times?", "pg": "659", "o": ["High winds", "Overcast skies", "Driving at night", "High traffic volumes"], "a": 2}, {"n": 61, "p": "Where do the greatest number of collisions involving emergency vehicles occur?", "pg": "659", "o": ["Intersections", "Right-hand turns", "Divided highways", "Off-ramps and on-ramps"], "a": 0}, {"n": 62, "p": "When should the tiller operator and D/O communicate about the actions they will take at an intersection?", "pg": "659", "o": ["As they approach the intersection", "During pre-planning after dispatch", "When starting through the intersection", "During incident pre-planning and training"], "a": 0}, {"n": 63, "p": "NFPA 1550, Standard for Emergency Responder Health and Safety, requires fire apparatus D/Os to _____ before proceeding through an intersection.", "pg": "659", "o": ["slow to 10 mph (15 km/h) and sound the horn", "fully stop and wait for the traffic lights to turn green", "briefly flash the apparatus lights and sound the horn", "fully stop and account for vehicles in all lanes of traffic"], "a": 3}, {"n": 64, "p": "Which weather condition is most likely to cause glare while driving the tiller of a fire truck at night?", "pg": "659", "o": ["Snow", "High winds", "Dust storms", "Extreme heat"], "a": 0}, {"n": 65, "p": "What weather phenomenon can contribute to both decreased vision and increased glare for a tiller operator driving at night?", "pg": "659", "o": ["Fog", "Hail", "Sandstorms", "Thunderstorms"], "a": 0}, {"n": 66, "p": "When backing a tractor-drawn aerial (TDA), turning the tiller steering wheel to the right will cause:", "pg": "660", "o": ["the tiller to move to the left.", "the tiller to move to the right.", "the tractor to move to the left.", "the tractor to move to the right."], "a": 0}, {"n": 67, "p": "When moving a tractor-drawn aerial (TDA) in reverse, the tiller operator can place both hands at the _____ position on the wheel.", "pg": "660", "o": ["seven- and five-o'clock", "eight- and four-o'clock", "ten- and two-o'clock", "twelve- and six-o'clock"], "a": 0}, {"n": 68, "p": "When stabilizing a TDA, maximum stability is achieved when the angle of the tractor is _____ from the centerline of the trailer, and the aerial ladder is operated toward the outside of that angle.", "pg": "660", "o": ["30 to 59 degrees", "60 degrees", "61 to 90 degrees", "90 degrees"], "a": 1}, {"n": 69, "p": "To increase stability beyond what the stabilizers on a TDA can provide, position the apparatus:", "pg": "660", "o": ["with the tractor directly facing the objective.", "in a position to work off the rear of the apparatus.", "with the tractor and trailer parallel to the objective.", "with an angle between the tractor and trailer sections."], "a": 3}, {"n": 70, "p": "Poor stability is produced, and damage may occur, if a TDA is parked with the tractor and trailer at an angle greater than:", "pg": "660", "o": ["30 degrees.", "45 degrees.", "60 degrees.", "90 degrees."], "a": 3}, {"n": 71, "p": "To place a tractor-drawn aerial (TDA) in an angled position, first turn the tractor wheels sharply away from the building and pull forward, then turn the _____ and back the tractor slightly.", "pg": "660", "o": ["tiller wheels sharply toward the building", "tractor wheels sharply toward the building", "tiller wheels sharply away from the building", "tractor wheels sharply away from the building"], "a": 0}, {"n": 72, "p": "Techniques for jackknifing tillered apparatus for stabilization are more important for:", "pg": "661", "o": ["tillered quint apparatus.", "older models of apparatus.", "apparatus over 60 feet (18 m) in length.", "apparatus with midship mounted aerials."], "a": 1}, {"n": 73, "p": "What serves as a checklist for D/Os visual and operational checks of an aerial apparatus?", "pg": "662", "o": ["NFPA 1910, Appendix D", "Departmental forms and SOPs", "Manufacturers' operators manual", "Emergency Vehicle Technician Guidelines"], "a": 1}, {"n": 74, "p": "Operators should check hydraulic fluid levels only when:", "pg": "663", "o": ["included in departmental maintenance schedules.", "the apparatus has been stabilized on a level surface.", "trained and certified as an emergency vehicle technician.", "the stabilizers and aerial device are all in their stowed positions."], "a": 3}, {"n": 75, "p": "Before beginning operational checks, D/Os should park the apparatus, _____, set the parking brake, and chock the tires.", "pg": "663", "o": ["shut down the vehicle engine", "activate the emergency lights", "place the transmission in park", "place the transmission in neutral"], "a": 3}, {"n": 76, "p": "During operational checks of the stabilization system, D/Os should examine hydraulic lines and hoses for:", "pg": "664", "o": ["installation date tags or stickers.", "kinks, cuts, abrasions, and leakage.", "clear dimension and specification markings.", "adequate lubrication and smooth movement."], "a": 1}, {"n": 77, "p": "If the apparatus leans toward one side after stabilizer deployment, the D/O should check for:", "pg": "664", "o": ["mismatched stabilizer pads.", "a leak in the hydraulic system.", "loose aerial device hold-down locks.", "bending and warping of the stabilizer arms."], "a": 1}, {"n": 78, "p": "Thorough operational checks of the aerial device may require the aerial to be:", "pg": "664", "o": ["used to deploy a full-flowing master stream.", "placed in a full horizontal position at full extension.", "placed in a full vertical position and slowly extended.", "operated through the full range of motion from the tip controls."], "a": 1}, {"n": 79, "p": "When performing an operational check of the emergency power unit (EPU), the main hydraulic system should be disengaged, and _____ before turning on the pump to prevent deadheading.", "pg": "665", "o": ["the device must be bedded", "a control valve must be open", "the vehicle engine set at idle speed", "a spotter stationed behind the apparatus"], "a": 1}, {"n": 80, "p": "When operational checks of an apparatus are complete, the D/O should:", "pg": "666", "o": ["wash the apparatus and clean the cab.", "add an inspection decal to the windshield.", "take the apparatus out of service for 24 hours.", "complete and save AHJ-required forms and reports."], "a": 3}, {"n": 81, "p": "Who is responsible for performing routine structural testing of an aerial device?", "pg": "666", "o": ["The D/O and tiller operator", "An emergency vehicle technician", "An ASE-certified vehicle mechanic", "A certified fire code enforcement inspector"], "a": 1}, {"n": 82, "p": "Steering wheel free play must NOT exceed 2 inches on a 20 inch wheel (50 mm on a 500 mm wheel), or _____ degrees on any other sized steering wheel.", "pg": "666", "o": ["2", "5", "10", "20"], "a": 2}, {"n": 83, "p": "What may be the result of insufficient lubrication of the coupling attaching the tractor to the trailer in a tillered aerial apparatus?", "pg": "666", "o": ["Torquing of the tiller cab", "Difficulty in steering control", "Uneven tire wear on the tractor", "Shearing of the straight-line locking pin"], "a": 1}, {"n": 84, "p": "Apparatus that are currently in service must undergo service testing at least every:", "pg": "666", "o": ["month.", "six months.", "year.", "five years."], "a": 2}, {"n": 85, "p": "What type of testing occurs every five years, after accidents, when the aerial device has been subjected to unusual stresses and loads, and following major repairs or overhauls?", "pg": "667", "o": ["Service testing", "Visual inspection", "Operational inspection", "Nondestructive testing"], "a": 3}]}, {"ch": 19, "title": "Aerial Apparatus Strategies and Tactics", "qs": [{"n": 1, "p": "Why are aerial apparatus companies typically deployed during an offensive strategy at a structure fire?", "pg": "689", "o": ["Increase water levels", "Deployment of a master stream", "Rescue victims and for ventilation", "Protect adjacent structures and exposures"], "a": 2}, {"n": 2, "p": "During a rescue and extinguishment incident, which of the following may result in a dramatic change in fire conditions?", "pg": "689", "o": ["Failure to coordinate ventilation", "Using a master stream on a collapsed structure", "Conducting rescue operations from upper floors", "Deploying a master stream to protect exposures"], "a": 0}, {"n": 3, "p": "Why should D/Os consider deploying an aerial ladder in a ready state during offensive fire attacks?", "pg": "689", "o": ["To provide real-time training opportunities", "In anticipation of a transition to a defensive attack", "In preparation for a cool water mist for firefighter rehabilitation", "To allow the Incident Commander to view operations from above"], "a": 1}, {"n": 4, "p": "What can cause torsional loads when master streams are deployed from an aerial device?", "pg": "691", "o": ["Insufficient or intermittent water supply", "Switching from a straight stream to a fog stream", "Nozzle reaction from improperly positioned nozzles", "Positioning to operate off the side of the apparatus"], "a": 2}, {"n": 5, "p": "How should an aerial apparatus be positioned when using the device to deliver a master stream close to ground level?", "pg": "691", "o": ["With the turntable offset to protect the operator", "With the turntable directly in line with the target", "At the corner of the building or at a safe distance", "With the apparatus \"quartering away\" from the target"], "a": 1}, {"n": 6, "p": "How should the operator deliver water when the aerial apparatus master stream is used during a transitional attack?", "pg": "691", "o": ["Short applications of a fog stream", "Short applications of a solid stream", "Long, steady applications of a fog stream", "Long, steady applications of a solid stream"], "a": 1}, {"n": 7, "p": "During a transitional attack at a building, where should the operator direct the aerial apparatus master stream?", "pg": "692", "o": ["The base of the fire", "The open area above the flames", "The ceiling of the target fire area", "The ground level of a target fire area"], "a": 2}, {"n": 8, "p": "When elevated master streams are used during a transitional attack, they should be flowed long enough to:", "pg": "692", "o": ["darken down the fire.", "fully extinguish the fire.", "disrupt thermal layering.", "flood the compartment with steam."], "a": 0}, {"n": 9, "p": "For every 250 gpm (1 000 L/min) of water applied, _____ of weight is added to a structure.", "pg": "692", "o": ["500 pounds (250 kg)", "1,000 pounds (500 kg)", "2,000 pounds (1 000 kg)", "3,000 pounds (1 500 kg)"], "a": 2}, {"n": 10, "p": "The most common use of an elevated master stream is for:", "pg": "692", "o": ["initial entry support.", "offensive operations.", "defensive operations.", "shielding rescue operations."], "a": 2}, {"n": 11, "p": "For defensive attacks using an elevated master stream, the apparatus should be positioned:", "pg": "693", "o": ["on the unburned side of the building.", "as near as possible to the seat of the fire.", "with the tailboard past the corner of the building.", "as close as possible to the hydrant or water supply."], "a": 0}, {"n": 12, "p": "In which of the following situations is it more likely for fire to spread to an exposure?", "pg": "694", "o": ["If the exposure is made with wood siding", "The wind is blowing from the exposure toward the fire", "When the exposure is 50 feet (15 m) upwind of the fire", "A heavy rain occurred a few hours before the fire began"], "a": 0}, {"n": 13, "p": "Applying large fog streams into the thermal column above a fire is a tactic used to:", "pg": "694", "o": ["deliver large volumes of water to the seat of the fire.", "inhibit flashover conditions during a transitional attack.", "push flames and heat away from fire crews inside the structure.", "reduce the chances of burning embers traveling through the air."], "a": 3}, {"n": 14, "p": "When positioning the aerial apparatus for exposure protection, there should always be _____ in case conditions worsen.", "pg": "696", "o": ["a straightforward exit route", "an operator in the apparatus cab", "preconnected handlines on the device", "a standby firefighter protecting the apparatus"], "a": 0}, {"n": 15, "p": "What type of fire stream will allow for maximum coverage of an exposure?", "pg": "696", "o": ["Fog stream", "Solid stream", "Broken stream", "Straight stream"], "a": 0}, {"n": 16, "p": "What is an advantage of using an aerial device as an exterior standpipe to upper floors?", "pg": "696", "o": ["Removes the need to reposition the device", "Eliminates difficult hose lays up interior stairwells", "Delivers more water than a building standpipe system", "Eliminates stresses from water hammer and nozzle reaction"], "a": 1}, {"n": 17, "p": "Which rescue scenario places greater stress on an aerial device in a rescue situation?", "pg": "697", "o": ["The static load of a victim's weight", "A fog stream directed near the device", "Lowering a device into a rescue position", "A victim climbing or jumping onto the device"], "a": 3}, {"n": 18, "p": "During rescue operations, the operator should maneuver the aerial device by _____ the device into a rescue position.", "pg": "697", "o": ["raising", "rotating", "lowering", "extending"], "a": 2}, {"n": 19, "p": "In an ideal rescue situation, the operator should position the apparatus on level grade and:", "pg": "697", "o": ["upwind of the target.", "behind a shielding structure.", "in the center of the longest wall.", "as close as possible to the target."], "a": 0}, {"n": 20, "p": "To decrease the risk of damage to the truck and injury to the firefighters in the event of a building collapse, the aerial apparatus should be positioned:", "pg": "697", "o": ["at a corner of the building.", "close to the center of the structure.", "parallel to the A side of the structure.", "at the furthest point of stream delivery."], "a": 0}, {"n": 21, "p": "During rescue, the operator may place the platform gate more squarely in line with the target by positioning the apparatus with the:", "pg": "697", "o": ["tailboard in line with the target.", "turntable in direct line with the target.", "turntable at the corner of the building.", "tailboard past the corner of the building."], "a": 2}, {"n": 22, "p": "What type of fire stream can be used to protect victims, rescuers, and the aerial device when rescues occur in areas threatened by fire?", "pg": "698", "o": ["Solid stream", "Straight stream", "Wide-angle fog stream", "Intermittent broken stream"], "a": 2}, {"n": 23, "p": "Typically, occupants are in the greatest danger, therefore the highest rescue priority in a fire situation are those:", "pg": "698", "o": ["on the fire floor and floors below.", "on or immediately above the fire floor.", "in structures exposed to the hottest fire.", "afraid of using fire escapes or stairways."], "a": 1}, {"n": 24, "p": "Rescue operations with an aerial apparatus should give first priority to severely threatened victims, then to:", "pg": "698", "o": ["people in exposed areas.", "panicked victims in safe areas.", "other victims in the hazard area.", "larger groups of endangered victims."], "a": 3}, {"n": 25, "p": "The ideal position for rescue with an aerial device is one in which the extended and rotated aerial device is _____ the objective.", "pg": "699", "o": ["parallel to", "slightly below", "downwind from", "perpendicular to"], "a": 3}, {"n": 26, "p": "When positioning an aerial device for rescue from a damaged building, operators must be alert for _____ that may injure persons on the device and/or damage the apparatus.", "pg": "700", "o": ["falling debris", "blowing smoke", "hazardous vapors", "window coverings"], "a": 0}, {"n": 27, "p": "When conducting a window rescue using an aerial platform, the _____ of the platform should be placed even with the windowsill.", "pg": "701", "o": ["floor", "top rail", "middle rail", "scene lights"], "a": 1}, {"n": 28, "p": "When removing trapped victims from a roof, how far should the tip of the aerial ladder extend above the edge of the roof?", "pg": "703", "o": ["At least 2 feet (600 mm)", "At least 3 feet (1 m)", "At least 6 feet (2 m)", "At least 12 feet (3.5 m)"], "a": 2}, {"n": 29, "p": "Which type of aerial device has an advantage over telescoping devices when conducting rescues over a parapet wall?", "pg": "703", "o": ["Telescoping ladders", "Rear-mount ladders", "Articulating platforms", "Telescoping platforms"], "a": 2}, {"n": 30, "p": "What should firefighters be aware of when conducting operations where solar panels and photovoltaic (PV) panels are present?", "pg": "704", "o": ["Special keys are required to operate inverter shutoff switches", "Solar panels retain heat and can produce severe contact burns", "Electric meters always retain residual charges when switched off", "Current may travel down the water stream and cause electrical shock"], "a": 3}, {"n": 31, "p": "How is an unconscious or severely injured victim removed from a structure using an aerial ladder?", "pg": "705", "o": ["Cradled by one firefighter's arm while descending", "Assisted by a firefighter using the knee-sit method", "Carried over a firefighter's shoulders (fireman carry)", "Positioned across the rails, supported by a firefighter's arms"], "a": 3}, {"n": 32, "p": "The number of conscious victims that can be lowered with an aerial platform is determined by the load capacity of the aerial device and the:", "pg": "707", "o": ["space inside the platform.", "height of the point of rescue.", "number of assisting firefighters.", "distance from the top rail to the victims."], "a": 0}, {"n": 33, "p": "Two firefighters are preferable for removal of conscious victims using an aerial platform; one to operate the device from the control station, and a second to:", "pg": "707", "o": ["serve as a landing spotter on the ground.", "help victims don their fall protection devices.", "remain at the loading point to reassure victims.", "assist victims as they move out of the platform."], "a": 2}, {"n": 34, "p": "During a rescue, firefighters may be able to remove victims from heat and smoke quickly by:", "pg": "707", "o": ["carrying the them through the platform gates.", "lifting them over the top rail onto the platform.", "lowering them from the platform with a pulley system.", "suspending them below the platform in a Stokes basket."], "a": 1}, {"n": 35, "p": "What is the easiest method of lowering a Stokes basket with an aerial ladder?", "pg": "709", "o": ["Sliding the basket down the ladder", "Using a rope system to lower the basket", "Multiple firefighters passing the basket hand-to-hand", "Securing the basket to the tip and lowering the ladder"], "a": 0}, {"n": 36, "p": "Before an aerial ladder is used as part of a rope lowering system for removing victims in basket litters, the operator must know the:", "pg": "709", "o": ["limitations of all tools involved.", "medical condition of the victim.", "distance the victim will be lowered.", "training levels for all personnel involved."], "a": 0}, {"n": 37, "p": "When using the aerial ladder as a high point anchor for rope rescue, victims and rescuers should be lifted by:", "pg": "709", "o": ["an electric winch.", "authorized personnel.", "elevating the aerial ladder.", "a rope anchored to the lower section."], "a": 1}, {"n": 38, "p": "When lifting objects other than people, if the device includes a pulley, the rope’s working end should be anchored to:", "pg": "710", "o": ["a secure static object.", "the apparatus bumper.", "a screw-type ground anchor.", "a lower section of the ladder."], "a": 3}, {"n": 39, "p": "Which is a reason departments should discourage the use of aerial apparatus for emergency water rescues?", "pg": "710", "o": ["Rescuing firefighters must be certified rescue swimmers", "Lighting conditions limit the operator's view of the device tip", "Many departments do not have personal flotation devices (PFDs)", "The lack of a suitable location to stabilize the apparatus adequately"], "a": 3}, {"n": 40, "p": "What may cause a violent and continual recoil action in an aerial device?", "pg": "710", "o": ["Contact with swift water", "Master stream nozzle reaction", "Ice accumulation on the beams", "Untrained victims descending the ladder"], "a": 0}, {"n": 41, "p": "During ventilation operations, the D/O must NEVER use the aerial device:", "pg": "711", "o": ["downwind of an active fire.", "as a support for a roof ladder.", "above the line of the roof or parapet.", "as a battering ram or forcible entry tool."], "a": 3}, {"n": 42, "p": "When providing access for firefighters ventilating a flat roof, the aerial apparatus should be placed on the unburned side of the structure and:", "pg": "711", "o": ["facing a direct escape route.", "midway down the face of the structure.", "well away from the proposed work area.", "as close as possible to the area being ventilated."], "a": 3}, {"n": 43, "p": "What should firefighters do before exiting an aerial device to perform ventilation on a roof?", "pg": "711", "o": ["Use ladder belts to tie off to the aerial device.", "Plan how many ventilation locations will be needed.", "Place all required tools at the edge of the roof surface.", "Check the integrity of the roof by sounding with a pike pole."], "a": 3}, {"n": 44, "p": "When firefighters are ventilating a flat roof, the aerial ladder should extend 6 feet (2 m) above the roof to make it visible to firefighters and to:", "pg": "711", "o": ["keep the aerial tip from contacting the structure.", "provide a storage rack for the tools they will be using.", "give them something to hold when they cross to the roof.", "allow them to mount a flood light to illuminate the work area."], "a": 2}, {"n": 45, "p": "When using an elevating platform to place firefighters on a roof for ventilation, the bottom of the platform should be positioned:", "pg": "711", "o": ["3 feet (1 m) above the roof edge.", "lightly resting on the roof surface.", "even with or slightly over the roof edge.", "at least 12 inches (300 mm) away from the roof edge."], "a": 2}, {"n": 46, "p": "What is the safest means to access parapet roofs from the aerial device?", "pg": "711", "o": ["Ladder against the parapet wall", "Ladder the tip of the aerial ladder or platform", "Use a drop and roll maneuver from the device", "Use a gambrel and pulley anchored to the lifting eye"], "a": 1}, {"n": 47, "p": "To provide access and egress at a structural incident, the D/O should position the aerial apparatus to maximize:", "pg": "712", "o": ["water flow.", "scrub area.", "elevation height.", "exposure protection."], "a": 1}, {"n": 48, "p": "What is typically a traditional aerial company (or truck company operations) responsibility during a structural incident?", "pg": "712", "o": ["Forcible entry", "Hazmat control", "Offensive attack", "Technical rescue"], "a": 0}, {"n": 49, "p": "During what communication stage do officers and D/Os communicate on the direction of approach, apparatus positioning, and operational objectives?", "pg": "713", "o": ["On-scene", "Pre-arrival", "During deployment", "Preincident planning"], "a": 1}, {"n": 50, "p": "What type of communication is used on-scene to guide the aerial operator to position the aerial apparatus quickly, safely, and efficiently?", "pg": "714", "o": ["Hand signals", "Colored lights", "Portable radio", "Portable loudspeaker"], "a": 0}, {"n": 51, "p": "What communication systems allow calm, clear communication between the pump panel operator and the control pedestal operator without disrupting the emergency scene communication?", "pg": "714", "o": ["Headsets", "Hand signals", "Portable radios", "Central trunking"], "a": 0}]}, {"ch": 20, "title": "Fire Service Knowledge and Skills for Driver/Operators", "qs": [{"n": 1, "p": "The fire service mission is to save lives and:", "pg": "724", "o": ["extinguish fires by any means possible.", "aid other organizations in responding to emergency incidents.", "establish and transfer Incident Command at emergency incidents.", "protect property and the environment from fires and other hazardous situations."], "a": 3}, {"n": 2, "p": "A fire department organizational structure that is _____ has an uninterrupted series of steps.", "pg": "725", "o": ["linear", "scalar", "complex", "constant"], "a": 1}, {"n": 3, "p": "In a chain of command the _____ is at the top and the firefighters at the bottom.", "pg": "725", "o": ["captain", "fire chief", "fire marshal", "battalion chief"], "a": 1}, {"n": 4, "p": "Each employee in a fire department reporting to one supervisor is an example of:", "pg": "725", "o": ["span of control.", "division of labor.", "unity of command.", "chain of command."], "a": 2}, {"n": 5, "p": "The span of control organizational principle states that the optimum number of subordinates or functions that a supervisor can control is:", "pg": "725", "o": ["three.", "five.", "seven.", "ten."], "a": 1}, {"n": 6, "p": "What organizational principle is administered through policies that define acceptable performance and expected outcomes?", "pg": "725", "o": ["Discipline", "Span of control", "Division of labor", "Unity of command"], "a": 0}, {"n": 7, "p": "What organizational principle is necessary in the fire service to assign responsibility, assign specific and clear-cut tasks, and prevent duplication of effort?", "pg": "726", "o": ["Discipline", "Span of control", "Division of labor", "Unity of command"], "a": 2}, {"n": 8, "p": "Which type of fire department is continually staffed by full-time firefighters?", "pg": "727", "o": ["Career department", "Private department", "Volunteer department", "Combination department"], "a": 0}, {"n": 9, "p": "Volunteer fire departments have members respond to emergencies when necessary:", "pg": "727", "o": ["and are usually found at private industrial sites.", "since many are not continuously staffed with firefighters.", "to replace members living at the fire station who are at the response.", "and although classified as volunteers, they are paid full-time members."], "a": 1}, {"n": 10, "p": "What is the most basic unit of fire fighting operations?", "pg": "727", "o": ["Battalion", "Company", "Response district", "Operations division"], "a": 1}, {"n": 11, "p": "Which type of fire company performs fire suppression duties at all types of fires and is assigned to a pumping apparatus?", "pg": "727", "o": ["Truck company", "Engine company", "Tanker company", "Wildland company"], "a": 1}, {"n": 12, "p": "Staffing classifications in fire service organizations are based on:", "pg": "728", "o": ["the number of companies in a battalion or response district.", "whether or not firefighters are paid and how often they work.", "whether firefighters have completed Firefighter I or II training.", "the number of firefighters in the company and their experience."], "a": 1}, {"n": 13, "p": "Part-time paid and paid-on-call are both examples of _____ staffing classifications.", "pg": "728", "o": ["officer", "career", "volunteer", "combination"], "a": 2}, {"n": 14, "p": "Who selects the level of competency fire department members should be trained to meet?", "pg": "728", "o": ["Chief officer", "Firefighter II", "The authority having jurisdiction (AHJ)", "The National Fire Protection Association (NFPA)"], "a": 2}, {"n": 15, "p": "Line personnel deliver emergency services to the pubic, while _____ personnel perform administrative and logistical support.", "pg": "728", "o": ["staff", "delivery", "technical", "paid-on-call"], "a": 0}, {"n": 16, "p": "The primary difference between a Firefighter I and a Firefighter II is a:", "pg": "730", "o": ["Firefighter II has more years of experience.", "Firefighter II has hazardous materials training.", "Firefighter I works under the direct supervision of a Firefighter II or company officer.", "Firefighter I cannot train to other fire service specialties until he or she is a Firefighter II."], "a": 2}, {"n": 17, "p": "Which officer position monitors operational safety at emergency incidents?", "pg": "731", "o": ["District/Battalion Chief", "Assistant/Deputy Chief", "Fire Department Incident Safety Officer", "Fire Department Health and Safety Officer"], "a": 2}, {"n": 18, "p": "Which personnel are responsible for managing fire prevention, investigation divisions, and plans review?", "pg": "731", "o": ["Fire marshals", "Plans examiner", "Company officers", "Fire prevention officers"], "a": 0}, {"n": 19, "p": "The officer responsible for all operations within a fire department is the:", "pg": "731", "o": ["fire chief.", "fire captain.", "company officer.", "district/battalion chief."], "a": 0}, {"n": 20, "p": "Fire prevention officers/inspectors, plans examiners, and fire and life safety educators are positions in the ____ division.", "pg": "732", "o": ["training", "operations", "incident safety/health and safety", "fire prevention or Community Risk Reduction (CRR)"], "a": 3}, {"n": 21, "p": "Which fire service personnel inform the public about fire causes, and precautions or actions to take before and during a fire?", "pg": "732", "o": ["Chief officers", "Fire prevention officers", "Fire protection specialists", "Fire and life safety educators"], "a": 3}, {"n": 22, "p": "What position oversees all training activities and supervises personnel assigned to the training division?", "pg": "734", "o": ["Chief officer", "Fire marshal", "Instructional developer", "Training officer/chief of training"], "a": 3}, {"n": 23, "p": "Guides that set boundaries and establish standards of conduct than an organization expects from its members are:", "pg": "734", "o": ["policies.", "mandates.", "guidelines.", "procedures."], "a": 0}, {"n": 24, "p": "The use of seat belts or mitigation of hazardous spills are examples of:", "pg": "735", "o": ["policies.", "procedures.", "organizational norms.", "Standards of Conduct."], "a": 1}, {"n": 25, "p": "How might law enforcement interact with fire department personnel?", "pg": "736", "o": ["Providing incident scene security", "Coordinating multiagency activities", "Shutting off natural gas lines or water mains", "Dispatching a medical professional to a scene"], "a": 0}, {"n": 26, "p": "Which agency can alert the public of traffic incidents, evacuations, and fire department activities?", "pg": "736", "o": ["Media", "Law enforcement", "Public information office", "Emergency/Disaster management"], "a": 0}, {"n": 27, "p": "The highest risk factor that firefighters face is to have a _____ as a result of overexertion, poor health habits, or occupational stress.", "pg": "736", "o": ["hemmorhage", "mental breakdown", "physical breakdown", "sudden cardiac arrest"], "a": 3}, {"n": 28, "p": "What is the purpose of the National Fallen Firefighter Foundation's (NFFF) 16 Firefighter Life Safety Initiatives?", "pg": "736", "o": ["To educate the public on fire and life safety", "To honor firefighters who have died in the line of duty", "To provide the fire service with a blueprint for making changes", "To specify minimum requirements for a fire department safety and health program"], "a": 2}, {"n": 29, "p": "When are proficiency training and evaluations required to ensure that members maintain their knowledge and skills?", "pg": "738", "o": ["Weekly", "Monthly", "Annually", "After any incident"], "a": 2}, {"n": 30, "p": "Emergency operations should be managed:", "pg": "740", "o": ["by a chief officer only.", "by personnel that are not on scene.", "through an Incident Management System (IMS).", "through other departmental agencies, if possible."], "a": 2}, {"n": 31, "p": "Some of the medical and physical requirements of NFPA 1550 include medical evaluations, development of physical performance standards, and:", "pg": "741", "o": ["operation of an infection control program.", "medical records being available to all personnel.", "randomized drug testing to be administered twice a year.", "monthly medical exams to ensure continued fitness for duty."], "a": 0}, {"n": 32, "p": "In what type of departments are firefighters typically required to participate in a physical fitness program?", "pg": "741", "o": ["All", "Career", "Volunteer", "Combination"], "a": 1}, {"n": 33, "p": "The level of stress firefighters deal with on a regular basis is:", "pg": "742", "o": ["mostly atypical and rarely occupational.", "common enough that it becomes manageable.", "greater than that of most of the civilian population.", "less of a concern than physical health risks or injuries."], "a": 2}, {"n": 34, "p": "The damage caused by which type of stress accumulates over time and can take years to develop?", "pg": "742", "o": ["Acute", "Atypical", "Occupational", "Posttraumatic"], "a": 2}, {"n": 35, "p": "If your personal stress management program is not working, what organization program should be able to assist with stress management?", "pg": "742", "o": ["Fire and Life Safety Initiatives", "Member assistance program (MAP)", "Incident Management System (IMS)", "Critical Incident Stress Management (CISM)"], "a": 1}, {"n": 36, "p": "Firefighters that experience atypical stressful events (ASE):", "pg": "744", "o": ["are better at building resilience.", "should follow NFPA 1970 recommendations.", "may experience a posttraumatic stress injury.", "are usually able to cope with ASE since it is not long term."], "a": 2}, {"n": 37, "p": "To remain mentally fit and healthy and reduce stress, firefighters need to:", "pg": "745", "o": ["build resilience.", "learn how to cope on their own.", "use the Critical Incident Stress Management (CISM) method.", "avoid any type of event that has the potential to be stressful."], "a": 0}, {"n": 38, "p": "Following critical incidents or potentially traumatizing events (PTE), firefighters need to:", "pg": "745", "o": ["immediately return to work.", "utilize positive coping mechanisms.", "attend a training session as soon as possible.", "focus primarily on improving their physical fitness."], "a": 1}, {"n": 39, "p": "Cancer and diabetes are examples of _____ illnesses that are long lasting and can even be fatal.", "pg": "746", "o": ["acute", "chronic", "atypical", "occupational"], "a": 1}, {"n": 40, "p": "The leading cause of firefighter fatalities is:", "pg": "746", "o": ["suicide.", "smoke inhalation.", "cardiovascular disease.", "chronic obstructive pulmonary disease (COPD)."], "a": 2}, {"n": 41, "p": "To avoid respiratory hazards, firefighters should:", "pg": "746", "o": ["wear SCBA at an incident until they feel it is safe to remove it.", "wear SCBA to any incident, whether it is deemed an IDLH situation or not.", "let hazmat certified personnel handle any situation that is considered IDLH.", "never remove SCBA during structural fire fighting until your supervisor or IC says it is safe to do so."], "a": 3}, {"n": 42, "p": "Areas of the body with high absorption rates for carcinogens include:", "pg": "747", "o": ["fingers, toes, and stomach.", "groin, jaw, forehead, and back.", "chest, lower back, neck, and shoulders.", "armpits, top of the head, and other areas with body hair."], "a": 1}, {"n": 43, "p": "Which is a recommendation for preventing or limiting chemical and carcinogen exposures?", "pg": "748", "o": ["Remaining upwind of fires and smoke plumes.", "Waiting to doff contaminated gear at the station.", "Disposing of contaminated gear instead of laundering for reuse.", "Sealing contaminated gear in an air-tight container until its ready for reuse."], "a": 0}, {"n": 44, "p": "What programs have the intention of limiting exposures, documenting exposures, and providing access to correct treatment options if exposure occurs?", "pg": "749", "o": ["Member assistance programs", "Firefighter Cancer Support Networks", "Behavioral Health Assistance Programs", "Infection and exposure control programs"], "a": 3}, {"n": 45, "p": "Which is a method to protect yourself from infection and exposure?", "pg": "749", "o": ["Do not come in contact with patients.", "Use hazmat monitoring and detection equipment.", "Limit unnecessary physical contact with all patients.", "Decontaminate any patients before coming into contact with them."], "a": 2}, {"n": 46, "p": "What program provides assistance for personal issues to firefighters and their families?", "pg": "749", "o": ["Personal Protection Program (PPP)", "Member assistance program (MAP)", "Firefighter Wellness Program (FWP)", "Firefighter Life Safety Program (FLSP)"], "a": 1}, {"n": 47, "p": "One issue that a member assistance program can provide assistance for is:", "pg": "749", "o": ["job-related legal issues.", "physical fitness and obesity.", "substance use, abuse, and dependence.", "exposure to chemicals/carcinogens and infection."], "a": 2}, {"n": 48, "p": "Firefighters should wear personal protective equipment (PPE):", "pg": "750", "o": ["providing greater protection than is needed.", "after entering a fire or emergency environment.", "only if requested to do so by supervisors or other firefighters.", "appropriate for the type of incident and activity being performed."], "a": 3}, {"n": 49, "p": "Which is a true statement about firefighter station and work uniforms?", "pg": "751", "o": ["Should not be worn with other types of PPE.", "Made of non-fire-resistant synthetic materials.", "Provides a layer of protection against direct flame contact.", "Dual certified as work uniforms and structural fire fighting clothing."], "a": 2}, {"n": 50, "p": "All station and work uniforms should meet NFPA _____ requirements.", "pg": "752", "o": ["1970", "1975", "1977", "1982"], "a": 0}, {"n": 51, "p": "All PPE designed for structural and proximity fire fighting must meet the requirements of NFPA:", "pg": "752", "o": ["1500.", "1970.", "1975.", "1977."], "a": 1}, {"n": 52, "p": "In order to provide the level of protection intended by NFPA standards, structural fire fighting PPE components:", "pg": "753", "o": ["must be compatible with each other.", "must protect you from all hazard types.", "should not be combined with other types of PPE.", "may be altered to match the emergency situation."], "a": 0}, {"n": 53, "p": "A limitation of structural fire fighting PPE is that it:", "pg": "754", "o": ["does not trap body sweat to cool the wearer.", "can become hot enough to cause contact burns.", "is difficult to remove or open during rehabilitation breaks.", "does not cover all of the skin when a firefighter is reaching or bending over."], "a": 1}, {"n": 54, "p": "One additional advantage of structural fire fighting helmets is that they can:", "pg": "755", "o": ["help identify personnel.", "also be used at wildland fires.", "be donned without securing or tightening any straps.", "eliminate the need for protective hoods if ear flaps are folded down."], "a": 0}, {"n": 55, "p": "During fire fighting operations, what is the primary eye protection?", "pg": "756", "o": ["Goggles", "Safety glasses", "SCBA facepiece", "Helmet-mounted faceshield"], "a": 2}, {"n": 56, "p": "When donning a protective hood, firefighters should:", "pg": "757", "o": ["pull the hood on after the protective coat.", "pull the hood on before the protective coat.", "avoid sealing the hood to the SCBA facepiece.", "secure the facepiece after pulling up the hood."], "a": 1}, {"n": 57, "p": "The components of a structural fire fighting protective coat are designed to:", "pg": "757", "o": ["have the shell removed to let the heat escape from the coat quicker.", "trap body sweat to cool the firefighter down during fire fighting operations.", "absorb heat and trap insulating air that prevents heat transfer from the fire to the wearer's body.", "have the liner removed to keep the firefighter from getting too hot during fire fighting operations."], "a": 2}, {"n": 58, "p": "NFPA 1970 requires that structural fire fighting protective coats and trousers have:", "pg": "757", "o": ["wristlets/anklets.", "retroreflective trim.", "a drag rescue device.", "a personal alert safety system (PASS)."], "a": 1}, {"n": 59, "p": "The personal alert safety system (PASS) alarm activates when a firefighter is motionless for more than ____ seconds, or when a firefighter presses the emergency button.", "pg": "760", "o": ["10", "30", "45", "60"], "a": 1}, {"n": 60, "p": "When wearing high-visibility vests at a roadway incident, responders should:", "pg": "761", "o": ["only wear the high-visibility vests under their PPE.", "not wear personal PPE under the high-visibility vest.", "only wear them at night when visibility is the lowest.", "not perform fire fighting or hazardous materials activities."], "a": 3}, {"n": 61, "p": "When wearing PPE garments at a fire scene, responders should ensure the PPE is:", "pg": "762", "o": ["dry.", "tight.", "loose.", "damp."], "a": 0}, {"n": 62, "p": "What should firefighters do if they feel contact burns developing underneath their PPE?", "pg": "763", "o": ["Cool the PPE with water", "Withdraw from the area immediately", "Begin loosening and removing the PPE", "Remove the thermal barrier from the protective coat"], "a": 1}, {"n": 63, "p": "PPE that needs more than routine cleaning should be:", "pg": "765", "o": ["disposed of by the wearer.", "removed from service and reported to the supervisor.", "cleaned using preliminary exposure reduction methods.", "cleaned by the wearer with specialized washing machines."], "a": 1}, {"n": 64, "p": "The type of PPE cleaning required is determined by the amount and type of contamination and:", "pg": "765", "o": ["how long the PPE has been in service.", "whether spare sets of PPE are available.", "whether the equipment must be removed from service.", "the type of cleaning equipment available to a department."], "a": 2}, {"n": 65, "p": "The advanced cleaning method may be necessary for cleaning PPE when:", "pg": "766", "o": ["the PPE needs to be cleaned for immediate reuse.", "a gentle spray of water is needed to rinse off debris and other contaminants.", "a washing machine is needed to remove soiling and contamination from products of combustion.", "hazardous materials or contaminants cannot be removed by preliminary exposure reduction or specialized cleaning."], "a": 2}, {"n": 66, "p": "When protective clothing is damaged beyond repair, it should be:", "pg": "766", "o": ["used as a backup set of PPE.", "used as a station or work uniform.", "removed from service immediately.", "worn in conjunction with other PPE."], "a": 2}, {"n": 67, "p": "To safely and efficiently perform assigned tasks, a D/O must maintain situational awareness throughout the entire operation by:", "pg": "767", "o": ["asking for situation updates every 15 minutes.", "relying on other personnel to remain aware of hazards.", "changing strategies, tactics, and orders during an incident.", "remaining observant about changing conditions on the emergency scene."], "a": 3}, {"n": 68, "p": "In order to minimize your exposure to risk at an incident, you should:", "pg": "767", "o": ["wear more PPE than is required.", "let more experienced personnel respond first.", "work individually under your own supervision.", "conduct a risk/benefit analysis for every action."], "a": 3}]}, {"ch": 21, "title": "Fire Department Communications", "qs": [{"n": 1, "p": "Which telecommunications system for receiving emergency calls is operated by the fire department, emergency medical service (EMS), or law enforcement agency?", "pg": "775", "o": ["Enhanced 911 (E911)", "Mobile Data Terminal (MDT)", "Public Safety Answering Point (PSAP)", "Emergency Service Specific Telecommunications Center"], "a": 3}, {"n": 2, "p": "Which telecommunications system for receiving emergency calls uses a central location that routes emergency calls to the appropriate dispatcher?", "pg": "775", "o": ["Enhanced 911 (E911)", "Mobile Data Terminal (MDT)", "Public Safety Answering Point (PSAP)", "Emergency Service Specific Telecommunications Center"], "a": 2}, {"n": 3, "p": "Which communications center equipment allows the public to text 911 and send videos to communications centers?", "pg": "776", "o": ["Teletype (TTY)", "Direct line telephones", "Wired telegraph circuit boxes", "Next Generation 911 (NG911)"], "a": 3}, {"n": 4, "p": "When the public contacts the fire station directly regarding an emergency, the dispatcher should:", "pg": "778", "o": ["let the caller talk directly to the firefighters or other appropriate personnel.", "follow established procedures for relaying the information from the caller to firefighters.", "wait to relay any information to the firefighters until the call is determined to be legitimate.", "transfer the caller to the Public Information Officer (PIO), who will contact the appropriate personnel."], "a": 1}, {"n": 5, "p": "What type of information should a dispatcher gather from an emergency call?", "pg": "778", "o": ["The occupation of the caller", "Who is at fault for the emergency", "The number and location of people involved", "The closest emergency services station to the caller"], "a": 2}, {"n": 6, "p": "When transmitting information from an emergency call, remember that the more time a department spends obtaining information and dispatching resources:", "pg": "779", "o": ["the longer the situation goes unmitigated.", "the less time spent sizing up the scene by responders.", "the more prepared the responders will be for the response.", "the less potential there will be for severe injury or damage at the scene."], "a": 0}, {"n": 7, "p": "When different departments or agencies share the same dispatch frequency on their pagers, they should:", "pg": "779", "o": ["keep the volume low to limit unwanted radio traffic.", "switch each of their pagers to a different frequency.", "set pagers to the alert setting to avoid unwanted traffic.", "make sure pagers are off unless they are absolutely needed."], "a": 2}, {"n": 8, "p": "Which agency regulates all radio communication in the United States?", "pg": "780", "o": ["Telecommunication Commission", "Federal Communications Commission (FCC)", "Federal Emergency Management Agency (FEMA)", "Occupational Safety and Health Administration (OSHA)"], "a": 1}, {"n": 9, "p": "When communicating with radios, fire department personnel should:", "pg": "780", "o": ["use clear text (plain English).", "use agency specific codes (10-codes).", "avoid using emergency-specific words and phrases.", "be sure that communications cannot be understood by others listening in."], "a": 0}, {"n": 10, "p": "Fire department radio systems may be used to:", "pg": "781", "o": ["communicate with the media.", "coordinate tactics at an emergency.", "communicate outside of FCC regulations.", "send personal messages outside the department."], "a": 1}, {"n": 11, "p": "Radio systems in the fire service can be classified according to:", "pg": "781", "o": ["location and size.", "secure and unsecure.", "plain text and 10-code.", "emergency and nonemergency."], "a": 0}, {"n": 12, "p": "One advantage of using a base station radio is that it:", "pg": "781", "o": ["is powered by vehicle electrical systems.", "does not require an electrical system to power it.", "has a longer battery life than mobile and portable radios.", "provides better performance than mobile and portable radios."], "a": 3}, {"n": 13, "p": "Which type of radio system is found in fixed locations such as fire stations or telecommunications centers?", "pg": "781", "o": ["Mobile radio", "Portable radio", "Dispatch radio", "Base station radio"], "a": 3}, {"n": 14, "p": "When using a mobile radio, remember that it:", "pg": "782", "o": ["is less powerful than a fixed location radio.", "uses rechargeable or replaceable batteries.", "does not perform as well as a portable radio.", "must be powered by a building's electrical system."], "a": 0}, {"n": 15, "p": "Portable radios are different from other types of radio systems because they:", "pg": "782", "o": ["are intrinsically safer than mobile and base station radios.", "have better performance than mobile and base station radios.", "are powered by battery packs rather than an electrical system.", "are powered by vehicle electrical systems rather than a building's electrical system."], "a": 2}, {"n": 16, "p": "When using radios, direct communication allows the same radio channel to be used by other groups:", "pg": "782", "o": ["without keying the radios before speaking.", "without speakers having to acknowledge each other.", "that are located at a greater distance from the first group.", "regardless of distance or physical barriers between the radios."], "a": 2}, {"n": 17, "p": "Which fireground radio channel is assigned for fireground operations?", "pg": "784", "o": ["Tactical", "Logistics", "Dispatch", "Command"], "a": 0}, {"n": 18, "p": "What can be used to increase the area of coverage of a radio?", "pg": "784", "o": ["Inverters", "Repeaters", "Converters", "Portable antennas"], "a": 1}, {"n": 19, "p": "What is one way you might improve radio reception in a dead zone?", "pg": "784", "o": ["Remove the repeater from the area", "Move to an outside wall of a structure", "Use your body to create a physical barrier", "Create a longer distance between the radios"], "a": 1}, {"n": 20, "p": "How can you limit ambient noise during radio communications?", "pg": "785", "o": ["Use repeaters when transmitting", "Move near noise-emitting equipment when transmitting", "Use your body or PPE to create a wind barrier when transmitting", "Avoid using voice amplification devices that will cause interference"], "a": 2}, {"n": 21, "p": "Recorded transmissions become part of the official record of an incident and may be made public under open records laws or the:", "pg": "785", "o": ["FirstNet dispatch system.", "Freedom of Information Act (FOIA) requests.", "Public Safety Answering Point (PSAP) system.", "Federal Communications Commission (FCC) act."], "a": 1}, {"n": 22, "p": "After identifying yourself in a radio transmission, you should:", "pg": "786", "o": ["repeat yourself one more time.", "wait for your microphone to key.", "continue with the rest of your message.", "wait for the receiver to acknowledge the message."], "a": 3}, {"n": 23, "p": "After keying your microphone on your radio, you should:", "pg": "786", "o": ["begin speaking immediately.", "repeat your message a second time.", "wait for the receiver to key their microphone.", "wait a second or two before starting your message."], "a": 3}]}]};
</script>
<script>
(function () {
  const LETTERS = 'ABCDEF';
  const STORE = 'do-quiz-v1';
  const TITLES = {};
  SOURCES.QUIZ.forEach(c => TITLES[c.ch] = c.title);

  // Question ids: quizzes keep the original "ch-n" ids so earlier progress carries over; tests use "T-ch-n"
  const Q = {};
  const ids = { QUIZ: {}, TEST: {} };
  ['QUIZ', 'TEST'].forEach(src => SOURCES[src].forEach(c => {
    ids[src][c.ch] = c.qs.map(q => {
      const id = (src === 'TEST' ? 'T-' : '') + c.ch + '-' + q.n;
      Q[id] = Object.assign({ src: src, ch: c.ch }, q);
      return id;
    });
  }));
  const chaptersOf = src => src === 'BOTH'
    ? [...new Set([...SOURCES.QUIZ, ...SOURCES.TEST].map(c => c.ch))].sort((a, b) => a - b)
    : SOURCES[src].map(c => c.ch);
  const idsFor = (src, ch) => {
    const srcs = src === 'BOTH' ? ['QUIZ', 'TEST'] : [src];
    let out = [];
    srcs.forEach(s => Object.keys(ids[s]).forEach(k => { if (ch === 'all' || +k === ch) out = out.concat(ids[s][k]); }));
    return out;
  };

  let saved = { answers: {}, src: 'QUIZ', scope: 'all' };
  try { saved = Object.assign(saved, JSON.parse(localStorage.getItem(STORE)) || {}); } catch (e) {}
  const answers = saved.answers;
  let src = ['QUIZ', 'TEST', 'BOTH'].includes(saved.src) ? saved.src : 'QUIZ';
  let scope = saved.scope;
  if (scope !== 'all' && !chaptersOf(src).includes(scope)) scope = 'all';
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ answers, src, scope })); } catch (e) {} };

  let order = [], optOrder = {};
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const shuffleArr = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const isRight = id => answers[id] === Q[id].a;
  const stat = list => { const a = list.filter(id => id in answers).length; return a ? list.filter(isRight).length + '/' + a : list.length + ' q'; };

  function buildScope(shuffle) {
    let list = idsFor(src, scope);
    const count = scope === 'all' ? +$('count').value : 0;
    if (count > 0) { list = shuffleArr(list).slice(0, count); shuffle = true; }
    order = shuffle ? shuffleArr(list) : list;
    optOrder = {};
    order.forEach(id => { const idx = Q[id].o.map((_, i) => i); optOrder[id] = shuffle ? shuffleArr(idx) : idx; });
    $('count').hidden = scope !== 'all';
    render();
  }

  function renderNav() {
    const sb = $('sources'); sb.innerHTML = '';
    [['QUIZ', 'Quizzes'], ['TEST', 'Tests'], ['BOTH', 'Both']].forEach(([v, label]) => {
      const b = document.createElement('button');
      b.className = 'src'; b.setAttribute('aria-pressed', src === v);
      b.innerHTML = esc(label) + '<small>' + stat(idsFor(v, 'all')) + '</small>';
      b.onclick = () => {
        if (src === v) return;
        src = v;
        if (scope !== 'all' && !chaptersOf(src).includes(scope)) scope = 'all';
        save(); $('filter').value = 'all'; buildScope(false);
      };
      sb.appendChild(b);
    });
    const tabs = $('tabs'); tabs.innerHTML = '';
    const make = (value, label, title) => {
      const b = document.createElement('button');
      b.className = 'tab'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', scope === value); b.title = title;
      b.innerHTML = esc(label) + '<small>' + stat(idsFor(src, value)) + '</small>';
      b.onclick = () => { scope = value; save(); $('filter').value = 'all'; buildScope(false); b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); };
      tabs.appendChild(b);
    };
    make('all', 'All', 'All chapters');
    chaptersOf(src).forEach(ch => make(ch, 'Ch ' + ch, TITLES[ch] || ''));
  }

  function card(id, n) {
    const q = Q[id], r = answers[id], done = r !== undefined;
    const el = document.createElement('div');
    el.className = 'q' + (done ? (r === q.a ? ' right' : ' wrong') : '');
    const tag = src === 'BOTH' ? '<span class="tag ' + q.src + '">' + (q.src === 'TEST' ? 'Test' : 'Quiz') + '</span>' : '';
    const where = scope === 'all' ? 'Chapter ' + q.ch + ', question ' + q.n + ' ' : (src === 'BOTH' ? 'Question ' + q.n + ' ' : '');
    el.innerHTML = '<div class="qhead"><span class="num">' + n + '</span><p class="prompt">' + esc(q.p) + '</p></div>' +
      '<div class="page">' + tag + where + (q.pg ? '[p. ' + esc(q.pg) + ']' : '') + '</div>';
    const opts = document.createElement('div'); opts.className = 'opts';
    optOrder[id].forEach((oi, k) => {
      const b = document.createElement('button'); b.className = 'opt';
      b.innerHTML = '<span class="l">' + LETTERS[k] + '</span><span>' + esc(q.o[oi]) + '</span>';
      if (done) { b.disabled = true; if (oi === q.a) b.classList.add('correct'); else if (oi === r) b.classList.add('chosen-wrong'); }
      b.onclick = () => { answers[id] = oi; save(); el.replaceWith(card(id, n)); updateStats(); };
      opts.appendChild(b);
    });
    el.appendChild(opts);
    if (done) {
      const p = document.createElement('p');
      if (r === q.a) { p.className = 'fb good'; p.textContent = 'Correct.'; }
      else { p.className = 'fb bad'; p.textContent = 'Incorrect. Answer: ' + LETTERS[optOrder[id].indexOf(q.a)] + ', ' + q.o[q.a]; }
      el.appendChild(p);
    }
    return el;
  }

  function render() {
    const f = $('filter').value, list = $('list');
    const srcName = { QUIZ: 'Quizzes', TEST: 'Tests', BOTH: 'Quizzes + Tests' }[src];
    $('scopeTitle').textContent = srcName + ': ' + (scope === 'all' ? 'All chapters' : 'Chapter ' + scope + (TITLES[scope] ? ', ' + TITLES[scope] : ''));
    list.innerHTML = '';
    const shown = order.filter(id => {
      const r = answers[id];
      if (f === 'unanswered') return r === undefined;
      if (f === 'missed') return r !== undefined && !isRight(id);
      if (f === 'correct') return isRight(id);
      return true;
    });
    if (!shown.length) {
      const msg = { unanswered: 'Every question here is answered.', missed: 'No missed questions here.', correct: 'No correct answers yet.' }[f] || 'No questions.';
      list.innerHTML = '<div class="empty">' + msg + ' Switch the filter to All questions to see the full set.</div>';
    }
    shown.forEach((id, i) => list.appendChild(card(id, i + 1)));
    updateStats();
  }

  function updateStats() {
    const ans = order.filter(id => id in answers).length, right = order.filter(isRight).length;
    $('score').innerHTML = right + '/' + ans + ' <small>answered ' + ans + ' of ' + order.length + '</small>';
    $('prog').style.width = (order.length ? ans / order.length * 100 : 0) + '%';
    const old = document.querySelector('.done'); if (old) old.remove();
    if (ans === order.length && order.length) {
      const d = document.createElement('div'); d.className = 'done';
      d.textContent = 'Finished: ' + right + ' of ' + order.length + ' (' + Math.round(right / order.length * 100) + '%).' + (right < order.length ? ' Use Retry missed to go again.' : '');
      $('list').appendChild(d);
    }
    renderNav();
  }

  $('filter').onchange = render;
  $('count').onchange = () => buildScope(false);
  $('shuffle').onclick = () => buildScope(true);
  $('reset').onclick = () => { order.forEach(id => delete answers[id]); save(); $('filter').value = 'all'; buildScope(false); };
  $('retry').onclick = () => {
    const missed = order.filter(id => id in answers && !isRight(id));
    if (!missed.length) return;
    missed.forEach(id => { delete answers[id]; optOrder[id] = shuffleArr(optOrder[id]); });
    save(); order = shuffleArr(missed); $('filter').value = 'all'; render(); window.scrollTo(0, 0);
  };
  buildScope(false);
})();
</script>
