<style>:root{

  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191D; --panel:#1F252B; --ink:#E9ECEF; --muted:#9AA4AE; --line:#343C44;
    --red:#E0414B; --good:#4FC27F; --goodbg:#17301F; --badbg:#3A1A1C;
  }
}
:root[data-theme="dark"]{
  --bg:#15191D; --panel:#1F252B; --ink:#E9ECEF; --muted:#9AA4AE; --line:#343C44;
  --red:#E0414B; --good:#4FC27F; --goodbg:#17301F; --badbg:#3A1A1C;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
.stripe{height:14px;margin-top:env(safe-area-inset-top,0px);background:repeating-linear-gradient(135deg,var(--red) 0 22px,var(--yellow) 22px 44px)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.top{padding-top:22px}
h1{font:700 clamp(2rem,6vw,2.9rem)/1.02 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 6px;letter-spacing:.01em}
h2{font:700 1.6rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:22px 0 12px}
.sub{color:var(--muted);margin:0 0 14px}

.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1.5px solid var(--line);
  padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.tab{flex:0 0 auto;font:700 1rem "Barlow Condensed","Arial Narrow",sans-serif;min-width:44px;padding:6px 10px 4px;
  border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer;text-align:center;line-height:1.1}
.tab small{display:block;font:500 11px "Barlow",sans-serif;color:var(--muted)}
.tab:hover{border-color:var(--ink)}
.tab[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.tab[aria-selected="true"] small{color:#fff}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar button,.bar select{font:600 15px "Barlow",sans-serif;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:6px;cursor:pointer}
.bar button:hover,.bar select:hover{border-color:var(--ink)}
.score{margin-left:auto;font:700 1.5rem "Barlow Condensed",sans-serif}
.score small{font:500 14px "Barlow",sans-serif;color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 22px}
.progress span{display:block;height:100%;background:var(--red);width:0;transition:width .25s}

.q{background:var(--panel);border-left:5px solid var(--line);border-radius:4px;padding:18px 18px 14px;margin-bottom:16px}
.q.right{border-left-color:var(--good)} .q.wrong{border-left-color:var(--red)}
.qhead{display:flex;gap:10px;align-items:baseline}
.num{font:700 1.3rem "Barlow Condensed",sans-serif;color:var(--red);min-width:1.6em}
.prompt{font-weight:600;margin:0}
.page{color:var(--muted);font-size:14px;margin:4px 0 12px 2.2em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;width:100%;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt .l{font-weight:700;min-width:1.2em}
.opt.correct{background:var(--goodbg);border-color:var(--good)}
.opt.chosen-wrong{background:var(--badbg);border-color:var(--red)}
.fb{margin:10px 0 0;font-weight:600}
.fb.good{color:var(--good)} .fb.bad{color:var(--red)}
button:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.empty{background:var(--panel);padding:24px;border-radius:4px;color:var(--muted)}
.done{background:var(--ink);color:var(--bg);padding:18px;border-radius:4px;margin:8px 0 40px;font-weight:600}
@media (prefers-reduced-motion:reduce){.progress span{transition:none}}
</style>
</head>

<div class="stripe"></div>
<header class="top">
  <div class="wrap">
    <h1>Driver/Operator Quizzes</h1>
    <p class="sub">Pumping and Aerial Apparatus Driver/Operator Handbook, 4th Ed. Numbers in brackets are textbook pages.</p>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Chapters"></nav>
<main class="wrap">
  <h2 id="scopeTitle"></h2>
  <div class="bar">
    <select id="filter" aria-label="Show questions">
      <option value="all">All questions</option>
      <option value="unanswered">Unanswered</option>
      <option value="missed">Missed</option>
      <option value="correct">Correct</option>
    </select>
    <select id="count" aria-label="Number of questions" hidden>
      <option value="0">Every question</option>
      <option value="25">Random 25</option>
      <option value="50">Random 50</option>
      <option value="100">Random 100</option>
    </select>
    <button id="shuffle">Shuffle</button>
    <button id="retry">Retry missed</button>
    <button id="reset">Reset</button>
    <div class="score" id="score"></div>
  </div>
  <div class="progress"><span id="prog"></span></div>
  <div id="list"></div>
</main>

</script>
<script>(function () {
  const LETTERS = 'ABCDEF';
  const STORE = 'do-quiz-v1';

  // Flatten questions and give each a stable id: "chapter-question"
  const Q = {};
  CHAPTERS.forEach(c => c.qs.forEach(q => {
    Q[c.ch + '-' + q.n] = Object.assign({ ch: c.ch }, q);
  }));
  const chapterIds = ch => CHAPTERS.find(c => c.ch === ch).qs.map(q => ch + '-' + q.n);
  const allIds = Object.keys(Q);

  // Saved state (answers survive page reloads)
  let saved = { answers: {}, scope: 'all' };
  try { saved = Object.assign(saved, JSON.parse(localStorage.getItem(STORE)) || {}); } catch (e) {}
  const answers = saved.answers;
  let scope = saved.scope;
  if (scope !== 'all' && !CHAPTERS.some(c => c.ch === scope)) scope = 'all';
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ answers, scope })); } catch (e) {} };

  let order = [];
  let optOrder = {};

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const shuffleArr = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const isRight = id => answers[id] === Q[id].a;

  function buildScope(shuffle) {
    let ids = scope === 'all' ? allIds.slice() : chapterIds(scope);
    const count = scope === 'all' ? +$('count').value : 0;
    if (count > 0) { ids = shuffleArr(ids).slice(0, count); shuffle = true; }
    order = shuffle ? shuffleArr(ids) : ids;
    optOrder = {};
    order.forEach(id => {
      const idx = Q[id].o.map((_, i) => i);
      optOrder[id] = shuffle ? shuffleArr(idx) : idx;
    });
    render();
  }

  function renderTabs() {
    const tabs = $('tabs');
    tabs.innerHTML = '';
    const make = (value, label, ids, title) => {
      const b = document.createElement('button');
      b.className = 'tab';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', scope === value);
      b.title = title;
      const answered = ids.filter(id => id in answers).length;
      const right = ids.filter(isRight).length;
      b.innerHTML = esc(label) + '<small>' + (answered ? right + '/' + answered : ids.length + ' q') + '</small>';
      b.onclick = () => {
        scope = value; save();
        $('filter').value = 'all';
        $('count').hidden = scope !== 'all';
        buildScope(false);
        b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      };
      tabs.appendChild(b);
    };
    make('all', 'All', allIds, 'All chapters combined');
    CHAPTERS.forEach(c => make(c.ch, 'Ch ' + c.ch, chapterIds(c.ch), c.title));
  }

  function card(id, n) {
    const q = Q[id], r = answers[id], done = r !== undefined;
    const el = document.createElement('div');
    el.className = 'q' + (done ? (r === q.a ? ' right' : ' wrong') : '');
    const where = scope === 'all' ? 'Chapter ' + q.ch + ', question ' + q.n + ' ' : '';
    el.innerHTML = '<div class="qhead"><span class="num">' + n + '</span><p class="prompt">' + esc(q.p) + '</p></div>' +
      '<div class="page">' + where + (q.pg ? '[p. ' + esc(q.pg) + ']' : '') + '</div>';
    const opts = document.createElement('div');
    opts.className = 'opts';
    optOrder[id].forEach((oi, k) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = '<span class="l">' + LETTERS[k] + '</span><span>' + esc(q.o[oi]) + '</span>';
      if (done) {
        b.disabled = true;
        if (oi === q.a) b.classList.add('correct');
        else if (oi === r) b.classList.add('chosen-wrong');
      }
      b.onclick = () => {
        answers[id] = oi; save();
        el.replaceWith(card(id, n));
        updateStats();
      };
      opts.appendChild(b);
    });
    el.appendChild(opts);
    if (done) {
      const p = document.createElement('p');
      if (r === q.a) { p.className = 'fb good'; p.textContent = 'Correct.'; }
      else {
        p.className = 'fb bad';
        p.textContent = 'Incorrect. Answer: ' + LETTERS[optOrder[id].indexOf(q.a)] + ', ' + q.o[q.a];
      }
      el.appendChild(p);
    }
    return el;
  }

  function render() {
    const f = $('filter').value, list = $('list');
    $('scopeTitle').textContent = scope === 'all' ? 'All chapters' : 'Chapter ' + scope + ': ' + CHAPTERS.find(c => c.ch === scope).title;
    list.innerHTML = '';
    const shown = order.filter(id => {
      const r = answers[id];
      if (f === 'unanswered') return r === undefined;
      if (f === 'missed') return r !== undefined && !isRight(id);
      if (f === 'correct') return isRight(id);
      return true;
    });
    if (!shown.length) {
      const msg = { unanswered: 'Every question here is answered.', missed: 'No missed questions here.', correct: 'No correct answers yet.' }[f] || 'No questions.';
      list.innerHTML = '<div class="empty">' + msg + ' Switch the filter to All questions to see the full set.</div>';
    }
    shown.forEach((id, i) => list.appendChild(card(id, i + 1)));
    updateStats();
  }

  function updateStats() {
    const ans = order.filter(id => id in answers).length;
    const right = order.filter(isRight).length;
    $('score').innerHTML = right + '/' + ans + ' <small>answered ' + ans + ' of ' + order.length + '</small>';
    $('prog').style.width = (order.length ? ans / order.length * 100 : 0) + '%';
    const old = document.querySelector('.done');
    if (old) old.remove();
    if (ans === order.length && order.length) {
      const d = document.createElement('div');
      d.className = 'done';
      d.textContent = 'Finished: ' + right + ' of ' + order.length + ' (' + Math.round(right / order.length * 100) + '%).' +
        (right < order.length ? ' Use Retry missed to go again.' : '');
      $('list').appendChild(d);
    }
    renderTabs();
  }

  $('filter').onchange = render;
  $('count').onchange = () => buildScope(false);
  $('shuffle').onclick = () => buildScope(true);
  $('reset').onclick = () => {
    order.forEach(id => delete answers[id]); save();
    $('filter').value = 'all';
    buildScope(false);
  };
  $('retry').onclick = () => {
    const missed = order.filter(id => id in answers && !isRight(id));
    if (!missed.length) return;
    missed.forEach(id => { delete answers[id]; optOrder[id] = shuffleArr(optOrder[id]); });
    save();
    order = shuffleArr(missed);
    $('filter').value = 'all';
    render();
    window.scrollTo(0, 0);
  };

  $('count').hidden = scope !== 'all';
  buildScope(false);
})();
</script>
