r intake hose in the first pumper.", "high intake pressure in the small-diameter intake hose in the first pumper."], "a": 1}, {"n": 25, "p": "What type of pumping operation may be needed when pressures higher than a single engine is capable of supplying are required?", "pg": "134", "o": ["Dual", "Relay", "Looped", "Tandem"], "a": 3}, {"n": 26, "p": "In tandem pumping operations, apparatus may be positioned up to _____ apart.", "pg": "134", "o": ["300 feet (90 m)", "900 feet (270m)", "600 feet (180 m)", "1200 feet (360 m)"], "a": 0}, {"n": 27, "p": "At which apparatus-staging level should incoming apparatus not pass their last strategic advantage?", "pg": "135", "o": ["Level I", "Level II", "Level IV", "Level III"], "a": 0}, {"n": 28, "p": "At which apparatus-staging level may an apparatus be directed to one or more apparatus staging areas designated by the operations section officer?", "pg": "135", "o": ["Level I", "Level II", "Level III", "Level IV"], "a": 1}, {"n": 29, "p": "D/Os in the cold zone at an incident:", "pg": "136", "o": ["are required to wear special PPE because this area is considered unsafe.", "are not required to wear special PPE because this area is considered safe.", "are required to wear special PPE because this area is considered to be marginally safe.", "are not required to wear special PPE because this area is considered free of pathogens."], "a": 1}, {"n": 30, "p": "During a response in vehicle traffic, the D/O should position the fire apparatus so that the apparatus:", "pg": "137", "o": ["will deflect a vehicle toward the scene.", "will deflect a vehicle away from the scene.", "creates a barrier that prohibits passing vehicles.", "creates a barrier that allows responders direct access to traffic."], "a": 1}, {"n": 31, "p": "Where should a supply hose be laid on a fire scene involving vehicle traffic?", "pg": "137", "o": ["Around the fire apparatus", "To the side of the street or roadway", "On the sidewalk opposite the roadway", "Perpendicular to the side of the street or roadway"], "a": 1}, {"n": 32, "p": "In which type of adverse weather condition must D/Os maintain situational awareness to position the apparatus so that the crew or apparatus will not be struck by debris?", "pg": "138", "o": ["Fog", "Wind", "Flooding", "Extreme temperature"], "a": 1}, {"n": 33, "p": "When preparing to position the apparatus during heavy rain, the D/O should ensure that the apparatus:", "pg": "138", "o": ["stays near the touchdown area.", "is parked in an open area, such as a field.", "remains in tandem with the aerial apparatus.", "remains visible to other vehicles on the road."], "a": 3}, {"n": 34, "p": "According to OSHA/NOAA, what should the D/O do to prevent risk exposure to lightning?", "pg": "139", "o": ["Park the fire apparatus near a fence", "Position the fire apparatus in open areas", "Park the fire apparatus near large equipment", "Avoid parking the fire apparatus next to isolated tall trees"], "a": 3}, {"n": 35, "p": "When operating at an incident involving hazardous or flammable liquids, park the apparatus in a(an) _____ position to eliminate the chance of a hazardous liquid flowing under the apparatus.", "pg": "139", "o": ["uphill", "upwind", "downhill", "downwind"], "a": 0}, {"n": 36, "p": "Pumping operations can be adversely affected if an apparatus is positioned on _____ surface grades.", "pg": "140", "o": ["flat", "dry", "hard", "curved"], "a": 3}, {"n": 37, "p": "A response apparatus should travel opposing the normal flow of traffic on highways or ramps when the police have:", "pg": "140", "o": ["closed the road to traffic.", "cleared the road for traffic.", "declared the roadway as safe.", "deployed a spotter for the apparatus."], "a": 0}, {"n": 38, "p": "The U.S. Department of Transportation Manual on Uniform Traffic Control Devices (MUTCD) advises that emergency vehicle warning lights should be ____ when arriving on the scene.", "pg": "141", "o": ["turned off", "increased to high brightness", "reduced as much as possible", "added in conjunction with audibles"], "a": 2}, {"n": 39, "p": "During a highway incident, what direction should the fire apparatus equipped with a side-mounted pump panel face?", "pg": "141", "o": ["Towards the street, so that the D/O sees the incident head-on", "Parallel to the incident scene, so that the D/O has a 90-degree view of the operation", "Perpendicular to the incident scene, so that the D/O has a 180-degree view of the operation", "To the incident scene, so that the D/O at the pump panel controls has a view of the operation"], "a": 3}, {"n": 40, "p": "Which is a consideration when positioning an apparatus on a bridge?", "pg": "142", "o": ["Always park or operate all apparatus on the same span", "Bridges will be the first road surfaces to freeze during cold weather", "Always stop well short of the beginning of a bridge or elevated roadway", "Park off the bridge and shut off all emergency lights and audible systems"], "a": 1}, {"n": 41, "p": "If a D/O responds to a railroad incident, what is the first step to minimize the dangers for emergency responders and apparatus?", "pg": "142", "o": ["Position the fire apparatus on the railroad tracks", "Seek support from nearby emergency responders", "Understand the specific hazards posed by rail operations", "Call the emergency telephone numbers for railroads to report the incident"], "a": 2}, {"n": 42, "p": "When operating at a railroad incident, an apparatus should maintain a clear zone _____ to prevent contact with objects on the railroad cars.", "pg": "142", "o": ["to the non-energized side of the active rail", "within 10 feet (3 m) of the railroad incident", "of at least 25 feet (8 m) from railroad tracts", "behind the energized rail side of the incident"], "a": 2}, {"n": 43, "p": "During an emergency medical incident, an important apparatus positioning consideration is for the D/O to leave the ambulance enough room for:", "pg": "143", "o": ["patient loading.", "victim decontamination.", "the driver to exit the vehicle.", "an emergency helicopter landing."], "a": 0}, {"n": 44, "p": "When preparing to position an apparatus at a hazardous material incident, the D/O should approach the incident from a(an) _____ position.", "pg": "145", "o": ["upwind and uphill", "upwind and downhill", "downwind and uphill", "downwind and downhill"], "a": 0}]}, {"ch": 4, "title": "Principles of Water", "qs": [{"n": 1, "p": "At what temperature does water convert to gas, water vapor, or steam?", "pg": "161", "o": ["Below 32°F (0°C)", "Exactly 32°F (0°C)", "Below 212°F (100°C)", "Above 212°F (100°C)"], "a": 3}, {"n": 2, "p": "Water’s density, or its weight per unit of volume, is commonly measured in:", "pg": "162", "o": ["square foot per second (ft²/s) (m²/s).", "pounds per cubic foot (lb/ft³) (kg/m³).", "pounds per square inch (lb/in²) (kg/cm²).", "pounds-foot per square second (lbf/s²) (kg-m/s²)."], "a": 1}, {"n": 3, "p": "For fire protection purposes, ordinary freshwater is considered to weigh:", "pg": "162", "o": ["92.4 lb/ft³ (1500 kg/m³).", "82.4 lb/ft³ (1300 kg/m³).", "62.4 lb/ft³ (1000 kg/m³).", "102.4 lb/ft³ (1640 kg/m³)."], "a": 2}, {"n": 4, "p": "Water may also be used to smother fires in combustible liquids whose specific gravity is:", "pg": "162", "o": ["equal to 1.", "lesser than 1.", "higher than 1.", "higher than 0, but less than 1."], "a": 2}, {"n": 5, "p": "Which is a disadvantage of using water as an extinguishing agent?", "pg": "163", "o": ["Water is a lightweight agent", "Water is a bad conductor of electricity", "Water has a low surface tension that makes it somewhat difficult to soak into dense materials", "Water has a high surface tension that makes it somewhat difficult to soak into dense materials"], "a": 3}, {"n": 6, "p": "To understand how force is determined, it is necessary to know the weight of water and the:", "pg": "163", "o": ["quality of water.", "source that water originated from.", "width that a column of water occupies.", "height that a column of water occupies."], "a": 3}, {"n": 7, "p": "The speed at which a fluid travels through a hose or pipe of a particular size and the pressure upon this water determines the fluid:", "pg": "165", "o": ["velocity.", "viscosity.", "temperature.", "state of matter."], "a": 0}, {"n": 8, "p": "What factors determine the velocity of fluid travel through a hose or pipe?", "pg": "165", "o": ["Intensity of the fluid", "Perpendicular exertion", "Pressure upon the fluid", "Size of the orifice through which it is flowing"], "a": 3}, {"n": 9, "p": "Which of the following is NOT one of the six principles of pressure that the D/O must understand?", "pg": "165", "o": ["Velocity", "Intensity", "Perpendicular exertion", "Equal pressure transmission"], "a": 0}, {"n": 10, "p": "The first pressure principle states that:", "pg": "165", "o": ["the pressure of a liquid in an open vessel is proportional to its depth.", "fluid pressure is perpendicular (at right angles) to any surface on which it acts.", "the pressure of a liquid in an open vessel is proportional to the density of the liquid.", "the pressure of a liquid at the bottom of a vessel is independent of the shape of the vessel."], "a": 1}, {"n": 11, "p": "What pressure principle states that pressure applied to a confined fluid is transmitted equally in all directions?", "pg": "165", "o": ["First", "Second", "Third", "Fourth"], "a": 2}, {"n": 12, "p": "The atmospheric pressure that surrounds the earth has depth and density and exerts the greatest pressures in:", "pg": "166", "o": ["low altitudes.", "high altitudes.", "confined spaces.", "unprotected spaces."], "a": 0}, {"n": 13, "p": "Which is considered standard atmospheric pressure?", "pg": "166", "o": ["7.3 psi (50.6 kPa)", "14.7 psi (100 kPa)", "29.4 psi (202.7 kPa)", "44.1 psi (304 kPa)"], "a": 1}, {"n": 14, "p": "In the fire service, head pressure refers to the:", "pg": "167", "o": ["height of the discharge orifice.", "height of a water supply above the discharge orifice.", "distance between the discharge orifice and the pump intake.", "distance between the water supply and the discharge orifice."], "a": 1}, {"n": 15, "p": "If the water supply is 100 feet (30 m) above the hydrant discharge opening, what would the head pressure be at the hydrant discharge?", "pg": "167", "o": ["43.4 psi (300 kPa)", "73.4 psi (506 kPa)", "63.4 psi (438 kPa)", "53.4 psi (370 kPa)"], "a": 0}, {"n": 16, "p": "What is hydrostatic pressure?", "pg": "168", "o": ["The total pressure a pump is capable to deliver", "The flow in which the fluid particles move along well-defined paths or streamline", "The stored potential energy available to force water through pipes, fittings, hose, and adapters", "The pressure exerted perpendicular to the direction of the flow and is represented by the symbol \"Q\""], "a": 2}, {"n": 17, "p": "The pressure in a water supply system before it flows from a hydrant is considered _____ for fire service purposes.", "pg": "168", "o": ["static", "potable", "residual", "dynamic"], "a": 0}, {"n": 18, "p": "The pressure found in a water distribution system during normal consumption demand is considered the normal _____ pressure.", "pg": "168", "o": ["static", "residual", "turbulent", "operating"], "a": 3}, {"n": 19, "p": "During a flow test of a water distribution system, the total available pressure of the water flowing from the open hydrant(s), other water consumption demands, and the size of the pipe is referred to as the:", "pg": "168", "o": ["static pressure.", "velocity friction.", "residual pressure.", "coefficient of friction."], "a": 2}, {"n": 20, "p": "What is used to measure the forward velocity of flow pressure?", "pg": "169", "o": ["Velocimeter", "Tachometer", "Pressure indicator", "Pitot tube and gauge"], "a": 3}, {"n": 21, "p": "A firefighter can use the measurement of flow pressure to calculate the quantity of water flowing in gpm or L/min if they know the size of the:", "pg": "169", "o": ["building.", "pitot tube.", "water tank.", "discharge opening."], "a": 3}, {"n": 22, "p": "Any pressure that is less than atmospheric pressure is called:", "pg": "169", "o": ["vacuum.", "pressure loss.", "positive pressure.", "stabilized pressure."], "a": 0}, {"n": 23, "p": "What is the notation for gauge readings that are calibrated so that atmospheric pressure is zero?", "pg": "169", "o": ["Inches of mercury (in Hg)", "Pounds per square foot (psfg)", "Pounds per square inch gauge (psig)", "Pounds per square inch absolute (psia)"], "a": 3}, {"n": 24, "p": "When a nozzle is above the level of the pump, there is:", "pg": "170", "o": ["no pressure.", "vacuum loss.", "pressure loss.", "pressure gain."], "a": 2}, {"n": 25, "p": "What are the pressure losses or gains due to gravity called?", "pg": "170", "o": ["Vacuum pressure (VP)", "Elevation pressure (EP)", "Atmospheric pressure (AP)", "Gravitational pressure (GP)"], "a": 1}, {"n": 26, "p": "Altitude impacts the production of fire streams because atmospheric pressure:", "pg": "170", "o": ["drops as height above sea level increases.", "raises as height above sea level decreases.", "stabilizes as height above sea level increases.", "destabilizes as height above sea level increases."], "a": 0}, {"n": 27, "p": "The friction loss in older hose may be as much as _____ greater than that of new hose.", "pg": "170", "o": ["10%", "25%", "50%", "75%"], "a": 2}, {"n": 28, "p": "Which friction loss principle states that if all other conditions are the same, friction loss increases due to the length of the hose or pipe?", "pg": "171", "o": ["First friction loss principle: Length", "Third friction loss principle: Diameter", "Second friction loss principle: Velocity", "Fourth friction loss principle: Pressure"], "a": 0}, {"n": 29, "p": "The fourth friction loss principle states that for a given velocity, friction loss:", "pg": "172", "o": ["increases due to the length of the hose or pipe.", "develops much faster than the change in velocity.", "is approximately the same, regardless of the pressure on the water.", "is dependent on the diameter and position of the hose carrying the water."], "a": 2}, {"n": 30, "p": "Expansion or a larger diameter hose increases volume so less velocity delivers the same amount, and when the velocity decreases, friction loss:", "pg": "172", "o": ["increases.", "decreases.", "does not change.", "increases exponentially."], "a": 1}, {"n": 31, "p": "Since water is basically incompressible, a pressure of 30,000 psi (210 000 kPa) only reduces its volume by:", "pg": "173", "o": ["1%.", "2%.", "its friction coefficient.", "its perpendicular pressure quotient."], "a": 0}, {"n": 32, "p": "Friction loss in a water system increases as the _____ of hose or piping increases.", "pg": "173", "o": ["length", "ductility", "diameter", "thickness"], "a": 0}, {"n": 33, "p": "Flow pressure will always be strongest near the source of supply and lowest at the:", "pg": "173", "o": ["lowest point in the water system.", "junction between hydrant fittings.", "nearest point in the water system.", "farthest point in the water system."], "a": 3}, {"n": 34, "p": "By decreasing the amount of water flowing, a firefighter reduces the speed of the water in the hose, which:", "pg": "173", "o": ["reduces friction loss.", "increases friction loss.", "marginally affects friction loss.", "maintains the same friction loss."], "a": 0}, {"n": 35, "p": "What can a D/O use when situations require velocity flow beyond the capability of a specific diameter of hose?", "pg": "174", "o": ["Attack line", "Longer hose", "Siamese line", "Smaller diameter hose"], "a": 2}, {"n": 36, "p": "What should the D/O do to reduce friction loss caused by hose length or diameter?", "pg": "175", "o": ["Extend the length of the lay and/or increase the diameter of the hose", "Extend the length of the lay and/or decrease the diameter of the hose", "Shorten the length of the lay and/or increase the diameter of the hose", "Shorten the length of the lay and/or decrease the diameter of the hose"], "a": 2}, {"n": 37, "p": "A water hammer is produced by:", "pg": "175", "o": ["suddenly stopping the pump.", "suddenly stopping water moving through a hose or pipe.", "gradually stopping water moving through a hose or pipe.", "intermittently stopping water moving through a hose or pipe."], "a": 1}, {"n": 38, "p": "What should the D/O do to prevent water hammer when flowing water?", "pg": "175", "o": ["Suddenly stop the water flow", "Stop the entire operation very fast", "Slowly close nozzles, valves, and hose clamps", "Partially close the water flow for few seconds and then immediately stop it"], "a": 2}, {"n": 39, "p": "When a large volume of water for a firefighting operation is needed, the fire department should request the water utility department to increase the:", "pg": "176", "o": ["water velocity.", "probabilities of extinguishing the fire.", "potable water supply for use in rehab.", "water pressure and/or volume in an area."], "a": 3}, {"n": 40, "p": "What is included in an engineering estimate to determine the amount of water that a community needs?", "pg": "177", "o": ["The total number of fire occurred", "The total number of people who will be consuming water", "The average water consumption for each population sector", "The total amount of water needed for domestic, industrial, and fire fighting use"], "a": 3}, {"n": 41, "p": "Which means of moving water uses one or more pumps that take water from the primary source and discharge it through the filtration and treatment processes?", "pg": "177", "o": ["Gravity system", "Combination system", "Direct pumping system", "Indirect pumping system"], "a": 2}, {"n": 42, "p": "Which event could disable a water treatment system’s pumping station and drastically reduce the volume and pressure of water available for fire fighting operations?", "pg": "178", "o": ["High humidity", "A loss of power supply", "Use of unsuitable water treatment chemicals", "Lower than average community water consumption"], "a": 1}, {"n": 43, "p": "A water distribution system sustains much less pressure loss when fire hydrants receive:", "pg": "178", "o": ["half of the water supply.", "water supply from one direction.", "50% more water supply than needed.", "water supply from two or more directions."], "a": 3}, {"n": 44, "p": "What are large pipes (mains), with relatively widespread spacing, that convey large quantities of water to various points of the system for local distribution to the smaller mains called?", "pg": "178", "o": ["Primary feeders", "Substitute feeders", "Secondary feeders", "Distributor feeders"], "a": 0}, {"n": 45, "p": "Which water system valve visually shows whether the gate or valve seat is open, partially closed, or totally closed?", "pg": "179", "o": ["Gate valve", "Solenoid valve", "Indicating valve", "Reduced pressure valve"], "a": 2}, {"n": 46, "p": "The function of a valve in a water distribution system is to provide a means to:", "pg": "180", "o": ["prevent the occurrence of water hammers.", "reduce friction loss within the water system.", "facilitate access to the interior of the distribution pipes.", "control the flow of water through the distribution piping."], "a": 3}, {"n": 47, "p": "Restriction of water pipe size, increased friction loss, and a proportionate reduction of available system water is the result of:", "pg": "181", "o": ["deficient maintenance programs.", "utilizing bad quality water sources.", "utilizing a large diameter hose during pumping operations.", "encrustation of minerals on the interior surfaces of the pipe."], "a": 3}, {"n": 48, "p": "D/Os must understand that the average daily consumption (ADC) of a water supply system is the amount of water used:", "pg": "181", "o": ["in any one-hour interval.", "during unusual situations.", "per day in a three-year period.", "per day, measured over a one year period."], "a": 3}, {"n": 49, "p": "In many cases, a private source of water used for fire protection is:", "pg": "182", "o": ["hard.", "potable.", "mineral.", "nonpotable."], "a": 3}]}, {"ch": 5, "title": "Hose Nozzles and Flow Rates", "qs": [{"n": 1, "p": "Which three basic fire stream designs are used in the fire service?", "pg": "187", "o": ["Solid, fog, and broken", "Solid, mist, and broken", "Jet solid, spray, intermittent", "Semi-solid, mist, and broken"], "a": 0}, {"n": 2, "p": "Generally, noozles with flows less than 350 gpm (1 400 L/min) are used with:", "pg": "187", "o": ["handlines.", "master streams.", "oscillating master nozzles.", "adjustable master nozzles."], "a": 0}, {"n": 3, "p": "Which fire stream has a better ability to penetrate into a fuel package and reach the seat of a fire because it produces a stream with little shower or spray?", "pg": "188", "o": ["Fog", "Mist", "Solid", "Broken"], "a": 2}, {"n": 4, "p": "What determines the flow and reach of a solid stream tip when the correct pressure is being delivered to the nozzle?", "pg": "188", "o": ["Pump size", "Nozzle brand", "Type of fire truck used on site", "Size of the nozzle’s discharge orifice"], "a": 3}, {"n": 5, "p": "What is the optimum pressure at the nozzle to operate a solid stream nozzle on handlines?", "pg": "188", "o": ["50 psi (350 kPa)", "75 psi ( 525 kPa)", "100 psi (700 kPa)", "150 psi (1050 kPa)"], "a": 0}, {"n": 6, "p": "What is the optimum pressure at the nozzle to operate master stream appliances on handlines?", "pg": "188", "o": ["20 psi (140 kPa)", "40 psi (280 kPa)", "80 psi (560 kPa)", "100 psi (700 kPa)"], "a": 2}, {"n": 7, "p": "When a smooth bore tip is used, what is the first step in determining the friction loss in the hose layout?", "pg": "189", "o": ["Calculate the PDP", "Determine the gpm", "Calculate the elevation", "Drawing the hose layout"], "a": 1}, {"n": 8, "p": "Using the discharge rate formula for solid stream nozzles, what is the water flow from a 1 inch (25.4 mm) tip operating at 50 psi (344.75 L/min)? Answers are not rounded.", "pg": "190", "o": ["110 gpm (416 L/min)", "210 gpm (783.41 L/min)", "310 (1173 L/min)", "410 psi (1552 L/min)"], "a": 1}, {"n": 9, "p": "What fog stream is produced by deflecting water around a circular stem inside the nozzle?", "pg": "190", "o": ["Impinged stream", "Interior-deflected", "Periphery-deflected", "Concentric-deflected"], "a": 2}, {"n": 10, "p": "Generally, the flow of the nozzle is the same regardless of the:", "pg": "190", "o": ["pattern.", "elevation.", "hose size.", "hose length."], "a": 0}, {"n": 11, "p": "Which fog stream nozzles break water into fine, evenly divided droplets by driving several jets of water together at an angle?", "pg": "190", "o": ["Solid", "Straight", "Impinging", "Intermittent"], "a": 2}, {"n": 12, "p": "The reach of the fog stream is directly correlated to the:", "pg": "190", "o": ["pre-piped waterway.", "ambient temperature.", "length of the fire hose.", "size of the water droplets."], "a": 3}, {"n": 13, "p": "Which fog nozzle is designed to flow a specific volume of water on all stream patterns at a specific nozzle discharge pressure?", "pg": "192", "o": ["Automatic", "Variable flow", "Constant flow", "Selectable gallonage"], "a": 2}, {"n": 14, "p": "Most constant flow nozzles are designed to operate at a nozzle pressure of:", "pg": "192", "o": ["100 psi (700 kPa).", "200 psi (1 400 kPa).", "300 psi ( 2 100 kPa).", "400 psi (2 800 kPa)."], "a": 0}, {"n": 15, "p": "When operating a selectable gallonage nozzle, the D/O sets its discharge gallonage:", "pg": "192", "o": ["with a specified range before use.", "based on the fire pump capabilities.", "depending on the water supply capabilities.", "based on nozzle manufacturer specifications."], "a": 0}, {"n": 16, "p": "One of the reasons for using low-pressure fog nozzles is that:", "pg": "193", "o": ["they have a better cost-to-benefit ratio.", "they help preserve the lifespan of fire hoses.", "friction loss will not affect the designed flow rate.", "elevation pressures do not affect their operational flows."], "a": 3}, {"n": 17, "p": "High-pressure fog nozzles produce a stream with significant forward velocity, but a relatively:", "pg": "193", "o": ["low velocity pressure.", "low volume of water delivery.", "high volume of water delivery.", "marginal volume of water delivery."], "a": 1}, {"n": 18, "p": "Master stream nozzles can deliver water flow in excess of:", "pg": "193", "o": ["350 gpm (1 400 L/min).", "450 gpm (1 700 L/min).", "550 gpm (2 000 L/min).", "650 gpm (2 500 l/min)."], "a": 0}, {"n": 19, "p": "Master stream appliances generally operate where _____ would be ineffective.", "pg": "193", "o": ["nozzles", "handlines", "aerial streams", "offensive posture"], "a": 1}, {"n": 20, "p": "What types of master stream devices are commonly called deck guns and permanently mounted on the apparatus?", "pg": "194", "o": ["Dual", "Fixed", "Portable", "Combination"], "a": 1}, {"n": 21, "p": "What types of master stream devices may be used in a mount on the apparatus or removed and used remotely from the vehicle?", "pg": "194", "o": ["Dual", "Fixed", "Portable", "Combination"], "a": 3}, {"n": 22, "p": "What types of master stream devices are stored on the apparatus for deployment to the location where they are to be used?", "pg": "194", "o": ["Dual", "Fixed", "Portable", "Combination"], "a": 2}, {"n": 23, "p": "An advantage of a pre-piped waterway master stream on an elevated platform is that it:", "pg": "194", "o": ["has a higher weight and volume limit.", "may be remotely controlled from the apparatus turntable.", "greater pressure capabilities than a detachable waterway.", "has remote control capabilities when operating from a detachable ladder."], "a": 1}, {"n": 24, "p": "Which special-purpose nozzle has a rotating head that is spun by water discharged through multiple miniature outlets resembling periphery fog nozzles?", "pg": "195", "o": ["Solid", "Cellar", "Smooth bore", "Automatic variable flow"], "a": 1}, {"n": 25, "p": "The special-purpose piercing nozzle is capable of flowing approximately:", "pg": "196", "o": ["125 gpm (500 L/min) at 100 psi (700 kPa).", "150 gpm (560 L/min) at 100 psi (700 kPa).", "200 gpm (760 L/min) at 50 psi (350 kPa).", "250 gpm (950 L/min) at 50 psi (350 kPa)."], "a": 0}, {"n": 26, "p": "Which special-purpose nozzle consists of a solid piece of brass or steel with many small impinging holes, flowing only 1.5 to 3 gpm (6 to 12 L/min) at a nozzle pressure of 100 psi (700 kPa)?", "pg": "196", "o": ["Cellar", "Piercing", "Chimney", "Distributor"], "a": 2}, {"n": 27, "p": "What is the nozzle reaction when utilizing a smooth bore nozzle with a 1¼ inch (48 mm) tip operating at a pressure of 50 psi (350 kPa)?", "pg": "198", "o": ["Approximately 120 lb (540 N)", "Approximately 140 lb (630 N)", "Approximately 160 lb (710 N)", "Approximately 180 lb (800 N)"], "a": 0}, {"n": 28, "p": "What is the nozzle reaction of a hoseline with a fog nozzle flowing 200 gpm (700 L/min) at 100 psi (525 kPa)?", "pg": "199", "o": ["Approximately 100 lb (450 N)", "Approximately 150 lb (670 N)", "Approximately 200 lb (890N)", "Approximately 250 lb (1 115 N)"], "a": 0}]}, {"ch": 6, "title": "Theoretical Pressure Calculations", "qs": [{"n": 1, "p": "To effectively provide water for fire streams, the D/O must know the pressure loss or gain due to elevation, and the:", "pg": "204", "o": ["pipes and/or appliances brands.", "amount of friction loss in the fire hose.", "pressure loss or gain due to pipe ductility.", "number of trucks available for relay operations."], "a": 1}, {"n": 2, "p": "To effectively provide water for fire streams, the D/O must know the amount of friction loss in the fire hose, pipes, and/or appliances, and the:", "pg": "204", "o": ["the fire's fuel load.", "experience of the nozzle operator.", "pressure loss or gain due to elevation.", "different types of hose loads on the apparatus."], "a": 2}, {"n": 3, "p": "Friction loss, loss or gain due to elevation, and appliance pressure loss are factors that comprise:", "pg": "205", "o": ["head pressure (HP).", "total pressure loss (TPL).", "pump discharge pressure (PDP).", "net pump discharge pressure (NPDP)."], "a": 1}, {"n": 4, "p": "Friction loss is affected by the amount of water flowing as well as the length, diameter, and _____ of the hose or pipe.", "pg": "205", "o": ["cost", "lining", "layers", "thickness"], "a": 1}, {"n": 5, "p": "What can be done by jurisdictions to gain more accurate hydraulic calculation results?", "pg": "206", "o": ["Purchase the most expensive equipment for testing", "Compare hydraulic calculations to results from other jurisdictions", "Use individual testing and published data in standard calculations", "Test the actual equipment in conditions likely to be encountered at a fire scene"], "a": 3}, {"n": 6, "p": "The standard friction loss coefficients of discharge for attack hose are generally high for _____ hose.", "pg": "206", "o": ["old", "modern", "double layer", "large-diameter"], "a": 1}, {"n": 7, "p": "What is recommended to prevent issues with friction loss in standpipe operations?", "pg": "206", "o": ["On-site improvisation during the incident", "Reducing the size of the standpipe to minimize friction", "Avoiding the use of pumping apparatus in such situations", "Preplanning and determining standpipe pressures in advance"], "a": 3}, {"n": 8, "p": "What factors are accounted for in the current formula for friction loss?", "pg": "206", "o": ["The material of the hose or pipe, the volume of water flowing, and the length of the hose layout", "The diameter of the hose or pipe, the volume of water flowing, and the length of the hose layout", "The diameter of the hose or pipe, the velocity of water flowing, and the length of the hose layout", "The diameter of the hose or pipe, the volume of water flowing, and the volume of the hose or pipe"], "a": 1}, {"n": 9, "p": "One accurate method for determining pressure loss in a particular hose lay involves measuring the pressure at:", "pg": "207", "o": ["both ends of the hoseline and adding the difference.", "both ends of the hoseline and subtracting the difference.", "the pump discharge and adding pressure gain due to elevation.", "one end of the hoseline and adding pressure loss due to elevation."], "a": 1}, {"n": 10, "p": "A pitot tube, two in-line gauges, a hose, and a smooth bore nozzle is the equipment required:", "pg": "208", "o": ["for testing friction loss.", "on every fire apparatus.", "on every aerial platform.", "for determining pump intake pressure."], "a": 0}, {"n": 11, "p": "The largest factor related to avoidable friction loss is the:", "pg": "208", "o": ["fire hose material quality.", "number of hose couplings.", "appliances' material quality.", "volume of water flowing per minute."], "a": 3}, {"n": 12, "p": "What is created by gravity and the height difference between the pump and the nozzle?", "pg": "210", "o": ["Laminar flow", "Turbulent flow", "Elevation pressure (EP)", "Total pressure loss (TPL)"], "a": 2}, {"n": 13, "p": "Elevation pressure can cause a pressure loss when the:", "pg": "210", "o": ["pump is at sea level.", "nozzle is at the pump level.", "pump is higher than the nozzle.", "nozzle is higher than the pump."], "a": 3}, {"n": 14, "p": "What customary (metric) formula should a D/O use to calculate changes in pressure due to elevation?", "pg": "210", "o": ["FL=CQ2L", "EP=5H (35H)", "PDP=NP+TPL", "EP=.05H (10H)"], "a": 3}, {"n": 15, "p": "What variables are considered in the formula used to calculate changes in pressure due to elevation in a multistory building?", "pg": "210", "o": ["A constant 5 psi (35 kPa), the number of stories plus one", "A constant 10 psi (70 kPa) the number of stories plus one", "A constant 5 psi (35 kPa), the number of stories minus one", "A constant 10 psi (70 kPa), the number of stories minus one"], "a": 2}, {"n": 16, "p": "When using more than one hoseline and their diameters vary, friction loss calculations must be made for:", "pg": "211", "o": ["one hoseline.", "each hoseline.", "the hose line with a larger diameter.", "the hose line with the smallest diameter."], "a": 1}, {"n": 17, "p": "When using a wyed hoseline, what effect can cause too much, or too little, pressure and flow of one line?", "pg": "211", "o": ["Inadvertent valve movement", "The pattern of opposing nozzles", "Inline pressure gauge fluctuation", "Friction loss due to the internal design"], "a": 0}, {"n": 18, "p": "The greater the rate of flow through a hoseline, _____ must be supplied to overcome friction loss.", "pg": "212", "o": ["the lesser amount of water", "the greater amount of water", "the lesser amount of pressure", "the greater amount of pressure"], "a": 3}, {"n": 19, "p": "When two hoselines of equal length are siamesed to supply a fire stream, or another pumper, friction loss is approximately _____ of a single hoseline at the same volume.", "pg": "212", "o": ["25%", "50%", "75%", "100%"], "a": 0}, {"n": 20, "p": "When determining friction loss, add 10 psi (70 kPa) for a siamese appliance if the flow is:", "pg": "212", "o": ["less than 250 gpm [1 000 L/min]).", "greater than 250 gpm [1 000 L/min]).", "less than 350 gpm [1 400 L/min]).", "greater than 350 gpm [1 400 L/min])."], "a": 3}, {"n": 21, "p": "To determine the required pressure for a standpipe system, the D/O must calculate:", "pg": "212", "o": ["nozzle reaction time.", "pump discharge rates.", "friction loss coefficient.", "total pressure loss (TLP)."], "a": 3}, {"n": 22, "p": "In an aerial waterway, bends in the aerial piping and associated swivels cause pressure loss due to the:", "pg": "213", "o": ["great amount of water running through the piping.", "extremely high elevation the water has to overcome through the piping.", "ductility of the piping and the quality of the hoses used in the apparatus.", "turbulence created as the water forcefully makes its way through the piping."], "a": 3}, {"n": 23, "p": "When calculating pressure loss for a master stream device, the D/O must add _____ to the pressure loss calculation.", "pg": "213", "o": ["25 psi (175 kPa)", "50 psi (350 kPa)", "75 psi (525 kPa)", "100 psi (700 kPa)"], "a": 0}, {"n": 24, "p": "Multiple hoselines are simple layouts as long as _____ has its own discharge valve that can be gated for the correct PDP.", "pg": "214", "o": ["each one", "at least one", "each group of 2 lines", "each group of three lines"], "a": 0}, {"n": 25, "p": "When hoselines connected to a manifold are unequal and/or the diameter is different, the TPL in the system is based on the:", "pg": "215", "o": ["lowest flow required in any of the hoselines.", "highest flow required in any of the hoselines.", "lowest pressure required in any of the hoselines.", "highest pressure required in any of the hoselines."], "a": 3}, {"n": 26, "p": "What is the safe and efficient nozzle pressure for a common solid stream nozzle (master stream)?", "pg": "216", "o": ["50 psi (350 kPa)", "75 psi (525 kPa)", "80 psi (560 kPa)", "100 psi (700 kPa)"], "a": 2}, {"n": 27, "p": "The NPDP for a positive pressure source is the:", "pg": "216", "o": ["sum of the TPL and the incoming pressure from the supply source.", "sum of the PDP and the discharge pressure from the supply source.", "difference between the TPL and the incoming pressure from the supply source.", "difference between the PDP and the incoming pressure from the supply source."], "a": 3}]}, {"ch": 7, "title": "Fireground Hydraulic Calculations", "qs": [{"n": 1, "p": "What does a flowmeter determine?", "pg": "262", "o": ["Friction loss in the pump", "Pressure coming from a discharge", "Direct water flow from a discharge", "Water velocity coming from a discharge"], "a": 2}, {"n": 2, "p": "Based on NFPA 1900, what must be provided for every discharge outlet equipped with a flowmeter?", "pg": "262", "o": ["Tachometer", "Paddlewheel", "Pressure gauge", "Volumetric gauge"], "a": 2}, {"n": 3, "p": "In what situation would a D/O most likely exceed safe operating pressures for hoses or standpipes when only considering the flowrate of the nozzle and ignoring the pressure?", "pg": "262", "o": ["During standard firefighting operations", "When conducting regular pump maintenance", "When the discharge outlets have multiple flowmeters", "When using long hose lays or facing high elevation pressure losses"], "a": 3}, {"n": 4, "p": "Which type of flowmeter uses a sensor that measures the speed at which it spins and then translates the information into a flow measurement?", "pg": "262", "o": ["Paddlewheel", "Spring probe", "Cooper wheel", "Thermocouples"], "a": 0}, {"n": 5, "p": "According to NFPA 1900, if a pressure gauge is mounted within 6 inches (150 mm) of the control valve centerline, the flowmeter must be mounted within _____ adjacent to the pressure gauge.", "pg": "263", "o": ["2 inches (50 mm)", "4 inches (100 mm)", "6 inches (150 mm)", "8 inches (200 mm)"], "a": 0}, {"n": 6, "p": "With proper calibration, a flowmeter in good condition should be accurate to a tolerance of plus or minus:", "pg": "263", "o": ["5%.", "10%.", "15%.", "20%."], "a": 0}, {"n": 7, "p": "Which tool relieves the D/O from relying on calculations based on the friction loss, length of the hoseline, and elevation pressure?", "pg": "264", "o": ["Flowmeter", "Tachometer", "Pressure gauge", "Hydraulic calculator"], "a": 0}, {"n": 8, "p": "When engaged in a relay pumping operation, the intake pressure reading should NOT drop below:", "pg": "264", "o": ["20 psi (140 kPa).", "40 psi (275 kPa).", "60 psi (410 kPa).", "80 psi (550 kPa)."], "a": 0}, {"n": 9, "p": "When operating a flowmeter-equipped apparatus, the D/O may factor in the number and types of nozzles on hoselines operating from the standpipe by:", "pg": "264", "o": ["adding the flow rates for one nozzle and pumping a matching volume of water.", "adding the flow rates for each nozzle and pumping a matching volume of water.", "subtracting the flow rates for one nozzle and pumping a matching volume of water.", "subtracting the flow rates for each nozzle and pumping a matching volume of water."], "a": 1}, {"n": 10, "p": "What would happen if firefighters shut down a nozzle and the pressure control device does not activate accordingly?", "pg": "265", "o": ["The volume will increase exponentially", "The pressure will increase exponentially", "The volume and unused pressure could divert to other open nozzles", "Volume and unused pressure will remain static when the nozzle is shut down"], "a": 2}, {"n": 11, "p": "How do apparatus equipped with discharge relief valves compensate when firefighters shut down a nozzle?", "pg": "265", "o": ["Intermittently opening the relief valve", "Intermittently opening the tank dump valve", "Recirculating discharge volume to the intake", "Recirculating discharge pressure to the intake"], "a": 3}, {"n": 12, "p": "Apparatus equipped with electronic pressure governors set in the _____ mode should compensate when firefighters shut down a nozzle.", "pg": "265", "o": ["psi", "rpm", "gpm", "automatic"], "a": 0}, {"n": 13, "p": "Sprinkler systems present too many variables for the effective use of a flowmeter in support of the system, one of these variables being:", "pg": "265", "o": ["age of the building.", "engineering of the system.", "the cost of the system components.", "the number of improvements made to the system."], "a": 1}, {"n": 14, "p": "An electronic pressure governor will usually have one or more presets where one button is pushed and the pump automatically maintains:", "pg": "266", "o": ["a particular flow.", "a particular pressure.", "the same water viscosity.", "the same water temperature."], "a": 1}, {"n": 15, "p": "What is the purpose of developing SOPs for operating flows or pressures?", "pg": "266", "o": ["Eliminate the need for pressure governor presets", "Allow the D/O to operate the fire pump without restrictions", "Comply with legal requirements set by the local government", "Provide guidelines for the operation of preconnected attack lines"], "a": 3}, {"n": 16, "p": "An AHJ may determine SOPs for flows and pressures. Measurement typically is documented for hose in friction loss per 100 feet (30 m) at:", "pg": "266", "o": ["sea level.", "specific flows.", "any condition.", "specific elevations."], "a": 1}, {"n": 17, "p": "Which NFPA standard requires establishing an uninterrupted water supply of a minimum of 400 gpm (1 520 L/min) for 30 minutes with supply line(s) maintained by an operator for residential fire?", "pg": "266", "o": ["NFPA 1002", "NFPA 1033", "NFPA 1710", "NFPA 1911"], "a": 2}, {"n": 18, "p": "What is the responsibility of the D/O concerning SOPs for operating flows or pressures?", "pg": "266", "o": ["Follow the SOPs while operating a fire pump", "Enforce the SOPs strictly without any flexibility", "Challenge and modify the SOPs whenever necessary", "Develop new SOPs independently for each operation"], "a": 0}, {"n": 19, "p": "What should fire department personnel establish to develop a customized pump chart?", "pg": "267", "o": ["An electronic board for onsite hydraulic calculations", "A form that clearly identifies the D/Os academic background", "A form that clearly identifies the department’s nozzles and devices", "An electronic board preloaded with theoretical pressure calculations"], "a": 2}, {"n": 20, "p": "After gathering the relevant data from a pump chart and applying appliance pressure loss, the D/O should calculate the appropriate PDP by rounding to the nearest:", "pg": "267", "o": ["5 psi (35 kPa).", "10 psi (69 kPa).", "15 psi (104 kPa).", "20 psi (138 kPa)."], "a": 0}]}, {"ch": 8, "title": "Fire Pump Characteristics", "qs": [{"n": 1, "p": "Centrifugal pump operation functions on the principle that:", "pg": "274", "o": ["a hand crank rotates a gear, forcing water through the pump and hoses.", "multiple pistons apply kinetic energy to water so its pressure and velocity are increased.", "a rapidly revolving spiral tends to throw water introduced at several points along the pump body.", "a rapidly revolving disk tends to throw water introduced at its center toward the outer edges of the disk."], "a": 3}, {"n": 2, "p": "The faster the impeller of a centrifugal pump rotates:", "pg": "274", "o": ["the slower water velocity is at the same pump level.", "the higher the impeller can force a column of water up.", "the more difficult it is to overcome gravity force to move water up.", "the more difficult it is to overcome gravity force to move water at the same pump level."], "a": 1}, {"n": 3, "p": "What dictates the capacity of a centrifugal pump?", "pg": "274", "o": ["Pump size", "Impeller size", "Impeller metal components", "Apparatus engine horsepower"], "a": 1}, {"n": 4, "p": "The off-center mounting of the impeller within the casing which creates a water passage that enlarges as it nears the discharge outlet of the pump is known as the:", "pg": "274", "o": ["volute.", "diffuser.", "pump eye.", "impeller eye."], "a": 0}, {"n": 5, "p": "What is one of the three factors that influence a centrifugal fire pump's discharge pressure?", "pg": "275", "o": ["Speed at which volute occurs", "Speed at which the impeller is turning", "Pressure of water when it exits the pump", "Velocity of water when it enters the pump"], "a": 1}, {"n": 6, "p": "Why must the D/O provide a water source and evacuate all air from a centrifugal pump?", "pg": "275", "o": ["A centrifugal pump can pump air and self-prime", "A centrifugal pump cannot pump air or self-prime", "A centrifugal pump is capable of overcoming gravity force", "A centrifugal pump is not capable of overcoming gravity force"], "a": 1}, {"n": 7, "p": "What will happen if an air lock occurs in a centrifugal pump?", "pg": "275", "o": ["The pump will develop discharge pressure", "Air will dilute in the water inside the pump", "The pump will not develop discharge pressure", "Air will help to build up a higher discharge pressure"], "a": 2}, {"n": 8, "p": "Centrifugal pumps constructed with a single impeller are referred to as:", "pg": "276", "o": ["single-stage.", "two-stage.", "three-stage.", "multistage."], "a": 0}, {"n": 9, "p": "Sometimes, the double-suction impeller refers to _____ fire pump impeller.", "pg": "276", "o": ["single-stage", "two-stage", "multistage", "variable stage"], "a": 0}, {"n": 10, "p": "As a means to balance the fire pump and cancel lateral thrust forces, how does the water enter the single-stage impeller?", "pg": "276", "o": ["Through both eyes", "Through only one eye", "Through both eyes at a 90-degree angle", "Through one eye first and then the other"], "a": 0}, {"n": 11, "p": "The capability to connect the stages in series for maximum pressure or in parallel for maximum volume by use of a _____ makes two impellers more efficient.", "pg": "276", "o": ["clapper valve", "transfer valve", "midship pump", "priming device"], "a": 1}, {"n": 12, "p": "Pumping in series (pressure) position, the volume of water available is limited to the:", "pg": "277", "o": ["pressure the pump can develop.", "pressure the volute is able to build.", "amount that one impeller can supply.", "amount that two impellers can supply."], "a": 2}, {"n": 13, "p": "When pumping in the parallel (volume) position with a two-stage pump rated at 1,000 gpm (4 000 L/min) at 150 psi (1 050 kPa), each of the impeller's supplies _____ to the pump discharge manifold.", "pg": "277", "o": ["250 gpm (1 000 L/min)", "500 gpm (2 000 L/min)", "750 gpm (3 000 L/min)", "1000 gpm (4 000 L/min)"], "a": 1}, {"n": 14, "p": "When the transfer valve operates on a two-stage pump, switching from volume to pressure can:", "pg": "278", "o": ["increase pressure loss.", "decrease pressure loss.", "double discharge volume.", "double discharge pressure."], "a": 3}, {"n": 15, "p": "In what position should the D/O set the transfer valve to ensure the two-stage pump can supply sufficient volume?", "pg": "278", "o": ["Series", "Parallel", "Velocity", "Pressure"], "a": 1}, {"n": 16, "p": "The D/O must NOT exceed a net pump discharge pressure (NPDP) of _____ when making a changeover between pressure and volume on a two-stage centrifugal pump.", "pg": "278", "o": ["50 psi (350 kPa)", "100 psi (700 kPa)", "150 psi (1 050 kPa)", "200 psi (1 400 kPa)"], "a": 0}, {"n": 17, "p": "Which valves are essential to the operation of a two-stage pump?", "pg": "278", "o": ["Globe", "Deluge", "Clapper", "Automatic"], "a": 2}, {"n": 18, "p": "Fire pumps that utilize up to four impellers connected in series to develop high pressure are known as:", "pg": "280", "o": ["two-stage pumps.", "vertical split pumps.", "single-stage pumps.", "multistage centrifugal pumps."], "a": 3}, {"n": 19, "p": "What is a type of device that newer model centrifugal pumps may come with that opens to allow overheated water to circulate between the pump and the main water tank or into the atmosphere?", "pg": "281", "o": ["Deluge valve", "Automatic cooler", "Thermal relief valve", "Electronic thermal control"], "a": 2}, {"n": 20, "p": "To prevent overheating, what should the D/O do if water is NOT expected to be discharged through a pump for an extended period of time?", "pg": "281", "o": ["Maintain the pump at its fully operational capacity", "Shut down the pump and wait for instruction from IC", "Make connections to deliver water to other fire apparatus", "The pump should be throttled down to idle and disengaged"], "a": 3}, {"n": 21, "p": "The most common seal-packing materials for pumps are made up of:", "pg": "281", "o": ["lead alloys.", "aluminum alloys.", "fibers impregnated with graphite or lead.", "fibers impregnated with graphite or aluminum."], "a": 2}, {"n": 22, "p": "What is used to overcome the friction that develops heat where the packing rings contact the shaft?", "pg": "281", "o": ["Plastic seal", "Silicone gel", "Heat resistant rubber", "Lantern or slinger ring"], "a": 3}, {"n": 23, "p": "What may happen to the packing seal if the pump goes unused for extended periods of time?", "pg": "282", "o": ["No water will drip from the glands", "Excessive lubrication will damage the packing", "Packing will maintain all its physical properties", "Packing may dry out and cause excessive leaking"], "a": 3}, {"n": 24, "p": "What may happen if mechanical seals freeze in cold weather?", "pg": "282", "o": ["Minor damage may occur", "Seals remain intact, not requiring replacement", "Damage may occur, but replacement is not necessary", "Damage may occur, requiring the seals to be replaced"], "a": 3}, {"n": 25, "p": "In most fire departments, where is the pump mounted in the pumper truck?", "pg": "282", "o": ["In the rear of the pumper", "In the front of the pumper", "On top of the inboard water tank", "To the frame in line behind the engine and transmission"], "a": 3}, {"n": 26, "p": "Where is the split shaft transfer case that powers a midship-mounted pump located?", "pg": "282", "o": ["Underneath the pump", "Behind the apparatus engine", "In front of the apparatus engine", "Between the transmission and rear axle"], "a": 3}, {"n": 27, "p": "What will happen if the D/O places the road transmission in the wrong gear on a midship-mounted fire pump?", "pg": "283", "o": ["Engine will overheat and fail", "Pump will turn at the needed rpm to operate effectively", "Pump will not turn at the needed rpm to operate effectively", "Engine will not turn at the needed velocity to operate effectively"], "a": 2}, {"n": 28, "p": "What happens if the D/O places the transmission in the correct gear?", "pg": "283", "o": ["A lockout feature will stop the transmission immediately", "The pump will not turn at the needed rpm to operate effectively", "The engine will not turn at the needed velocity to operate effectively", "A lockout feature prevents the transmission from switching gears as rpm rises and falls"], "a": 3}, {"n": 29, "p": "What prevents an automatic transmission gear selector from moving during a pumping operation or a manual transmission from slipping out of gear?", "pg": "284", "o": ["Driver/operator hand holds it in the proper pumping gear", "A switch on the transmission holds it in the proper pumping gear", "A lock on the transmission or shift lever holds it in the proper pumping gear", "A special device tailored by each apparatus manufacturer holds it in the proper pumping gear"], "a": 2}, {"n": 30, "p": "PTO-driven fire pumps commonly serve on initial attack and _____ fires.", "pg": "284", "o": ["wildland", "industrial", "high-rise building", "hazordous materials"], "a": 0}, {"n": 31, "p": "The rear-engine power take-off (REPTO) design works well in which type of industry?", "pg": "285", "o": ["Food", "Chemical", "Agriculture", "Automotive"], "a": 2}, {"n": 32, "p": "Where is the pump typically mounted on fire department pumpers with an extended front bumper?", "pg": "285", "o": ["In the back of the vehicle", "On the roof of the vehicle", "Between the driver and passenger seats", "Between the vehicle bumper and its grill"], "a": 3}, {"n": 33, "p": "The freezing of front-mount pumps and gauges may be reduced by:", "pg": "286", "o": ["allowing internal heat of the cab to systematically pass through.", "using external lines that circulate radiator fluid through the pump body.", "keeping the pump and gauges pointed opposite the direction of wind flow.", "using external lines that circulate onboard tank water through the pump body."], "a": 1}, {"n": 34, "p": "What key advantage would an apparatus with rear-mount pumps offer?", "pg": "286", "o": ["Better internal piping distribution", "Opportunity for a longer wheelbase", "Optimum pump location for a fire attack", "More even weight distribution on the chassis"], "a": 3}, {"n": 35, "p": "The most common applications for auxiliary engine driven pumps include:", "pg": "286", "o": ["portable fire pumps.", "all aerial fire apparatus.", "industrial fire apparatus.", "all structural fire fighting pumpers."], "a": 0}, {"n": 36, "p": "According to NFPA 1900, which is a necessary control/instrument that should be located on the operator’s panel?", "pg": "287", "o": ["Voltmeter", "Digital clock", "Aerial ladder joystick", "Outrigger control button"], "a": 0}, {"n": 37, "p": "The master intake and discharge gauges work as the primary gauges used by the D/O to determine the water:", "pg": "288", "o": ["velocity entering and leaving the pump.", "pressure entering and leaving the pump.", "velocity entering and leaving the hydrant.", "pressure entering and leaving the hydrant."], "a": 1}, {"n": 38, "p": "The pump discharge pressure gauge registers the pressure as it leaves the pump, but:", "pg": "288", "o": ["after it reaches the gauges for each discharge line.", "before it reaches the gauges for each discharge line.", "before it reaches the gauge for the largest discharge line.", "before it reaches the gauges for the smallest discharge line."], "a": 1}, {"n": 39, "p": "If a flowmeter is provided for an individual discharge, it must be within _____ of the pressure gauge.", "pg": "288", "o": ["1 inch (25 mm)", "2 inches (50 mm)", "3 inches (77 mm)", "4 inches (102 mm)"], "a": 1}, {"n": 40, "p": "What units of measurement are displayed on a tachometer?", "pg": "288", "o": ["Cycles per minute (cpm)", "Voltage per minute (vpm)", "Revolutions per minute (rpm)", "Miles per minute (mpm) (km/m)"], "a": 2}, {"n": 41, "p": "What happens if an engine operates with a too-cool temperature?", "pg": "289", "o": ["It is not as efficient", "Increases oil pressure", "Dries out the impellers", "Expands the water valve seals"], "a": 0}, {"n": 42, "p": "The ammeter indicates the status of the vehicle’s _____ and charging system.", "pg": "289", "o": ["battery", "alternator", "condenser", "lighting system"], "a": 1}, {"n": 43, "p": "What device is used to increase or decrease the speed of the engine powering the fire pump?", "pg": "290", "o": ["PTO", "Clutch", "Throttle", "Gear lever"], "a": 2}, {"n": 44, "p": "The primer control operates the priming device when the pump drafts from:", "pg": "290", "o": ["a hydrant.", "an onboard tank.", "a static water supply.", "another fire apparatus."], "a": 2}, {"n": 45, "p": "The D/O should verify the accuracy of the water level indicator by:", "pg": "290", "o": ["taking the truck to a weigh station.", "checking a second water level indicator.", "inspecting the fill opening to verify the tank is full.", "tapping the outer walls of the tank to hear if it sounds empty."], "a": 2}, {"n": 46, "p": "The piping system and the fire pump itself must be able to withstand a hydrostatic test of _____ before being placed into service.", "pg": "291", "o": ["125 psi (875 kPa)", "250 psi (1 750 kPa)", "500 psi (3 500 kPa)", "750 psi (5 250 kPa)"], "a": 2}, {"n": 47, "p": "According to NFPA 1900, pumpers with a tank capacity of less than 500 gallons (2 000 L), should have piping capable of flowing:", "pg": "291", "o": ["150 gpm (600 L/min).", "250 gpm (1 000 L/min).", "500 gpm (2 000 L/min).", "750 gpm (3 000 L/min)."], "a": 1}, {"n": 48, "p": "Based on NFPA 1900, a sufficient number of _____ discharge openings must be provided to flow the rated capacity of the pump.", "pg": "292", "o": ["1½ inch (38 mm)", "2½ inch (65 mm)", "3 inch (77 mm)", "4 inch (100 mm)"], "a": 1}, {"n": 49, "p": "A fire apparatus pump rated less than 750 gpm (3 000 L/min) must have at least _____ 2½ inch (65 mm) discharge(s).", "pg": "292", "o": ["one", "two", "three", "six"], "a": 0}, {"n": 50, "p": "A minimum of _____ piping, valves, and elbows must be used to supply discharges where 1½, 1¾, or 2 inch (38 mm, 45 mm, or 50 mm) handlines are attached.", "pg": "293", "o": ["1½ inch (38 mm)", "1¾ inch (45 mm)", "2 inch (50 mm)", "2½ inch (65 mm)"], "a": 2}, {"n": 51, "p": "According to NFPA 1900, apparatus equipped with tanks less than 1,000 gallons (4 000 liters) must have a tank fill line of at least _____ in diameter.", "pg": "294", "o": ["1 inch (25 mm)", "2 inch (50 mm)", "3 inch (75 mm)", "4 inch (100 mm)"], "a": 0}, {"n": 52, "p": "What can operate in conjunction with the tank-to-pump valve to circulate water through the pump to prevent overheating when no water flows?", "pg": "294", "o": ["Tank fill line", "Deluge valve", "Auxiliary pump", "Recirculating valve"], "a": 0}, {"n": 53, "p": "Gate or butterfly valves are also used on fire apparatus, frequently on:", "pg": "296", "o": ["tank intake.", "priming pump discharge.", "large-diameter intakes and discharges.", "small-diameter intakes and discharges."], "a": 2}, {"n": 54, "p": "Which is one of the three common valves that D/Os use to operate a fire pump?", "pg": "296", "o": ["Tank fill valve", "Cooler pump valve", "Riser clapper valve", "Three-way siamese valve"], "a": 0}, {"n": 55, "p": "Suction drains must be supplied at the _____ the pump and at the lowest point of each line connecting to it.", "pg": "296", "o": ["top of", "midpoint on", "lowest point on", "highest point on"], "a": 2}, {"n": 56, "p": "What is achieved by opening the bleeder valve on the line side of the intake valve?", "pg": "296", "o": ["Air can be forced out of the hose as the hose is empty of water", "A large amount of water can be forced out of the pump as the hose fills with water", "Air can be forced out of the hose and pass through the bleeder as the hose fills with water", "A large amount of water can be forced out of the pump and pass through the bleeder as the hose fills with water"], "a": 2}, {"n": 57, "p": "The pressure control device must operate within _____ seconds after the discharge pressure rises and restricts the pressure from exceeding 30 psi (210 kPa) above the set level.", "pg": "297", "o": ["one to two", "three to ten", "fifteen", "twenty"], "a": 1}, {"n": 58, "p": "The electronic governor constantly senses either PDP or rpm to send signals to the engine to control:", "pg": "297", "o": ["speed.", "velocity.", "pressure.", "temperature."], "a": 0}, {"n": 59, "p": "Because the speed of the impellers determines pressure, cutting engine speed:", "pg": "297", "o": ["reduces pump pressure.", "increases pump pressure.", "stabilizes pump temperature.", "increases pump temperature."], "a": 0}, {"n": 60, "p": "What is another advantage of the electronic governor when a discharge line closes?", "pg": "297", "o": ["The engine rpm adjusts, but the discharge pressure is maintained in just one line", "Engine temperature adjusts, but the discharge pressure is maintained in just one line", "The engine rpm adjusts, but the same discharge pressure is maintained on any lines still flowing", "Engine temperature adjusts, and the same discharge pressure is maintained on any lines still flowing"], "a": 2}, {"n": 61, "p": "What are the main features of a relief valve?", "pg": "297", "o": ["Sensitivity to high pressure and ability to balance excessive pressure", "Sensitivity to pressure change and ability to relieve excessive pressure", "Sensitivity to temperature change and ability to relieve excessive pressure", "Sensitivity to pressure change and ability to transfer excessive temperature"], "a": 1}, {"n": 62, "p": "While discharge pressure relief valves are quick to react to overpressure conditions, they take more time to reset to _____ positions.", "pg": "298", "o": ["on", "volume", "pressure", "all-closed"], "a": 3}, {"n": 63, "p": "Which valves protect attack companies from excessive pressure?", "pg": "298", "o": ["Deluge valves", "Tank-fill valves", "Discharge bleeder valves", "Intake pressure relief valves"], "a": 3}, {"n": 64, "p": "The ability to initiate a successful drafting operation depends on creating a:", "pg": "299", "o": ["balanced pressure within the pump and intake hose.", "variable pressure within the pump and discharge hose.", "lower pressure within the pump and intake hose than exists in the atmosphere.", "higher pressure within the pump and intake hose than exists in the atmosphere."], "a": 2}, {"n": 65, "p": "The amount of water that can be pumped by a rotary gear pump depends on the size of the:", "pg": "300", "o": ["orifices in the gears and speed of rotation.", "pockets in the gears and speed of rotation.", "orifices in the gears and speed of the engine.", "pockets in the gears and duration of the rotation."], "a": 1}, {"n": 66, "p": "Which positive displacement pump operates with moveable elements that automatically compensate for wear, maintaining a tighter fit with closer clearances with the pump in use?", "pg": "300", "o": ["Piston", "Centrifugal", "Rotary gear", "Rotary vane"], "a": 3}, {"n": 67, "p": "Which positive displacement primer requires relatively high rpm and can be driven by mechanical means from the pump transfer gear case?", "pg": "301", "o": ["Rotary gear", "Rotary vane", "Rotary cycle", "Rotary piston"], "a": 1}, {"n": 68, "p": "Which type of primer may be installed into older apparatus as an environmentally friendly initiative?", "pg": "302", "o": ["Oil-less", "Catalytic", "Vapor-less", "Centrifugal"], "a": 0}, {"n": 69, "p": "Which type of primer uses the apparatus compressor to supply a jet pump to create a Venturi effect that primes the pump?", "pg": "303", "o": ["Air", "Piston", "Vacuum", "Rotary vane"], "a": 0}, {"n": 70, "p": "Which temperature control device recirculates water from the discharge to the intake side of the pump?", "pg": "303", "o": ["Pump heater", "Engine cooler", "Pump cooler valve", "Thermal relief valve"], "a": 2}, {"n": 71, "p": "In which cooler system does the water supplied by the fire pump pass through a coil mounted inside the cooler and submerged in the coolant?", "pg": "304", "o": ["Radiator", "Marine cooler", "Engine cooler", "Immersion auxiliary cooler"], "a": 3}, {"n": 72, "p": "What can excessive leakage between the discharge and intake sides of a pump indicate?", "pg": "306", "o": ["That the pump is functioning properly", "That there is a blockage in the water supply", "That the pump is drawing air into the system", "That the pump is not able to develop necessary pressure or flows"], "a": 3}, {"n": 73, "p": "Any leakage seen from mechanical seals during a visual or operational check of the pump shaft seals indicates:", "pg": "306", "o": ["failure.", "good packing conditions.", "good lubrication of pump shaft seal.", "that seals need more time to adjust."], "a": 0}, {"n": 74, "p": "If a tank is at least 500 gallons, how much flow should a tank-to-pump valve be able to move?", "pg": "307", "o": ["250 gpm (1 000 L/min)", "500 gpm (2 000 L/min)", "750 gpm (3 000 L/min)", "1,000 gpm (4 000 L/min)"], "a": 1}, {"n": 75, "p": "According to NFPA 1900 and 1910, the true test of the accuracy of a gauge stands at:", "pg": "307", "o": ["150 psi (1 050 kPa), 200 psi (1 400 kPa), and 250 psi (1 750 kPa).", "300 psi (2 100 kPa), 350 psi (2 400 kPa), and 400 psi (2 800 kPa).", "400 psi (2 800 kPa), 450 psi (3 100 kPa), and 500 psi (3 450 kPa).", "500 psi (3 450 kPa), 550 psi (3 800 kPa), and 600 psi (4 100 kPa)."], "a": 0}]}, {"ch": 9, "title": "Pump Operations from Pressurized Sources", "qs": [{"n": 1, "p": "After properly positioning the apparatus at the scene, setting the parking brake, placing the pump into gear, and exiting the cab, then the D/O can:", "pg": "319", "o": ["evaluate the hose layout.", "make the pump operational.", "measure the water tank level.", "perform a size-up of the scene."], "a": 1}, {"n": 2, "p": "If the backup lever for engaging the pump is used because of a main lever malfunction, the main lever:", "pg": "319", "o": ["is no longer available.", "holds in the pump position.", "is moved to the off position.", "is moved out of pump position."], "a": 1}, {"n": 3, "p": "A D/O should verify putting the pump in gear by noting:", "pg": "320", "o": ["vehicle's lights dim.", "apparatus' computer report.", "the vehicle's indicator lights.", "how the parking brake is released."], "a": 2}, {"n": 4, "p": "When the pump engages, the apparatus often produces a:", "pg": "320", "o": ["piezo alert.", "long horn blast.", "different sound.", "short horn blast."], "a": 2}, {"n": 5, "p": "At a minimum, where should the wheels of the fire apparatus be chocked?", "pg": "320", "o": ["Rear of a drive wheel", "Front of a drive wheel", "Front and rear of a drive wheel", "Two chocks sit on the downhill sides of two wheels"], "a": 2}, {"n": 6, "p": "The initial source of water that firefighters typically use is a:", "pg": "320", "o": ["fire hydrant.", "pumper tank.", "natural water source.", "relay from another pumper."], "a": 1}, {"n": 7, "p": "In cases where a master stream is placed in operation, operating from the onboard tank:", "pg": "320", "o": ["is the only option.", "may NOT be feasible.", "is always the best option.", "will NOT cause cavitation."], "a": 1}, {"n": 8, "p": "Cavitation results from a situation known as overpumping that creates a _____ condition on the intake side of the pump.", "pg": "320", "o": ["no-pressure", "low-pressure", "high-pressure", "zero absolute pressure"], "a": 1}, {"n": 9, "p": "What is a visual indication that there is physical damage due to erosion on a pump and/or impeller?", "pg": "320", "o": ["Pitting of the metal", "Cracking of pump casing", "Discoloration of pump casing", "Water color at the pump discharge"], "a": 0}, {"n": 10, "p": "A sound like gravel going through the pump is a sign of:", "pg": "321", "o": ["implosion.", "cavitation.", "delamination.", "auto rotation."], "a": 1}, {"n": 11, "p": "To safely assist blitz attack operations, what must a D/O know?", "pg": "321", "o": ["How many hydrants are available", "The limitations of the internal water tank", "Estimated time until additional resources arrive", "How many firefighters are involved in the operation"], "a": 1}, {"n": 12, "p": "Immediately after pumping water from an apparatus onboard water tank, the D/O must see whether the master discharge gauge reads approximately_____ at idle.", "pg": "321", "o": ["90 psi (630 kPa)", "60 psi (420 kPa)", "50 psi (350 kPa)", "120 psi (840 kPa)"], "a": 2}, {"n": 13, "p": "If the pump does not develop pressure after a period of time determined by the manufacturer, the governor will:", "pg": "321", "o": ["shut off.", "increase.", "return to idle.", "sound a high pitch emergency horn."], "a": 2}, {"n": 14, "p": "Most primer manufacturers call for a high idle of about _____ when using the primer.", "pg": "321", "o": ["1,000 rpm", "4,000 rpm", "3,000 rpm", "2,000 rpm"], "a": 0}, {"n": 15, "p": "To help save fuel, the D/O can keep the pump discharge pressure (PDP) only at the level needed by the _____ discharge.", "pg": "322", "o": ["75% of all", "average off all", "lowest individual", "highest individual"], "a": 3}, {"n": 16, "p": "Discharge relief valves CANNOT control discharge pressures below:", "pg": "322", "o": ["90 psi (630 kPa).", "100 psi (690 kPa).", "110 psi (760 kPa).", "120 psi (830 kPa)."], "a": 0}, {"n": 17, "p": "When pumping multiple lines with varying pressures, the proper pressures can only be reached:", "pg": "322", "o": ["when water flows.", "before water flows.", "when the hoseline closes.", "when water flow is stopped."], "a": 0}, {"n": 18, "p": "When operating at an incident requiring more water than carried onboard the apparatus, the D/O must transition to an external water supply:", "pg": "323", "o": ["upon arrival at the fire scene.", "only when requested by the IC.", "after depleting the onboard tank.", "before depleting the onboard tank."], "a": 3}, {"n": 19, "p": "Before relocating an apparatus, the D/O must _____ the pump drive system.", "pg": "323", "o": ["flush", "prime", "engage", "disengage"], "a": 3}, {"n": 20, "p": "When the air has been purged from the bleeder and a(n) _____ stream of water drains from the valve, it may be shut.", "pg": "323", "o": ["clear", "steady", "forceful", "intermittent"], "a": 1}, {"n": 21, "p": "Pressure governor manufacturers recommend transitioning to a pressurized source with the governor in:", "pg": "324", "o": ["volume mode.", "pressure mode.", "offensive mode.", "defensive mode."], "a": 1}, {"n": 22, "p": "The D/O can _____ the intake valve to provide the intake side of the pump with the external supply.", "pg": "324", "o": ["slowly open", "slowly close", "quickly open", "quickly close"], "a": 0}, {"n": 23, "p": "When operating a two-stage pump, the D/O must consider where the _____ should be for best advantage before increasing the throttle.", "pg": "324", "o": ["forward lever", "transfer valve", "proper pressure", "discharge relief valve"], "a": 1}, {"n": 24, "p": "The two basic pressured water supply sources that the D/O will encounter include:", "pg": "324", "o": ["a fire hydrant and a swimming pool.", "a fire hydrant and a natural water source.", "a fire hydrant and a relay supply from another pumper.", "a natural water source and a relay supply from another pumper."], "a": 2}, {"n": 25, "p": "D/O should maintain a residual pressure of at least _____ on their master intake gauge during pumping operations that utilize positive pressure hydrants.", "pg": "325", "o": ["20 psi (140 kPa)", "30 psi (210 kPa)", "40 psi (280 kPa)", "50 psi (350 kPa)"], "a": 0}, {"n": 26, "p": "What is a reason the closest hydrant to the fire may NOT be the best choice?", "pg": "326", "o": ["It may be a safety hazard for personnel and apparatus", "The closest water source should always be used to protect fire apparatus", "Hydrant must be 300 feet from fire building to prevent potential contamination", "Water flow close to a sprinklered building is being used primarily for fire protection"], "a": 0}, {"n": 27, "p": "Dead end mains are served by:", "pg": "326", "o": ["larger main from one direction.", "smaller mains from one direction.", "larger mains from multiple directions.", "smaller mains from multiple directions."], "a": 1}, {"n": 28, "p": "A common practice for hydrant placement is dictated by:", "pg": "326", "o": ["local civil engineering policies.", "the type and model of a hydrant.", "the hydrant metal characteristics.", "hydrant manufacturer's requirements."], "a": 0}, {"n": 29, "p": "A common practice is to place hydrants about every _____ in residential areas.", "pg": "326", "o": ["500 feet (150 m)", "750 feet (230 m)", "1,000 feet (305 m)", "1,250 feet (380 m)"], "a": 0}, {"n": 30, "p": "A common practice is to place hydrants about every _____ in high-value commercial and industrial areas.", "pg": "326", "o": ["300 feet (90 m)", "400 feet (120 m)", "500 feet (150 m)", "600 feet (180 m)"], "a": 0}, {"n": 31, "p": "What should personnel do before connecting the intake hose to the hydrant?", "pg": "327", "o": ["Warm up the pump", "Wait for authorization from the D/O", "Briefly open the hydrant to flush debris", "Using a pitot tube, measure immediately"], "a": 2}, {"n": 32, "p": "Failure or reduction in the water supply or pressure from hydrants can result from:", "pg": "327", "o": ["its model or type.", "damaged pump systems.", "greater pressure than needed.", "pipes or hydrants that are frozen."], "a": 3}, {"n": 33, "p": "Hydrant specifications require a 5 inch (125 mm) valve opening for standard three-way hydrants and a _____ connection to the water main.", "pg": "328", "o": ["2 inch (50 mm)", "4 inch (100 mm)", "6 inch (150 mm)", "8 inch (200 mm)"], "a": 2}, {"n": 34, "p": "Dry-barrel hydrants are designed to work in climates with:", "pg": "328", "o": ["tropical temperatures.", "freezing temperatures.", "possibility of hurricanes.", "high possibility of earthquakes."], "a": 1}, {"n": 35, "p": "Wet-barrel hydrants hold water in the barrel of the hydrant:", "pg": "328", "o": ["at all times.", "while in use.", "during high-occupancy environments.", "when a key is turned opening the hydrant."], "a": 0}, {"n": 36, "p": "Wet-barrel hydrants work best in climates:", "pg": "328", "o": ["with humid temperatures.", "with freezing temperatures.", "with frost lines below 4 ft (1.2 m).", "without prolonged periods of subfreezing weather."], "a": 3}, {"n": 37, "p": "What do hydrant wrenches primarily do?", "pg": "330", "o": ["Open and close fire hydrant drainage line", "Apply heavy-duty force to hose connections", "Remove discharge caps from fire hydrant outlets and open fire hydrant valves", "Boost the pressure in the original supply line without interrupting flow in the line"], "a": 2}, {"n": 38, "p": "What type of valve controls the flow of a hydrant by turning a screw-type handle that lowers the baffle into the path of the water?", "pg": "330", "o": ["Ball valves", "Gate valves", "Hose clamps", "Check valves"], "a": 1}, {"n": 39, "p": "What allows additional hoselines to be connected to the hydrant?", "pg": "330", "o": ["Gate valves", "Hose clamps", "Hydrant valves", "Straight-line nozzles"], "a": 2}, {"n": 40, "p": "According to NFPA standards, personnel should inspect and operate fire hydrants at least _____ to verify reliable function and address needed repairs.", "pg": "331", "o": ["monthly", "semi-annually", "annually", "every 5 years"], "a": 2}, {"n": 41, "p": "One reason a D/O must learn how to operate fire hydrants is to:", "pg": "331", "o": ["perform periodic inspections.", "be able to operate in the dark.", "utilize positive pressure hydrants.", "maintain a buffer zone of the fireground."], "a": 0}, {"n": 42, "p": "To prevent damage to equipment and injury to firefighters, all hydrants must be opened and closed:", "pg": "331", "o": ["slowly.", "quickly.", "immediately.", "by multiple firefighters."], "a": 0}, {"n": 43, "p": "Closing a hydrant _____ may cause a surge in pressure (water hammer) within the water supply system.", "pg": "331", "o": ["too fast", "too slow", "before the pump is on", "after depleting the tank"], "a": 0}, {"n": 44, "p": "Connecting a pumper to a fire hydrant using a _____ intake hose requires coordination and teamwork.", "pg": "332", "o": ["soft", "hard", "long section of", "short section of"], "a": 1}, {"n": 45, "p": "As good practice when positioning an apparatus, the D/O should stop the apparatus with the intake of choice _____ of the hydrant outlet.", "pg": "332", "o": ["at the rear", "just in front", "completely past", "on the opposite side"], "a": 1}, {"n": 46, "p": "What procedure consists of stopping the apparatus at the hydrant dropping the end of one or more supply hoselines at the hydrant, and then proceeding to the fire location?", "pg": "333", "o": ["Split lay", "Reverse lay", "Forward lay", "Combination lay"], "a": 2}, {"n": 47, "p": "If a pumper runs out of hose before reaching the fire scene:", "pg": "333", "o": ["set up a portable tank and then call for additional units.", "the pumper must be relocated and start a new hose set up.", "set the pumper where the hose ran out and set a new hose layout.", "more hose may be brought in, or a relay pumping operation may be set up."], "a": 3}, {"n": 48, "p": "Hose is laid from the fire to the water source in which type of hose lay?", "pg": "334", "o": ["Split lay", "Reverse lay", "Forward lay", "Combination lay"], "a": 1}, {"n": 49, "p": "What type of hose lay is the most direct method of supplementing hydrant pressure or performing drafting operations?", "pg": "334", "o": ["Split lay", "Reverse lay", "Forward lay", "Combination lay"], "a": 1}, {"n": 50, "p": "A common two-pumper operation in a reverse lay provides for a water supply pumper and a(n):", "pg": "336", "o": ["extra pumper.", "attack pumper.", "ladder/pumper.", "tender/pumper."], "a": 1}, {"n": 51, "p": "Which refers to ways to lay multiple supply hose with a single engine?", "pg": "337", "o": ["Split lay", "Reverse lay", "Forward lay", "Combination lay"], "a": 3}, {"n": 52, "p": "Supply hose must be loaded into two separate hose bed compartments in order to make a:", "pg": "337", "o": ["split lay.", "reverse lay.", "forward lay.", "combination lay."], "a": 3}, {"n": 53, "p": "Hoses with _____ may be laid in either direction without adapters.", "pg": "337", "o": ["male adapters", "female adapters", "threaded couplings", "nonthreaded couplings"], "a": 3}, {"n": 54, "p": "When the pump and water pressure stabilize with no water flowing, the D/O should note the _____ pressure reading before they begin to pump.", "pg": "337", "o": ["static", "residual", "dynamic", "atmospheric"], "a": 0}, {"n": 55, "p": "When the pumper is discharging water, the intake gauge displays the:", "pg": "337", "o": ["low pressure.", "static pressure.", "residual pressure.", "atmospheric pressure."], "a": 2}, {"n": 56, "p": "The difference between static pressure and _____ helps determine how much more water the hydrant can supply.", "pg": "337", "o": ["low pressure", "static pressure", "residual pressure", "atmospheric pressure"], "a": 2}, {"n": 57, "p": "The D/O needs to know the static pressure of the water system from preplanning documents or from experience to use the:", "pg": "339", "o": ["friction loss data.", "first-digit method.", "atmospheric pressure-loss.", "squaring-the-lines method."], "a": 3}]}, {"ch": 10, "title": "Pump Operations from Static Water Supply", "qs": [{"n": 1, "p": "When a fire apparatus drafts from a source, the source may be classified as _____ if it is not connected to a pressurized water piping system.", "pg": "359", "o": ["static", "mobile", "primary", "secondary"], "a": 0}, {"n": 2, "p": "The difference in elevation between the surface of the static water supply and center of the pump intake is referred to as:", "pg": "360", "o": ["lift.", "gravity.", "pressure.", "cavitation."], "a": 0}, {"n": 3, "p": "To begin drafting operations, most of the air inside the pump evacuates, creating a:", "pg": "360", "o": ["maximum lift.", "dependable lift.", "perfect vacuum.", "pressure differential."], "a": 3}, {"n": 4, "p": "When moving water, pumps must develop a vacuum capacity of:", "pg": "360", "o": ["11 in Hg (-37kPa).", "22 in Hg (-75kPa).", "33 in Hg (-112 kPa).", "44 in Hg (-150 kPa)."], "a": 1}, {"n": 5, "p": "What type of suction hose is translucent, allowing the operator to see the water inside and any air leaks?", "pg": "360", "o": ["Kevlar", "Leather", "Traditional, rubber", "Flexible, PVC-constructed"], "a": 3}, {"n": 6, "p": "Generally speaking, apparatus in good repair can draft water to a height of approximately:", "pg": "361", "o": ["10 feet (3 m).", "20 feet (6 m).", "30 feet (9 m).", "40 feet (12 m)."], "a": 1}, {"n": 7, "p": "Pumpers cannot be expected to draft water that sits _____ below the level of the pump at sea level.", "pg": "361", "o": ["9.8 feet (3 m)", "19.6 feet (6 m)", "33.8 feet (10 m)", "39.4 feet (12 m)"], "a": 2}, {"n": 8, "p": "Which of the following means the greatest height to which any amount of water may be raised through an intake hose to the pump?", "pg": "361", "o": ["Maximum lift", "Theoretical lift", "Operational lift", "Dependable lift"], "a": 0}, {"n": 9, "p": "In most circumstances, maximum lift reaches about:", "pg": "361", "o": ["15 feet (4.5 m).", "20 feet (6 m).", "25 feet (7.5 m).", "30 feet (9 m)."], "a": 2}, {"n": 10, "p": "Which of the following refers to the height of a column of water being lifted to provide a reliable fire flow?", "pg": "362", "o": ["Maximum lift", "Theoretical lift", "Operational lift", "Dependable lift"], "a": 3}, {"n": 11, "p": "After 25 feet (7.5 m) of dependable lift, maximum suction capacity is so challenged, and the loss is so great, that the resulting expected capacity is:", "pg": "362", "o": ["only about 60 percent.", "only about 70 percent.", "too low to be considered for drafting.", "too high to be considered for drafting."], "a": 2}, {"n": 12, "p": "What two things must first be considered when evaluating a potential water supply source?", "pg": "364", "o": ["Cost and adequacy", "Cost and accessibility", "Adequacy and adaptability", "Adequacy and accessibility"], "a": 3}, {"n": 13, "p": "Some natural water sources provide _____, which allow a pumper to draft without the complications of putting hard suction hoses directly into the source.", "pg": "364", "o": ["dry hydrants", "wet hydrants", "storage tanks", "permanent supply hoses"], "a": 0}, {"n": 14, "p": "What is a major factor in determining t
