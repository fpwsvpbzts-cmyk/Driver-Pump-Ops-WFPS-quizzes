"n": 14, "p": "What cleaning tool can grind grit into the glass surface when cleaning or drying the apparatus windshield?", "pg": "20", "o": ["Microfiber rag", "Silk window rag", "Cotton fiber cloth", "Dry towels or rags"], "a": 3}, {"n": 15, "p": "Vehicle batteries must be cleaned by washing them with a solution of:", "pg": "23", "o": ["acetic acid and soda.", "baking soda and water.", "caustic soda and water.", "baking powder and vinegar."], "a": 1}, {"n": 16, "p": "Because apparatus batteries can give off hydrogen gas, what preventative measure should be taken when servicing them?", "pg": "23", "o": ["Ventilate the area", "Use a water mist to dilute gas", "Keep room below 60°F (15.5°C)", "Attach a grounding strap to a terminal"], "a": 0}, {"n": 17, "p": "The apparatus transmission fluid level check should be conducted:", "pg": "24", "o": ["while the engine is running.", "after the engine has been run.", "before the engine has been run.", "before and after the engine is run."], "a": 0}, {"n": 18, "p": "When checking the oil level on an apparatus, make sure that the vehicle:", "pg": "24", "o": ["is on a level surface.", "is sitting on an incline.", "has the engine running.", "vehicle is on soft terrain."], "a": 0}, {"n": 19, "p": "To avoid an excessive load on batteries during the starting procedure, ensure that:", "pg": "25", "o": ["all electric equipment is unplugged.", "half of the electric equipment is turned OFF.", "all electrical switches are in the ON position.", "all electrical switches are in the OFF position."], "a": 3}, {"n": 20, "p": "To perform the prove-out (self-check) stage on apparatus, the D/O must:", "pg": "25", "o": ["keep the ignition and engine turned off.", "turn the ignition on and start the engine.", "turn the ignition off and release the brakes.", "turn the ignition on, but do not start the engine."], "a": 3}, {"n": 21, "p": "Which warning light illuminates when the onboard diagnostics system detects an emissions control system malfunction?", "pg": "26", "o": ["Amber Warning Lamp", "Malfunction Indicator Lamp (MIL)", "Diesel Particulate Filter Light (DPF)", "HEST Light (High Exhaust System Temperature)"], "a": 1}, {"n": 22, "p": "Which device indicates the amount of current flowing to or from the batteries?", "pg": "26", "o": ["Ammeter", "Voltmeter", "DPF indicator", "DEF indicator"], "a": 0}, {"n": 23, "p": "Most commercial and private vehicles built since 1990 are equipped with _____ systems.", "pg": "27", "o": ["anti-freezing", "anti-lock braking", "hydraulic braking", "automatic fog lamp"], "a": 1}, {"n": 24, "p": "What assists the D/O to keep the apparatus in a straight trajectory during heavy or emergency braking?", "pg": "28", "o": ["Hydraulic brakes", "Vehicle tilt switch", "Anti-lock braking system", "Automatic slack adjusters"], "a": 2}, {"n": 25, "p": "Apparatus brakes should be thoroughly tested using the methods outlined by:", "pg": "28", "o": ["NFPA 1910.", "NFPA 1002.", "a trusted apparatus mechanic.", "CDL Endorsements & Restrictions."], "a": 0}, {"n": 26, "p": "What is the function of a Selective Catalyst Reductant (SCR)?", "pg": "29", "o": ["Increases the output of the HEST filter", "Assists a braking system to avoid sliding", "Increases nitrogen oxide (NOx) emissions", "Uses DEF to help further reduce emissions"], "a": 3}, {"n": 27, "p": "What adjustment should a D/O perform during the test and maintenance of a manual shift transmission but not with an automatic transmission?", "pg": "30", "o": ["The brake pedal", "The clutch pedal", "The accelerator pedal", "The gear shift lever knob"], "a": 1}, {"n": 28, "p": "The distance that a vehicle clutch pedal must be pushed before the throw-out bearing actually contacts the clutch release fingers is known as:", "pg": "30", "o": ["free play.", "tolerance.", "safety distance.", "clutch release distance."], "a": 0}, {"n": 29, "p": "Steering wheel play should be no more than _____ degrees in either direction.", "pg": "30", "o": ["5", "10", "15", "20"], "a": 1}, {"n": 30, "p": "During an exterior inspection, when the apparatus is parked and engine running, the D/O must ensure that the _____ according to manufacturer recommendations.", "pg": "30", "o": ["engine runs", "pump engages", "wheels are chocked", "rear wheels are free to move"], "a": 2}, {"n": 31, "p": "Who establishes the standard operating procedure (SOP) a D/O should follow if they find a deficiency during a vehicle or operating check?", "pg": "31", "o": ["The D/O assigned to that apparatus", "The authority having jurisdiction (AHJ)", "The municipality that purchases the vehicles", "The D/O or firefighter that is in charge of inspections"], "a": 1}, {"n": 32, "p": "NFPA 1910 mandates tire tread depth limitations of no less than _____ on any non-steering axle at any two adjacent major tread grooves.", "pg": "32", "o": ["2/32 inches (1.6 mm) on any steering axle or 4/32 inches (3.2 mm)", "4/32 inches (3.2 mm) on any steering axle or 2/32 inches (1.6 mm)", "5/32 inches (4 mm) on any steering axle or 2/32 inches (2.3 mm)", "6/32 inches (4.7 mm) on any steering axle or 4/32 inches (3.2 mm)"], "a": 1}, {"n": 33, "p": "The maximum recommended tire pressure is imprinted on the exterior of the tires; however, the tires' actual pressure specification is up to the:", "pg": "32", "o": ["AHJ to determine from actual axle weight.", "D/O to determine from actual axle weight.", "AHJ to determine from estimated axle weight.", "D/O to determine from estimated axle weight."], "a": 0}, {"n": 34, "p": "Where is the apparatus tire size listed?", "pg": "33", "o": ["Gross Axle Weight Ratings (GAWRs) sticker near the driver’s position", "Gross Vehicle Weight Rating (GVWR) sticker near the driver’s position", "Gross Axle Weight Ratings (GAWRs) booklet in the glove compartment", "Gross Vehicle Weight Rating (GVWR) booklet in the glove compartment"], "a": 1}, {"n": 35, "p": "According to NFPA 1910, tires have a maximum age of _____ years.", "pg": "33", "o": ["two", "three", "five", "seven"], "a": 3}, {"n": 36, "p": "The maximum weight at which a vehicle can be safely operated on roadways in ideal conditions is known as:", "pg": "33", "o": ["Net Vehicle Weight Rating.", "Gross Axle Weight Ratings.", "Curb Weight Vehicle Rating.", "Gross Vehicle Weight Rating."], "a": 3}, {"n": 37, "p": "What is the curb weight of the apparatus?", "pg": "33", "o": ["The maximum weight for each axle on the apparatus with the load applied", "The weight of a fire apparatus fresh off the assembly line with tools, water, and equipment", "The maximum weight at which a vehicle can be safely operated on roadways in ideal conditions", "The weight of an empty fire apparatus fresh off the assembly line with no tools, water, equipment, or passengers"], "a": 3}, {"n": 38, "p": "Fire apparatus equipped with electric power generators may be powered by separate engines with or without their own fuel tank, or by:", "pg": "34", "o": ["480 volt AC pump controllers.", "hydraulic power take-off systems.", "an independent setup transformer.", "scene lighting power distribution equipment."], "a": 1}, {"n": 39, "p": "Fire apparatus files for inspections, maintenance requests, preventive maintenance, repairs, and testing results must be kept for:", "pg": "36", "o": ["5 years.", "10 years.", "20 years.", "the life of the vehicle."], "a": 3}, {"n": 40, "p": "In the event of a lawsuit involving a fire apparatus accident, it is possible that:", "pg": "36", "o": ["daily/weekly check records may be solicited for audit review.", "driver operator personal records may be solicited for court review.", "maintenance and inspection records will not be subpoenaed for court review.", "apparatus checks, maintenance, and inspection records may be subpoenaed for court review."], "a": 3}, {"n": 41, "p": "Proper documentation of recurrent repairs of fire apparatus can assist in deciding:", "pg": "36", "o": ["which new model of apparatus should be purchased.", "how much equipment can be added to the GVWR of the vehicle.", "how much equipment should be removed due to the GAWR of the vehicle.", "whether to purchase new apparatus instead of continued repairs on an older unit."], "a": 3}]}, {"ch": 2, "title": "Apparatus Safety and Driving Emergency Vehicles", "qs": [{"n": 1, "p": "Why is it important for D/Os to possess mathematical skills?", "pg": "54", "o": ["For developing maps and to dispatch instructions", "For deploying hard sleeve hose for drafting operations", "To complete preventative maintenance forms and repair requests", "To solve mathematical equations, such as friction loss calculations"], "a": 3}, {"n": 2, "p": "When pursuing D/O certification, a candidate must first fulfill the:", "pg": "55", "o": ["driver’s life insurance requirements.", "driver’s FBI background check requirements.", "driver’s passport requirements for their country, state/province.", "local driver's licensing requirements and the AHJ requirements of the D/O position."], "a": 3}, {"n": 3, "p": "To be designated a D/O, qualified candidates may need to:", "pg": "56", "o": ["be a new hire.", "pass written and practical testing.", "complete a probationary period as a co-pilot on an apparatus.", "successfully serve as an acting firefighter until official designation."], "a": 1}, {"n": 4, "p": "In which situation would an emergency vehicle be exempt from driving regulations such as speed limits or direction of travel?", "pg": "56", "o": ["Driving apparatus on public roads for the purpose of road testing", "Response to an emergency with active audible and visible warning devices", "Operation of apparatus to verify the functionality of components or systems", "Response to a community event with inactive audible and visible warning devices"], "a": 1}, {"n": 5, "p": "In most jurisdictions when a school bus has its red lights flashing, a fire department apparatus D/O must:", "pg": "57", "o": ["proceed and continue watching for pedestrians unaware of the apparatus.", "stop and continue slowly, watching for children unaware of the apparatus.", "stop and proceed only after the bus driver or a police officer gives a safe-to-proceed signal.", "proceed and continue at the same speed regardless of signals from the bus driver or police officers."], "a": 2}, {"n": 6, "p": "The driver and the officers in charge may be found guilty of criminal gross negligence and recklessness if a D/O:", "pg": "57", "o": ["operates the apparatus while under the influence of alcohol.", "practices defensive driving techniques while operating the apparatus.", "yields to emergency vehicles and resources during an emergency response.", "drives the apparatus above the speed limit during a nonemergency response."], "a": 0}, {"n": 7, "p": "Traffic control devices on roadways and at intersections:", "pg": "57", "o": ["allow D/Os to move faster than the flow of traffic.", "do not apply to D/Os during emergency situations.", "do not relieve the D/O from using defensive driving techniques.", "should be switched to red so that traffic stops and gives the apparatus right-of-way."], "a": 2}, {"n": 8, "p": "Some of the most common causes of D/O injuries are _____ when entering and exiting the apparatus.", "pg": "58", "o": ["slips and falls", "cuts from rungs", "crushed hands and feet", "sprains and broken bones"], "a": 0}, {"n": 9, "p": "If a D/O dismounts on the side of the apparatus exposed to traffic, they must:", "pg": "58", "o": ["use at least two spotters to tell them when it is safe to exit the apparatus.", "watch for oncoming vehicles and wait for traffic to completely stop before exiting.", "reposition the apparatus so they will be able to dismount on the side not exposed to traffic.", "watch for oncoming vehicles before opening their door, and wait for a break in traffic before exiting."], "a": 3}, {"n": 10, "p": "NFPA 1550 mandates that persons riding in an enclosed apparatus cab with seat-back protections should:", "pg": "59", "o": ["NOT wear helmets.", "wear helmets at all times.", "NOT wear helmets when the apparatus is parked.", "only wear helmets when the apparatus is in motion."], "a": 0}, {"n": 11, "p": "Firefighters riding in an apparatus must don helmets when:", "pg": "59", "o": ["responding in an open cab and open tiller.", "responding in an apparatus without seatbelts.", "taking part in an informal post-incident analysis.", "inside a closed cab with provided neck and head protection."], "a": 0}, {"n": 12, "p": "Which of the following practices is prohibited for riders in a fire apparatus before it begins to move?", "pg": "59", "o": ["Reviewing incident information", "Checking radio communications", "Preparing personal protective equipment", "Remaining unsecured without a seat belt"], "a": 3}, {"n": 13, "p": "Which situation is an exception to the required seat belt usage rule found in NFPA 1550?", "pg": "61", "o": ["The crew is wearing full personal protective equipment (PPE)", "Firefighters are providing needed medical care inside the apparatus cab", "Firefighters are responding to an incident in an apparatus with an open tiller", "The crew is carrying tools and equipment to an life-threatening emergency scene"], "a": 1}, {"n": 14, "p": "How many crewmembers should be assigned as safety observers during a hose-loading operation?", "pg": "62", "o": ["One", "Two", "Three", "Four"], "a": 0}, {"n": 15, "p": "What is one requirement mentioned by NFPA 1550 for performing hose-loading operations?", "pg": "62", "o": ["All crew members must be trained on how to perform CPR", "The D/O must drive the apparatus backward during the operation", "The apparatus should never drive backward at a speed greater than 10 mph (16 km/h)", "The safety observer should have visual and voice communication with the D/O loading the hose"], "a": 3}, {"n": 16, "p": "A D/O should drive the apparatus at a speed no greater than 5 mph (10 km/h) during _____ operations.", "pg": "62", "o": ["roll-over", "hose-loading", "defensive driving", "roll stability control"], "a": 1}, {"n": 17, "p": "When firefighters on board an apparatus encounter noise levels greater than 90 decibels (dB), they must:", "pg": "62", "o": ["use hearing protection that is approved by their jurisdiction.", "lower the volume of all active audible warning devices on the apparatus.", "inform all firefighters on board to put on their helmets to muffle the noise.", "select hearing protection for each firefighter based on its availability and price."], "a": 0}, {"n": 18, "p": "What should the D/O do to maintain situational awareness during a roadway incident?", "pg": "64", "o": ["Have rested at least 4 hours", "Wear a well-broke-in uniform", "Wear a high-visibility garment", "Have radios on maximum volume"], "a": 2}, {"n": 19, "p": "Which direction should emergency personnel walk in relation to oncoming traffic at a roadway incident?", "pg": "64", "o": ["Walk with traffic flow", "Walk parallel to traffic", "Walk facing oncoming traffic", "Walk with your back to traffic"], "a": 2}, {"n": 20, "p": "Which traffic control zone includes areas up and downstream from the incident buffer space where emergency vehicles can position?", "pg": "65", "o": ["Activity areas", "Transition areas", "Termination zone", "Advance warning zone"], "a": 0}, {"n": 21, "p": "Where can traffic downstream from the incident merge and return to normal flow/lanes in a traffic control zone?", "pg": "65", "o": ["Activity Area", "Transition Area", "Termination Zone", "Advance Warning Area"], "a": 2}, {"n": 22, "p": "What should the D/O utilize to mount the apparatus?", "pg": "66", "o": ["Seat belt", "Steering wheel", "Apparatus door handle", "Appropriate grab handles"], "a": 3}, {"n": 23, "p": "After a D/O locates the apparatus’ battery switch and turns it on, they should _____ to begin the prove-out process.", "pg": "66", "o": ["engage the DEF", "activate the ignition", "secure their seat belt", "disconnect non-auto-eject lines"], "a": 1}, {"n": 24, "p": "What should the driver/operator (D/O) do after securing their seatbelt?", "pg": "67", "o": ["Open the door", "Start the engine", "Check the parking brake", "Adjust the mirrors and steering wheel"], "a": 3}, {"n": 25, "p": "Before engaging the ignition and starting the apparatus, ensure that the parking brake is applied and the apparatus is in the _____ position.", "pg": "67", "o": ["park", "drive", "neutral", "reverse"], "a": 2}, {"n": 26, "p": "The process that reduces engine torque output or limits the vehicle speed is called:", "pg": "67", "o": ["derating.", "regeneration.", "speed control.", "reacceleration."], "a": 0}, {"n": 27, "p": "Apparatus engines manufactured in and after 2007 often come equipped with a diesel particulate filter (DPF) that traps diesel particulate matter and:", "pg": "67", "o": ["prevents its release into the atmosphere.", "regenerates it back into the diesel engine.", "reduces the emission of nitrogen oxide.", "reduces the emission of water vapor."], "a": 3}, {"n": 28, "p": "An illuminated diesel particulate filter (DPF) light on an apparatus dashboard informs the D/O that the engine requires a(an):", "pg": "68", "o": ["complete scan.", "complete manual regeneration.", "immediate active (automatic) derating.", "replacement selective catalytic reductant."], "a": 1}, {"n": 29, "p": "An apparatus equipped with Selective Catalyst Reductant (SCR) will have a tank with a light blue cap that must be filled with:", "pg": "69", "o": ["water.", "fuel oil.", "diesel starting fluid (DSF).", "diesel exhaust fluid (DEF)."], "a": 3}, {"n": 30, "p": "Keeping the _____ topped off reduces crystal formation which can impair engine performance.", "pg": "69", "o": ["engine fuel tank", "diesel exhaust fluid (DEF)", "select catalyst reductant (SCR)", "diesel particulate filtration (DPF)"], "a": 1}, {"n": 31, "p": "Shutting down an engine without a sufficient cooldown may result in:", "pg": "70", "o": ["damage to exhaust system filters.", "water film “boiling” on hot surfaces.", "damage to the turbocharger that can result in engine seizure.", "immediate decrease of engine temperature from constant coolant circulation."], "a": 2}, {"n": 32, "p": "What is a recommended general rule for backing fire apparatus?", "pg": "70", "o": ["Identify any obstructions in front of the apparatus", "If possible, position the apparatus so that backing will not be necessary", "Back the apparatus as quickly as possible to avoid outpacing the spotter", "If possible, turn off radios to facilitate verbal communication with spotters"], "a": 1}, {"n": 33, "p": "Backing a fire apparatus can be a hazardous action because of the:", "pg": "70", "o": ["vehicle’s size.", "news media on the scene.", "number of personnel on the scene.", "number of lights illuminating the scene."], "a": 0}, {"n": 34, "p": "To safely back up a fire apparatus, the driver/operator should use all means of observation at their disposal, including scanning between their direct field of vision, video screens and:", "pg": "71", "o": ["spotters.", "scene lights.", "radio communications.", "standard operating procedures."], "a": 0}, {"n": 35, "p": "Where should the spotter be positioned while backing the fire apparatus?", "pg": "71", "o": ["On the driver’s side no matter terrain conditions", "On the driver’s side unless not allowed by the terrain", "At the front of the apparatus where the D/O can easily see the spotter", "At the rear of the apparatus where the D/O can see the spotter through the camera"], "a": 1}, {"n": 36, "p": "If the D/O loses sight of the spotter or feels unsafe while backing the apparatus, the D/O should stop, set the parking brake, and:", "pg": "71", "o": ["rev the engine and turn on audible and visual warning devices.", "stay in the apparatus and contact dispatch using the apparatus radio.", "get out of the apparatus to check that everyone understands the plan.", "look for the spotters using the rear camera to ensure they are still there."], "a": 2}, {"n": 37, "p": "If conditions allow, where should the spotter be standing when a driver/operator is backing up an apparatus?", "pg": "71", "o": ["Wherever the D/O directs the spotter to stand", "In front of the apparatus where the D/O can clearly see the spotter", "Behind and slightly to the outside of the apparatus on the left (driver's) side", "Behind and slightly to the outside of the apparatus on the right (passenger's) side"], "a": 2}, {"n": 38, "p": "Backing spotters must be prepared to simultaneously stop the apparatus as well as oncoming vehicles or:", "pg": "72", "o": ["pedestrians.", "new media vehicles.", "emergency vehicles.", "other fire apparatus."], "a": 0}, {"n": 39, "p": "Which of the six hand signals used to maintain clear communication indicates that the apparatus should back straight?", "pg": "72", "o": ["Both forearms crossed into a large X", "Back and forth motion with both arms outward and bent at the elbows", "Right arm pointed towards the right with the right palm facing the driver", "Both arms outstretched with palms facing down and motioning back and forth"], "a": 1}, {"n": 40, "p": "An angle of departure is formed by level ground and a line from the point where the rear tires touch the ground to the lowest projection at the _____ of the apparatus.", "pg": "75", "o": ["rear", "right", "front", "bottom"], "a": 0}, {"n": 41, "p": "Which point of potential contact is formed by level ground and a line from the point where the front and rear tires touch the ground to the bottom of the frame at the wheelbase midpoint?", "pg": "75", "o": ["Right angle", "Breakover angle", "Angle of approach", "Angle of departure"], "a": 1}, {"n": 42, "p": "Generally, as the apparatus' wheelbase shrinks,:", "pg": "75", "o": ["stability is gained.", "maneuverability is lost.", "stability is lost but maneuverability is gained.", "maneuverability is lost but stability is gained."], "a": 2}, {"n": 43, "p": "The angle formed by level ground and a line from the point where the front and rear tires touch the ground to the bottom of the frame at the wheelbase midpoint is known as:", "pg": "75", "o": ["tail swing.", "breakover angle.", "angle of approach.", "angle of departure."], "a": 1}, {"n": 44, "p": "When turning and stabilizing emergency vehicles, such as an aerial apparatus, D/Os must be aware of the vehicle’s:", "pg": "76", "o": ["overload and weight.", "tail swing and weight.", "central vision and speed.", "center of gravity and speed."], "a": 3}, {"n": 45, "p": "The arc created by the distance between the vehicle’s rear when turning is known as:", "pg": "76", "o": ["tail swing.", "breakover angle.", "angle of approach.", "angle of departure."], "a": 0}, {"n": 46, "p": "What can a D/O do to keep apparatus weight transfer to a minimum?", "pg": "76", "o": ["Use variable speeds during a response", "Use inappropriate speeds during a response", "Steer the apparatus in a smooth, fluid motion", "Steer the apparatus with a series of multiple turns"], "a": 2}, {"n": 47, "p": "Whenever a vehicle undergoes a change in speed or direction, the vehicle's weight transfers relative to the:", "pg": "76", "o": ["wheelbase.", "apparatus dimensions.", "weight of the apparatus.", "rate and degree of change."], "a": 3}, {"n": 48, "p": "Onboard water tanks are best for the traction of the vehicle when it is:", "pg": "77", "o": ["empty.", "½ full.", "¾ full.", "full."], "a": 3}, {"n": 49, "p": "D/Os need to know the gross vehicle weight rating (GVWR) of the apparatus they operate to know:", "pg": "77", "o": ["the baffling specifications for the onboard water tanks.", "the quality of pavement that roads and bridges must have.", "which roads and bridges the apparatus can safely traverse.", "the maximum weight of the driver operator who will drive the fire apparatus."], "a": 2}, {"n": 50, "p": "A D/O who is practicing defensive driving continually evaluates upcoming road conditions for hazards and:", "pg": "77", "o": ["adjusts to these conditions and traffic.", "uses panoramic vision to assess hazards.", "rides at inappropriate speeds to control hazards.", "turns on lights and sirens until the hazard is clear."], "a": 0}, {"n": 51, "p": "Which condition poses a particular concern for liquid surge when driving a fire apparatus?", "pg": "77", "o": ["Empty tanks", "Properly baffled full tanks", "Tanks fully filled with foam concentrate", "Improperly baffled or partially filled tanks"], "a": 3}, {"n": 52, "p": "What is the primary purpose of baffles in fire apparatus water tanks?", "pg": "77", "o": ["To reduce vehicle weight", "To increase water capacity", "To improve water flow during pumping and drafting operations", "To limit lateral and front-to-back forces affecting vehicle handling"], "a": 3}, {"n": 53, "p": "What is a defensive driving tactic?", "pg": "78", "o": ["Reducing speeds in inclement weather", "Increasing speeds when it is not raining", "Driving with the understanding that other drivers may choose to take safe actions at all times", "Continually evaluating traffic conditions to adjust apparatus speed and get to the scene faster"], "a": 0}, {"n": 54, "p": "Engine lugging can occur if the driver:", "pg": "78", "o": ["activates auxiliary brakes too soon to move downhill.", "operates the engine at a very high RPM, beyond its safe operating limit.", "downshifts too late when a vehicle needs a lower gear to move up a steep grade.", "downshifts too late when a vehicle needs a lower gear to move on horizontal terrain."], "a": 2}, {"n": 55, "p": "NFPA 1900 requires every apparatus to have _____ that lists vehicle height and weight to emphasize the importance of watching for bridge and overpass limits.", "pg": "79", "o": ["an original bill of sale", "a placard in the vehicle", "specifications filed with the AHJ", "manufacturer's specifications on every tire"], "a": 1}, {"n": 56, "p": "What should the D/O do before crossing railroad tracks?", "pg": "79", "o": ["Slow the apparatus and look both ways", "Check by satellite if a train is about to pass", "Pass over the railroad track as quickly as possible", "Stop, set the parking brake, and get out of the apparatus"], "a": 0}, {"n": 57, "p": "It may take three to fifteen times greater distance for a vehicle to come to a complete stop on:", "pg": "80", "o": ["dry pavement.", "new pavement.", "deteriorated pavement.", "snow and icy pavement."], "a": 3}, {"n": 58, "p": "What is the most likely place for a collision to occur involving an emergency vehicle?", "pg": "80", "o": ["Highways", "Rural roads", "Intersections", "Heavy trafficked streets"], "a": 2}, {"n": 59, "p": "When coming to an intersection, many jurisdictions and NFPA 1550 require the D/O of an apparatus to:", "pg": "80", "o": ["slow to 5 mph (10 km/h).", "coast through the intersection.", "come to a full stop before proceeding.", "come to a half-stop before proceeding."], "a": 2}, {"n": 60, "p": "When driving the apparatus into an opposing lane of traffic through an intersection, the apparatus must proceed:", "pg": "80", "o": ["as fast as possible.", "at a greatly reduced speed.", "and turn off all emergency lights.", "using a spotter to control oncoming traffic."], "a": 1}, {"n": 61, "p": "What hazard should a D/O be particularly aware of when operating the apparatus at night?", "pg": "81", "o": ["Mechanical failure", "Poor vehicle design", "Distracting roadway advertisements", "Reflection caused by snow, fog, or rain"], "a": 3}, {"n": 62, "p": "The main goal of the Crew Resource Management (CRM) Model is to reduce line-of-duty-deaths (LLODs) by requiring that all crew members maintain:", "pg": "86", "o": ["reckless disregard.", "situational awareness.", "ambiguity in communication.", "overconfidence in their abilities."], "a": 1}, {"n": 63, "p": "What is a factor that may lead to the loss of situational awareness when information received is confusing or unclear?", "pg": "86", "o": ["Fixation", "Ambiguity", "Distraction", "Unresolved discrepancy"], "a": 1}, {"n": 64, "p": "What is a factor that may lead to the loss of situational awareness when crew members become so fixated on one detail that they ignore everything else?", "pg": "87", "o": ["Overload", "Distraction", "Unresolved discrepancy", "Lack of comprehensive hazard surveillance"], "a": 3}, {"n": 65, "p": "What type of apparatus incident generally accounts for a significant percentage of all damage repair costs?", "pg": "88", "o": ["180 degree turning", "Backing the apparatus", "Highway traffic incidents", "Not yeilding at traffic lights"], "a": 1}, {"n": 66, "p": "What is a cause of D/O mental or physical impairment?", "pg": "88", "o": ["Complacency", "Substance abuse", "Improper backing", "Lack of experience"], "a": 1}, {"n": 67, "p": "If a D/O has sufficient visual lead time, their reaction time and knowledge of apparatus stopping distance limitations can prevent:", "pg": "91", "o": ["baffling.", "a collision.", "brake damage.", "waste of driving time."], "a": 1}, {"n": 68, "p": "What is the distance traveled between what the D/O visually sees and what is perceived as a reason to stop?", "pg": "91", "o": ["Braking distance", "Perception distance", "Total stopping distance", "Driver reaction distance"], "a": 1}, {"n": 69, "p": "What is the recommended following distance according to the 2-4-12 rule for speeds below 55 mph (88 km/h)?", "pg": "92", "o": ["One-second interval", "Two-second interval", "Four-second interval", "Twelve-second interval"], "a": 1}, {"n": 70, "p": "Why is a four-second interval recommended for speeds above 55 mph (88 km/h) according to the 2-4-12 rule?", "pg": "92", "o": ["Ensures a smoother driving experience", "Prevents other vehicles from overtaking the apparatus", "Reduces the risk of encountering potholes on the road", "Allows for increased stopping distances required by higher speeds"], "a": 3}, {"n": 71, "p": "Which type of surface provides the optimal stopping environment for an apparatus in motion?", "pg": "92", "o": ["Icy", "Wet", "Paved", "Unpaved"], "a": 2}, {"n": 72, "p": "What are the common causes of skidding?", "pg": "94", "o": ["Tires and brake conditions", "Apparatus model and design", "Acceleration and locked wheel", "Weight and dimensions of the apparatus"], "a": 2}, {"n": 73, "p": "To stop a skid in a vehicle equipped with an antilock braking system (ABS), the D/O should:", "pg": "95", "o": ["intermittently pump the brake pedal.", "pump the brake pedal until the vehicle stops.", "maintain a steady pressure on the brake pedal.", "release the brakes to allow the wheels to rotate freely."], "a": 2}, {"n": 74, "p": "NFPA 1900 requires that all apparatus with a GVWR of _____ or greater be equipped with an auxiliary braking system.", "pg": "95", "o": ["66,000 lb (29 937 kg)", "56,000 lb (25 401 kg)", "46,000 lb (20 865 kg)", "36,000 lb (18 000 kg)"], "a": 3}, {"n": 75, "p": "The amount of retardation force available from any auxiliary braking system on an apparatus is a complex function of vehicle speed, engine speed, temperature, and:", "pg": "96", "o": ["ambiguity.", "tire condition.", "cooling system.", "control strategy."], "a": 3}, {"n": 76, "p": "Which auxiliary traction control system improves overall traction on slippery roads by transferring engine torque to the wheels that still have traction?", "pg": "97", "o": ["Interaxle differential lock (IDL)", "Automatic traction control (ATC)", "Transmission output retarders (TOR)", "Driver controlled differential local (DCDL)"], "a": 1}, {"n": 77, "p": "What is the speed at which an emergency vehicle may begin to outrun the effective range of its audible warning device?", "pg": "100", "o": ["Above 50 mph (80 km/h)", "Above 55 mph (90 km/h)", "Above 65 mph (105 km/h)", "Above 75 mph (120 km/h)"], "a": 0}, {"n": 78, "p": "In addition to dimming headlights and spotlights at an incident scene, D/Os must be aware that warning lights and scene floodlights may reduce the effectiveness of the:", "pg": "100", "o": ["audible warning devices.", "stability and traction controls.", "reflective trim on firefighter PPE.", "strobe light activated preemption devices."], "a": 2}, {"n": 79, "p": "A microphone on the traffic signal that receives the sound of an oncoming siren and orders the appropriate control signal is known as a(an):", "pg": "102", "o": ["apparatus routing device.", "GPS-based radio transmitter.", "traffic signal preemption device.", "emergency mode municipal switch."], "a": 2}, {"n": 80, "p": "NFPA 1010 requires that prospective D/Os be able to perform practical driving exercises with each type of:", "pg": "103", "o": ["apparatus used in their jurisdiction.", "apparatus used in their department.", "apparatus they are expected to drive.", "similar apparatus they are expected to drive no matter the model."], "a": 2}]}, {"ch": 3, "title": "Positioning Pumping Apparatus", "qs": [{"n": 1, "p": "For all response situations, what must the D/O know prior to committing to a position?", "pg": "124", "o": ["Who owns the compromised facility", "To understand the scene conditions", "Location of the nearest medical facility", "How long the apparatus will be on scene"], "a": 1}, {"n": 2, "p": "The D/O of the first-arriving apparatus must observe conditions and determine the best apparatus position based on:", "pg": "124", "o": ["initial overhaul and salvage policy.", "initial attack strategy and department policy.", "rehabilitation and decontamination procedures.", "primary water supply available and secondary water sources for drafting."], "a": 1}, {"n": 3, "p": "If the first arriving apparatus is at an incident where no fire is evident, the D/O should:", "pg": "124", "o": ["pull the apparatus past the front of the structure.", "pull the apparatus halfway into an exit route position.", "position the apparatus in front of the nearest fire hydrant.", "position the apparatus at least one block away from the structure."], "a": 0}, {"n": 4, "p": "What will assist the D/O in making informed decisions regarding fire apparatus positioning?", "pg": "125", "o": ["Vast knowledge of geolocalization", "Understanding of community demographics", "Preincident planning and district familiarization", "Contingency plan and budget limitation knowledge"], "a": 2}, {"n": 5, "p": "If there is an indication of a rescue situation, where should the fire apparatus be positioned?", "pg": "125", "o": ["In a place for most efficient deployment of all first responders", "In a place for most efficient deployment of all necessary equipment", "In a place that provides immediate access to a freeway that leads to hospitals", "In a place flat enough for a helicopter to land and help with victims' transportation"], "a": 1}, {"n": 6, "p": "When a D/O is positioning for exposure protection, consider the apparatus as a:", "pg": "125", "o": ["fixed exposure.", "potential exposure.", "static water supply.", "conductor of electricity."], "a": 1}, {"n": 7, "p": "If a confirmed fire is located in an area of limited access, the first-arriving apparatus pumper should consider:", "pg": "126", "o": ["laying a supply line.", "laying at least three attack lines.", "the deployment of portable water tanks.", "immediate activation of at least two elevated fire streams."], "a": 0}, {"n": 8, "p": "Only after a proper size-up confirms the location and extent of the fire can a pumper’s onboard tank be considered for:", "pg": "126", "o": ["water supply.", "relay operation.", "overhaul operations.", "decontamination operations."], "a": 0}, {"n": 9, "p": "To maximize efficiency in the deployment of hoselines, if possible the D/O should position the fire apparatus on/at the:", "pg": "126", "o": ["furthest fire hydrant from the fire scene.", "backside of the structure to attack from the rear.", "same side of the street so attack lines do not cross the road.", "opposite side of the street to remain safe from heat exposure."], "a": 2}, {"n": 10, "p": "If a structure is fewer than five floors tall, the placement of the attack pumper of an \"inside/outside\" method is:", "pg": "128", "o": ["to the side and outboard of the pumper.", "on the side of the street closest to the structure.", "spread far right of the aerial device on the same street.", "the opposite side of the street than the aerial apparatus."], "a": 1}, {"n": 11, "p": "If a structure is five or more floors tall, the attack pumper should be positioned _____ of the aerial.", "pg": "128", "o": ["in front", "at the rear", "on the outside", "on the sideboard"], "a": 2}, {"n": 12, "p": "When placing aerial apparatus alongside pumpers, D/Os need to consider the space needed for the spread of the:", "pg": "128", "o": ["aerial ladder and the aerial platform.", "portable lighting system and traffic cones.", "hoseline deployment system and the equipment compartment door.", "stabilizing system of the aerial apparatus and placement of its ground ladders."], "a": 3}, {"n": 13, "p": "Why must the pumper be positioned as close as possible to the aerial device when supporting aerial apparatus elevated waterways?", "pg": "129", "o": ["For better layout hose organization", "To minimize supply-line friction loss", "For more efficient use of available resources", "To save space so that other apparatus could be accommodated"], "a": 1}, {"n": 14, "p": "To efficiently supply an FDC, it is the D/Os responsibility to know the:", "pg": "129", "o": ["number of active responders on scene.", "number of apparatus dispatched to the incident.", "location of positions for FDCs, and their alternative supply.", "alternative aerial supply positions and location of hose streams."], "a": 2}, {"n": 15, "p": "For a quick and effective positioning of the apparatus to support decon activities, a D/O must follow:", "pg": "130", "o": ["AHJ protocols and procedures.", "common sense and experience.", "manufacturer recommendations.", "other fire departments' best practices."], "a": 0}, {"n": 16, "p": "What scene condition may require that a D/O position the apparatus at an incident location suitable for a showering area using a monitor appliance or similar device?", "pg": "130", "o": ["Responder rescue", "Mass rehabilitation", "Victim decontamination", "Apparatus decontamination"], "a": 2}, {"n": 17, "p": "When choosing drafting locations, preference should be given to hose locations that are accessible from a hard surface and that require the:", "pg": "131", "o": ["minimum length of hard intake hose or lift.", "maximum length of hard intake hose or lift.", "responders to don appropriate protective clothing.", "responders to don protective respiratory equipment."], "a": 0}, {"n": 18, "p": "What type of hydrant consists of an intake hose connection on the shore of a static water supply and a length of pipe extended into the water with a strainer on the end?", "pg": "132", "o": ["Dry", "Wet", "Yard", "Industrial"], "a": 0}, {"n": 19, "p": "The procedures for many fire departments require that the D/Os place _____ valves on the small-diameter discharges of dry barrel hydrants before connecting to the large-diameter discharge.", "pg": "132", "o": ["gate", "deluge", "siamese", "reductor"], "a": 0}, {"n": 20, "p": "To properly position the apparatus during a hydrant operation, D/Os must know the position of the _____ on their vehicle.", "pg": "132", "o": ["dump valve", "tank to pump valve", "pump to tank valve", "intake hose connection"], "a": 3}, {"n": 21, "p": "Why should a D/O need to ensure a hydrant is fully dressed?", "pg": "133", "o": ["To demonstrate that apparatus equipment is being used correctly", "To demonstrate the hydrant is appropriate for the apparatus’ GVWR", "To obtain the highest pressure outcome needed to equip the apparatus", "To obtain the maximum gallons-per-minute (gpm) output for the apparatus"], "a": 3}, {"n": 22, "p": "When a pumper has _____, the D/O must stop close to the curb with the pump intake a few feet short of being in line with the hydrant.", "pg": "133", "o": ["a mid-line intake", "hard suction hose", "side intake connectors", "a dual intake connection"], "a": 2}, {"n": 23, "p": "How are pumpers generally positioned during a dual-pumping operation?", "pg": "134", "o": ["Parked bumper-to-bumper", "In close proximity to one another", "In close proximity and parallel to one another", "At least 1½ apparatus lengths away from one another"], "a": 1}, {"n": 24, "p": "During duel pumping operations, if the supply line running between the apparatus is too long, the friction loss may cause:", "pg": "134", "o": ["high residual pressure and cavitation in the first pumper.", "low residual pressure and cavitation in the second pumper.", "low intake pressure in the large-diameter intake hose in the first pumper.", "high intake pressure in the small-diameter intake hose in the first pumper."], "a": 1}, {"n": 25, "p": "What type of pumping operation may be needed when pressures higher than a single engine is capable of supplying are required?", "pg": "134", "o": ["Dual", "Relay", "Looped", "Tandem"], "a": 3}, {"n": 26, "p": "In tandem pumping operations, apparatus may be positioned up to _____ apart.", "pg": "134", "o": ["300 feet (90 m)", "900 feet (270m)", "600 feet (180 m)", "1200 feet (360 m)"], "a": 0}, {"n": 27, "p": "At which apparatus-staging level should incoming apparatus not pass their last strategic advantage?", "pg": "135", "o": ["Level I", "Level II", "Level IV", "Level III"], "a": 0}, {"n": 28, "p": "At which apparatus-staging level may an apparatus be directed to one or more apparatus staging areas designated by the operations section officer?", "pg": "135", "o": ["Level I", "Level II", "Level III", "Level IV"], "a": 1}, {"n": 29, "p": "D/Os in the cold zone at an incident:", "pg": "136", "o": ["are required to wear special PPE because this area is considered unsafe.", "are not required to wear special PPE because this area is considered safe.", "are required to wear special PPE because this area is considered to be marginally safe.", "are not required to wear special PPE because this area is considered free of pathogens."], "a": 1}, {"n": 30, "p": "During a response in vehicle traffic, the D/O should position the fire apparatus so that the apparatus:", "pg": "137", "o": ["will deflect a vehicle toward the scene.", "will deflect a vehicle away from the scene.", "creates a barrier that prohibits passing vehicles.", "creates a barrier that allows responders direct access to traffic."], "a": 1}, {"n": 31, "p": "Where should a supply hose be laid on a fire scene involving vehicle traffic?", "pg": "137", "o": ["Around the fire apparatus", "To the side of the street or roadway", "On the sidewalk opposite the roadway", "Perpendicular to the side of the street or roadway"], "a": 1}, {"n": 32, "p": "In which type of adverse weather condition must D/Os maintain situational awareness to position the apparatus so that the crew or apparatus will not be struck by debris?", "pg": "138", "o": ["Fog", "Wind", "Flooding", "Extreme temperature"], "a": 1}, {"n": 33, "p": "When preparing to position the apparatus during heavy rain, the D/O should ensure that the apparatus:", "pg": "138", "o": ["stays near the touchdown area.", "is parked in an open area, such as a field.", "remains in tandem with the aerial apparatus.", "remains visible to other vehicles on the road."], "a": 3}, {"n": 34, "p": "According to OSHA/NOAA, what should the D/O do to prevent risk exposure to lightning?", "pg": "139", "o": ["Park the fire apparatus near a fence", "Position the fire apparatus in open areas", "Park the fire apparatus near large equipment", "Avoid parking the fire apparatus next to isolated tall trees"], "a": 3}, {"n": 35, "p": "When operating at an incident involving hazardous or flammable liquids, park the apparatus in a(an) _____ position to eliminate the chance of a hazardous liquid flowing under the apparatus.", "pg": "139", "o": ["uphill", "upwind", "downhill", "downwind"], "a": 0}, {"n": 36, "p": "Pumping operations can be adversely affected if an apparatus is positioned on _____ surface grades.", "pg": "140", "o": ["flat", "dry", "hard", "curved"], "a": 3}, {"n": 37, "p": "A response apparatus should travel opposing the normal flow of traffic on highways or ramps when the police have:", "pg": "140", "o": ["closed the road to traffic.", "cleared the road for traffic.", "declared the roadway as safe.", "deployed a spotter for the apparatus."], "a": 0}, {"n": 38, "p": "The U.S. Department of Transportation Manual on Uniform Traffic Control Devices (MUTCD) advises that emergency vehicle warning lights should be ____ when arriving on the scene.", "pg": "141", "o": ["turned off", "increased to high brightness", "reduced as much as possible", "added in conjunction with audibles"], "a": 2}, {"n": 39, "p": "During a highway incident, what direction should the fire apparatus equipped with a side-mounted pump panel face?", "pg": "141", "o": ["Towards the street, so that the D/O sees the incident head-on", "Parallel to the incident scene, so that the D/O has a 90-degree view of the operation", "Perpendicular to the incident scene, so that the D/O has a 180-degree view of the operation", "To the incident scene, so that the D/O at the pump panel controls has a view of the operation"], "a": 3}, {"n": 40, "p": "Which is a consideration when positioning an apparatus on a bridge?", "pg": "142", "o": ["Always park or operate all apparatus on the same span", "Bridges will be the first road surfaces to freeze during cold weather", "Always stop well short of the beginning of a bridge or elevated roadway", "Park off the bridge and shut off all emergency lights and audible systems"], "a": 1}, {"n": 41, "p": "If a D/O responds to a railroad incident, what is the first step to minimize the dangers for emergency responders and apparatus?", "pg": "142", "o": ["Position the fire apparatus on the railroad tracks", "Seek support from nearby emergency responders", "Understand the specific hazards posed by rail operations", "Call the emergency telephone numbers for railroads to report the incident"], "a": 2}, {"n": 42, "p": "When operating at a railroad incident, an apparatus should maintain a clear zone _____ to prevent contact with objects on the railroad cars.", "pg": "142", "o": ["to the non-energized side of the active rail", "within 10 feet (3 m) of the railroad incident", "of at least 25 feet (8 m) from railroad tracts", "behind the energized rail side of the incident"], "a": 2}, {"n": 43, "p": "During an emergency medical incident, an important apparatus positioning consideration is for the D/O to leave the ambulance enough room for:", "pg": "143", "o": ["patient loading.", "victim decontamination.", "the driver to exit the vehicle.", "an emergency helicopter landing."], "a": 0}, {"n": 44, "p": "When preparing to position an apparatus at a hazardous material incident, the D/O should approach the incident from a(an) _____ position.", "pg": "145", "o": ["upwind and uphill", "upwind and downhill", "downwind and uphill", "downwind and downhill"], "a": 0}]}, {"ch": 4, "title": "Principles of Water", "qs": [{"n": 1, "p": "At what temperature does water convert to gas, water vapor, or steam?", "pg": "161", "o": ["Below 32°F (0°C)", "Exactly 32°F (0°C)", "Below 212°F (100°C)", "Above 212°F (100°C)"], "a": 3}, {"n": 2, "p": "Water’s density, or its weight per unit of volume, is commonly measured in:", "pg": "162", "o": ["square foot per second (ft²/s) (m²/s).", "pounds per cubic foot (lb/ft³) (kg/m³).", "pounds per square inch (lb/in²) (kg/cm²).", "pounds-foot per square second (lbf/s²) (kg-m/s²)."], "a": 1}, {"n": 3, "p": "For fire protection purposes, ordinary freshwater is considered to weigh:", "pg": "162", "o": ["92.4 lb/ft³ (1500 kg/m³).", "82.4 lb/ft³ (1300 kg/m³).", "62.4 lb/ft³ (1000 kg/m³).", "102.4 lb/ft³ (1640 kg/m³)."], "a": 2}, {"n": 4, "p": "Water may also be used to smother fires in combustible liquids whose specific gravity is:", "pg": "162", "o": ["equal to 1.", "lesser than 1.", "higher than 1.", "higher than 0, but less than 1."], "a": 2}, {"n": 5, "p": "Which is a disadvantage of using water as an extinguishing agent?", "pg": "163", "o": ["Water is a lightweight agent", "Water is a bad conductor of electricity", "Water has a low surface tension that makes it somewhat difficult to soak into dense materials", "Water has a high surface tension that makes it somewhat difficult to soak into dense materials"], "a": 3}, {"n": 6, "p": "To understand how force is determined, it is necessary to know the weight of water and the:", "pg": "163", "o": ["quality of water.", "source that water originated from.", "width that a column of water occupies.", "height that a column of water occupies."], "a": 3}, {"n": 7, "p": "The speed at which a fluid travels through a hose or pipe of a particular size and the pressure upon this water determines the fluid:", "pg": "165", "o": ["velocity.", "viscosity.", "temperature.", "state of matter."], "a": 0}, {"n": 8, "p": "What factors determine the velocity of fluid travel through a hose or pipe?", "pg": "165", "o": ["Intensity of the fluid", "Perpendicular exertion", "Pressure upon the fluid", "Size of the orifice through which it is flowing"], "a": 3}, {"n": 9, "p": "Which of the following is NOT one of the six principles of pressure that the D/O must understand?", "pg": "165", "o": ["Velocity", "Intensity", "Perpendicular exertion", "Equal pressure transmission"], "a": 0}, {"n": 10, "p": "The first pressure principle states that:", "pg": "165", "o": ["the pressure of a liquid in an open vessel is proportional to its depth.", "fluid pressure is perpendicular (at right angles) to any surface on which it acts.", "the pressure of a liquid in an open vessel is proportional to the density of the liquid.", "the pressure of a liquid at the bottom of a vessel is independent of the shape of the vessel."], "a": 1}, {"n": 11, "p": "What pressure principle states that pressure applied to a confined fluid is transmitted equally in all directions?", "pg": "165", "o": ["First", "Second", "Third", "Fourth"], "a": 2}, {"n": 12, "p": "The atmospheric pressure that surrounds the earth has depth and density and exerts the greatest pressures in:", "pg": "166", "o": ["low altitudes.", "high altitudes.", "confined spaces.", "unprotected spaces."], "a": 0}, {"n": 13, "p": "Which is considered standard atmospheric pressure?", "pg": "166", "o": ["7.3 psi (50.6 kPa)", "14.7 psi (100 kPa)", "29.4 psi (202.7 kPa)", "44.1 psi (304 kPa)"], "a": 1}, {"n": 14, "p": "In the fire service, head pressure refers to the:", "pg": "167", "o": ["height of the discharge orifice.", "height of a water supply above the discharge orifice.", "distance between the discharge orifice and the pump intake.", "distance between the water supply and the discharge orifice."], "a": 1}, {"n": 15, "p": "If the water supply is 100 feet (30 m) above the hydrant discharge opening, what would the head pressure be at the hydrant discharge?", "pg": "167", "o": ["43.4 psi (300 kPa)", "73.4 psi (506 kPa)", "63.4 psi (438 kPa)", "53.4 psi (370 kPa)"], "a": 0}, {"n": 16, "p": "What is hydrostatic pressure?", "pg": "168", "o": ["The total pressure a pump is capable to deliver", "The flow in which the fluid particles move along well-defined paths or streamline", "The stored potential energy available to force water through pipes, fittings, hose, and adapters", "The pressure exerted perpendicular to the direction of the flow and is represented by the symbol \"Q\""], "a": 2}, {"n": 17, "p": "The pressure in a water supply system before it flows from a hydrant is considered _____ for fire service purposes.", "pg": "168", "o": ["static", "potable", "residual", "dynamic"], "a": 0}, {"n": 18, "p": "The pressure found in a water distribution system during normal consumption demand is considered the normal _____ pressure.", "pg": "168", "o": ["static", "residual", "turbulent", "operating"], "a": 3}, {"n": 19, "p": "During a flow test of a water distribution system, the total available pressure of the water flowing from the open hydrant(s), other water consumption demands, and the size of the pipe is referred to as the:", "pg": "168", "o": ["static pressure.", "velocity friction.", "residual pressure.", "coefficient of friction."], "a": 2}, {"n": 20, "p": "What is used to measure the forward velocity of flow pressure?", "pg": "169", "o": ["Velocimeter", "Tachometer", "Pressure indicator", "Pitot tube and gauge"], "a": 3}, {"n": 21, "p": "A firefighter can use the measurement of flow pressure to calculate the quantity of water flowing in gpm or L/min if they know the size of the:", "pg": "169", "o": ["building.", "pitot tube.", "water tank.", "discharge opening."], "a": 3}, {"n": 22, "p": "Any pressure that is less than atmospheric pressure is called:", "pg": "169", "o": ["vacuum.", "pressure loss.", "positive pressure.", "stabilized pressure."], "a": 0}, {"n": 23, "p": "What is the notation for gauge readings that are calibrated so that atmospheric pressure is zero?", "pg": "169", "o": ["Inches of mercury (in Hg)", "Pounds per square foot (psfg)", "Pounds per square inch gauge (psig)", "Pounds per square inch absolute (psia)"], "a": 3}, {"n": 24, "p": "When a nozzle is above the level of the pump, there is:", "pg": "170", "o": ["no pressure.", "vacuum loss.", "pressure loss.", "pressure gain."], "a": 2}, {"n": 25, "p": "What are the pressure losses or gains due to gravity called?", "pg": "170", "o": ["Vacuum pressure (VP)", "Elevation pressure (EP)", "Atmospheric pressure (AP)", "Gravitational pressure (GP)"], "a": 1}, {"n": 26, "p": "Altitude impacts the production of fire streams because atmospheric pressure:", "pg": "170", "o": ["drops as height above sea level increases.", "raises as height above sea level decreases.", "stabilizes as height above sea level increases.", "destabilizes as height above sea level increases."], "a": 0}, {"n": 27, "p": "The friction loss in older hose may be as much as _____ greater than that of new hose.", "pg": "170", "o": ["10%", "25%", "50%", "75%"], "a": 2}, {"n": 28, "p": "Which friction loss principle states that if all other conditions are the same, friction loss increases due to the length of the hose or pipe?", "pg": "171", "o": ["First friction loss principle: Length", "Third friction loss principle: Diameter", "Second friction loss principle: Velocity", "Fourth friction loss principle: Pressure"], "a": 0}, {"n": 29, "p": "The fourth friction loss principle states that for a given velocity, friction loss:", "pg": "172", "o": ["increases due to the length of the hose or pipe.", "develops much faster than the change in velocity.", "is approximately the same, regardless of the pressure on the water.", "is dependent on the diameter and position of the hose carrying the water."], "a": 2}, {"n": 30, "p": "Expansion or a larger diameter hose increases volume so less velocity delivers the same amount, and when the velocity decreases, friction loss:", "pg": "172", "o": ["increases.", "decreases.", "does not change.", "increases exponentially."], "a": 1}, {"n": 31, "p": "Since water is basically incompressible, a pressure of 30,000 psi (210 000 kPa) only reduces its volume by:", "pg": "173", "o": ["1%.", "2%.", "its friction coefficient.", "its perpendicular pressure quotient."], "a": 0}, {"n": 32, "p": "Friction loss in a water system increases as the _____ of hose or piping increases.", "pg": "173", "o": ["length", "ductility", "diameter", "thickness"], "a": 0}, {"n": 33, "p": "Flow pressure will always be strongest near the source of supply and lowest at the:", "pg": "173", "o": ["lowest point in the water system.", "junction between hydrant fittings.", "nearest point in the water system.", "farthest point in the water system."], "a": 3}, {"n": 34, "p": "By decreasing the amount of water flowing, a firefighter reduces the speed of the water in the hose, which:", "pg": "173", "o": ["reduces friction loss.", "increases friction loss.", "marginally affects friction loss.", "maintains the same friction loss."], "a": 0}, {"n": 35, "p": "What can a D/O use when situations require velocity flow beyond the capability of a specific diameter of hose?", "pg": "174", "o": ["Attack line", "Longer hose", "Siamese line", "Smaller diameter hose"], "a": 2}, {"n": 36, "p": "What should the D/O do to reduce friction loss caused by hose length or diameter?", "pg": "175", "o": ["Extend the length of the lay and/or increase the diameter of the hose", "Extend the length of the lay and/or decrease the diameter of the hose", "Shorten the length of the lay and/or increase the diameter of the hose", "Shorten the length of the lay and/or decrease the diameter of the hose"], "a": 2}, {"n": 37, "p": "A water hammer is produced by:", "pg": "175", "o": ["suddenly stopping the pump.", "suddenly stopping water moving through a hose or pipe.", "gradually stopping water moving through a hose or pipe.", "intermittently stopping water moving through a hose or pipe."], "a": 1}, {"n": 38, "p": "What should the D/O do to prevent water hammer when flowing water?", "pg": "175", "o": ["Suddenly stop the water flow", "Stop the entire operation very fast", "Slowly close nozzles, valves, and hose clamps", "Partially close the water flow for few seconds and then immediately stop it"], "a": 2}, {"n": 39, "p": "When a large volume of water for a firefighting operation is needed, the fire department should request the water utility department to increase the:", "pg": "176", "o": ["water velocity.", "probabilities of extinguishing the fire.", "potable water supply for use in rehab.", "water pressure and/or volume in an area."], "a": 3}, {"n": 40, "p": "What is included in an engineering estimate to determine the amount of water that a community needs?", "pg": "177", "o": ["The total number of fire occurred", "The total number of people who will be consuming water", "The average water consumption for each population sector", "The total amount of water needed for domestic, industrial, and fire fighting use"], "a": 3}, {"n": 41, "p": "Which means of moving water uses one or more pumps that take water from the primary source and discharge it through the filtration and treatment processes?", "pg": "177", "o": ["Gravity system", "Combination system", "Direct pumping system", "Indirect pumping system"], "a": 2}, {"n": 42, "p": "Which event could disable a water treatment system’s pumping station and drastically reduce the volume and pressure of water available for fire fighting operations?", "pg": "178", "o": ["High humidity", "A loss of power supply", "Use of unsuitable water treatment chemicals", "Lower than average community water consumption"], "a": 1}, {"n": 43, "p": "A water distribution system sustains much less pressure loss when fire hydrants receive:", "pg": "178", "o": ["half of the water supply.", "water supply from one direction.", "50% more water supply than needed.", "water supply from two or more directions."], "a": 3}, {"n": 44, "p": "What are large pipes (mains), with relatively widespread spacing, that convey large quantities of water to various points of the system for local distribution to the smaller mains called?", "pg": "178", "o": ["Primary feeders", "Substitute feeders", "Secondary feeders", "Distributor feeders"], "a": 0}, {"n": 45, "p": "Which water system valve visually shows whether the gate or valve seat is open, partially closed, or totally closed?", "pg": "179", "o": ["Gate valve", "Solenoid valve", "Indicating valve", "Reduced pressure valve"], "a": 2}, {"n": 46, "p": "The function of a valve in a water distribution system is to provide a means to:", "pg": "180", "o": ["prevent the occurrence of water hammers.", "reduce friction loss within the water system.", "facilitate access to the interior of the distribution pipes.", "control the flow of water through the distribution piping."], "a": 3}, {"n": 47, "p": "Restriction of water pipe size, increased friction loss, and a proportionate reduction of available system water is the result of:", "pg": "181", "o": ["deficient maintenance programs.", "utilizing bad quality water sources.", "utilizing a large diameter hose during pumping operations.", "encrustation of minerals on the interior surfaces of the pipe."], "a": 3}, {"n": 48, "p": "D/Os must understand that the average daily consumption (ADC) of a water supply system is the amount of water used:", "pg": "181", "o": ["in any one-hour interval.", "during unusual situations.", "per day in a three-year period.", "per day, measured over a one year period."], "a": 3}, {"n": 49, "p": "In many cases, a private source of water used for fire protection is:", "pg": "182", "o": ["hard.", "potable.", "mineral.", "nonpotable."], "a": 3}]}, {"ch": 5, "title": "Hose Nozzles and Flow Rates", "qs": [{"n": 1, "p": "Which three basic fire stream designs are used in the fire service?", "pg": "187", "o": ["Solid, fog, and broken", "Solid, mist, and broken", "Jet solid, spray, intermittent", "Semi-solid, mist, and broken"], "a": 0}, {"n": 2, "p": "Generally, noozles with flows less than 350 gpm (1 400 L/min) are used with:", "pg": "187", "o": ["handlines.", "master streams.", "oscillating master nozzles.", "adjustable master nozzles."], "a": 0}, {"n": 3, "p": "Which fire stream has a better ability to penetrate into a fuel package and reach the seat of a fire because it produces a stream with little shower or spray?", "pg": "188", "o": ["Fog", "Mist", "Solid", "Broken"], "a": 2}, {"n": 4, "p": "What determines the flow and reach of a solid stream tip when the correct pressure is being delivered to the nozzle?", "pg": "188", "o": ["Pump size", "Nozzle brand", "Type of fire truck used on site", "Size of the nozzle’s discharge orifice"], "a": 3}, {"n": 5, "p": "What is the optimum pressure at the nozzle to operate a solid stream nozzle on handlines?", "pg": "188", "o": ["50 psi (350 kPa)", "75 psi ( 525 kPa)", "100 psi (700 kPa)", "150 psi (1050 kPa)"], "a": 0}, {"n": 6, "p": "What is the optimum pressure at the nozzle to operate master stream appliances on handlines?", "pg": "188", "o": ["20 psi (140 kPa)", "40 psi (280 kPa)", "80 psi (560 kPa)", "100 psi (700 kPa)"], "a": 2}, {"n": 7, "p": "When a smooth bore tip is used, what is the first step in determining the friction loss in the hose layout?", "pg": "189", "o": ["Calculate the PDP", "Determine the gpm", "Calculate the elevation", "Drawing the hose layout"], "a": 1}, {"n": 8, "p": "Using the discharge rate formula for solid stream nozzles, what is the water flow from a 1 inch (25.4 mm) tip operating at 50 psi (344.75 L/min)? Answers are not rounded.", "pg": "190", "o": ["110 gpm (416 L/min)", "210 gpm (783.41 L/min)", "310 (1173 L/min)", "410 psi (1552 L/min)"], "a": 1}, {"n": 9, "p": "What fog stream is produced by deflecting water around a circular stem inside the nozzle?", "pg": "190", "o": ["Impinged stream", "Interior-deflected", "Periphery-deflected", "Concentric-deflected"], "a": 2}, {"n": 10, "p": "Generally, the flow of the nozzle is the same regardless of the:", "pg": "190", "o": ["pattern.", "elevation.", "hose size.", "hose length."], "a": 0}, {"n": 11, "p": "Which fog stream nozzles break water into fine, evenly divided droplets by driving several jets of water together at an angle?", "pg": "190", "o": ["Solid", "Straight", "Impinging", "Intermittent"], "a": 2}, {"n": 12, "p": "The reach of the fog stream is directly correlated to the:", "pg": "190", "o": ["pre-piped waterway.", "ambient temperature.", "length of the fire hose.", "size of the water droplets."], "a": 3}, {"n": 13, "p": "Which fog nozzle is designed to flow a specific volume of water on all stream patterns at a specific nozzle discharge pressure?", "pg": "192", "o": ["Automatic", "Variable flow", "Constant flow", "Selectable gallonage"], "a": 2}, {"n": 14, "p": "Most constant flow nozzles are designed to operate at a nozzle pressure of:", "pg": "192", "o": ["100 psi (700 kPa).", "200 psi (1 400 kPa).", "300 psi ( 2 100 kPa).", "400 psi (2 800 kPa)."], "a": 0}, {"n": 15, "p": "When operating a selectable gallonage nozzle, the D/O sets its discharge gallonage:", "pg": "192", "o": ["with a specified range before use.", "based on the fire pump capabilities.", "depending on the water supply capabilities.", "based on nozzle manufacturer specifications."], "a": 0}, {"n": 16, "p": "One of the reasons for using low-pressure fog nozzles is that:", "pg": "193", "o": ["they have a better cost-to-benefit ratio.", "they help preserve the lifespan of fire hoses.", "friction loss will not affect the designed flow rate.", "elevation pressures do not affect their operational flows."], "a": 3}, {"n": 17, "p": "High-pressure fog nozzles produce a stream with significant forward velocity, but a relatively:", "pg": "193", "o": ["low velocity pressure.", "low volume of water delivery.", "high volume of water delivery.", "marginal volume of water delivery."], "a": 1}, {"n": 18, "p": "Master stream nozzles can deliver water flow in excess of:", "pg": "193", "o": ["350 gpm (1 400 L/min).", "450 gpm (1 700 L/min).", "550 gpm (2 000 L/min).", "650 gpm (2 500 l/min)."], "a": 0}, {"n": 19, "p": "Master stream appliances generally operate where _____ would be ineffective.", "pg": "193", "o": ["nozzles", "handlines", "aerial streams", "offensive posture"], "a": 1}, {"n": 20, "p": "What types of master stream devices are commonly called deck guns and permanently mounted on the apparatus?", "pg": "194", "o": ["Dual", "Fixed", "Portable", "Combination"], "a": 1}, {"n": 21, "p": "What types of master stream devices may be used in a mount on the apparatus or removed and used remotely from the vehicle?", "pg": "194", "o": ["Dual", "Fixed", "Portable", "Combination"], "a": 3}, {"n": 22, "p": "What types of master stream devices are stored on the apparatus for deployment to the location where they are to be used?", "pg": "194", "o": ["Dual", "Fixed", "Portable", "Combination"], "a": 2}, {"n": 23, "p": "An advantage of a pre-piped waterway master stream on an elevated platform is that it:", "pg": "194", "o": ["has a higher weight and volume limit.", "may be remotely controlled from the apparatus turntable.", "greater pressure capabilities than a detachable waterway.", "has remote control capabilities when operating from a detachable ladder."], "a": 1}, {"n": 24, "p": "Which special-purpose nozzle has a rotating head that is spun by water discharged through multiple miniature outlets resembling periphery fog nozzles?", "pg": "195", "o": ["Solid", "Cellar", "Smooth bore", "Automatic variable flow"], "a": 1}, {"n": 25, "p": "The special-purpose piercing nozzle is capable of flowing approximately:", "pg": "196", "o": ["125 gpm (500 L/min) at 100 psi (700 kPa).", "150 gpm (560 L/min) at 100 psi (700 kPa).", "200 gpm (760 L/min) at 50 psi (350 kPa).", "250 gpm (950 L/min) at 50 psi (350 kPa)."], "a": 0}, {"n": 26, "p": "Which special-purpose nozzle consists of a solid piece of brass or steel with many small impinging holes, flowing only 1.5 to 3 gpm (6 to 12 L/min) at a nozzle pressure of 100 psi (700 kPa)?", "pg": "196", "o": ["Cellar", "Piercing", "Chimney", "Distributor"], "a": 2}, {"n": 27, "p": "What is the nozzle reaction when utilizing a smooth bore nozzle with a 1¼ inch (48 mm) tip operating at a pressure of 50 psi (350 kPa)?", "pg": "198", "o": ["Approximately 120 lb (540 N)", "Approximately 140 lb (630 N)", "Approximately 160 lb (710 N)", "Approximately 180 lb (800 N)"], "a": 0}, {"n": 28, "p": "What is the nozzle reaction of a hoseline with a fog nozzle flowing 200 gpm (700 L/min) at 100 psi (525 kPa)?", "pg": "199", "o": ["Approximately 100 lb (450 N)", "Approximately 150 lb (670 N)", "Approximately 200 lb (890N)", "Approximately 250 lb (1 115 N)"], "a": 0}]}, {"ch": 6, "title": "Theoretical Pressure Calculations", "qs": [{"n": 1, "p": "To effectively provide water for fire streams, the D/O must know the pressure loss or gain due to elevation, and the:", "pg": "204", "o": ["pipes and/or appliances brands.", "amount of friction loss in the fire hose.", "pressure loss or gain due to pipe ductility.", "number of trucks available for relay operations."], "a": 1}, {"n": 2, "p": "To effectively provide water for fire streams, the D/O must know the amount of friction loss in the fire hose, pipes, and/or appliances, and the:", "pg": "204", "o": ["the fire's fuel load.", "experience of the nozzle operator.", "pressure loss or gain due to elevation.", "different types of hose loads on the apparatus."], "a": 2}, {"n": 3, "p": "Friction loss, loss or gain due to elevation, and appliance pressure loss are factors that comprise:", "pg": "205", "o": ["head pressure (HP).", "total pressure loss (TPL).", "pump discharge pressure (PDP).", "net pump discharge pressure (NPDP)."], "a": 1}, {"n": 4, "p": "Friction loss is affected by the amount of water flowing as well as the length, diameter, and _____ of the hose or pipe.", "pg": "205", "o": ["cost", "lining", "layers", "thickness"], "a": 1}, {"n": 5, "p": "What can be done by jurisdictions to gain more accurate hydraulic calculation results?", "pg": "206", "o": ["Purchase the most expensive equipment for testing", "Compare hydraulic calculations to results from other jurisdictions", "Use individual testing and published data in standard calculations", "Test the actual equipment in conditions likely to be encountered at a fire scene"], "a": 3}, {"n": 6, "p": "The standard friction loss coefficients of discharge for attack hose are generally high for _____ hose.", "pg": "206", "o": ["old", "modern", "double layer", "large-diameter"], "a": 1}, {"n": 7, "p": "What is recommended to prevent issues with friction loss in standpipe operations?", "pg": "206", "o": ["On-site improvisation during the incident", "Reducing the size of the standpipe to minimize friction", "Avoiding the use of pumping apparatus in such situations", "Preplanning and determining standpipe pressures in advance"], "a": 3}, {"n": 8, "p": "What factors are accounted for in the current formula for friction loss?", "pg": "206", "o": ["The material of the hose or pipe, the volume of water flowing, and the length of the hose layout", "The diameter of the hose or pipe, the volume of water flowing, and the length of the hose layout", "The diameter of the hose or pipe, the velocity of water flowing, and the length of the hose layout", "The diameter of the hose or pipe, the volume of water flowing, and the volume of the hose or pipe"], "a": 1}, {"n": 9, "p": "One accurate method for determining pressure loss in a particular hose lay involves measuring the pressure at:", "pg": "207", "o": ["both ends of the hoseline and adding the difference.", "both ends of the hoseline and subtracting the difference.", "the pump discharge and adding pressure gain due to elevation.", "one end of the hoseline and adding pressure loss due to elevation."], "a": 1}, {"n": 10, "p": "A pitot tube, two in-line gauges, a hose, and a smooth bore nozzle is the equipment required:", "pg": "208", "o": ["for testing friction loss.", "on every fire apparatus.", "on every aerial platform.", "for determining pump intake pressure."], "a": 0}, {"n": 11, "p": "The largest factor related to avoidable friction loss is the:", "pg": "208", "o": ["fire hose material quality.", "number of hose couplings.", "appliances' material quality.", "volume of water flowing per minute."], "a": 3}, {"n": 12, "p": "What is created by gravity and the height difference between the pump and the nozzle?", "pg": "210", "o": ["Laminar flow", "Turbulent flow", "Elevation pressure (EP)", "Total pressure loss (TPL)"], "a": 2}, {"n": 13, "p": "Elevation pressure can cause a pressure loss when the:", "pg": "210", "o": ["pump is at sea level.", "nozzle is at the pump level.", "pump is higher than the nozzle.", "nozzle is higher than the pump."], "a": 3}, {"n": 14, "p": "What customary (metric) formula should a D/O use to calculate changes in pressure due to elevation?", "pg": "210", "o": ["FL=CQ2L", "EP=5H (35H)", "PDP=NP+TPL", "EP=.05H (10H)"], "a": 3}, {"n": 15, "p": "What variables are considered in the formula used to calculate changes in pressure due to elevation in a multistory building?", "pg": "210", "o": ["A constant 5 psi (35 kPa), the number of stories plus one", "A constant 10 psi (70 kPa) the number of stories plus one", "A constant 5 psi (35 kPa), the number of stories minus one", "A constant 10 psi (70 kPa), the number of stories minus one"], "a": 2}, {"n": 16, "p": "When using more than one hoseline and their diameters vary, friction loss calculations must be made for:", "pg": "211", "o": ["one hoseline.", "each hoseline.", "the hose line with a larger diameter.", "the hose line with the smallest diameter."], "a": 1}, {"n": 17, "p": "When using a wyed hoseline, what effect can cause too much, or too little, pressure and flow of one line?", "pg": "211", "o": ["Inadvertent valve movement", "The pattern of opposing nozzles", "Inline pressure gauge fluctuation", "Friction loss due to the internal design"], "a": 0}, {"n": 18, "p": "The greater the rate of flow through a hoseline, _____ must be supplied to overcome friction loss.", "pg": "212", "o": ["the lesser amount of water", "the greater amount of water", "the lesser amount of pressure", "the greater amount of pressure"], "a": 3}, {"n": 19, "p": "When two hoselines of equal length are siamesed to supply a fire stream, or another pumper, friction loss is approximately _____ of a single hoseline at the same volume.", "pg": "212", "o": ["25%", "50%", "75%", "100%"], "a": 0}, {"n": 20, "p": "When determining friction loss, add 10 psi (70 kPa) for a siamese appliance if the flow is:", "pg": "212", "o": ["less than 250 gpm [1 000 L/min]).", "greater than 250 gpm [1 000 L/min]).", "less than 350 gpm [1 400 L/min]).", "greater than 350 gpm [1 400 L/min])."], "a": 3}, {"n": 21, "p": "To determine the required pressure for a standpipe system, the D/O must calculate:", "pg": "212", "o": ["nozzle reaction time.", "pump discharge rates.", "friction loss coefficient.", "total pressure loss (TLP)."], "a": 3}, {"n": 22, "p": "In an aerial waterway, bends in the aerial piping and associated swivels cause pressure loss due to the:", "pg": "213", "o": ["great amount of water running through the piping.", "extremely high elevation the water has to overcome through the piping.", "ductility of the piping and the quality of the hoses used in the apparatus.", "turbulence created as the water forcefully makes its way through the piping."], "a": 3}, {"n": 23, "p": "When calculating pressure loss for a master stream device, the D/O must add _____ to the pressure loss calculation.", "pg": "213", "o": ["25 psi (175 kPa)", "50 psi (350 kPa)", "75 psi (525 kPa)", "100 psi (700 kPa)"], "a": 0}, {"n": 24, "p": "Multiple hoselines are simple layouts as long as _____ has its own discharge valve that can be gated for the correct PDP.", "pg": "214", "o": ["each one", "at least one", "each group of 2 lines", "each group of three lines"], "a": 0}, {"n": 25, "p": "When hoselines connected to a manifold are unequal and/or the diameter is different, the TPL in the system is based on the:", "pg": "215", "o": ["lowest flow required in any of the hoselines.", "highest flow required in any of the hoselines.", "lowest pressure required in any of the hoselines.", "highest pressure required in any of the hoselines."], "a": 3}, {"n": 26, "p": "What is the safe and efficient nozzle pressure for a common solid stream nozzle (master stream)?", "pg": "216", "o": ["50 psi (350 kPa)", "75 psi (525 kPa)", "80 psi (560 kPa)", "100 psi (700 kPa)"], "a": 2}, {"n": 27, "p": "The NPDP for a positive pressure source is the:", "pg": "216", "o": ["sum of the TPL and the incoming pressure from the supply source.", "sum of the PDP and the discharge pressure from the supply source.", "difference between the TPL and the incoming pressure from the supply source.", "difference between the PDP and the incoming pressure from the supply source."], "a": 3}]}, {"ch": 7, "title": "Fireground Hydraulic Calculations", "qs": [{"n": 1, "p": "What does a flowmeter determine?", "pg": "262", "o": ["Friction loss in the pump", "Pressure coming from a discharge", "Direct water flow from a discharge", "Water velocity coming from a discharge"], "a": 2}, {"n": 2, "p": "Based on NFPA 1900, what must be provided for every discharge outlet equipped with a flowmeter?", "pg": "262", "o": ["Tachometer", "Paddlewheel", "Pressure gauge", "Volumetric gauge"], "a": 2}, {"n": 3, "p": "In what situation would a D/O most likely exceed safe operating pressures for hoses or standpipes when only considering the flowrate of the nozzle and ignoring the pressure?", "pg": "262", "o": ["During standard firefighting operations", "When conducting regular pump maintenance", "When the discharge outlets have multiple flowmeters", "When using long hose lays or facing high elevation pressure losses"], "a": 3}, {"n": 4, "p": "Which type of flowmeter uses a sensor that measures the speed at which it spins and then translates the information into a flow measurement?", "pg": "262", "o": ["Paddlewheel", "Spring probe", "Cooper wheel", "Thermocouples"], "a": 0}, {"n": 5, "p": "According to NFPA 1900, if a pressure gauge is mounted within 6 inches (150 mm) of the control valve centerline, the flowmeter must be mounted within _____ adjacent to the pressure gauge.", "pg": "263", "o": ["2 inches (50 mm)", "4 inches (100 mm)", "6 inches (150 mm)", "8 inches (200 mm)"], "a": 0}, {"n": 6, "p": "With proper calibration, a flowmeter in good condition should be accurate to a tolerance of plus or minus:", "pg": "263", "o": ["5%.", "10%.", "15%.", "20%."], "a": 0}, {"n": 7, "p": "Which tool relieves the D/O from relying on calculations based on the friction loss, length of the hoseline, and elevation pressure?", "pg": "264", "o": ["Flowmeter", "Tachometer", "Pressure gauge", "Hydraulic calculator"], "a": 0}, {"n": 8, "p": "When engaged in a relay pumping operation, the intake pressure reading should NOT drop below:", "pg": "264", "o": ["20 psi (140 kPa).", "40 psi (275 kPa).", "60 psi (410 kPa).", "80 psi (550 kPa)."], "a": 0}, {"n": 9, "p": "When operating a flowmeter-equipped apparatus, the D/O may factor in the number and types of nozzles on hoselines operating from the standpipe by:", "pg": "264", "o": ["adding the flow rates for one nozzle and pumping a matching volume of water.", "adding the flow rates for each nozzle and pumping a matching volume of water.", "subtracting the flow rates for one nozzle and pumping a matching volume of water.", "subtracting the flow rates for each nozzle and pumping a matching volume of water."], "a": 1}, {"n": 10, "p": "What would happen if firefighters shut down a nozzle and the pressure control device does not activate accordingly?", "pg": "265", "o": ["The volume will increase exponentially", "The pressure will increase exponentially", "The volume and unused pressure could divert to other open nozzles", "Volume and unused pressure will remain static when the nozzle is shut down"], "a": 2}, {"n": 11, "p": "How do apparatus equipped with discharge relief valves compensate when firefighters shut down a nozzle?", "pg": "265", "o": ["Intermittently opening the relief valve", "Intermittently opening the tank dump valve", "Recirculating discharge volume to the intake", "Recirculating discharge pressure to the intake"], "a": 3}, {"n": 12, "p": "Apparatus equipped with electronic pressure governors set in the _____ mode should compensate when firefighters shut down a nozzle.", "pg": "265", "o": ["psi", "rpm", "gpm", "automatic"], "a": 0}, {"n": 13, "p": "Sprinkler systems present too many variables for the effective use of a flowmeter in support of the system, one of these variables being:", "pg": "265", "o": ["age of the building.", "engineering of the system.", "the cost of the system components.", "the number of improvements made to the system."], "a": 1}, {"n": 14, "p": "An electronic pressure g
