overnor will usually have one or more presets where one button is pushed and the pump automatically maintains:", "pg": "266", "o": ["a particular flow.", "a particular pressure.", "the same water viscosity.", "the same water temperature."], "a": 1}, {"n": 15, "p": "What is the purpose of developing SOPs for operating flows or pressures?", "pg": "266", "o": ["Eliminate the need for pressure governor presets", "Allow the D/O to operate the fire pump without restrictions", "Comply with legal requirements set by the local government", "Provide guidelines for the operation of preconnected attack lines"], "a": 3}, {"n": 16, "p": "An AHJ may determine SOPs for flows and pressures. Measurement typically is documented for hose in friction loss per 100 feet (30 m) at:", "pg": "266", "o": ["sea level.", "specific flows.", "any condition.", "specific elevations."], "a": 1}, {"n": 17, "p": "Which NFPA standard requires establishing an uninterrupted water supply of a minimum of 400 gpm (1 520 L/min) for 30 minutes with supply line(s) maintained by an operator for residential fire?", "pg": "266", "o": ["NFPA 1002", "NFPA 1033", "NFPA 1710", "NFPA 1911"], "a": 2}, {"n": 18, "p": "What is the responsibility of the D/O concerning SOPs for operating flows or pressures?", "pg": "266", "o": ["Follow the SOPs while operating a fire pump", "Enforce the SOPs strictly without any flexibility", "Challenge and modify the SOPs whenever necessary", "Develop new SOPs independently for each operation"], "a": 0}, {"n": 19, "p": "What should fire department personnel establish to develop a customized pump chart?", "pg": "267", "o": ["An electronic board for onsite hydraulic calculations", "A form that clearly identifies the D/Os academic background", "A form that clearly identifies the department’s nozzles and devices", "An electronic board preloaded with theoretical pressure calculations"], "a": 2}, {"n": 20, "p": "After gathering the relevant data from a pump chart and applying appliance pressure loss, the D/O should calculate the appropriate PDP by rounding to the nearest:", "pg": "267", "o": ["5 psi (35 kPa).", "10 psi (69 kPa).", "15 psi (104 kPa).", "20 psi (138 kPa)."], "a": 0}]}, {"ch": 8, "title": "Fire Pump Characteristics", "qs": [{"n": 1, "p": "Centrifugal pump operation functions on the principle that:", "pg": "274", "o": ["a hand crank rotates a gear, forcing water through the pump and hoses.", "multiple pistons apply kinetic energy to water so its pressure and velocity are increased.", "a rapidly revolving spiral tends to throw water introduced at several points along the pump body.", "a rapidly revolving disk tends to throw water introduced at its center toward the outer edges of the disk."], "a": 3}, {"n": 2, "p": "The faster the impeller of a centrifugal pump rotates:", "pg": "274", "o": ["the slower water velocity is at the same pump level.", "the higher the impeller can force a column of water up.", "the more difficult it is to overcome gravity force to move water up.", "the more difficult it is to overcome gravity force to move water at the same pump level."], "a": 1}, {"n": 3, "p": "What dictates the capacity of a centrifugal pump?", "pg": "274", "o": ["Pump size", "Impeller size", "Impeller metal components", "Apparatus engine horsepower"], "a": 1}, {"n": 4, "p": "The off-center mounting of the impeller within the casing which creates a water passage that enlarges as it nears the discharge outlet of the pump is known as the:", "pg": "274", "o": ["volute.", "diffuser.", "pump eye.", "impeller eye."], "a": 0}, {"n": 5, "p": "What is one of the three factors that influence a centrifugal fire pump's discharge pressure?", "pg": "275", "o": ["Speed at which volute occurs", "Speed at which the impeller is turning", "Pressure of water when it exits the pump", "Velocity of water when it enters the pump"], "a": 1}, {"n": 6, "p": "Why must the D/O provide a water source and evacuate all air from a centrifugal pump?", "pg": "275", "o": ["A centrifugal pump can pump air and self-prime", "A centrifugal pump cannot pump air or self-prime", "A centrifugal pump is capable of overcoming gravity force", "A centrifugal pump is not capable of overcoming gravity force"], "a": 1}, {"n": 7, "p": "What will happen if an air lock occurs in a centrifugal pump?", "pg": "275", "o": ["The pump will develop discharge pressure", "Air will dilute in the water inside the pump", "The pump will not develop discharge pressure", "Air will help to build up a higher discharge pressure"], "a": 2}, {"n": 8, "p": "Centrifugal pumps constructed with a single impeller are referred to as:", "pg": "276", "o": ["single-stage.", "two-stage.", "three-stage.", "multistage."], "a": 0}, {"n": 9, "p": "Sometimes, the double-suction impeller refers to _____ fire pump impeller.", "pg": "276", "o": ["single-stage", "two-stage", "multistage", "variable stage"], "a": 0}, {"n": 10, "p": "As a means to balance the fire pump and cancel lateral thrust forces, how does the water enter the single-stage impeller?", "pg": "276", "o": ["Through both eyes", "Through only one eye", "Through both eyes at a 90-degree angle", "Through one eye first and then the other"], "a": 0}, {"n": 11, "p": "The capability to connect the stages in series for maximum pressure or in parallel for maximum volume by use of a _____ makes two impellers more efficient.", "pg": "276", "o": ["clapper valve", "transfer valve", "midship pump", "priming device"], "a": 1}, {"n": 12, "p": "Pumping in series (pressure) position, the volume of water available is limited to the:", "pg": "277", "o": ["pressure the pump can develop.", "pressure the volute is able to build.", "amount that one impeller can supply.", "amount that two impellers can supply."], "a": 2}, {"n": 13, "p": "When pumping in the parallel (volume) position with a two-stage pump rated at 1,000 gpm (4 000 L/min) at 150 psi (1 050 kPa), each of the impeller's supplies _____ to the pump discharge manifold.", "pg": "277", "o": ["250 gpm (1 000 L/min)", "500 gpm (2 000 L/min)", "750 gpm (3 000 L/min)", "1000 gpm (4 000 L/min)"], "a": 1}, {"n": 14, "p": "When the transfer valve operates on a two-stage pump, switching from volume to pressure can:", "pg": "278", "o": ["increase pressure loss.", "decrease pressure loss.", "double discharge volume.", "double discharge pressure."], "a": 3}, {"n": 15, "p": "In what position should the D/O set the transfer valve to ensure the two-stage pump can supply sufficient volume?", "pg": "278", "o": ["Series", "Parallel", "Velocity", "Pressure"], "a": 1}, {"n": 16, "p": "The D/O must NOT exceed a net pump discharge pressure (NPDP) of _____ when making a changeover between pressure and volume on a two-stage centrifugal pump.", "pg": "278", "o": ["50 psi (350 kPa)", "100 psi (700 kPa)", "150 psi (1 050 kPa)", "200 psi (1 400 kPa)"], "a": 0}, {"n": 17, "p": "Which valves are essential to the operation of a two-stage pump?", "pg": "278", "o": ["Globe", "Deluge", "Clapper", "Automatic"], "a": 2}, {"n": 18, "p": "Fire pumps that utilize up to four impellers connected in series to develop high pressure are known as:", "pg": "280", "o": ["two-stage pumps.", "vertical split pumps.", "single-stage pumps.", "multistage centrifugal pumps."], "a": 3}, {"n": 19, "p": "What is a type of device that newer model centrifugal pumps may come with that opens to allow overheated water to circulate between the pump and the main water tank or into the atmosphere?", "pg": "281", "o": ["Deluge valve", "Automatic cooler", "Thermal relief valve", "Electronic thermal control"], "a": 2}, {"n": 20, "p": "To prevent overheating, what should the D/O do if water is NOT expected to be discharged through a pump for an extended period of time?", "pg": "281", "o": ["Maintain the pump at its fully operational capacity", "Shut down the pump and wait for instruction from IC", "Make connections to deliver water to other fire apparatus", "The pump should be throttled down to idle and disengaged"], "a": 3}, {"n": 21, "p": "The most common seal-packing materials for pumps are made up of:", "pg": "281", "o": ["lead alloys.", "aluminum alloys.", "fibers impregnated with graphite or lead.", "fibers impregnated with graphite or aluminum."], "a": 2}, {"n": 22, "p": "What is used to overcome the friction that develops heat where the packing rings contact the shaft?", "pg": "281", "o": ["Plastic seal", "Silicone gel", "Heat resistant rubber", "Lantern or slinger ring"], "a": 3}, {"n": 23, "p": "What may happen to the packing seal if the pump goes unused for extended periods of time?", "pg": "282", "o": ["No water will drip from the glands", "Excessive lubrication will damage the packing", "Packing will maintain all its physical properties", "Packing may dry out and cause excessive leaking"], "a": 3}, {"n": 24, "p": "What may happen if mechanical seals freeze in cold weather?", "pg": "282", "o": ["Minor damage may occur", "Seals remain intact, not requiring replacement", "Damage may occur, but replacement is not necessary", "Damage may occur, requiring the seals to be replaced"], "a": 3}, {"n": 25, "p": "In most fire departments, where is the pump mounted in the pumper truck?", "pg": "282", "o": ["In the rear of the pumper", "In the front of the pumper", "On top of the inboard water tank", "To the frame in line behind the engine and transmission"], "a": 3}, {"n": 26, "p": "Where is the split shaft transfer case that powers a midship-mounted pump located?", "pg": "282", "o": ["Underneath the pump", "Behind the apparatus engine", "In front of the apparatus engine", "Between the transmission and rear axle"], "a": 3}, {"n": 27, "p": "What will happen if the D/O places the road transmission in the wrong gear on a midship-mounted fire pump?", "pg": "283", "o": ["Engine will overheat and fail", "Pump will turn at the needed rpm to operate effectively", "Pump will not turn at the needed rpm to operate effectively", "Engine will not turn at the needed velocity to operate effectively"], "a": 2}, {"n": 28, "p": "What happens if the D/O places the transmission in the correct gear?", "pg": "283", "o": ["A lockout feature will stop the transmission immediately", "The pump will not turn at the needed rpm to operate effectively", "The engine will not turn at the needed velocity to operate effectively", "A lockout feature prevents the transmission from switching gears as rpm rises and falls"], "a": 3}, {"n": 29, "p": "What prevents an automatic transmission gear selector from moving during a pumping operation or a manual transmission from slipping out of gear?", "pg": "284", "o": ["Driver/operator hand holds it in the proper pumping gear", "A switch on the transmission holds it in the proper pumping gear", "A lock on the transmission or shift lever holds it in the proper pumping gear", "A special device tailored by each apparatus manufacturer holds it in the proper pumping gear"], "a": 2}, {"n": 30, "p": "PTO-driven fire pumps commonly serve on initial attack and _____ fires.", "pg": "284", "o": ["wildland", "industrial", "high-rise building", "hazordous materials"], "a": 0}, {"n": 31, "p": "The rear-engine power take-off (REPTO) design works well in which type of industry?", "pg": "285", "o": ["Food", "Chemical", "Agriculture", "Automotive"], "a": 2}, {"n": 32, "p": "Where is the pump typically mounted on fire department pumpers with an extended front bumper?", "pg": "285", "o": ["In the back of the vehicle", "On the roof of the vehicle", "Between the driver and passenger seats", "Between the vehicle bumper and its grill"], "a": 3}, {"n": 33, "p": "The freezing of front-mount pumps and gauges may be reduced by:", "pg": "286", "o": ["allowing internal heat of the cab to systematically pass through.", "using external lines that circulate radiator fluid through the pump body.", "keeping the pump and gauges pointed opposite the direction of wind flow.", "using external lines that circulate onboard tank water through the pump body."], "a": 1}, {"n": 34, "p": "What key advantage would an apparatus with rear-mount pumps offer?", "pg": "286", "o": ["Better internal piping distribution", "Opportunity for a longer wheelbase", "Optimum pump location for a fire attack", "More even weight distribution on the chassis"], "a": 3}, {"n": 35, "p": "The most common applications for auxiliary engine driven pumps include:", "pg": "286", "o": ["portable fire pumps.", "all aerial fire apparatus.", "industrial fire apparatus.", "all structural fire fighting pumpers."], "a": 0}, {"n": 36, "p": "According to NFPA 1900, which is a necessary control/instrument that should be located on the operator’s panel?", "pg": "287", "o": ["Voltmeter", "Digital clock", "Aerial ladder joystick", "Outrigger control button"], "a": 0}, {"n": 37, "p": "The master intake and discharge gauges work as the primary gauges used by the D/O to determine the water:", "pg": "288", "o": ["velocity entering and leaving the pump.", "pressure entering and leaving the pump.", "velocity entering and leaving the hydrant.", "pressure entering and leaving the hydrant."], "a": 1}, {"n": 38, "p": "The pump discharge pressure gauge registers the pressure as it leaves the pump, but:", "pg": "288", "o": ["after it reaches the gauges for each discharge line.", "before it reaches the gauges for each discharge line.", "before it reaches the gauge for the largest discharge line.", "before it reaches the gauges for the smallest discharge line."], "a": 1}, {"n": 39, "p": "If a flowmeter is provided for an individual discharge, it must be within _____ of the pressure gauge.", "pg": "288", "o": ["1 inch (25 mm)", "2 inches (50 mm)", "3 inches (77 mm)", "4 inches (102 mm)"], "a": 1}, {"n": 40, "p": "What units of measurement are displayed on a tachometer?", "pg": "288", "o": ["Cycles per minute (cpm)", "Voltage per minute (vpm)", "Revolutions per minute (rpm)", "Miles per minute (mpm) (km/m)"], "a": 2}, {"n": 41, "p": "What happens if an engine operates with a too-cool temperature?", "pg": "289", "o": ["It is not as efficient", "Increases oil pressure", "Dries out the impellers", "Expands the water valve seals"], "a": 0}, {"n": 42, "p": "The ammeter indicates the status of the vehicle’s _____ and charging system.", "pg": "289", "o": ["battery", "alternator", "condenser", "lighting system"], "a": 1}, {"n": 43, "p": "What device is used to increase or decrease the speed of the engine powering the fire pump?", "pg": "290", "o": ["PTO", "Clutch", "Throttle", "Gear lever"], "a": 2}, {"n": 44, "p": "The primer control operates the priming device when the pump drafts from:", "pg": "290", "o": ["a hydrant.", "an onboard tank.", "a static water supply.", "another fire apparatus."], "a": 2}, {"n": 45, "p": "The D/O should verify the accuracy of the water level indicator by:", "pg": "290", "o": ["taking the truck to a weigh station.", "checking a second water level indicator.", "inspecting the fill opening to verify the tank is full.", "tapping the outer walls of the tank to hear if it sounds empty."], "a": 2}, {"n": 46, "p": "The piping system and the fire pump itself must be able to withstand a hydrostatic test of _____ before being placed into service.", "pg": "291", "o": ["125 psi (875 kPa)", "250 psi (1 750 kPa)", "500 psi (3 500 kPa)", "750 psi (5 250 kPa)"], "a": 2}, {"n": 47, "p": "According to NFPA 1900, pumpers with a tank capacity of less than 500 gallons (2 000 L), should have piping capable of flowing:", "pg": "291", "o": ["150 gpm (600 L/min).", "250 gpm (1 000 L/min).", "500 gpm (2 000 L/min).", "750 gpm (3 000 L/min)."], "a": 1}, {"n": 48, "p": "Based on NFPA 1900, a sufficient number of _____ discharge openings must be provided to flow the rated capacity of the pump.", "pg": "292", "o": ["1½ inch (38 mm)", "2½ inch (65 mm)", "3 inch (77 mm)", "4 inch (100 mm)"], "a": 1}, {"n": 49, "p": "A fire apparatus pump rated less than 750 gpm (3 000 L/min) must have at least _____ 2½ inch (65 mm) discharge(s).", "pg": "292", "o": ["one", "two", "three", "six"], "a": 0}, {"n": 50, "p": "A minimum of _____ piping, valves, and elbows must be used to supply discharges where 1½, 1¾, or 2 inch (38 mm, 45 mm, or 50 mm) handlines are attached.", "pg": "293", "o": ["1½ inch (38 mm)", "1¾ inch (45 mm)", "2 inch (50 mm)", "2½ inch (65 mm)"], "a": 2}, {"n": 51, "p": "According to NFPA 1900, apparatus equipped with tanks less than 1,000 gallons (4 000 liters) must have a tank fill line of at least _____ in diameter.", "pg": "294", "o": ["1 inch (25 mm)", "2 inch (50 mm)", "3 inch (75 mm)", "4 inch (100 mm)"], "a": 0}, {"n": 52, "p": "What can operate in conjunction with the tank-to-pump valve to circulate water through the pump to prevent overheating when no water flows?", "pg": "294", "o": ["Tank fill line", "Deluge valve", "Auxiliary pump", "Recirculating valve"], "a": 0}, {"n": 53, "p": "Gate or butterfly valves are also used on fire apparatus, frequently on:", "pg": "296", "o": ["tank intake.", "priming pump discharge.", "large-diameter intakes and discharges.", "small-diameter intakes and discharges."], "a": 2}, {"n": 54, "p": "Which is one of the three common valves that D/Os use to operate a fire pump?", "pg": "296", "o": ["Tank fill valve", "Cooler pump valve", "Riser clapper valve", "Three-way siamese valve"], "a": 0}, {"n": 55, "p": "Suction drains must be supplied at the _____ the pump and at the lowest point of each line connecting to it.", "pg": "296", "o": ["top of", "midpoint on", "lowest point on", "highest point on"], "a": 2}, {"n": 56, "p": "What is achieved by opening the bleeder valve on the line side of the intake valve?", "pg": "296", "o": ["Air can be forced out of the hose as the hose is empty of water", "A large amount of water can be forced out of the pump as the hose fills with water", "Air can be forced out of the hose and pass through the bleeder as the hose fills with water", "A large amount of water can be forced out of the pump and pass through the bleeder as the hose fills with water"], "a": 2}, {"n": 57, "p": "The pressure control device must operate within _____ seconds after the discharge pressure rises and restricts the pressure from exceeding 30 psi (210 kPa) above the set level.", "pg": "297", "o": ["one to two", "three to ten", "fifteen", "twenty"], "a": 1}, {"n": 58, "p": "The electronic governor constantly senses either PDP or rpm to send signals to the engine to control:", "pg": "297", "o": ["speed.", "velocity.", "pressure.", "temperature."], "a": 0}, {"n": 59, "p": "Because the speed of the impellers determines pressure, cutting engine speed:", "pg": "297", "o": ["reduces pump pressure.", "increases pump pressure.", "stabilizes pump temperature.", "increases pump temperature."], "a": 0}, {"n": 60, "p": "What is another advantage of the electronic governor when a discharge line closes?", "pg": "297", "o": ["The engine rpm adjusts, but the discharge pressure is maintained in just one line", "Engine temperature adjusts, but the discharge pressure is maintained in just one line", "The engine rpm adjusts, but the same discharge pressure is maintained on any lines still flowing", "Engine temperature adjusts, and the same discharge pressure is maintained on any lines still flowing"], "a": 2}, {"n": 61, "p": "What are the main features of a relief valve?", "pg": "297", "o": ["Sensitivity to high pressure and ability to balance excessive pressure", "Sensitivity to pressure change and ability to relieve excessive pressure", "Sensitivity to temperature change and ability to relieve excessive pressure", "Sensitivity to pressure change and ability to transfer excessive temperature"], "a": 1}, {"n": 62, "p": "While discharge pressure relief valves are quick to react to overpressure conditions, they take more time to reset to _____ positions.", "pg": "298", "o": ["on", "volume", "pressure", "all-closed"], "a": 3}, {"n": 63, "p": "Which valves protect attack companies from excessive pressure?", "pg": "298", "o": ["Deluge valves", "Tank-fill valves", "Discharge bleeder valves", "Intake pressure relief valves"], "a": 3}, {"n": 64, "p": "The ability to initiate a successful drafting operation depends on creating a:", "pg": "299", "o": ["balanced pressure within the pump and intake hose.", "variable pressure within the pump and discharge hose.", "lower pressure within the pump and intake hose than exists in the atmosphere.", "higher pressure within the pump and intake hose than exists in the atmosphere."], "a": 2}, {"n": 65, "p": "The amount of water that can be pumped by a rotary gear pump depends on the size of the:", "pg": "300", "o": ["orifices in the gears and speed of rotation.", "pockets in the gears and speed of rotation.", "orifices in the gears and speed of the engine.", "pockets in the gears and duration of the rotation."], "a": 1}, {"n": 66, "p": "Which positive displacement pump operates with moveable elements that automatically compensate for wear, maintaining a tighter fit with closer clearances with the pump in use?", "pg": "300", "o": ["Piston", "Centrifugal", "Rotary gear", "Rotary vane"], "a": 3}, {"n": 67, "p": "Which positive displacement primer requires relatively high rpm and can be driven by mechanical means from the pump transfer gear case?", "pg": "301", "o": ["Rotary gear", "Rotary vane", "Rotary cycle", "Rotary piston"], "a": 1}, {"n": 68, "p": "Which type of primer may be installed into older apparatus as an environmentally friendly initiative?", "pg": "302", "o": ["Oil-less", "Catalytic", "Vapor-less", "Centrifugal"], "a": 0}, {"n": 69, "p": "Which type of primer uses the apparatus compressor to supply a jet pump to create a Venturi effect that primes the pump?", "pg": "303", "o": ["Air", "Piston", "Vacuum", "Rotary vane"], "a": 0}, {"n": 70, "p": "Which temperature control device recirculates water from the discharge to the intake side of the pump?", "pg": "303", "o": ["Pump heater", "Engine cooler", "Pump cooler valve", "Thermal relief valve"], "a": 2}, {"n": 71, "p": "In which cooler system does the water supplied by the fire pump pass through a coil mounted inside the cooler and submerged in the coolant?", "pg": "304", "o": ["Radiator", "Marine cooler", "Engine cooler", "Immersion auxiliary cooler"], "a": 3}, {"n": 72, "p": "What can excessive leakage between the discharge and intake sides of a pump indicate?", "pg": "306", "o": ["That the pump is functioning properly", "That there is a blockage in the water supply", "That the pump is drawing air into the system", "That the pump is not able to develop necessary pressure or flows"], "a": 3}, {"n": 73, "p": "Any leakage seen from mechanical seals during a visual or operational check of the pump shaft seals indicates:", "pg": "306", "o": ["failure.", "good packing conditions.", "good lubrication of pump shaft seal.", "that seals need more time to adjust."], "a": 0}, {"n": 74, "p": "If a tank is at least 500 gallons, how much flow should a tank-to-pump valve be able to move?", "pg": "307", "o": ["250 gpm (1 000 L/min)", "500 gpm (2 000 L/min)", "750 gpm (3 000 L/min)", "1,000 gpm (4 000 L/min)"], "a": 1}, {"n": 75, "p": "According to NFPA 1900 and 1910, the true test of the accuracy of a gauge stands at:", "pg": "307", "o": ["150 psi (1 050 kPa), 200 psi (1 400 kPa), and 250 psi (1 750 kPa).", "300 psi (2 100 kPa), 350 psi (2 400 kPa), and 400 psi (2 800 kPa).", "400 psi (2 800 kPa), 450 psi (3 100 kPa), and 500 psi (3 450 kPa).", "500 psi (3 450 kPa), 550 psi (3 800 kPa), and 600 psi (4 100 kPa)."], "a": 0}]}, {"ch": 9, "title": "Pump Operations from Pressurized Sources", "qs": [{"n": 1, "p": "After properly positioning the apparatus at the scene, setting the parking brake, placing the pump into gear, and exiting the cab, then the D/O can:", "pg": "319", "o": ["evaluate the hose layout.", "make the pump operational.", "measure the water tank level.", "perform a size-up of the scene."], "a": 1}, {"n": 2, "p": "If the backup lever for engaging the pump is used because of a main lever malfunction, the main lever:", "pg": "319", "o": ["is no longer available.", "holds in the pump position.", "is moved to the off position.", "is moved out of pump position."], "a": 1}, {"n": 3, "p": "A D/O should verify putting the pump in gear by noting:", "pg": "320", "o": ["vehicle's lights dim.", "apparatus' computer report.", "the vehicle's indicator lights.", "how the parking brake is released."], "a": 2}, {"n": 4, "p": "When the pump engages, the apparatus often produces a:", "pg": "320", "o": ["piezo alert.", "long horn blast.", "different sound.", "short horn blast."], "a": 2}, {"n": 5, "p": "At a minimum, where should the wheels of the fire apparatus be chocked?", "pg": "320", "o": ["Rear of a drive wheel", "Front of a drive wheel", "Front and rear of a drive wheel", "Two chocks sit on the downhill sides of two wheels"], "a": 2}, {"n": 6, "p": "The initial source of water that firefighters typically use is a:", "pg": "320", "o": ["fire hydrant.", "pumper tank.", "natural water source.", "relay from another pumper."], "a": 1}, {"n": 7, "p": "In cases where a master stream is placed in operation, operating from the onboard tank:", "pg": "320", "o": ["is the only option.", "may NOT be feasible.", "is always the best option.", "will NOT cause cavitation."], "a": 1}, {"n": 8, "p": "Cavitation results from a situation known as overpumping that creates a _____ condition on the intake side of the pump.", "pg": "320", "o": ["no-pressure", "low-pressure", "high-pressure", "zero absolute pressure"], "a": 1}, {"n": 9, "p": "What is a visual indication that there is physical damage due to erosion on a pump and/or impeller?", "pg": "320", "o": ["Pitting of the metal", "Cracking of pump casing", "Discoloration of pump casing", "Water color at the pump discharge"], "a": 0}, {"n": 10, "p": "A sound like gravel going through the pump is a sign of:", "pg": "321", "o": ["implosion.", "cavitation.", "delamination.", "auto rotation."], "a": 1}, {"n": 11, "p": "To safely assist blitz attack operations, what must a D/O know?", "pg": "321", "o": ["How many hydrants are available", "The limitations of the internal water tank", "Estimated time until additional resources arrive", "How many firefighters are involved in the operation"], "a": 1}, {"n": 12, "p": "Immediately after pumping water from an apparatus onboard water tank, the D/O must see whether the master discharge gauge reads approximately_____ at idle.", "pg": "321", "o": ["90 psi (630 kPa)", "60 psi (420 kPa)", "50 psi (350 kPa)", "120 psi (840 kPa)"], "a": 2}, {"n": 13, "p": "If the pump does not develop pressure after a period of time determined by the manufacturer, the governor will:", "pg": "321", "o": ["shut off.", "increase.", "return to idle.", "sound a high pitch emergency horn."], "a": 2}, {"n": 14, "p": "Most primer manufacturers call for a high idle of about _____ when using the primer.", "pg": "321", "o": ["1,000 rpm", "4,000 rpm", "3,000 rpm", "2,000 rpm"], "a": 0}, {"n": 15, "p": "To help save fuel, the D/O can keep the pump discharge pressure (PDP) only at the level needed by the _____ discharge.", "pg": "322", "o": ["75% of all", "average off all", "lowest individual", "highest individual"], "a": 3}, {"n": 16, "p": "Discharge relief valves CANNOT control discharge pressures below:", "pg": "322", "o": ["90 psi (630 kPa).", "100 psi (690 kPa).", "110 psi (760 kPa).", "120 psi (830 kPa)."], "a": 0}, {"n": 17, "p": "When pumping multiple lines with varying pressures, the proper pressures can only be reached:", "pg": "322", "o": ["when water flows.", "before water flows.", "when the hoseline closes.", "when water flow is stopped."], "a": 0}, {"n": 18, "p": "When operating at an incident requiring more water than carried onboard the apparatus, the D/O must transition to an external water supply:", "pg": "323", "o": ["upon arrival at the fire scene.", "only when requested by the IC.", "after depleting the onboard tank.", "before depleting the onboard tank."], "a": 3}, {"n": 19, "p": "Before relocating an apparatus, the D/O must _____ the pump drive system.", "pg": "323", "o": ["flush", "prime", "engage", "disengage"], "a": 3}, {"n": 20, "p": "When the air has been purged from the bleeder and a(n) _____ stream of water drains from the valve, it may be shut.", "pg": "323", "o": ["clear", "steady", "forceful", "intermittent"], "a": 1}, {"n": 21, "p": "Pressure governor manufacturers recommend transitioning to a pressurized source with the governor in:", "pg": "324", "o": ["volume mode.", "pressure mode.", "offensive mode.", "defensive mode."], "a": 1}, {"n": 22, "p": "The D/O can _____ the intake valve to provide the intake side of the pump with the external supply.", "pg": "324", "o": ["slowly open", "slowly close", "quickly open", "quickly close"], "a": 0}, {"n": 23, "p": "When operating a two-stage pump, the D/O must consider where the _____ should be for best advantage before increasing the throttle.", "pg": "324", "o": ["forward lever", "transfer valve", "proper pressure", "discharge relief valve"], "a": 1}, {"n": 24, "p": "The two basic pressured water supply sources that the D/O will encounter include:", "pg": "324", "o": ["a fire hydrant and a swimming pool.", "a fire hydrant and a natural water source.", "a fire hydrant and a relay supply from another pumper.", "a natural water source and a relay supply from another pumper."], "a": 2}, {"n": 25, "p": "D/O should maintain a residual pressure of at least _____ on their master intake gauge during pumping operations that utilize positive pressure hydrants.", "pg": "325", "o": ["20 psi (140 kPa)", "30 psi (210 kPa)", "40 psi (280 kPa)", "50 psi (350 kPa)"], "a": 0}, {"n": 26, "p": "What is a reason the closest hydrant to the fire may NOT be the best choice?", "pg": "326", "o": ["It may be a safety hazard for personnel and apparatus", "The closest water source should always be used to protect fire apparatus", "Hydrant must be 300 feet from fire building to prevent potential contamination", "Water flow close to a sprinklered building is being used primarily for fire protection"], "a": 0}, {"n": 27, "p": "Dead end mains are served by:", "pg": "326", "o": ["larger main from one direction.", "smaller mains from one direction.", "larger mains from multiple directions.", "smaller mains from multiple directions."], "a": 1}, {"n": 28, "p": "A common practice for hydrant placement is dictated by:", "pg": "326", "o": ["local civil engineering policies.", "the type and model of a hydrant.", "the hydrant metal characteristics.", "hydrant manufacturer's requirements."], "a": 0}, {"n": 29, "p": "A common practice is to place hydrants about every _____ in residential areas.", "pg": "326", "o": ["500 feet (150 m)", "750 feet (230 m)", "1,000 feet (305 m)", "1,250 feet (380 m)"], "a": 0}, {"n": 30, "p": "A common practice is to place hydrants about every _____ in high-value commercial and industrial areas.", "pg": "326", "o": ["300 feet (90 m)", "400 feet (120 m)", "500 feet (150 m)", "600 feet (180 m)"], "a": 0}, {"n": 31, "p": "What should personnel do before connecting the intake hose to the hydrant?", "pg": "327", "o": ["Warm up the pump", "Wait for authorization from the D/O", "Briefly open the hydrant to flush debris", "Using a pitot tube, measure immediately"], "a": 2}, {"n": 32, "p": "Failure or reduction in the water supply or pressure from hydrants can result from:", "pg": "327", "o": ["its model or type.", "damaged pump systems.", "greater pressure than needed.", "pipes or hydrants that are frozen."], "a": 3}, {"n": 33, "p": "Hydrant specifications require a 5 inch (125 mm) valve opening for standard three-way hydrants and a _____ connection to the water main.", "pg": "328", "o": ["2 inch (50 mm)", "4 inch (100 mm)", "6 inch (150 mm)", "8 inch (200 mm)"], "a": 2}, {"n": 34, "p": "Dry-barrel hydrants are designed to work in climates with:", "pg": "328", "o": ["tropical temperatures.", "freezing temperatures.", "possibility of hurricanes.", "high possibility of earthquakes."], "a": 1}, {"n": 35, "p": "Wet-barrel hydrants hold water in the barrel of the hydrant:", "pg": "328", "o": ["at all times.", "while in use.", "during high-occupancy environments.", "when a key is turned opening the hydrant."], "a": 0}, {"n": 36, "p": "Wet-barrel hydrants work best in climates:", "pg": "328", "o": ["with humid temperatures.", "with freezing temperatures.", "with frost lines below 4 ft (1.2 m).", "without prolonged periods of subfreezing weather."], "a": 3}, {"n": 37, "p": "What do hydrant wrenches primarily do?", "pg": "330", "o": ["Open and close fire hydrant drainage line", "Apply heavy-duty force to hose connections", "Remove discharge caps from fire hydrant outlets and open fire hydrant valves", "Boost the pressure in the original supply line without interrupting flow in the line"], "a": 2}, {"n": 38, "p": "What type of valve controls the flow of a hydrant by turning a screw-type handle that lowers the baffle into the path of the water?", "pg": "330", "o": ["Ball valves", "Gate valves", "Hose clamps", "Check valves"], "a": 1}, {"n": 39, "p": "What allows additional hoselines to be connected to the hydrant?", "pg": "330", "o": ["Gate valves", "Hose clamps", "Hydrant valves", "Straight-line nozzles"], "a": 2}, {"n": 40, "p": "According to NFPA standards, personnel should inspect and operate fire hydrants at least _____ to verify reliable function and address needed repairs.", "pg": "331", "o": ["monthly", "semi-annually", "annually", "every 5 years"], "a": 2}, {"n": 41, "p": "One reason a D/O must learn how to operate fire hydrants is to:", "pg": "331", "o": ["perform periodic inspections.", "be able to operate in the dark.", "utilize positive pressure hydrants.", "maintain a buffer zone of the fireground."], "a": 0}, {"n": 42, "p": "To prevent damage to equipment and injury to firefighters, all hydrants must be opened and closed:", "pg": "331", "o": ["slowly.", "quickly.", "immediately.", "by multiple firefighters."], "a": 0}, {"n": 43, "p": "Closing a hydrant _____ may cause a surge in pressure (water hammer) within the water supply system.", "pg": "331", "o": ["too fast", "too slow", "before the pump is on", "after depleting the tank"], "a": 0}, {"n": 44, "p": "Connecting a pumper to a fire hydrant using a _____ intake hose requires coordination and teamwork.", "pg": "332", "o": ["soft", "hard", "long section of", "short section of"], "a": 1}, {"n": 45, "p": "As good practice when positioning an apparatus, the D/O should stop the apparatus with the intake of choice _____ of the hydrant outlet.", "pg": "332", "o": ["at the rear", "just in front", "completely past", "on the opposite side"], "a": 1}, {"n": 46, "p": "What procedure consists of stopping the apparatus at the hydrant dropping the end of one or more supply hoselines at the hydrant, and then proceeding to the fire location?", "pg": "333", "o": ["Split lay", "Reverse lay", "Forward lay", "Combination lay"], "a": 2}, {"n": 47, "p": "If a pumper runs out of hose before reaching the fire scene:", "pg": "333", "o": ["set up a portable tank and then call for additional units.", "the pumper must be relocated and start a new hose set up.", "set the pumper where the hose ran out and set a new hose layout.", "more hose may be brought in, or a relay pumping operation may be set up."], "a": 3}, {"n": 48, "p": "Hose is laid from the fire to the water source in which type of hose lay?", "pg": "334", "o": ["Split lay", "Reverse lay", "Forward lay", "Combination lay"], "a": 1}, {"n": 49, "p": "What type of hose lay is the most direct method of supplementing hydrant pressure or performing drafting operations?", "pg": "334", "o": ["Split lay", "Reverse lay", "Forward lay", "Combination lay"], "a": 1}, {"n": 50, "p": "A common two-pumper operation in a reverse lay provides for a water supply pumper and a(n):", "pg": "336", "o": ["extra pumper.", "attack pumper.", "ladder/pumper.", "tender/pumper."], "a": 1}, {"n": 51, "p": "Which refers to ways to lay multiple supply hose with a single engine?", "pg": "337", "o": ["Split lay", "Reverse lay", "Forward lay", "Combination lay"], "a": 3}, {"n": 52, "p": "Supply hose must be loaded into two separate hose bed compartments in order to make a:", "pg": "337", "o": ["split lay.", "reverse lay.", "forward lay.", "combination lay."], "a": 3}, {"n": 53, "p": "Hoses with _____ may be laid in either direction without adapters.", "pg": "337", "o": ["male adapters", "female adapters", "threaded couplings", "nonthreaded couplings"], "a": 3}, {"n": 54, "p": "When the pump and water pressure stabilize with no water flowing, the D/O should note the _____ pressure reading before they begin to pump.", "pg": "337", "o": ["static", "residual", "dynamic", "atmospheric"], "a": 0}, {"n": 55, "p": "When the pumper is discharging water, the intake gauge displays the:", "pg": "337", "o": ["low pressure.", "static pressure.", "residual pressure.", "atmospheric pressure."], "a": 2}, {"n": 56, "p": "The difference between static pressure and _____ helps determine how much more water the hydrant can supply.", "pg": "337", "o": ["low pressure", "static pressure", "residual pressure", "atmospheric pressure"], "a": 2}, {"n": 57, "p": "The D/O needs to know the static pressure of the water system from preplanning documents or from experience to use the:", "pg": "339", "o": ["friction loss data.", "first-digit method.", "atmospheric pressure-loss.", "squaring-the-lines method."], "a": 3}]}, {"ch": 10, "title": "Pump Operations from Static Water Supply", "qs": [{"n": 1, "p": "When a fire apparatus drafts from a source, the source may be classified as _____ if it is not connected to a pressurized water piping system.", "pg": "359", "o": ["static", "mobile", "primary", "secondary"], "a": 0}, {"n": 2, "p": "The difference in elevation between the surface of the static water supply and center of the pump intake is referred to as:", "pg": "360", "o": ["lift.", "gravity.", "pressure.", "cavitation."], "a": 0}, {"n": 3, "p": "To begin drafting operations, most of the air inside the pump evacuates, creating a:", "pg": "360", "o": ["maximum lift.", "dependable lift.", "perfect vacuum.", "pressure differential."], "a": 3}, {"n": 4, "p": "When moving water, pumps must develop a vacuum capacity of:", "pg": "360", "o": ["11 in Hg (-37kPa).", "22 in Hg (-75kPa).", "33 in Hg (-112 kPa).", "44 in Hg (-150 kPa)."], "a": 1}, {"n": 5, "p": "What type of suction hose is translucent, allowing the operator to see the water inside and any air leaks?", "pg": "360", "o": ["Kevlar", "Leather", "Traditional, rubber", "Flexible, PVC-constructed"], "a": 3}, {"n": 6, "p": "Generally speaking, apparatus in good repair can draft water to a height of approximately:", "pg": "361", "o": ["10 feet (3 m).", "20 feet (6 m).", "30 feet (9 m).", "40 feet (12 m)."], "a": 1}, {"n": 7, "p": "Pumpers cannot be expected to draft water that sits _____ below the level of the pump at sea level.", "pg": "361", "o": ["9.8 feet (3 m)", "19.6 feet (6 m)", "33.8 feet (10 m)", "39.4 feet (12 m)"], "a": 2}, {"n": 8, "p": "Which of the following means the greatest height to which any amount of water may be raised through an intake hose to the pump?", "pg": "361", "o": ["Maximum lift", "Theoretical lift", "Operational lift", "Dependable lift"], "a": 0}, {"n": 9, "p": "In most circumstances, maximum lift reaches about:", "pg": "361", "o": ["15 feet (4.5 m).", "20 feet (6 m).", "25 feet (7.5 m).", "30 feet (9 m)."], "a": 2}, {"n": 10, "p": "Which of the following refers to the height of a column of water being lifted to provide a reliable fire flow?", "pg": "362", "o": ["Maximum lift", "Theoretical lift", "Operational lift", "Dependable lift"], "a": 3}, {"n": 11, "p": "After 25 feet (7.5 m) of dependable lift, maximum suction capacity is so challenged, and the loss is so great, that the resulting expected capacity is:", "pg": "362", "o": ["only about 60 percent.", "only about 70 percent.", "too low to be considered for drafting.", "too high to be considered for drafting."], "a": 2}, {"n": 12, "p": "What two things must first be considered when evaluating a potential water supply source?", "pg": "364", "o": ["Cost and adequacy", "Cost and accessibility", "Adequacy and adaptability", "Adequacy and accessibility"], "a": 3}, {"n": 13, "p": "Some natural water sources provide _____, which allow a pumper to draft without the complications of putting hard suction hoses directly into the source.", "pg": "364", "o": ["dry hydrants", "wet hydrants", "storage tanks", "permanent supply hoses"], "a": 0}, {"n": 14, "p": "What is a major factor in determining the usability of a static water supply source?", "pg": "364", "o": ["Whether or not water is potable", "Obtaining permits from the local authorities", "How many recreational vehicles are present", "Whether or not a fire apparatus can be set up at the site"], "a": 3}, {"n": 15, "p": "Which of the following situations could contribute to a pumper NOT being able to position itself properly at a static water source?", "pg": "365", "o": ["High water levels", "Fortified parking surfaces", "Public boat launching ramps", "High banks around the water source"], "a": 3}, {"n": 16, "p": "Fire departments are encouraged to use _____ to ensure access at drafting sites.", "pg": "365", "o": ["neutral sites", "annual permits", "public property only", "preincident planning"], "a": 3}, {"n": 17, "p": "Which route type is the safest and most efficient when conducting a water tender shuttle?", "pg": "366", "o": ["Direct", "Circular", "Primary", "Standard"], "a": 1}, {"n": 18, "p": "In general, the minimum amount of water around a barrel-type strainer is:", "pg": "366", "o": ["1 foot (300 mm).", "2 feet (600 mm).", "3 feet (900 mm).", "4 feet (1200 mm)."], "a": 1}, {"n": 19, "p": "What type of strainer can draw water from above a weed-covered, sandy or rocky bottom of a natural static source?", "pg": "366", "o": ["Floating", "Low-level", "Barrel-type", "Attachment"], "a": 0}, {"n": 20, "p": "The procedure that is used to dislodge debris from a strainer is known as:", "pg": "367", "o": ["de-clogging.", "back flushing.", "Venturi effect.", "water tender shuttling."], "a": 1}, {"n": 21, "p": "What allows for more efficient access to a natural supply source through a pre-piped installation?", "pg": "367", "o": ["Cistern", "Dry-hydrant", "Fire hydrant", "Back flushing"], "a": 1}, {"n": 22, "p": "Each time nonpotable water is pumped through the apparatus, the pump and piping should be:", "pg": "368", "o": ["sent to a special cleaning facility.", "flushed with foam/water solution.", "flushed with fresh water as soon as possible.", "emptied and allowed to dry completely before next use."], "a": 2}, {"n": 23, "p": "Which of the following artificial static water supply sources are usually found in areas NOT serviced by a hydrant system?", "pg": "368 - 369", "o": ["Cistern", "Ground reservoirs", "Private water storage tanks", "Agricultural irrigation systems"], "a": 0}, {"n": 24, "p": "Artificial static water supply sources that resemble ponds or lakes may offer more accessibility for fire apparatus than natural bodies of water because of their strategic area are known as:", "pg": "369", "o": ["cisterns.", "swimming pools.", "ground reservoirs.", "private water storage tanks."], "a": 2}, {"n": 25, "p": "What artificial static water supply source may be difficult to access due to lack of an acceptable driving surface, fences, or undersurface drainage and utility vaults?", "pg": "370", "o": ["Cisterns", "Swimming pools", "Ground reservoirs", "Water storage tanks"], "a": 1}, {"n": 26, "p": "When conducting preincident planning, the accessibility and _____ of swimming pools should be determined before being considered for fire protection.", "pg": "370", "o": ["cost", "shape", "capacity", "chlorine percentage"], "a": 2}, {"n": 27, "p": "Which artificial static water supply source supplies water via open canals and portable pipes?", "pg": "372", "o": ["Cisterns", "Lakes and ponds", "Ground reservoirs", "Agricultural irrigation systems"], "a": 3}, {"n": 28, "p": "During drafting operations, a hose with smaller diameter and greater length creates _____ friction loss.", "pg": "373", "o": ["zero", "level", "lower", "higher"], "a": 3}, {"n": 29, "p": "When water is being discharged faster than it comes into the pump, it is referred to as:", "pg": "373", "o": ["cavitation.", "maximum lift.", "Venturi effect.", "theoretical lift."], "a": 0}, {"n": 30, "p": "Intake gauge readings below _____ indicates cavitation during drafting.", "pg": "374", "o": ["10 in Hg (35 kPa)", "20 in Hg (70 kPa)", "30 in Hg (100 kPa)", "40 in Hg (135 kPa)"], "a": 1}, {"n": 31, "p": "In order for a pumper to approach its rated capacity using a traditional strainer, there must be at least _____ of water over the strainer.", "pg": "375", "o": ["12 inches (300 mm)", "24 inches (600 mm)", "36 inches (900 mm)", "48 inches (1 200 mm)"], "a": 1}, {"n": 32, "p": "The rapid intake of water may cause a _____ that can result in allowing air into the intake hose, causing the pump to lose its prime.", "pg": "375", "o": ["whirlpool", "cavitation", "Venturi effect", "perfect vacuum"], "a": 0}, {"n": 33, "p": "When using a portable tank or swimming pool for drafting operations, a _____ strainer becomes the appliance of choice.", "pg": "375", "o": ["floating", "low-level", "barrel-type", "medium immersion"], "a": 1}, {"n": 34, "p": "What issue becomes a factor when selecting an acceptable location for drafting ocean water?", "pg": "375", "o": ["Crowd control", "Tidal movements", "Recreational vehicles", "Water temperatures above freezing"], "a": 1}, {"n": 35, "p": "When connecting to the pump, incorrect positioning of the _____ may result in the formation of an air pocket that can prevent effective drafting.", "pg": "376", "o": ["intake hose", "supply tank", "discharge valve", "pressure vacuum"], "a": 0}, {"n": 36, "p": "When priming a two-stage pump, what position must the transfer valve be in?", "pg": "377", "o": ["Intake", "Parallel", "Primary", "Pressure"], "a": 1}, {"n": 37, "p": "After priming the pump, opening the discharge valve too quickly may draw air into the pump and:", "pg": "377", "o": ["cause a loss of prime.", "the pump may overheat.", "water hammer may occur.", "the hard section hose can over-pressurize."], "a": 0}, {"n": 38, "p": "As the primer operates, the vacuum reading should _____ as atmospheric pressure forces water into the intake hose.", "pg": "377", "o": ["increase", "level out", "decrease", "remain steady"], "a": 0}, {"n": 39, "p": "The priming action should continue until all air has been removed and:", "pg": "377", "o": ["a suction sound is heard.", "the pump shuts off automatically.", "a steady stream of water discharges.", "an intermittent stream of water discharges."], "a": 2}, {"n": 40, "p": "What issue drives more priming failures than any other cause?", "pg": "377", "o": ["Air leaks", "Water leaks", "Engine speed", "Electrical problems"], "a": 0}, {"n": 41, "p": "Constant movement of water through the pump prevents:", "pg": "378", "o": ["whirlpool.", "overheating.", "water hammer.", "blockage development."], "a": 1}, {"n": 42, "p": "When operating the pump from draft, the engine temperature gauge must be kept within the _____ operating range.", "pg": "379", "o": ["cooler", "normal", "warmer", "exceptional"], "a": 1}, {"n": 43, "p": "What is the most common source of problems while operating a draft?", "pg": "379", "o": ["Air leak in the discharge valve", "Air leak on the intake side of the pump", "Whirlpool allowing air to enter the pump", "Water leak on the supply side of the pump"], "a": 1}, {"n": 44, "p": "When operating a draft, the most common blockage location is at the:", "pg": "379", "o": ["strainer.", "coupling.", "flowmeter.", "discharge valve."], "a": 0}, {"n": 45, "p": "The pump's capacity is determined in a given scenario by the diameter and length of the intake hose, strainer design, and _____ lift.", "pg": "380", "o": ["vertical", "horizontal", "maximum", "dependable"], "a": 0}, {"n": 46, "p": "After the pump has been drained and the connections removed, operate the positive displacement primer for several seconds until _____ comes out of the discharge from the priming pump.", "pg": "380", "o": ["air", "water", "foam mixture", "primer oil or fluid"], "a": 3}]}, {"ch": 11, "title": "Fireground Pump Operations", "qs": [{"n": 1, "p": "What is the first priority during fireground operations?", "pg": "387", "o": ["Life safety", "Fire suppression", "Incident stabilization", "Property conservation"], "a": 0}, {"n": 2, "p": "What does the IC do to determine if lives can be saved without unnecessary risk to firefighters?", "pg": "387", "o": ["Risk-benefit analysis", "Prioritize property conservation", "Analyze after an offensive attack", "Focus solely on saving the lives of victims"], "a": 0}, {"n": 3, "p": "What type of strategy means that you intend to attack the fire directly (interior or transitional attack) and/or conduct a search?", "pg": "388", "o": ["Direct", "Indirect", "Offensive", "Defensive"], "a": 2}, {"n": 4, "p": "In what extreme situation in an offensive strategy does rescue take priority over fire attack?", "pg": "388", "o": ["When a victim is trapped", "When a victim is ambulatory", "When the fire and rescue can occur simultaneously", "When the fire attack can be completed with reduced risk to firefighters"], "a": 0}, {"n": 5, "p": "When implementing a defensive strategy, firefighters will typically:", "pg": "388", "o": ["enter the burning building to attack the fire.", "remain outside the burning building and not enter.", "search for any potential victims inside the building.", "prioritize saving the burning structure over adjacent buildings."], "a": 1}, {"n": 6, "p": "What outweighs any possible gain in attempting to save property in a defensive strategy?", "pg": "389", "o": ["The risk to firefighters", "The probability of saving lives", "The gain of saving the property", "The need for additional resources"], "a": 0}, {"n": 7, "p": "What is the most efficient method for extinguishing free-burning fires?", "pg": "389", "o": ["Indirect attack", "Combination attack", "Direct attack with a fog stream", "Direct attack using a solid or straight stream"], "a": 3}, {"n": 8, "p": "Which of the following is true regarding an indirect attack in firefighting?", "pg": "389", "o": ["It fills the compartment with clean air", "It produces less steam than a direct attack", "It does not require coordination with ventilation", "It results in a uniform temperature from floor to ceiling"], "a": 3}, {"n": 9, "p": "What is the desired effect of discharging water during an indirect attack on a fire from the exterior?", "pg": "390", "o": ["Extinguish the fire immediately", "Create more sources of ventilation", "Reducing the amount of smoke and steam in the structure", "Reduce the temperature of the heated overhead and the room"], "a": 3}, {"n": 10, "p": "What should firefighters do before entering a room that has been attacked indirectly with water?", "pg": "390", "o": ["Check the stability of the walls and ceiling", "Wait for the water to evaporate completely", "Ensure that the fire has been completely extinguished", "Create a new ventilation system to allow steam to escape"], "a": 3}, {"n": 11, "p": "What is the risk of excessive application of water during a combination attack?", "pg": "391", "o": ["It may create a fire whirl", "It may disturb ventilation", "It may cause the fire to spread", "It may cause unnecessary water damage"], "a": 3}, {"n": 12, "p": "Using exterior water application to transition a fire from ventilation-limited conditions to fuel-limited conditions is known as a(an) _____ attack.", "pg": "391", "o": ["direct", "indirect", "transitional", "combination"], "a": 2}, {"n": 13, "p": "What is the advantage of using a straight stream over a fog stream in a well-involved, unventilated interior fire?", "pg": "391", "o": ["Generates more heat and steam", "Better at upsetting thermal layering", "Better reach to knock down the body of a fire", "More effective at controlling flashover conditions"], "a": 2}, {"n": 14, "p": "A D/O must provide _____ for sprinkler and standpipe systems during fireground operations.", "pg": "392", "o": ["friction loss calculations", "detailed piping schematics", "approved building floor plans", "adequate water and pressure support"], "a": 3}, {"n": 15, "p": "What determines the flow of sprinklers in a sprinkler system?", "pg": "393", "o": ["The cost of the sprinkler system", "The type of hazard being protected", "The brand name of the sprinkler system", "The date of installation of the sprinkler system"], "a": 1}, {"n": 16, "p": "The design area of a fire sprinkler system is calculated using a specific number of sprinkler heads:", "pg": "393", "o": ["closest to the riser.", "farthest from the riser.", "with the most sprinkler heads.", "with the highest hazard rating."], "a": 1}, {"n": 17, "p": "When should the FDC be charged with water?", "pg": "393", "o": ["Only when the fire is out", "Only when directed by the IC", "Whenever the D/O engages the pump", "Whenever the sprinkler system is activated"], "a": 1}, {"n": 18, "p": "What are the two types of connections that an FDC may consist of?", "pg": "393", "o": ["Two large-diameter sexless connections or one small-diameter connection", "One large-diameter sexless connection and one small-diameter connection", "One 2½ inch (65 mm) female connection and one small-diameter connection", "Two 2½ inch (65 mm) female connections or one large-diameter sexless connection"], "a": 3}, {"n": 19, "p": "What is the minimum connection size for FDCs in residential structures?", "pg": "393", "o": ["1 inch (25 mm)", "1¼ inch (32 mm)", "1½ inch (40 mm)", "2 inch (50 mm)"], "a": 2}, {"n": 20, "p": "Once personnel connect lines to the sprinkler FDC, why should the discharge valves be opened slowly?", "pg": "394", "o": ["To surge water to the FDC", "To increase water pressure", "To decrease water pressure", "To prevent damage to the FDC"], "a": 3}, {"n": 21, "p": "Where can the suggested discharge pressure be found for a sprinkler FDC?", "pg": "394", "o": ["In the D/O's equipment bag", "In the fire department's database", "Printed on the sprinkler system control panel", "Printed on a plate located on or near the FDC"], "a": 3}, {"n": 22, "p": "According to NFPA 13E, unless the system is posted for a different pressure, or if no other specific information is available from a pre-plan, the general guideline is to supply ____ into the FDC.", "pg": "394", "o": ["100 psi (700 kPa)", "125 psi (875 kPa)", "150 psi (1 050 kPa)", "175 psi (1 225 kPa)"], "a": 2}, {"n": 23, "p": "What is the maximum pressure that a residential sprinkler system should be pressurized to according to NFPA 13E?", "pg": "394", "o": ["50 psi (350 kPa)", "75 psi (525 kPa)", "100 psi (700 kPa)", "Water main pressure"], "a": 3}, {"n": 24, "p": "What is the purpose of standpipe systems?", "pg": "394", "o": ["Prevent fires from starting", "Detect fires before they become large", "Provide water for foam operations in all parts of the building", "To connect attack lines for manual fire attack in remote parts of the building"], "a": 3}, {"n": 25, "p": "In what types of structures are standpipe systems most common?", "pg": "394", "o": ["Mobile homes", "High-rise structures", "Single-family homes", "One-story structures such as large warehouses"], "a": 1}, {"n": 26, "p": "What is the value of standpipes in large-area, one-story buildings?", "pg": "395", "o": ["Suppress fires before they become too large", "Prevent fires from expanding to unoccupied areas", "Provide supplemental water for industrial operations", "Reduces the effort required to advance hoselines long distances"], "a": 3}, {"n": 27, "p": "What is the purpose of a standpipe in most high-rise buildings?", "pg": "395", "o": ["Prevent fires from starting", "Detect fires before they become large", "Provide water for industrial operations", "Manually control a fire on the upper floors"], "a": 3}, {"n": 28, "p": "What size connections can fire attack teams connect to on each floor level of a high-rise building with a standpipe system?", "pg": "395", "o": ["1 inch (25 mm) or 1¼ inch (32 mm)", "1½ inch (38 mm) or 2½ inch (65 mm)", "2 inch (50 mm)", "3 inch (75 mm)"], "a": 1}, {"n": 29, "p": "What type of hose is typically installed at the standpipe connection for occupant use?", "pg": "395", "o": ["Triple-jacket", "Single-jacket", "Double-jacket", "Chemical resistant"], "a": 1}, {"n": 30, "p": "How much pressure loss is typically accounted for in hydraulic calculations for supplying an FDC for sprinkler systems and standpipes?", "pg": "395", "o": ["10 psi (70 kPa)", "15 psi (105 kPa)", "20 psi (140 kPa)", "25 psi (175 kPa)"], "a": 3}, {"n": 31, "p": "The friction loss in a standpipe system may be significant when:", "pg": "396", "o": ["the flow is large.", "the flow is small.", "the nozzle is too small.", "the FDC is located near the standpipe."], "a": 0}, {"n": 32, "p": "Which statement is true regarding the pressure requirements for standpipe systems serving high-rise buildings?", "pg": "396", "o": ["They require less water pressure due to the height of the building", "They require more water pressure due to the height of the building", "They require less water pressure than standpipe systems serving low-rise buildings", "They require the same water pressure as standpipe systems serving low-rise buildings"], "a": 1}, {"n": 33, "p": "When a standpipe system includes pressure-reducing valves, the elevation pressure must be based on the:", "pg": "396", "o": ["number of floors above the FDC.", "total height of the standpipe or zone being used.", "number of hoselines connected to the standpipe.", "total number of pressure-reducing valves installed."], "a": 1}, {"n": 34, "p": "If the pressure at a particular valve in a standpipe system lies below that for which the valve was adjusted, it will result in:", "pg": "396", "o": ["over-expansion of hoselines.", "unchanged pressure for attack hoselines.", "inadequate pressure for attack hoselines.", "a closing of the PRV in the sprinkler system."], "a": 2}, {"n": 35, "p": "Leaving valves in an open position in a dry standpipe system will:", "pg": "397", "o": ["make the system malfunction.", "reduce the water pressure in the system.", "increase the water pressure in the system.", "not affect the water pressure in the system."], "a": 1}, {"n": 36, "p": "To coordinate efforts and keep the correct riser charged, what should D/Os do when a building has multiple standpipes?", "pg": "397", "o": ["Disconnect all standpipes that are not in use", "Charge all of the standpipes from the same FDC", "Ignore standpipes that are not needed and only use the first one encountered", "Monitor radios for information about companies advancing onto a floor from different directions"], "a": 3}, {"n": 37, "p": "What can personnel do if an individual hose valve on an upper floor fails?", "pg": "397", "o": ["Connect hoselines on the fire floor", "Use a valve on the next floor down", "Charge the standpipe from the ground level", "Use a double male with a double female coupling"], "a": 1}, {"n": 38, "p": "Besides hoisting a hoseline up the outside of a building, what can firefighters do if the standpipe in a single-riser building seems unserviceable?", "pg": "398", "o": ["Flip the check valve on the FDC", "Use a standpipe in an adjacent building", "Increase the throttle on the pump supply", "Unroll hose down the side of the building from every second or third floor"], "a": 3}, {"n": 39, "p": "What is the advantage of using an aerial device to supply hoselines on upper-floor levels?", "pg": "398", "o": ["It is always the safest option", "It can reach higher than any other device", "It can be used for multiple rescue operations simultaneously", "It has much less friction loss than hose used for the same distance"], "a": 3}, {"n": 40, "p": "What should the D/O do when there is an indication that water supply or pumping ability may be unattainable or interrupted?", "pg": "398", "o": ["Ignore the indication", "Wait for the IC to provide more information", "Wait for a few minutes to see if the issue resolves itself", "Notify the IC and the officer or officers on any fire streams provided"], "a": 3}, {"n": 41, "p": "What should the D/O do when a charged supply line suddenly loses water?", "pg": "398", "o": ["Immediately call for backup", "Call for additional apparatus to help solve the problem", "Shut down the pump and switch to an alternative water supply", "Determine the source of the problem by following logical steps back to the source"], "a": 3}, {"n": 42, "p": "A relay pumping operation is an operation where:", "pg": "399", "o": ["water is supplied to a single pumper from a water source.", "a pumper is used to pump water from a fire hydrant to a building.", "a pumper is used to pump water from a remote source to an attack pumper.", "two or more pumpers pump water from the same source to the same location."], "a": 2}, {"n": 43, "p": "What is necessary for maximum proficiency in relay pumping operations?", "pg": "399", "o": ["Using hose of different diameters", "Connecting multiple pumpers in parallel", "Training together and using compatible equipment", "Using multiple supply lines to meet fireground requirements"], "a": 2}, {"n": 44, "p": "Which type of hose diameter generally requires one supply line to meet fireground requirements during relay pumping operations?", "pg": "399", "o": ["2 inch (50 mm)", "6 inch (150 mm)", "Large-diameter hose (LDH)", "Medium-diameter hose (MDH)"], "a": 2}, {"n": 45, "p": "Which apparatus should have the largest pumping capacity in a relay pumping operation?", "pg": "400", "o": ["Rescue truck", "Water tender", "Attack pumper", "Supply pumper"], "a": 3}, {"n": 46, "p": "What is the function of a fire attack pumper in relay pumping operations?", "pg": "400", "o": ["Act as a pumper or pumpers connected within the relay", "Supply the attack lines and appliances required for fire suppression", "Increase the pressure and supply water to the next apparatus in the relay", "Take water from a hydrant or static source and pump it under pressure to the next apparatus"], "a": 1}, {"n": 47, "p": "What is the function of intake relief valves in firefighting?", "pg": "402", "o": ["Minimize water waste", "To release excess pressure", "Regulate water flow to the fire", "Increase water pressure to the pump"], "a": 1}, {"n": 48, "p": "Which type of intake relief valve (IRV) is required by NFPA 1900 in case of a surge in the system?", "pg": "402", "o": ["Bleeder valve", "In-line relay valve", "Master intake relief valve", "Screw-on intake relief valve"], "a": 2}, {"n": 49, "p": "What is the purpose of a bleeder valve in intake relief valves?", "pg": "402", "o": ["Minimize water waste", "Regulate water flow to the fire", "Increase water pressure to the pump", "Vent air from the hose before it travels down the line"], "a": 3}, {"n": 50, "p": "The adjustment of some intake relief valves is made possible with a(an):", "pg": "403", "o": ["clapper valve.", "bleeder valve.", "Storz coupling.", "electric or air pressure actuator."], "a": 3}, {"n": 51, "p": "What happens when the incoming pressure exceeds the set level in an intake relief valve?", "pg": "403", "o": ["The valve closes and water flow stops", "The valve diverts water to another intake", "The valve adjusts to the new pressure level automatically", "The valve opens and water is released until proper pressure is reached"], "a": 3}, {"n": 52, "p": "What is the purpose of using in-line relay valves in firefighting operations?", "pg": "403", "o": ["Interrupt the water supply", "Increase spacing between pumpers", "Reduce water pressure in the system", "Boost pressure and volume in the hose"], "a": 3}, {"n": 53, "p": "What is the relationship between hose lay distance and friction loss in relay pumping operations?", "pg": "403", "o": ["The longer the hose lay distance, the less friction loss", "The longer the hose lay distance, the more friction loss", "The shorter the hose lay distance, the more friction loss", "The distance affects only friction loss of certain types of hose"], "a": 1}, {"n": 54, "p": "How does elevation impact pressure loss on the hose lay?", "pg": "404", "o": ["Elevation does not impact pressure loss on the hose lay", "Uphill pumping causes more pressure loss than downhill pumping", "Downhill pumping causes more pressure loss than uphill pumping", "The amount of pressure loss is the same for uphill and downhill pumping"], "a": 1}, {"n": 55, "p": "How can flow be increased during relay pumping operations?", "pg": "404", "o": ["Adding more pumpers to the system", "Increasing the length of hose in the system", "Decreasing the diameter of the supply hose", "Decreasing the discharge pressure of the pumpers"], "a": 0}, {"n": 56, "p": "Adding apparatus to a relay operation that did not have in-line valves from the outset:", "pg": "404", "o": ["reduces the flow rate through the system.", "increases the diameter of the supply hose.", "requires additional pumpers to be added to the system.", "requires the shutdown of the water supply until the apparatus is added."], "a": 3}, {"n": 57, "p": "A relay pumping operation begins with the:", "pg": "408", "o": ["largest capacity pumper working from the water source.", "pumpers working simultaneously from the water source.", "smallest capacity pumper working from the water source.", "attack pumpers working sequentially from the water source."], "a": 0}, {"n": 58, "p": "What determines the overall capacity of the relay pumping system?", "pg": "408", "o": ["The flow requirements of the incident", "The number of pumpers involved in the relay", "The largest pump and diameter of hose used in the relay", "The smallest pump and diameter of hose used in the relay"], "a": 3}, {"n": 59, "p": "Why should the source pumper open a discharge or allow water to discharge through a waste line in relay pumping operations?", "pg": "408", "o": ["To conserve water in the system", "To reduce the pressure in the system", "To prevent pump cavitation in the system", "To prevent loss of prime or overheating of the pump"], "a": 3}, {"n": 60, "p": "What intake pressure should the D/O maintain on a relay pumper in relay pumping operations?", "pg": "408", "o": ["10 to 25 psi (70 to 175 kPa)", "20 to 50 psi (140 to 210 kPa)", "30 to 75 psi (210 to 520 kPa)", "40 to 100 psi (280 to 690 kPa)"], "a": 1}, {"n": 61, "p": "In relay pumping operations, what should the D/O do as water reaches each pumper?", "pg": "408", "o": ["Decrease the intake pressure on the pumper", "Increase the discharge pressure on the pumper", "Bleed air from the line before opening the intake valve", "Close the discharge valve before opening the tank-to-pump valve"], "a": 2}, {"n": 62, "p": "Apparatus equipped with pressure governors should be set in _____ mode when working as a relay pumper in relay pumping operations.", "pg": "408", "o": ["rpm", "flow", "volume", "pressure"], "a": 0}, {"n": 63, "p": "How much above the static pressure of the water system should the adjustable intake relief valve be set to in relay pumping operations?", "pg": "409", "o": ["5 psi (35 kPa)", "10 psi (70 kPa)", "15 psi (105 kPa)", "20 psi (140 kPa)"], "a": 1}, {"n": 64, "p": "What is the recommended range for setting the adjustable intake relief valve on an attack pumper?", "pg": "410", "o": ["25 to 50 psi (175 to 350 kPa)", "50 to75 psi (350 to 525 kPa)", "75 to 100 psi (525 to 700 kPa)", "100 to 125 psi (700 to 875 kPa)"], "a": 1}, {"n": 65, "p": "When an attack line gets shut down or the amount of discharge changes, what happens to the residual pressure and friction loss in the supply line?", "pg": "410", "o": ["Residual pressure increases, friction loss increases", "Residual pressure decreases, friction loss increases", "Residual pressure increases, friction loss decreases", "Residual pressure decreases, friction loss decreases"], "a": 2}, {"n": 66, "p": "At what intake pressure level should the D/O of the attack pumper NOT attempt to correct minor pressure fluctuations during relay pumping operations?", "pg": "410", "o": ["Above 5 psi (35 kPa)", "Above 10 psi (70 kPa)", "Above 15 psi (105 kPa)", "At or above 20 psi (140 kPa)"], "a": 3}, {"n": 67, "p": "What is the primary concern when attempting to achieve an exact pressure during relay pumping operations?", "pg": "410", "o": ["Delayed pressure changes", "Rapid increase in friction loss", "Affecting other pumpers in the relay", "Overcompensating for pressure changes"], "a": 2}, {"n": 68, "p": "What is the last resort for communication if no other method is available during relay pumping operations?", "pg": "410", "o": ["Using a PA system", "Using hand signals", "Using the fireground channel", "Using firefighters as messengers between apparatus"], "a": 3}, {"n": 69, "p": "What is the purpose of systematically proceeding back to the source pumper when ending a relay pumping operation?", "pg": "410", "o": ["To prevent water hammer", "Ensure that the pumps do not run dry", "Allow for refilling of onboard fuel tanks", "Make sure that all pumpers are in the same location"], "a": 1}, {"n": 70, "p": "How does tandem pumping differ from relay pumping?", "pg": "411", "o": ["Tandem pumping and relay pumping are the same thing", "Tandem pumping only involves one pumper, while relay pumping involves multiple pumpers", "Tandem pumping is designed to increase pressure, while relay pumping sends volume over distance", "Tandem pumping involves connecting multiple pumps in parallel, while relay pumping involves connecting pumps in series"], "a": 2}, {"n": 71, "p": "What are some situations that may require a tandem pumping operation?", "pg": "411", "o": ["When filling onboard water tanks", "When only one pumper is available", "When the attack pumper is located far from the water source", "When pressures higher than a single engine can supply are required"], "a": 3}, {"n": 72, "p": "In tandem pumping operations, what is the maximum distance that apparatus may be located apart from each other?", "pg": "411", "o": ["100 feet (30 m)", "200 feet (60 m)", "300 feet (90 m)", "400 feet (120 m)"], "a": 2}, {"n": 73, "p": "What is the goal of the second-arriving pumper in a hydrant assist valve operation?", "pg": "411", "o": ["Conserve water", "Deliver water to the fire", "Increase the volume of water", "Raise the intake pressure at the first engine"], "a": 3}, {"n": 74, "p": "In fire fighting operations the parallel (volume) setting of the transfer valve is typically used when:", "pg": "412", "o": ["supplying a single hose line.", "hydrant assist valves are required.", "conducting tandem pumping operations to increase intake pressure.", "supplying a relay operation or master stream that requires large amounts of water."], "a": 3}, {"n": 75, "p": "In tandem pumping operations, why is it important to open valves slowly when using large-diameter hose (LDH)?", "pg": "412", "o": ["To conserve water", "To reduce pressure", "To prevent cavitation", "To prevent water hammer"], "a": 2}, {"n": 76, "p": "What is the purpose of establishing a continuous minimum flow during intermittent use of water?", "pg": "412", "o": ["Prevent cavitation", "Reduce water flow", "Increase water pressure", "Prevent pump overheating"], "a": 3}, {"n": 77, "p": "What is dual pumping?", "pg": "413", "o": ["The use of two pumps to supply water to a single fire engine", "The use of two hydrants to supply water to a single fire engine", "The use of one hydrant with high flow to supply two fire pumps", "The use of two hydrants to supply water to multiple fire engines"], "a": 2}, {"n": 78, "p": "In a dual pumping operation the D/O should position the pumpers so that they:", "pg": "413", "o": ["are far apart from each other.", "are positioned closest to the fire.", "can connect intake-to-intake with the shortest section of appropriate diameter hose available.", "can connect discharge-to-discharge with the shortest section of appropriate diameter hose available."], "a": 2}]}, {"ch": 12, "title": "Water Shuttle Operations", "qs": [{"n": 1, "p": "During a water shuttle operation, mobile water supply apparatus may:", "pg": "427", "o": ["provide medical assistance.", "transport victims to the hospital.", "provide direct supply lines to other apparatus.", "make multiple round trips to keep the scene supplied."], "a": 3}, {"n": 2, "p": "What is the main focus of pumper apparatus in a water shuttle operation?", "pg": "428", "o": ["Delivering water to the incident", "Transporting water from portable tanks to the attack pumpers", "Acting as a secondary relay in support of a water shuttle operation", "Developing pressure on hoselines or drafting from a static water source"], "a": 3}, {"n": 3, "p": "What is the first step in determining the amount and types of apparatus needed for a water shuttle operation?", "pg": "428", "o": ["Identifying the location of the fill site", "Determining the fire flow needs for the incident", "Selecting the type of water shuttle apparatus needed", "Understanding the requirements for an effective water supply apparatus"], "a": 1}, {"n": 4, "p": "How does a tender rapidly off-load its onboard water into portable tanks?", "pg": "428", "o": ["Using a fire hose", "Using a ladder to pour the water", "Manually transferring the water with buckets", "Using dump chutes or pump-assisted discharge"], "a": 3}, {"n": 5, "p": "What are tenders with pumps of 750 gpm or greater often called in a water shuttle operations?", "pg": "429", "o": ["Portable tanks", "Attack engines", "Pumper/tenders", "Support water supply apparatus"], "a": 2}, {"n": 6, "p": "What are the factors that should be controlled to increase the efficiency of a water shuttle operation?", "pg": "429", "o": ["Filling and dump times", "The number of apparatus", "The size of the water tank", "Response time and travel time of the shuttle"], "a": 0}, {"n": 7, "p": "What factors should the D/O consider when preplanning a water shuttle operation?", "pg": "429", "o": ["Types of fire fighting equipment used", "Availability of fire hydrants and fire alarms", "Size of the jurisdiction and population density", "Distance and length of the operation, and access to structures and water sources"], "a": 3}, {"n": 8, "p": "Why is a circular route the optimum arrangement for a water shuttle circuit on narrow or rural roads?", "pg": "430", "o": ["It eliminates the need for large tenders passing each other", "It provides a secure entrance to incidents with limited access", "It ensures the safety and operational effectiveness of the D/O", "It allows empty tenders to follow the same route they took to the dump site"], "a": 0}, {"n": 9, "p": "What is the recommended direction of travel for fully loaded tenders on a circular route?", "pg": "430", "o": ["Uphill", "Downhill", "On a substantial grade", "Any direction is suitable"], "a": 1}, {"n": 10, "p": "What can be done to optimize the circular travel route of a water shuttle circuit?", "pg": "430", "o": ["Direct tender to back up to the fill site", "Close traffic to nonemergency vehicles", "Have tenders pass each other on the roadway", "Route tender traffic over limited-weight bridges"], "a": 1}, {"n": 11, "p": "How can safety be enhanced when backing of tenders is unavoidable at a fill site?", "pg": "432", "o": ["Having a single spotter for all apparatus", "Staffing the fill site with adequate spotters", "Ensuring the site is far away from any roadways", "Providing nonemergency vehicles with priority access"], "a": 1}, {"n": 12, "p": "What is the recommended action when encountering blind curves and intersections along a shuttle route?", "pg": "432", "o": ["Have police or fire police personnel control traffic", "Exercise common sense while driving on winding roads", "Increase vehicle speed to quickly pass through the area", "Request assistance from the AHJ's department of public works"], "a": 0}, {"n": 13, "p": "What is the preferred characteristic of a fill or dump site for a water shuttle operation?", "pg": "432", "o": ["Location near a substantial grade", "Availability of nearby parking spaces", "High traffic congestion for increased efficiency", "Straight driving access without the need for backing"], "a": 3}, {"n": 14, "p": "What is the primary concern when driving downhill on steep grades during water shuttle operations?", "pg": "432", "o": ["Increased wear on apparatus tires", "Potential rollovers on narrow roads", "Maintaining control of the vehicle's speed", "Limited visibility due to blind curves and intersections"], "a": 2}, {"n": 15, "p": "In what situation is it advantageous to locate the dump site at the nearest intersection?", "pg": "433", "o": ["Incidents requiring a large parking lot for access", "Incidents with clear intersections near the scene", "Incidents with through access on two-way streets", "Incidents on narrow lanes, driveways, or dead-end streets"], "a": 3}, {"n": 16, "p": "What is the purpose of preplanning fill and dump sites for water shuttle operations?", "pg": "433", "o": ["Ensure continual forward movement", "Establish clear intersections near the scene", "Allow for the growth of the dump site as needed", "Prevent obstruction of the area near the fire scene"], "a": 0}, {"n": 17, "p": "Where should the traffic cone or marker be placed at the fill site?", "pg": "434", "o": ["Near the apparatus rear", "At the exact fill spot for tenders", "Close to the water supply source", "Adjacent to the driver's side of the apparatus door"], "a": 3}, {"n": 18, "p": "What is the recommended water supply capacity for a fill site during water shuttle operations?", "pg": "434", "o": ["At least 500 gpm (2 000 L/min)", "At least 750 gpm (3 000 L/min)", "At least 1,000 gpm (4 000 L/min)", "At least 1,250 gpm (5 000 L/min)"], "a": 2}, {"n": 19, "p": "Who reports directly up the chain of command to the Operations Section Chief in a water shuttle operation?", "pg": "435", "o": ["Incident Commander (IC)", "Water Supply Branch Director", "Water Supply Group Supervisor", "Water Supply Group companies and agencies"], "a": 2}, {"n": 20, "p": "What is the purpose of assigning a dedicated radio channel to water supply operations?", "pg": "435", "o": ["Reduce traffic on the main incident channel", "Enable direct reporting to the Incident Commander", "Improve communication to the Operations Section Chief", "Establish a Water Supply Branch under the IC's supervision"], "a": 0}, {"n": 21, "p": "During water shuttle operations, the IC or Operations Section Chief should keep the _____ apprised of any changes in fire flow so they can properly coordinate resources.", "pg": "435", "o": ["AHJ", "tender D/O", "Branch Director", "Group Supervisor"], "a": 3}, {"n": 22, "p": "During large-scale incidents, the IC may develop a Water Supply _____ and assign separate fill and dump sites, as well as specifically assigned tenders.", "pg": "435", "o": ["Branch", "Section", "Strike Team", "Operational Team"], "a": 0}, {"n": 23, "p": "What is the primary factor to consider when designing or purchasing tenders for shuttle operations?", "pg": "436", "o": ["Efficient filling and dumping capabilities", "Availability of multiple external fill connections", "The number of personnel required for operations", "Compliance with departmental policies and procedures"], "a": 0}, {"n": 24, "p": "How many external fill connections should tenders using medium-diameter supply hose (MDH) have at a water shuttle operation?", "pg": "436", "o": ["At least one", "At least two", "At least three", "At least four"], "a": 1}, {"n": 25, "p": "What is typically required to establish fill and/or dump sites during water shuttle operations?", "pg": "436", "o": ["A single D/O for each site", "Entire fire companies
