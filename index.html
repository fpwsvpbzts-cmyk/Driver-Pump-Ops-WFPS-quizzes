he usability of a static water supply source?", "pg": "364", "o": ["Whether or not water is potable", "Obtaining permits from the local authorities", "How many recreational vehicles are present", "Whether or not a fire apparatus can be set up at the site"], "a": 3}, {"n": 15, "p": "Which of the following situations could contribute to a pumper NOT being able to position itself properly at a static water source?", "pg": "365", "o": ["High water levels", "Fortified parking surfaces", "Public boat launching ramps", "High banks around the water source"], "a": 3}, {"n": 16, "p": "Fire departments are encouraged to use _____ to ensure access at drafting sites.", "pg": "365", "o": ["neutral sites", "annual permits", "public property only", "preincident planning"], "a": 3}, {"n": 17, "p": "Which route type is the safest and most efficient when conducting a water tender shuttle?", "pg": "366", "o": ["Direct", "Circular", "Primary", "Standard"], "a": 1}, {"n": 18, "p": "In general, the minimum amount of water around a barrel-type strainer is:", "pg": "366", "o": ["1 foot (300 mm).", "2 feet (600 mm).", "3 feet (900 mm).", "4 feet (1200 mm)."], "a": 1}, {"n": 19, "p": "What type of strainer can draw water from above a weed-covered, sandy or rocky bottom of a natural static source?", "pg": "366", "o": ["Floating", "Low-level", "Barrel-type", "Attachment"], "a": 0}, {"n": 20, "p": "The procedure that is used to dislodge debris from a strainer is known as:", "pg": "367", "o": ["de-clogging.", "back flushing.", "Venturi effect.", "water tender shuttling."], "a": 1}, {"n": 21, "p": "What allows for more efficient access to a natural supply source through a pre-piped installation?", "pg": "367", "o": ["Cistern", "Dry-hydrant", "Fire hydrant", "Back flushing"], "a": 1}, {"n": 22, "p": "Each time nonpotable water is pumped through the apparatus, the pump and piping should be:", "pg": "368", "o": ["sent to a special cleaning facility.", "flushed with foam/water solution.", "flushed with fresh water as soon as possible.", "emptied and allowed to dry completely before next use."], "a": 2}, {"n": 23, "p": "Which of the following artificial static water supply sources are usually found in areas NOT serviced by a hydrant system?", "pg": "368 - 369", "o": ["Cistern", "Ground reservoirs", "Private water storage tanks", "Agricultural irrigation systems"], "a": 0}, {"n": 24, "p": "Artificial static water supply sources that resemble ponds or lakes may offer more accessibility for fire apparatus than natural bodies of water because of their strategic area are known as:", "pg": "369", "o": ["cisterns.", "swimming pools.", "ground reservoirs.", "private water storage tanks."], "a": 2}, {"n": 25, "p": "What artificial static water supply source may be difficult to access due to lack of an acceptable driving surface, fences, or undersurface drainage and utility vaults?", "pg": "370", "o": ["Cisterns", "Swimming pools", "Ground reservoirs", "Water storage tanks"], "a": 1}, {"n": 26, "p": "When conducting preincident planning, the accessibility and _____ of swimming pools should be determined before being considered for fire protection.", "pg": "370", "o": ["cost", "shape", "capacity", "chlorine percentage"], "a": 2}, {"n": 27, "p": "Which artificial static water supply source supplies water via open canals and portable pipes?", "pg": "372", "o": ["Cisterns", "Lakes and ponds", "Ground reservoirs", "Agricultural irrigation systems"], "a": 3}, {"n": 28, "p": "During drafting operations, a hose with smaller diameter and greater length creates _____ friction loss.", "pg": "373", "o": ["zero", "level", "lower", "higher"], "a": 3}, {"n": 29, "p": "When water is being discharged faster than it comes into the pump, it is referred to as:", "pg": "373", "o": ["cavitation.", "maximum lift.", "Venturi effect.", "theoretical lift."], "a": 0}, {"n": 30, "p": "Intake gauge readings below _____ indicates cavitation during drafting.", "pg": "374", "o": ["10 in Hg (35 kPa)", "20 in Hg (70 kPa)", "30 in Hg (100 kPa)", "40 in Hg (135 kPa)"], "a": 1}, {"n": 31, "p": "In order for a pumper to approach its rated capacity using a traditional strainer, there must be at least _____ of water over the strainer.", "pg": "375", "o": ["12 inches (300 mm)", "24 inches (600 mm)", "36 inches (900 mm)", "48 inches (1 200 mm)"], "a": 1}, {"n": 32, "p": "The rapid intake of water may cause a _____ that can result in allowing air into the intake hose, causing the pump to lose its prime.", "pg": "375", "o": ["whirlpool", "cavitation", "Venturi effect", "perfect vacuum"], "a": 0}, {"n": 33, "p": "When using a portable tank or swimming pool for drafting operations, a _____ strainer becomes the appliance of choice.", "pg": "375", "o": ["floating", "low-level", "barrel-type", "medium immersion"], "a": 1}, {"n": 34, "p": "What issue becomes a factor when selecting an acceptable location for drafting ocean water?", "pg": "375", "o": ["Crowd control", "Tidal movements", "Recreational vehicles", "Water temperatures above freezing"], "a": 1}, {"n": 35, "p": "When connecting to the pump, incorrect positioning of the _____ may result in the formation of an air pocket that can prevent effective drafting.", "pg": "376", "o": ["intake hose", "supply tank", "discharge valve", "pressure vacuum"], "a": 0}, {"n": 36, "p": "When priming a two-stage pump, what position must the transfer valve be in?", "pg": "377", "o": ["Intake", "Parallel", "Primary", "Pressure"], "a": 1}, {"n": 37, "p": "After priming the pump, opening the discharge valve too quickly may draw air into the pump and:", "pg": "377", "o": ["cause a loss of prime.", "the pump may overheat.", "water hammer may occur.", "the hard section hose can over-pressurize."], "a": 0}, {"n": 38, "p": "As the primer operates, the vacuum reading should _____ as atmospheric pressure forces water into the intake hose.", "pg": "377", "o": ["increase", "level out", "decrease", "remain steady"], "a": 0}, {"n": 39, "p": "The priming action should continue until all air has been removed and:", "pg": "377", "o": ["a suction sound is heard.", "the pump shuts off automatically.", "a steady stream of water discharges.", "an intermittent stream of water discharges."], "a": 2}, {"n": 40, "p": "What issue drives more priming failures than any other cause?", "pg": "377", "o": ["Air leaks", "Water leaks", "Engine speed", "Electrical problems"], "a": 0}, {"n": 41, "p": "Constant movement of water through the pump prevents:", "pg": "378", "o": ["whirlpool.", "overheating.", "water hammer.", "blockage development."], "a": 1}, {"n": 42, "p": "When operating the pump from draft, the engine temperature gauge must be kept within the _____ operating range.", "pg": "379", "o": ["cooler", "normal", "warmer", "exceptional"], "a": 1}, {"n": 43, "p": "What is the most common source of problems while operating a draft?", "pg": "379", "o": ["Air leak in the discharge valve", "Air leak on the intake side of the pump", "Whirlpool allowing air to enter the pump", "Water leak on the supply side of the pump"], "a": 1}, {"n": 44, "p": "When operating a draft, the most common blockage location is at the:", "pg": "379", "o": ["strainer.", "coupling.", "flowmeter.", "discharge valve."], "a": 0}, {"n": 45, "p": "The pump's capacity is determined in a given scenario by the diameter and length of the intake hose, strainer design, and _____ lift.", "pg": "380", "o": ["vertical", "horizontal", "maximum", "dependable"], "a": 0}, {"n": 46, "p": "After the pump has been drained and the connections removed, operate the positive displacement primer for several seconds until _____ comes out of the discharge from the priming pump.", "pg": "380", "o": ["air", "water", "foam mixture", "primer oil or fluid"], "a": 3}]}, {"ch": 11, "title": "Fireground Pump Operations", "qs": [{"n": 1, "p": "What is the first priority during fireground operations?", "pg": "387", "o": ["Life safety", "Fire suppression", "Incident stabilization", "Property conservation"], "a": 0}, {"n": 2, "p": "What does the IC do to determine if lives can be saved without unnecessary risk to firefighters?", "pg": "387", "o": ["Risk-benefit analysis", "Prioritize property conservation", "Analyze after an offensive attack", "Focus solely on saving the lives of victims"], "a": 0}, {"n": 3, "p": "What type of strategy means that you intend to attack the fire directly (interior or transitional attack) and/or conduct a search?", "pg": "388", "o": ["Direct", "Indirect", "Offensive", "Defensive"], "a": 2}, {"n": 4, "p": "In what extreme situation in an offensive strategy does rescue take priority over fire attack?", "pg": "388", "o": ["When a victim is trapped", "When a victim is ambulatory", "When the fire and rescue can occur simultaneously", "When the fire attack can be completed with reduced risk to firefighters"], "a": 0}, {"n": 5, "p": "When implementing a defensive strategy, firefighters will typically:", "pg": "388", "o": ["enter the burning building to attack the fire.", "remain outside the burning building and not enter.", "search for any potential victims inside the building.", "prioritize saving the burning structure over adjacent buildings."], "a": 1}, {"n": 6, "p": "What outweighs any possible gain in attempting to save property in a defensive strategy?", "pg": "389", "o": ["The risk to firefighters", "The probability of saving lives", "The gain of saving the property", "The need for additional resources"], "a": 0}, {"n": 7, "p": "What is the most efficient method for extinguishing free-burning fires?", "pg": "389", "o": ["Indirect attack", "Combination attack", "Direct attack with a fog stream", "Direct attack using a solid or straight stream"], "a": 3}, {"n": 8, "p": "Which of the following is true regarding an indirect attack in firefighting?", "pg": "389", "o": ["It fills the compartment with clean air", "It produces less steam than a direct attack", "It does not require coordination with ventilation", "It results in a uniform temperature from floor to ceiling"], "a": 3}, {"n": 9, "p": "What is the desired effect of discharging water during an indirect attack on a fire from the exterior?", "pg": "390", "o": ["Extinguish the fire immediately", "Create more sources of ventilation", "Reducing the amount of smoke and steam in the structure", "Reduce the temperature of the heated overhead and the room"], "a": 3}, {"n": 10, "p": "What should firefighters do before entering a room that has been attacked indirectly with water?", "pg": "390", "o": ["Check the stability of the walls and ceiling", "Wait for the water to evaporate completely", "Ensure that the fire has been completely extinguished", "Create a new ventilation system to allow steam to escape"], "a": 3}, {"n": 11, "p": "What is the risk of excessive application of water during a combination attack?", "pg": "391", "o": ["It may create a fire whirl", "It may disturb ventilation", "It may cause the fire to spread", "It may cause unnecessary water damage"], "a": 3}, {"n": 12, "p": "Using exterior water application to transition a fire from ventilation-limited conditions to fuel-limited conditions is known as a(an) _____ attack.", "pg": "391", "o": ["direct", "indirect", "transitional", "combination"], "a": 2}, {"n": 13, "p": "What is the advantage of using a straight stream over a fog stream in a well-involved, unventilated interior fire?", "pg": "391", "o": ["Generates more heat and steam", "Better at upsetting thermal layering", "Better reach to knock down the body of a fire", "More effective at controlling flashover conditions"], "a": 2}, {"n": 14, "p": "A D/O must provide _____ for sprinkler and standpipe systems during fireground operations.", "pg": "392", "o": ["friction loss calculations", "detailed piping schematics", "approved building floor plans", "adequate water and pressure support"], "a": 3}, {"n": 15, "p": "What determines the flow of sprinklers in a sprinkler system?", "pg": "393", "o": ["The cost of the sprinkler system", "The type of hazard being protected", "The brand name of the sprinkler system", "The date of installation of the sprinkler system"], "a": 1}, {"n": 16, "p": "The design area of a fire sprinkler system is calculated using a specific number of sprinkler heads:", "pg": "393", "o": ["closest to the riser.", "farthest from the riser.", "with the most sprinkler heads.", "with the highest hazard rating."], "a": 1}, {"n": 17, "p": "When should the FDC be charged with water?", "pg": "393", "o": ["Only when the fire is out", "Only when directed by the IC", "Whenever the D/O engages the pump", "Whenever the sprinkler system is activated"], "a": 1}, {"n": 18, "p": "What are the two types of connections that an FDC may consist of?", "pg": "393", "o": ["Two large-diameter sexless connections or one small-diameter connection", "One large-diameter sexless connection and one small-diameter connection", "One 2½ inch (65 mm) female connection and one small-diameter connection", "Two 2½ inch (65 mm) female connections or one large-diameter sexless connection"], "a": 3}, {"n": 19, "p": "What is the minimum connection size for FDCs in residential structures?", "pg": "393", "o": ["1 inch (25 mm)", "1¼ inch (32 mm)", "1½ inch (40 mm)", "2 inch (50 mm)"], "a": 2}, {"n": 20, "p": "Once personnel connect lines to the sprinkler FDC, why should the discharge valves be opened slowly?", "pg": "394", "o": ["To surge water to the FDC", "To increase water pressure", "To decrease water pressure", "To prevent damage to the FDC"], "a": 3}, {"n": 21, "p": "Where can the suggested discharge pressure be found for a sprinkler FDC?", "pg": "394", "o": ["In the D/O's equipment bag", "In the fire department's database", "Printed on the sprinkler system control panel", "Printed on a plate located on or near the FDC"], "a": 3}, {"n": 22, "p": "According to NFPA 13E, unless the system is posted for a different pressure, or if no other specific information is available from a pre-plan, the general guideline is to supply ____ into the FDC.", "pg": "394", "o": ["100 psi (700 kPa)", "125 psi (875 kPa)", "150 psi (1 050 kPa)", "175 psi (1 225 kPa)"], "a": 2}, {"n": 23, "p": "What is the maximum pressure that a residential sprinkler system should be pressurized to according to NFPA 13E?", "pg": "394", "o": ["50 psi (350 kPa)", "75 psi (525 kPa)", "100 psi (700 kPa)", "Water main pressure"], "a": 3}, {"n": 24, "p": "What is the purpose of standpipe systems?", "pg": "394", "o": ["Prevent fires from starting", "Detect fires before they become large", "Provide water for foam operations in all parts of the building", "To connect attack lines for manual fire attack in remote parts of the building"], "a": 3}, {"n": 25, "p": "In what types of structures are standpipe systems most common?", "pg": "394", "o": ["Mobile homes", "High-rise structures", "Single-family homes", "One-story structures such as large warehouses"], "a": 1}, {"n": 26, "p": "What is the value of standpipes in large-area, one-story buildings?", "pg": "395", "o": ["Suppress fires before they become too large", "Prevent fires from expanding to unoccupied areas", "Provide supplemental water for industrial operations", "Reduces the effort required to advance hoselines long distances"], "a": 3}, {"n": 27, "p": "What is the purpose of a standpipe in most high-rise buildings?", "pg": "395", "o": ["Prevent fires from starting", "Detect fires before they become large", "Provide water for industrial operations", "Manually control a fire on the upper floors"], "a": 3}, {"n": 28, "p": "What size connections can fire attack teams connect to on each floor level of a high-rise building with a standpipe system?", "pg": "395", "o": ["1 inch (25 mm) or 1¼ inch (32 mm)", "1½ inch (38 mm) or 2½ inch (65 mm)", "2 inch (50 mm)", "3 inch (75 mm)"], "a": 1}, {"n": 29, "p": "What type of hose is typically installed at the standpipe connection for occupant use?", "pg": "395", "o": ["Triple-jacket", "Single-jacket", "Double-jacket", "Chemical resistant"], "a": 1}, {"n": 30, "p": "How much pressure loss is typically accounted for in hydraulic calculations for supplying an FDC for sprinkler systems and standpipes?", "pg": "395", "o": ["10 psi (70 kPa)", "15 psi (105 kPa)", "20 psi (140 kPa)", "25 psi (175 kPa)"], "a": 3}, {"n": 31, "p": "The friction loss in a standpipe system may be significant when:", "pg": "396", "o": ["the flow is large.", "the flow is small.", "the nozzle is too small.", "the FDC is located near the standpipe."], "a": 0}, {"n": 32, "p": "Which statement is true regarding the pressure requirements for standpipe systems serving high-rise buildings?", "pg": "396", "o": ["They require less water pressure due to the height of the building", "They require more water pressure due to the height of the building", "They require less water pressure than standpipe systems serving low-rise buildings", "They require the same water pressure as standpipe systems serving low-rise buildings"], "a": 1}, {"n": 33, "p": "When a standpipe system includes pressure-reducing valves, the elevation pressure must be based on the:", "pg": "396", "o": ["number of floors above the FDC.", "total height of the standpipe or zone being used.", "number of hoselines connected to the standpipe.", "total number of pressure-reducing valves installed."], "a": 1}, {"n": 34, "p": "If the pressure at a particular valve in a standpipe system lies below that for which the valve was adjusted, it will result in:", "pg": "396", "o": ["over-expansion of hoselines.", "unchanged pressure for attack hoselines.", "inadequate pressure for attack hoselines.", "a closing of the PRV in the sprinkler system."], "a": 2}, {"n": 35, "p": "Leaving valves in an open position in a dry standpipe system will:", "pg": "397", "o": ["make the system malfunction.", "reduce the water pressure in the system.", "increase the water pressure in the system.", "not affect the water pressure in the system."], "a": 1}, {"n": 36, "p": "To coordinate efforts and keep the correct riser charged, what should D/Os do when a building has multiple standpipes?", "pg": "397", "o": ["Disconnect all standpipes that are not in use", "Charge all of the standpipes from the same FDC", "Ignore standpipes that are not needed and only use the first one encountered", "Monitor radios for information about companies advancing onto a floor from different directions"], "a": 3}, {"n": 37, "p": "What can personnel do if an individual hose valve on an upper floor fails?", "pg": "397", "o": ["Connect hoselines on the fire floor", "Use a valve on the next floor down", "Charge the standpipe from the ground level", "Use a double male with a double female coupling"], "a": 1}, {"n": 38, "p": "Besides hoisting a hoseline up the outside of a building, what can firefighters do if the standpipe in a single-riser building seems unserviceable?", "pg": "398", "o": ["Flip the check valve on the FDC", "Use a standpipe in an adjacent building", "Increase the throttle on the pump supply", "Unroll hose down the side of the building from every second or third floor"], "a": 3}, {"n": 39, "p": "What is the advantage of using an aerial device to supply hoselines on upper-floor levels?", "pg": "398", "o": ["It is always the safest option", "It can reach higher than any other device", "It can be used for multiple rescue operations simultaneously", "It has much less friction loss than hose used for the same distance"], "a": 3}, {"n": 40, "p": "What should the D/O do when there is an indication that water supply or pumping ability may be unattainable or interrupted?", "pg": "398", "o": ["Ignore the indication", "Wait for the IC to provide more information", "Wait for a few minutes to see if the issue resolves itself", "Notify the IC and the officer or officers on any fire streams provided"], "a": 3}, {"n": 41, "p": "What should the D/O do when a charged supply line suddenly loses water?", "pg": "398", "o": ["Immediately call for backup", "Call for additional apparatus to help solve the problem", "Shut down the pump and switch to an alternative water supply", "Determine the source of the problem by following logical steps back to the source"], "a": 3}, {"n": 42, "p": "A relay pumping operation is an operation where:", "pg": "399", "o": ["water is supplied to a single pumper from a water source.", "a pumper is used to pump water from a fire hydrant to a building.", "a pumper is used to pump water from a remote source to an attack pumper.", "two or more pumpers pump water from the same source to the same location."], "a": 2}, {"n": 43, "p": "What is necessary for maximum proficiency in relay pumping operations?", "pg": "399", "o": ["Using hose of different diameters", "Connecting multiple pumpers in parallel", "Training together and using compatible equipment", "Using multiple supply lines to meet fireground requirements"], "a": 2}, {"n": 44, "p": "Which type of hose diameter generally requires one supply line to meet fireground requirements during relay pumping operations?", "pg": "399", "o": ["2 inch (50 mm)", "6 inch (150 mm)", "Large-diameter hose (LDH)", "Medium-diameter hose (MDH)"], "a": 2}, {"n": 45, "p": "Which apparatus should have the largest pumping capacity in a relay pumping operation?", "pg": "400", "o": ["Rescue truck", "Water tender", "Attack pumper", "Supply pumper"], "a": 3}, {"n": 46, "p": "What is the function of a fire attack pumper in relay pumping operations?", "pg": "400", "o": ["Act as a pumper or pumpers connected within the relay", "Supply the attack lines and appliances required for fire suppression", "Increase the pressure and supply water to the next apparatus in the relay", "Take water from a hydrant or static source and pump it under pressure to the next apparatus"], "a": 1}, {"n": 47, "p": "What is the function of intake relief valves in firefighting?", "pg": "402", "o": ["Minimize water waste", "To release excess pressure", "Regulate water flow to the fire", "Increase water pressure to the pump"], "a": 1}, {"n": 48, "p": "Which type of intake relief valve (IRV) is required by NFPA 1900 in case of a surge in the system?", "pg": "402", "o": ["Bleeder valve", "In-line relay valve", "Master intake relief valve", "Screw-on intake relief valve"], "a": 2}, {"n": 49, "p": "What is the purpose of a bleeder valve in intake relief valves?", "pg": "402", "o": ["Minimize water waste", "Regulate water flow to the fire", "Increase water pressure to the pump", "Vent air from the hose before it travels down the line"], "a": 3}, {"n": 50, "p": "The adjustment of some intake relief valves is made possible with a(an):", "pg": "403", "o": ["clapper valve.", "bleeder valve.", "Storz coupling.", "electric or air pressure actuator."], "a": 3}, {"n": 51, "p": "What happens when the incoming pressure exceeds the set level in an intake relief valve?", "pg": "403", "o": ["The valve closes and water flow stops", "The valve diverts water to another intake", "The valve adjusts to the new pressure level automatically", "The valve opens and water is released until proper pressure is reached"], "a": 3}, {"n": 52, "p": "What is the purpose of using in-line relay valves in firefighting operations?", "pg": "403", "o": ["Interrupt the water supply", "Increase spacing between pumpers", "Reduce water pressure in the system", "Boost pressure and volume in the hose"], "a": 3}, {"n": 53, "p": "What is the relationship between hose lay distance and friction loss in relay pumping operations?", "pg": "403", "o": ["The longer the hose lay distance, the less friction loss", "The longer the hose lay distance, the more friction loss", "The shorter the hose lay distance, the more friction loss", "The distance affects only friction loss of certain types of hose"], "a": 1}, {"n": 54, "p": "How does elevation impact pressure loss on the hose lay?", "pg": "404", "o": ["Elevation does not impact pressure loss on the hose lay", "Uphill pumping causes more pressure loss than downhill pumping", "Downhill pumping causes more pressure loss than uphill pumping", "The amount of pressure loss is the same for uphill and downhill pumping"], "a": 1}, {"n": 55, "p": "How can flow be increased during relay pumping operations?", "pg": "404", "o": ["Adding more pumpers to the system", "Increasing the length of hose in the system", "Decreasing the diameter of the supply hose", "Decreasing the discharge pressure of the pumpers"], "a": 0}, {"n": 56, "p": "Adding apparatus to a relay operation that did not have in-line valves from the outset:", "pg": "404", "o": ["reduces the flow rate through the system.", "increases the diameter of the supply hose.", "requires additional pumpers to be added to the system.", "requires the shutdown of the water supply until the apparatus is added."], "a": 3}, {"n": 57, "p": "A relay pumping operation begins with the:", "pg": "408", "o": ["largest capacity pumper working from the water source.", "pumpers working simultaneously from the water source.", "smallest capacity pumper working from the water source.", "attack pumpers working sequentially from the water source."], "a": 0}, {"n": 58, "p": "What determines the overall capacity of the relay pumping system?", "pg": "408", "o": ["The flow requirements of the incident", "The number of pumpers involved in the relay", "The largest pump and diameter of hose used in the relay", "The smallest pump and diameter of hose used in the relay"], "a": 3}, {"n": 59, "p": "Why should the source pumper open a discharge or allow water to discharge through a waste line in relay pumping operations?", "pg": "408", "o": ["To conserve water in the system", "To reduce the pressure in the system", "To prevent pump cavitation in the system", "To prevent loss of prime or overheating of the pump"], "a": 3}, {"n": 60, "p": "What intake pressure should the D/O maintain on a relay pumper in relay pumping operations?", "pg": "408", "o": ["10 to 25 psi (70 to 175 kPa)", "20 to 50 psi (140 to 210 kPa)", "30 to 75 psi (210 to 520 kPa)", "40 to 100 psi (280 to 690 kPa)"], "a": 1}, {"n": 61, "p": "In relay pumping operations, what should the D/O do as water reaches each pumper?", "pg": "408", "o": ["Decrease the intake pressure on the pumper", "Increase the discharge pressure on the pumper", "Bleed air from the line before opening the intake valve", "Close the discharge valve before opening the tank-to-pump valve"], "a": 2}, {"n": 62, "p": "Apparatus equipped with pressure governors should be set in _____ mode when working as a relay pumper in relay pumping operations.", "pg": "408", "o": ["rpm", "flow", "volume", "pressure"], "a": 0}, {"n": 63, "p": "How much above the static pressure of the water system should the adjustable intake relief valve be set to in relay pumping operations?", "pg": "409", "o": ["5 psi (35 kPa)", "10 psi (70 kPa)", "15 psi (105 kPa)", "20 psi (140 kPa)"], "a": 1}, {"n": 64, "p": "What is the recommended range for setting the adjustable intake relief valve on an attack pumper?", "pg": "410", "o": ["25 to 50 psi (175 to 350 kPa)", "50 to75 psi (350 to 525 kPa)", "75 to 100 psi (525 to 700 kPa)", "100 to 125 psi (700 to 875 kPa)"], "a": 1}, {"n": 65, "p": "When an attack line gets shut down or the amount of discharge changes, what happens to the residual pressure and friction loss in the supply line?", "pg": "410", "o": ["Residual pressure increases, friction loss increases", "Residual pressure decreases, friction loss increases", "Residual pressure increases, friction loss decreases", "Residual pressure decreases, friction loss decreases"], "a": 2}, {"n": 66, "p": "At what intake pressure level should the D/O of the attack pumper NOT attempt to correct minor pressure fluctuations during relay pumping operations?", "pg": "410", "o": ["Above 5 psi (35 kPa)", "Above 10 psi (70 kPa)", "Above 15 psi (105 kPa)", "At or above 20 psi (140 kPa)"], "a": 3}, {"n": 67, "p": "What is the primary concern when attempting to achieve an exact pressure during relay pumping operations?", "pg": "410", "o": ["Delayed pressure changes", "Rapid increase in friction loss", "Affecting other pumpers in the relay", "Overcompensating for pressure changes"], "a": 2}, {"n": 68, "p": "What is the last resort for communication if no other method is available during relay pumping operations?", "pg": "410", "o": ["Using a PA system", "Using hand signals", "Using the fireground channel", "Using firefighters as messengers between apparatus"], "a": 3}, {"n": 69, "p": "What is the purpose of systematically proceeding back to the source pumper when ending a relay pumping operation?", "pg": "410", "o": ["To prevent water hammer", "Ensure that the pumps do not run dry", "Allow for refilling of onboard fuel tanks", "Make sure that all pumpers are in the same location"], "a": 1}, {"n": 70, "p": "How does tandem pumping differ from relay pumping?", "pg": "411", "o": ["Tandem pumping and relay pumping are the same thing", "Tandem pumping only involves one pumper, while relay pumping involves multiple pumpers", "Tandem pumping is designed to increase pressure, while relay pumping sends volume over distance", "Tandem pumping involves connecting multiple pumps in parallel, while relay pumping involves connecting pumps in series"], "a": 2}, {"n": 71, "p": "What are some situations that may require a tandem pumping operation?", "pg": "411", "o": ["When filling onboard water tanks", "When only one pumper is available", "When the attack pumper is located far from the water source", "When pressures higher than a single engine can supply are required"], "a": 3}, {"n": 72, "p": "In tandem pumping operations, what is the maximum distance that apparatus may be located apart from each other?", "pg": "411", "o": ["100 feet (30 m)", "200 feet (60 m)", "300 feet (90 m)", "400 feet (120 m)"], "a": 2}, {"n": 73, "p": "What is the goal of the second-arriving pumper in a hydrant assist valve operation?", "pg": "411", "o": ["Conserve water", "Deliver water to the fire", "Increase the volume of water", "Raise the intake pressure at the first engine"], "a": 3}, {"n": 74, "p": "In fire fighting operations the parallel (volume) setting of the transfer valve is typically used when:", "pg": "412", "o": ["supplying a single hose line.", "hydrant assist valves are required.", "conducting tandem pumping operations to increase intake pressure.", "supplying a relay operation or master stream that requires large amounts of water."], "a": 3}, {"n": 75, "p": "In tandem pumping operations, why is it important to open valves slowly when using large-diameter hose (LDH)?", "pg": "412", "o": ["To conserve water", "To reduce pressure", "To prevent cavitation", "To prevent water hammer"], "a": 2}, {"n": 76, "p": "What is the purpose of establishing a continuous minimum flow during intermittent use of water?", "pg": "412", "o": ["Prevent cavitation", "Reduce water flow", "Increase water pressure", "Prevent pump overheating"], "a": 3}, {"n": 77, "p": "What is dual pumping?", "pg": "413", "o": ["The use of two pumps to supply water to a single fire engine", "The use of two hydrants to supply water to a single fire engine", "The use of one hydrant with high flow to supply two fire pumps", "The use of two hydrants to supply water to multiple fire engines"], "a": 2}, {"n": 78, "p": "In a dual pumping operation the D/O should position the pumpers so that they:", "pg": "413", "o": ["are far apart from each other.", "are positioned closest to the fire.", "can connect intake-to-intake with the shortest section of appropriate diameter hose available.", "can connect discharge-to-discharge with the shortest section of appropriate diameter hose available."], "a": 2}]}, {"ch": 12, "title": "Water Shuttle Operations", "qs": [{"n": 1, "p": "During a water shuttle operation, mobile water supply apparatus may:", "pg": "427", "o": ["provide medical assistance.", "transport victims to the hospital.", "provide direct supply lines to other apparatus.", "make multiple round trips to keep the scene supplied."], "a": 3}, {"n": 2, "p": "What is the main focus of pumper apparatus in a water shuttle operation?", "pg": "428", "o": ["Delivering water to the incident", "Transporting water from portable tanks to the attack pumpers", "Acting as a secondary relay in support of a water shuttle operation", "Developing pressure on hoselines or drafting from a static water source"], "a": 3}, {"n": 3, "p": "What is the first step in determining the amount and types of apparatus needed for a water shuttle operation?", "pg": "428", "o": ["Identifying the location of the fill site", "Determining the fire flow needs for the incident", "Selecting the type of water shuttle apparatus needed", "Understanding the requirements for an effective water supply apparatus"], "a": 1}, {"n": 4, "p": "How does a tender rapidly off-load its onboard water into portable tanks?", "pg": "428", "o": ["Using a fire hose", "Using a ladder to pour the water", "Manually transferring the water with buckets", "Using dump chutes or pump-assisted discharge"], "a": 3}, {"n": 5, "p": "What are tenders with pumps of 750 gpm or greater often called in a water shuttle operations?", "pg": "429", "o": ["Portable tanks", "Attack engines", "Pumper/tenders", "Support water supply apparatus"], "a": 2}, {"n": 6, "p": "What are the factors that should be controlled to increase the efficiency of a water shuttle operation?", "pg": "429", "o": ["Filling and dump times", "The number of apparatus", "The size of the water tank", "Response time and travel time of the shuttle"], "a": 0}, {"n": 7, "p": "What factors should the D/O consider when preplanning a water shuttle operation?", "pg": "429", "o": ["Types of fire fighting equipment used", "Availability of fire hydrants and fire alarms", "Size of the jurisdiction and population density", "Distance and length of the operation, and access to structures and water sources"], "a": 3}, {"n": 8, "p": "Why is a circular route the optimum arrangement for a water shuttle circuit on narrow or rural roads?", "pg" : ["Increased wear on apparatus tires", "Potential rollovers on narrow roads", "Maintaining control of the vehicle's speed", "Limited visibility due to blind curves and intersections"], "a": 2}, {"n": 15, "p": "In what situation is it advantageous to locate the dump site at the nearest intersection?", "pg": "433", "o": ["Incidents requiring a large parking lot for access", "Incidents with clear intersections near the scene", "Incidents with through access on two-way streets", "Incidents on narrow lanes, driveways, or dead-end streets"], "a": 3}, {"n": 16, "p": "What is the purpose of preplanning fill and dump sites for water shuttle operations?", "pg": "433", "o": ["Ensure continual forward movement", "Establish clear intersections near the scene", "Allow for the growth of the dump site as needed", "Prevent obstruction of the area near the fire scene"], "a": 0}, {"n": 17, "p": "Where should the traffic cone or marker be placed at the fill site?", "pg": "434", "o": ["Near the apparatus rear", "At the exact fill spot for tenders", "Close to the water supply source", "Adjacent to the driver's side of the apparatus door"], "a": 3}, {"n": 18, "p": "What is the recommended water supply capacity for a fill site during water shuttle operations?", "pg": "434", "o": ["At least 500 gpm (2 000 L/min)", "At least 750 gpm (3 000 L/min)", "At least 1,000 gpm (4 000 L/min)", "At least 1,250 gpm (5 000 L/min)"], "a": 2}, {"n": 19, "p": "Who reports directly up the chain of command to the Operations Section Chief in a water shuttle operation?", "pg": "435", "o": ["Incident Commander (IC)", "Water Supply Branch Director", "Water Supply Group Supervisor", "Water Supply Group companies and agencies"], "a": 2}, {"n": 20, "p": "What is the purpose of assigning a dedicated radio channel to water supply operations?", "pg": "435", "o": ["Reduce traffic on the main incident channel", "Enable direct reporting to the Incident Commander", "Improve communication to the Operations Section Chief", "Establish a Water Supply Branch under the IC's supervision"], "a": 0}, {"n": 21, "p": "During water shuttle operations, the IC or Operations Section Chief should keep the _____ apprised of any changes in fire flow so they can properly coordinate resources.", "pg": "435", "o": ["AHJ", "tender D/O", "Branch Director", "Group Supervisor"], "a": 3}, {"n": 22, "p": "During large-scale incidents, the IC may develop a Water Supply _____ and assign separate fill and dump sites, as well as specifically assigned tenders.", "pg": "435", "o": ["Branch", "Section", "Strike Team", "Operational Team"], "a": 0}, {"n": 23, "p": "What is the primary factor to consider when designing or purchasing tenders for shuttle operations?", "pg": "436", "o": ["Efficient filling and dumping capabilities", "Availability of multiple external fill connections", "The number of personnel required for operations", "Compliance with departmental policies and procedures"], "a": 0}, {"n": 24, "p": "How many external fill connections should tenders using medium-diameter supply hose (MDH) have at a water shuttle operation?", "pg": "436", "o": ["At least one", "At least two", "At least three", "At least four"], "a": 1}, {"n": 25, "p": "What is typically required to establish fill and/or dump sites during water shuttle operations?", "pg": "436", "o": ["A single D/O for each site", "Entire fire companies dedicated to the sites", "Implementation of large-diameter hose (LDH)", "The presence of a Water Supply Group Supervisor"], "a": 1}, {"n": 26, "p": "The alternating supply operation in the direct pumping method ends when:", "pg": "437", "o": ["all tenders are empty.", "an attack pumper's intake is full.", "the need for water at the incident is satisfied.", "the pressure in the supply line becomes too low."], "a": 2}, {"n": 27, "p": "What is the primary advantage of using nurse tenders in water shuttle operations?", "pg": "438", "o": ["Accessibility to tenders in rural areas", "Large tank capacity that reduces the need for refills", "Efficient delivery through the direct pumping method", "Ability to switch between supplying the attack pumper"], "a": 1}, {"n": 28, "p": "What is the advantage of placing portable tanks near the incident scene in water shuttle operations?", "pg": "438", "o": ["Improves drafting capabilities for tenders", "Reduces the need for dump site pumpers", "Provides additional space for dump site operations", "Eliminates the need for backing up or turning around"], "a": 3}, {"n": 29, "p": "What is a primary disadvantage of using portable tanks for dump site supply?", "pg": "438", "o": ["Limited water storage capacity", "Inability to establish a constant water supply", "Lack of venting system for proper air circulation", "Requires substantial working space for dump site operations"], "a": 3}, {"n": 30, "p": "Discharge and hoseline may be employed for pumping water into a portable tank or nurse tender when:", "pg": "439", "o": ["discharge pressure is insufficient.", "there is limited tank capacity available.", "the tender is not equipped with a dump valve.", "hoseline needs to be controlled at the point of delivery."], "a": 2}, {"n": 31, "p": "What precaution should be taken when pumping into portable tanks using hoselines?", "pg": "439", "o": ["Baffle the water tank to prevent overflow", "Secure the hoselines discharging into the tank", "Maintain a firm grip on the open butt of the hoseline", "Increase the flow rate to expedite the emptying process"], "a": 1}, {"n": 32, "p": "What type of dump site operation should be used only when relatively low flow rates (less than 300 gpm [1 200 L/min]) are needed?", "pg": "439", "o": ["Single portable tank", "Nurse tender", "Direct pumping", "Multiple portable tank"], "a": 2}, {"n": 33, "p": "What type of water tending method is used when relatively low flow rates (less than 300 gpm [1 200 L/min]) are needed?", "pg": "439 - 440", "o": ["Multi-tank", "Nurse tender", "Direct pumping", "Single portable tank"], "a": 3}, {"n": 34, "p": "Which style of portable tank is most commonly used and can be mounted on an apparatus?", "pg": "440", "o": ["Folding tank", "Self-supporting tank", "Frameless water tank", "Assembled framework tank"], "a": 0}, {"n": 35, "p": "What is a distinguishing feature of a self-supporting or frameless water tank?", "pg": "440", "o": ["It can be folded and mounted on an apparatus", "It requires assembly of framework at the scene", "It utilizes a floating collar to regulate water capacity", "It has a hose connection near its bottom for drafting"], "a": 2}, {"n": 36, "p": "What is the recommended capacity of a portable tank in relation to the water tank on the supplying apparatus?", "pg": "440", "o": ["At least 100 gallons (400 L) larger", "At least 200 gallons (800 L) larger", "At least 300 gallons (1 200 L) larger", "At least 500 gallons (2 000 L) larger"], "a": 3}, {"n": 37, "p": "The goal of a multi-tank operation is to:", "pg": "440", "o": ["keep the tank farthest from the attack pumper full.", "keep all tanks at the same water level for efficiency.", "constantly rotate water between all tanks in the operation.", "keep the tank from which the attack pumper is drafting full."], "a": 3}, {"n": 38, "p": "Parallel jet siphons should be used in portable tank operations when:", "pg": "441", "o": ["connecting tanks with a hard intake hose or PVC/aluminum pipe.", "conditions deteriorate and a new dump site needs to be prepared.", "the dump site pumper cannot supply enough water for all jet siphons.", "operations require more than three tanks and water flows are over 500 gpm."], "a": 3}, {"n": 39, "p": "In drafting operations from a static water supply, what should the D/O consider when positioning the fill site pumper?", "pg": "442", "o": ["Distance from the dump site pumper", "Rate at which tenders are being filled", "Minimum lift required to maximize flow", "Availability of high-volume portable pumps"], "a": 2}, {"n": 40, "p": "How should jurisdictions standardize their tenders at the fill site?", "pg": "443", "o": ["Utilize multiple hoselines for each tender intake", "Use one size hose (MDH or LDH) for all connections", "Position the water tender at the rear of the apparatus", "Control flow from the fill site pumper using discharge gates"], "a": 1}, {"n": 41, "p": "What is the role of the \"make-and-break\" team at the fill site?", "pg": "443", "o": ["Monitoring gate valves and manifolds during the operation", "Assisting the D/O in connecting the pumper to the water supply", "Operating the circulating line to maintain prime and prevent overheating", "Establishing and removing connections between the water source and tank"], "a": 3}, {"n": 42, "p": "How should tender D/Os proceed when entering the fill site?", "pg": "444", "o": ["The entrance to the fill site must be in reverse", "Stop when driver's door is perpendicular to the traffic cone", "Connect the fill hose to the direct tank fill intake(s) before stopping", "Stop when the driver's door is parallel to the traffic cone or marking device"], "a": 3}, {"n": 43, "p": "All personnel working at the fill site should monitor ground conditions to:", "pg": "444", "o": ["prevent spillage of water during the operation.", "determine if relocation of the site is necessary.", "ensure proper coordination and instructional clarity.", "assess the effects of temperature and terrain on the operation."], "a": 3}, {"n": 44, "p": "What is the effect of decreasing the trip time on the water shuttle flow rate?", "pg": "447", "o": ["It will increase exponentially", "It will increase proportionally", "It will decrease exponentially", "It will decrease proportionally"], "a": 1}, {"n": 45, "p": "How can the flow rate for a specific tender be calculated using field tests?", "pg": "448", "o": ["Subtract the amount of water the tender dumped from the amount it can carry in its tank", "Divide the amount of water the tender dumped by the time it took to complete the round trip", "Multiply the amount of water the tender dumped by the time it took to complete the round trip", "Measure the time it takes for the tender to complete a round trip from the dump site to the fill site"], "a": 1}, {"n": 46, "p": "According to NFPA 1010, which of the following systems/components should be included in the visual and operational checks of mobile water supply apparatus?", "pg": "449", "o": ["HVAC system", "Electrical system", "Suspension system", "Water tank and other extinguishing agent levels"], "a": 3}, {"n": 47, "p": "When performing visual and operational checks, the D/O should verify that the water tank is:", "pg": "449", "o": ["full.", "empty.", "leaking.", "partially filled."], "a": 0}, {"n": 48, "p": "When operating the rapid dump system, what should the D/O do after discharging a limited amount of water?", "pg": "449", "o": ["Refill the tank", "Shut down the pump", "Engage the foam system", "Leave the dump valve open"], "a": 0}]}, {"ch": 13, "title": "Foam Types and Systems", "qs": [{"n": 1, "p": "What is the purpose of washing PPE gear after every use when foam has been used?", "pg": "464", "o": ["Prevent damage to equipment", "Degrade the foam concentrate residue", "Reduce the need for professional cleaning", "Eliminate the need for proper flushing procedures"], "a": 0}, {"n": 2, "p": "What adverse chronic health effects have been found in humans and animals due to the ingredients in aqueous film-forming foam (AFFF)?", "pg": "465", "o": ["Olfactory fatigue", "Allergic reactions", "Irritation of internal tissue", "Deep and long-time problems such as cancer"], "a": 3}, {"n": 3, "p": "Why should foam concentrates, solutions, or finished foam NOT be discharged into any body of water?", "pg": "466", "o": ["Do not biodegrade", "Can be harmful to aquatic life", "Cause excessive foam buildup", "Increase oxygen levels in the water"], "a": 1}, {"n": 4, "p": "What requirement do many jurisdictions have regarding the use of foam?", "pg": "466", "o": ["Testing foam samples for biodegradability", "Disposing of foam in designated containers", "Limiting foam use to emergency situations only", "Reporting foam usage to local or state environmental protection office"], "a": 3}, {"n": 5, "p": "Which agent cools a fire and surrounding structures while releasing a warm vapor instead of deadly steam?", "pg": "467", "o": ["AFFF foam", "Encapsulator", "Gelling agent", "Durable agent"], "a": 1}, {"n": 6, "p": "Which alternative agent retains its fire retarding properties longer than Class A foam and is nontoxic and biodegradable?", "pg": "467", "o": ["Durable", "Surfactants", "Encapsulator", "Hydrocarbon-based"], "a": 0}, {"n": 7, "p": "What is the purpose of hydrocarbon surfactants in Class A foam?", "pg": "468", "o": ["Reduce the effectiveness of the foam", "Increase the surface tension of water", "Create insulation qualities in the foam", "Improve penetration and effectiveness"], "a": 3}, {"n": 8, "p": "Which system entrains compressed air with small amounts of water to create a useable foam agent?", "pg": "468", "o": ["Aerating foam system", "Solid stream nozzle system", "High-expansion device system", "Compressed air foam system (CAFS)"], "a": 3}, {"n": 9, "p": "As the percentage of Class A foam concentrate increases, the drain time of foam bubbles:", "pg": "469", "o": ["increases.", "decreases.", "remains the same.", "becomes unpredictable."], "a": 0}, {"n": 10, "p": "What is foam expansion?", "pg": "469", "o": ["The change in color of foam solution after aeration", "The increase in volume of foam solution after aeration", "The reduction in volume of foam solution after aeration", "The decrease in quality of foam concentrate after aeration"], "a": 1}, {"n": 11, "p": "According to the NFPA 11, what is the air/solution ratio for low-expansion foam?", "pg": "469", "o": ["Up to 20 parts finished foam for every part of foam solution", "Up to 200 parts finished foam for every part of foam solution", "20:1 up to 200:1", "200:1 up to 1,000:1"], "a": 0}, {"n": 12, "p": "What is a common application of Class A wet foam?", "pg": "470", "o": ["Vertical surfaces", "45 degree sloped surfaces", "Areas that require maximum penetration", "Surface of a fuel pool of flammable liquid"], "a": 2}, {"n": 13, "p": "Which of the following best describes the characteristics of dry foam?", "pg": "470", "o": ["Low water content and low air content", "High water content and low air content", "Low water content and high air content", "High water content and high air content"], "a": 2}, {"n": 14, "p": "The bubbles in a Class A foam blanket begin to break down upon application allowing:", "pg": "470", "o": ["expansion, absorbing the heat.", "the release water, wetting the fuel.", "an increase in size, smothering the fire.", "the blanket to solidify, blocking the fire."], "a": 1}, {"n": 15, "p": "Class B foam is primarily used to suppress fires involving:", "pg": "470", "o": ["gases.", "metals.", "solid materials.", "flammable or combustible liquids."], "a": 3}, {"n": 16, "p": "What are the two main types of bases that Class B foam concentrates consist of?", "pg": "470", "o": ["Water and oil", "Oil and protein", "Synthetic or silicon", "Synthetic or protein"], "a": 3}, {"n": 17, "p": "What is the typical proportion range for Class B foams?", "pg": "471", "o": ["1% to 3%", "1% to 6%", "3% to 6%", "3% to 9%"], "a": 1}, {"n": 18, "p": "For which type of fuels is a foam concentration typically at 1% or 3%?", "pg": "471", "o": ["Solid fuels", "Polar solvents", "Gaseous fuels", "Hydrocarbon fuels"], "a": 3}, {"n": 19, "p": "What is the recommended concentration for polar solvents based on manufacturer recommendations?", "pg": "471", "o": ["1% or 2%", "1% or 3%", "3% or 6%", "6% or 9%"], "a": 2}, {"n": 20, "p": "What factors influence application rate of Class B foam?", "pg": "471", "o": ["The color of the foam and the wind direction", "The type of concentrate used and the fuel involved", "The temperature of the foam and the time of the day", "The size of the fire and the type of foam delivery system"], "a": 1}, {"n": 21, "p": "How can the application rate of class B foam from a specific nozzle be calculated?", "pg": "472", "o": ["Adding the flow rate to the fire area", "Dividing the flow rate by the fire area", "Multiplying the flow rate with the fire area", "Subtracting the flow rate from the fire area"], "a": 1}, {"n": 22, "p": "When encapsulants are used with a foam injection system, how can the foam agent be adjusted for a specific fire?", "pg": "472", "o": ["Using different types of foam concentrates", "Adding additional agents to the foam concentrate", "Adjusting the temperature of the foam injection system", "Changing the foam proportion on the system control panel"], "a": 3}, {"n": 23, "p": "Why must plastic pails used for foam storage remain airtight?", "pg": "473", "o": ["Ensure easy storage on fire apparatus", "Withstand the corrosive nature of foam concentrates", "Prevent a skin from forming on the concentrate surface", "Facilitate direct inducting of foam concentrate using an eductor"], "a": 2}, {"n": 24, "p": "What is the most common size of foam concentrate barrel?", "pg": "473", "o": ["25 gallon (100 L)", "35 gallon (140 L)", "45 gallon (180 L)", "55 gallon (220 L)"], "a": 3}, {"n": 25, "p": "What is the purpose of using totes for foam storage in some fire departments or industrial facilities?", "pg": "473", "o": ["Store foam concentrate in small quantities", "Facilitate easy transport of foam concentrate barrels", "Meet the storage requirements of aircraft rescue fire fighting (ARFF)", "Enable deployment of large quantities of foam during large-scale incidents"], "a": 3}, {"n": 26, "p": "How does a Venturi effect achieve foam proportioning?", "pg": "474", "o": ["Mixing water and foam concentrate in a tank", "Introducing air into the foam solution at the nozzle", "Injecting foam concentrate into a pressurized water stream", "Creating a flow of water across an orifice at a right angle to the flow"], "a": 3}, {"n": 27, "p": "Which type of foam proportioning system imparts pressure on the foam solution using the main fire pump?", "pg": "474", "o": ["Tank mixing system", "Bernoulli effect system", "Low-energy foam system", "Pressurized proportioning device system"], "a": 2}, {"n": 28, "p": "Where is the foam concentrate positioned in the self-educting foam nozzle system?", "pg": "475", "o": ["Attached to the hoseline", "At the pump panel discharge", "Diluted by the deflector plates in the nozzle", "At the point where personnel operate the nozzle"], "a": 3}, {"n": 29, "p": "What advantage does the self-educting master stream foam nozzle have over standard foam nozzle eductors?", "pg": "475", "o": ["It requires a higher pressure drop", "It allows for much greater reach capabilities", "It produces a less proportioned foam solution", "It can deliver flows up to 250 gpm (950 L/min)"], "a": 1}, {"n": 30, "p": "What is the primary difference between portable in-line eductors and installed in-line eductor systems?", "pg": "475", "o": ["The method of foam induction", "The type of foam concentrate used", "The location of the eductor on the apparatus", "The compatibility with Class A or B foam concentrates"], "a": 2}, {"n": 31, "p": "What is the advantage of a bypass proportioner in an installed in-line eductor system?", "pg": "476", "o": ["Reduce friction loss across the eductor", "Inject foam solution directly at the nozzle", "Proportion very low concentrations of class A foam", "Accommodate foam concentrates through a metering valve"], "a": 0}, {"n": 32, "p": "How is the foam concentrate ratio controlled in variable-flow variable-rate direct injection systems?", "pg": "476", "o": ["Adjusting the water flow through the fire pump", "Flow restricting devices in the proportioning system", "The speed of the positive displacement foam concentrate pump", "Monitoring the foam concentrate level in the atmospheric pressure foam tanks"], "a": 2}, {"n": 33, "p": "In variable-flow variable rate injection systems, where should the foam injection point be located in relation to the apparatus piping?", "pg": "476", "o": ["Anywhere within the piping system", "Adjacent to the foam concentrate pump", "After the distribution to manifolds or multiple pump discharges", "Before any distribution to manifolds or multiple pump discharges"], "a": 3}, {"n": 34, "p": "What advantage does the flow of concentrate in a variable-flow demand-type balanced pressure proportioner system have?", "pg": "477", "o": ["Matches pressure demand", "Requires frequent flushing", "Allows for recirculation of product", "Discharges only from a single outlet"], "a": 0}, {"n": 35, "p": "What equipment is required for batch mixing or the dump-in method of foam proportioning?", "pg": "477", "o": ["Variable-speed mechanism", "Venturi-type proportioning device", "Specialized foam mixing equipment", "Regular fire apparatus and its water tank"], "a": 3}, {"n": 36, "p": "Which is NOT a tactical advantage of a Compressed Air Foam System (CAFS)?", "pg": "479", "o": ["Increase the reach of the fire stream", "Produce big, durable uniform air bubbles", "Produce small, durable uniform air bubbles", "Reduce the weight of hoselines containing foam solution"], "a": 1}, {"n": 37, "p": "What component attaches to the discharge side of the pump in a CAFS?", "pg": "479", "o": ["Rotary air compressor", "Standard centrifugal fire pump", "Variable flow rate sensing proportioner", "Direct injection foam proportioning system"], "a": 3}, {"n": 38, "p": "What is a limitation of CAFS?", "pg": "479", "o": ["Requires close proximity in order to be effective", "Increased purchase price and maintenance costs of new apparatus", "Hoselines weigh more than those containing low-energy foam solution", "Foam produced does not adhere to a fuel's surface as well as low-energy foam"], "a": 1}, {"n": 39, "p": "When using low-energy foam systems the aeration and discharge functions are completed by a:", "pg": "479", "o": ["handline nozzle.", "aerating foam nozzle.", "master stream appliance.", "standard fire fighting nozzle."], "a": 1}, {"n": 40, "p": "What type of nozzles break the foam solution into droplets while using the agitation of water droplets moving through air to achieve foaming action?", "pg": "480", "o": ["Fog nozzles", "Smooth bore nozzles", "Venturi action nozzles", "Expansion concentrate nozzles"], "a": 0}, {"n": 41, "p": "What is a characteristic of air-aspirating foam nozzles?", "pg": "480", "o": ["Lacks the reach of a standard fog nozzle", "Provide medium agent expansion and long reach", "Specifically designed for Class A foam application", "Produce foam with expansion ratios from 2:1 up to 4:1"], "a": 0}, {"n": 42, "p": "Which types of master stream appliances can be used to deliver foam?", "pg": "481", "o": ["Smooth bore nozzles", "Semi-automatic nozzles", "Mechanical blower nozzles", "Fixed flow and automatic fog nozzles"], "a": 3}, {"n": 43, "p": "High-expansion foam generators:", "pg": "481", "o": ["produce foam with high air content.", "generate foam for handline operations.", "induce air into the foam solution by Venturi action.", "are smaller and shorter than other foam-producing nozzles."], "a": 0}, {"n": 44, "p": "What is the importance of matching the rated flow between the eductor and nozzle when assembling and operating a foam eductor?", "pg": "481", "o": ["Minimizes air leaks at fittings", "Prevents excessive back pressure", "Ensures no pickup of foam concentrate", "Maintains the proper pickup of foam concentration"], "a": 3}, {"n": 45, "p": "What pressure at the eductor is generally recommended by the manufacturer?", "pg": "482", "o": ["50 to 100 psi (345 to 690 kPa)", "100 to 150 psi (690 to 1 035 kPa)", "150 to 200 psi (1 035 to 1 380 kPa)", "200 to 250 psi (1 380 to 1 725 kPa)"], "a": 2}, {"n": 46, "p": "What should be done to ensure the readiness of eductors after each use?", "pg": "482", "o": ["Increase the inlet pressure to create a stronger Venturi effect", "Set the metering valves to draw a higher percentage of foam concentrate", "Adjust the length of the pick-up tube to sit higher above the liquid surface", "Use a bucket of water to immerse the foam pickup tube until the water flows clear"], "a": 3}, {"n": 47, "p": "Why is it recommended to flush foam concentrates from the equipment as soon as the foam equipment stops at an incident or training?", "pg": "483", "o": ["Prevent corrosion on the equipment", "Conserve foam concentrate for future use", "Improve the efficiency of the foam system", "Avoid clogging of the foam injection equipment"], "a": 0}, {"n": 48, "p": "Proper procedure for flushing or bleeding foam injection equipment on an apparatus may include:", "pg": "483", "o": ["loosening the backflow check valve inside the eductor following use.", "following proper procedure for flushing and draining of foam nozzles.", "turning off the foam pump and flowing clean water through apparatus piping.", "using cleaning solutions to clear out any residual concentrate via the pickup tube."], "a": 2}, {"n": 49, "p": "What should be done to clean portable proportioner equipment after each use?", "pg": "483", "o": ["Remove the backflow check valve from the eductor", "Use a cleaning solution to remove residual concentrate", "Drain the foam from the pump housing/discharge houses", "Flush with fresh water to clear out any residual concentrate"], "a": 3}]}, {"ch": 14, "title": "Pumping Apparatus Testing", "qs": [{"n": 1, "p": "What is the purpose of preservice testing for pumping apparatus?", "pg": "493", "o": ["Verify that the powertrain meets safety regulations", "Determine the resale value of the pumping apparatus", "Ensure the purchaser is satisfied with the pump's appearance", "Assess the pump and powertrain's performance under extreme conditions"], "a": 3}, {"n": 2, "p": "When are acceptance tests commonly performed for fire apparatus?", "pg": "493 - 494", "o": ["Before the delivery to the purchaser", "During the manufacturer's testing phase", "Throughout the preservice testing period", "After the final acceptance by the purchaser"], "a": 0}, {"n": 3, "p": "Who is primarily responsible for conducting manufacturer or certification tests for fire apparatus?", "pg": "494", "o": ["District driver/operators", "Fire Department testing committee", "Organizations that test to the UL Solutions", "Organizations that test to the NFPA standards"], "a": 2}, {"n": 4, "p": "In the road test, the apparatus must accelerate to 35 mph from a standing start within:", "pg": "494", "o": ["10 seconds.", "15 seconds.", "25 seconds.", "30 seconds."], "a": 2}, {"n": 5, "p": "What is one of the minimum standards an apparatus must meet during a road test?", "pg": "494", "o": ["Achieve a speed of 20 mph (30 km/h) within 20 seconds", "Achieve a top speed of 55 mph (90 km/h) on public roadways", "Attain a speed of 25 mph (40 km/h) both forward and reverse", "Come to a full stop from 20 mph (30 km/h) within 35 feet (10.5 m)"], "a": 3}, {"n": 6, "p": "To ensure a fire pump can withstand high-pressure pumping demands, the fire pump case and associated piping must endure a hydrostatic test of:", "pg": "494", "o": ["350 psi (2 450 kPa) for 10 minutes.", "500 psi (3 500 kPa) for 3 minutes.", "500 psi (3 500 kPa) for 10 minutes.", "750 psi (5 250 kPa) for 5 minutes."], "a": 2}, {"n": 7, "p": "The purpose of acceptance testing for fire apparatus is to:", "pg": "495", "o": ["ensure the fire hose has been hydrostatically tested.", "demonstrate the validity of the manufacturer's warranty.", "ensure the apparatus conforms to bid specifications at delivery.", "review procedures with representatives from the manufacturer."], "a": 2}, {"n": 8, "p": "Which of the following is NOT one of the certification tests required for apparatus equipped with a fire pump rated from 750 gpm (3 000 L/min) up to 3,000 gpm (12 000 L/min)?", "pg": "495", "o": ["Pumping test", "Engine speed check", "Fire hose inspection test", "Pressure control system test"], "a": 2}, {"n": 9, "p": "In jurisdictions higher than 2,000 feet (600 m) above sea level, what additional test should be performed during acceptance testing?", "pg": "496", "o": ["Water tank-to-pump", "Gauge and flowmeter", "Pump priming system", "Pumping engine overload"], "a": 3}, {"n": 10, "p": "What action should the D/O take to prepare the apparatus for the pumping test?", "pg": "496", "o": ["Check the apparatus fluid levels", "Inspect the intake piping for any leaks", "Adjust the discharge pressure for optimal performance", "Open a discharge valve to allow pump pressure to equalize"], "a": 0}, {"n": 11, "p": "During a performace test, what is the maximum lift for pumps rated at 1,500 gpm (6 000 L/min) or less?", "pg": "496", "o": ["6 feet (2 m)", "8 feet (2.5 m)", "10 feet (3 m)", "12 feet (3.6 m)"], "a": 2}, {"n": 12, "p": "What is the range of acceptable air temperature during pump testing?", "pg": "497", "o": ["-10°F (-23°C) to 100°F (38°C)", "0°F (-18°C) to 110°F (43°C)", "20°F (-7°C) to 90°F (32°C)", "30°F (-1°C) to 120°F (49°C)"], "a": 1}, {"n": 13, "p": "What action should be taken if the scribed mark on the hoseline moves more than 3/8 inch (9 mm) from the coupling during testing?", "pg": "497", "o": ["Stop the test and replace the hose", "Remove the mark and continue testing", "Continue the test and monitor the movement", "Increase the pressure to stabilize the coupling"], "a": 0}, {"n": 14, "p": "How does net pump discharge pressure change when operating at draft?", "pg": "498", "o": ["Fluctuates depending on the height of the lift", "Exceeds the pressure displayed on the discharge gauge", "Decreases due to the additional pressure from the intake hose", "Remains the same as the pressure displayed on the discharge gauge"], "a": 1}, {"n": 15, "p": "What is the specified accuracy percentage requirement for a flowmeter when indicating flow during pump testing?", "pg": "498", "o": ["Within 2%", "Within 5%", "Within 10%", "Within 15%"], "a": 1}, {"n": 16, "p": "Which equipment is required if a flowmeter is not used during performance tests on fire department pumpers?", "pg": "498", "o": ["Gauge with a range of 0 to at least 400 psi (2 800 kPa)", "Hand tachometer with a range of o to at least 400 psi (2 800 kPa)", "Smooth bore nozzles and air chamber rated from 0 to at least 160 psi (1 100 kPa)", "Pitot tube with knife edge and air chamber rated from 0 to at least 160 psi (1 100 kPa)"], "a": 3}, {"n": 17, "p": "Why should valves and nozzles be opened and closed slowly during service testing?", "pg": "499", "o": ["Avoid water leakage", "Conserve water usage", "Prevent water hammer", "Increase water pressure"], "a": 2}, {"n": 18, "p": "Why should the engine throttle be operated slowly during service testing?", "pg": "499", "o": ["Conserve fuel", "Reduce noise levels", "Increase water flow rate", "Prevent sudden pressure changes"], "a": 3}, {"n": 19, "p": "What is the purpose of a pump shift indicator test during pump control testing?", "pg": "500", "o": ["Verify the pressure and rpm mode", "Ensure the parking brake is engaged", "Verify the pump can engage without issues", "Check the interlock for engine speed control"], "a": 2}, {"n": 20, "p": "What component should be tested when the chassis engine drives the pump and electric system or when the apparatus has electronic engine throttle controls?", "pg": "500", "o": ["Indicator lights in the cab", "Pump and roll capabilities", "Parking brake functionality", "Interlock for engine speed control"], "a": 3}, {"n": 21, "p": "When should the D/O conduct an engine speed check during testing?", "pg": "500", "o": ["Before starting any further testing", "Before conducting any fluid level checks", "After having the apparatus evaluated by a qualified mechanic", "After ensuring all fluid levels are within manufacturer's recommendations"], "a": 3}, {"n": 22, "p": "What should be done if the engine fails to run at the correct speed (+/- 50 rpm) during the engine speed check?", "pg": "500", "o": ["Adjust the fluid levels and repeat the engine speed check", "Continue with further testing and monitor the engine performance", "Consult the manufacturer's recommendations for troubleshooting steps", "Have the apparatus evaluated by a qualified mechanic before further testing"], "a": 3}, {"n": 23, "p": "Why is a vacuum test conducted during the performance testing of an apparatus?", "pg": "500", "o": ["Assess the functionality of the intake hose", "Evaluate the performance of the discharge valves", "Measure the maximum vacuum pressure the pump can achieve", "Check for air leaks in the priming device, pump, and intake hose"], "a": 3}, {"n": 24, "p": "What action should be taken if the pump fails to reach 22 in Hg (75 kPa) during the vacuum test?", "pg": "500", "o": ["Adjust the pressure on the discharge valve", "Remove the apparatus from service for repairs", "Conduct additional troubleshooting on the intake hose", "Proceed with the rest of the performance test as planned"], "a": 1}, {"n": 25, "p": "What is the purpose of the pumping test?", "pg": "502", "o": ["Check the functionality of the pressure gauges", "Measure the fuel consumption of the apparatus", "Determine the water flow rate from the nozzles", "Evaluate the overall operation of the engine and fire pump"], "a": 3}, {"n": 26, "p": "An apparatus technician should take a minimum of _____ readings during a 20 minute pump test at 100% rated capacity.", "pg": "502", "o": ["three", "five", "seven", "ten"], "a": 1}, {"n": 27, "p": "What action should be taken if any unusual vibration or performance defect is encountered during the pumping test?", "pg": "502", "o": ["Document and report the issue", "Repeat the test with different nozzles", "Continue the test while monitoring the defect", "Adjust the engine throttle to stabilize performance"], "a": 0}, {"n": 28, "p": "When performing an overload test on a 750 gpm (3 000 L/min) pump, the first test should be conducted by pumping at _____ net pump pressure for at least 5 minutes.", "pg": "502", "o": ["50% rated capacity at 150 psi (1 050 kPa)", "100% rated capacity at 165 psi (1 100 kPa)", "150% rated capacity at 150 psi (1 050 kPa)", "200% rated capacity at 165 psi (1 100kPa)"], "a": 1}, {"n": 29, "p": "When does the pressure control test typically occur in relation to the pumping test?", "pg": "502", "o": ["During the overload test", "Before the pumping test", "Immediately after the overload test", "While the pump is set up from the pumping test"], "a": 3}, {"n": 30, "p": "What should be done if the readings between the flowmeter and pitot gauge exceed the allowed margin during the operational test?", "pg": "502", "o": ["Repair or replace the flowmeter", "Conduct additional calibration tests", "Adjust the flow rate using the nozzle control", "Increase the pressure on the discharge lines"], "a": 0}, {"n": 31, "p": "What is the purpose of a tank-to-pump flow test for apparatus with an onboard water tank?", "pg": "503", "o": ["Assess the condition of the onboard water tank", "Evaluate the performance of the tank refill system", "Determine the maximum achievable flow rate from the tank", "Verify that the piping between the tank and pump can supply the minimum required water amount"], "a": 3}, {"n": 32, "p": "What should be done if the jurisdiction specifies higher flows for the tank-to-pump flow test?", "pg": "503", "o": ["Follow the jurisdiction's specified flows during testing", "Stick to the NFPA minimum flow rates for consistency", "Consult the manufacturer for recommended flow rates", "Increase the tank capacity to meet the higher flow requirements"], "a": 0}, {"n": 33, "p": "What should be done once the internal intake relief valve on the test pumper opens during testing?", "pg": "503", "o": ["Record the pressure at which the valve actuates", "Measure the flow rate from the intake relief valve", "Adjust the discharge pressure from the supply pumper", "Disconnect the discharge hoseline from the second pumper"], "a": 0}, {"n": 34, "p": "Why should the recorded pressure from the internal intake relief valve be compared with past test results and operating procedures?", "pg": "503", "o": ["Determine the accuracy of the relief valve", "Ensure compliance with national requirements", "Evaluate the performance of the supply pumper", "Identify any necessary adjustments to the valve setting"], "a": 3}, {"n": 35, "p": "What should be done upon completion of testing in regards to fluid levels?", "pg": "503", "o": ["Record any losses in fluid levels", "Refill all fluid levels to their maximum capacity", "Drain and replace all fluids used during the testing", "Conduct a thorough inspection of the fluid reservoirs"], "a": 0}, {"n": 36, "p": "What action should be taken if the pumper achieves results less than 90% of its original capabilities?", "pg": "503", "o": ["Repeat the testing process to confirm the results", "Consult with the manufacturer for further instructions", "Follow all AHJ protocols and procedures for reporting the failure", "Proceed with regular operations and monitor the pumper's performance"], "a": 2}, {"n": 37, "p": "If a pump fails to meet the requirements of a service test, which of the following issues should be investigated as a possible cause of the problem?", "pg": "504", "o": ["Nozzle properly sized", "Transmission in wrong gear", "Engine governor is on automatic", "Excessive air leaks on the discharge side of the pump"], "a": 1}]}]};
