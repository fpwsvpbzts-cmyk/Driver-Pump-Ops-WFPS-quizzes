<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driver/Operator Quizzes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EAED; --panel:#FFFFFF; --ink:#1C2126; --muted:#5B6570; --line:#C9CFD5;
  --red:#B3121D; --yellow:#F2C230; --good:#1F7A45; --goodbg:#E3F3E8; --badbg:#FBE4E5; --warn:#A86A00;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191D; --panel:#1F252B; --ink:#E9ECEF; --muted:#9AA4AE; --line:#343C44;
    --red:#E0414B; --good:#4FC27F; --goodbg:#17301F; --badbg:#3A1A1C; --warn:#E3A83C;
  }
}
:root[data-theme="dark"]{
  --bg:#15191D; --panel:#1F252B; --ink:#E9ECEF; --muted:#9AA4AE; --line:#343C44;
  --red:#E0414B; --good:#4FC27F; --goodbg:#17301F; --badbg:#3A1A1C; --warn:#E3A83C;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
.stripe{height:14px;margin-top:env(safe-area-inset-top,0px);background:repeating-linear-gradient(135deg,var(--red) 0 22px,var(--yellow) 22px 44px)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.top{padding-top:22px}
h1{font:700 clamp(2rem,6vw,2.9rem)/1.02 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 6px;letter-spacing:.01em}
h2{font:700 1.6rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:22px 0 12px}
.sub{color:var(--muted);margin:0 0 14px}

.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1.5px solid var(--line);
  padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.tab{flex:0 0 auto;font:700 1rem "Barlow Condensed","Arial Narrow",sans-serif;min-width:44px;padding:6px 10px 4px;
  border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer;text-align:center;line-height:1.1}
.tab small{display:block;font:500 11px "Barlow",sans-serif;color:var(--muted)}
.tab:hover{border-color:var(--ink)}
.tab[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.tab[aria-selected="true"] small{color:#fff}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar button,.bar select{font:600 15px "Barlow",sans-serif;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:6px;cursor:pointer}
.bar button:hover,.bar select:hover{border-color:var(--ink)}
.score{margin-left:auto;font:700 1.5rem "Barlow Condensed",sans-serif}
.score small{font:500 14px "Barlow",sans-serif;color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 22px}
.progress span{display:block;height:100%;background:var(--red);width:0;transition:width .25s}

.q{background:var(--panel);border-left:5px solid var(--line);border-radius:4px;padding:18px 18px 14px;margin-bottom:16px}
.q.right{border-left-color:var(--good)} .q.wrong{border-left-color:var(--red)}
.qhead{display:flex;gap:10px;align-items:baseline}
.num{font:700 1.3rem "Barlow Condensed",sans-serif;color:var(--red);min-width:1.6em}
.prompt{font-weight:600;margin:0}
.page{color:var(--muted);font-size:14px;margin:4px 0 12px 2.2em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;width:100%;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt .l{font-weight:700;min-width:1.2em}
.opt.correct{background:var(--goodbg);border-color:var(--good)}
.opt.chosen-wrong{background:var(--badbg);border-color:var(--red)}
.fb{margin:10px 0 0;font-weight:600}
.fb.good{color:var(--good)} .fb.bad{color:var(--red)}
button:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.empty{background:var(--panel);padding:24px;border-radius:4px;color:var(--muted)}
.done{background:var(--ink);color:var(--bg);padding:18px;border-radius:4px;margin:8px 0 40px;font-weight:600}
@media (prefers-reduced-motion:reduce){.progress span{transition:none}}

.sticky{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1.5px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sticky .tabs{position:static;border-bottom:0;padding-top:8px}
.sources{display:flex;gap:0;margin:10px 18px 0;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;max-width:420px}
.src{flex:1;font:700 1.15rem "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.02em;padding:8px 6px 6px;border:0;background:var(--panel);color:var(--ink);cursor:pointer;line-height:1.1}
.src+.src{border-left:1.5px solid var(--ink)}
.src small{display:block;font:500 11px "Barlow",sans-serif;color:var(--muted);letter-spacing:0}
.src[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.src[aria-pressed="true"] small{color:var(--bg);opacity:.8}
.tag{display:inline-block;font:700 11px "Barlow",sans-serif;padding:1px 6px;border-radius:4px;border:1px solid var(--line);margin-right:6px;color:var(--muted)}
.tag.TEST{border-color:var(--red);color:var(--red)}
[hidden]{display:none!important}
.rangebox{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 15px "Barlow",sans-serif}
.rangebox label{display:inline-flex;gap:6px;align-items:center}
.tab.stats-tab{border-color:var(--ink)}
.tab.stats-tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab.stats-tab[aria-selected="true"] small{color:var(--bg)}
#stats h3{font:700 1.3rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:26px 0 10px}
#stats .muted{color:var(--muted);font-size:14px;margin:4px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--panel);border-radius:4px;padding:12px}
.kpi b{display:block;font:700 2rem/1 "Barlow Condensed",sans-serif}
.kpi b em{font-style:normal;font-size:1rem;color:var(--muted)}
.kpi span{font-size:13px;color:var(--muted);line-height:1.25;display:block;margin-top:4px}
.focus{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fcol h3{margin-top:22px!important}
.fitem{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:0;border-left:5px solid var(--line);border-radius:4px;padding:9px 10px;margin-bottom:6px;cursor:pointer}
.fitem b{font:700 1.15rem "Barlow Condensed",sans-serif}
.fitem.bad{border-left-color:var(--red)} .fitem.good{border-left-color:var(--good)}
.fitem:hover{outline:1.5px solid var(--ink)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px}
.sw.good{background:var(--good)} .sw.ok{background:var(--warn)} .sw.bad{background:var(--red)}
.chrows{display:grid;gap:10px}
.chrow{background:var(--panel);border-radius:4px;padding:12px 14px;border-left:5px solid var(--line)}
.chrow.good{border-left-color:var(--good)} .chrow.ok{border-left-color:var(--warn)} .chrow.bad{border-left-color:var(--red)}
.chhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.chname{font-weight:600}
.lvl{font:700 .95rem "Barlow Condensed",sans-serif;white-space:nowrap;color:var(--muted)}
.chrow.good .lvl{color:var(--good)} .chrow.ok .lvl{color:var(--warn)} .chrow.bad .lvl{color:var(--red)}
.meter{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin:8px 0 6px}
.meter span{display:block;height:100%;background:var(--muted)}
.chrow.good .meter span{background:var(--good)} .chrow.ok .meter span{background:var(--warn)} .chrow.bad .meter span{background:var(--red)}
.chfoot{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted)}
.chfoot b{color:var(--ink)}
.chbtns{display:flex;gap:6px;margin-top:10px}
.chbtns button,#clearStats{font:600 14px "Barlow",sans-serif;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer}
.chbtns button:hover,#clearStats:hover{border-color:var(--ink)}
.missed{padding-left:1.4em;margin:0}
.missed li{background:var(--panel);border-radius:4px;padding:10px 12px;margin-bottom:8px}
.missed .ans{margin:4px 0 0;font-weight:600;color:var(--good)}
.plan{display:grid;gap:10px}
.planrow{background:var(--panel);border-radius:4px;padding:12px 14px;border-left:5px solid var(--red)}
.planhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.planhead .muted{margin:0;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.chip{font:600 14px "Barlow",sans-serif;border:1.5px solid var(--line);border-radius:6px;padding:4px 8px}
.chip em{font-style:normal;font-weight:500;color:var(--muted);font-size:12px;margin-left:2px}
.chip.hot{border-color:var(--red)}
.planbtn{font:600 14px "Barlow",sans-serif;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer}
.planbtn:hover{border-color:var(--ink)}
.clearrow{margin:24px 0 40px!important}
@media (max-width:520px){.kpis{grid-template-columns:1fr 1fr}.kpis .kpi:last-child{grid-column:1/-1}.focus{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="stripe"></div>
<header class="top">
  <div class="wrap">
    <h1>Driver/Operator Quizzes</h1>
    <p class="sub">Pumping and Aerial Apparatus Driver/Operator Handbook, 4th Ed. Numbers in brackets are textbook pages.</p>
  </div>
</header>
<div class="sticky">
  <div class="sources" id="sources" role="group" aria-label="Question set"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Chapters"></nav>
</div>
<main class="wrap">
  <h2 id="scopeTitle"></h2>
  <div class="bar">
    <select id="filter" aria-label="Show questions">
      <option value="all">All questions</option>
      <option value="unanswered">Unanswered</option>
      <option value="missed">Missed</option>
      <option value="correct">Correct</option>
    </select>
    <select id="count" aria-label="Number of questions" hidden>
      <option value="0">Every question</option>
      <option value="25">Random 25</option>
      <option value="50">Random 50</option>
      <option value="100">Random 100</option>
    </select>
    <span class="rangebox" id="rangeBox" hidden>
      <label>Chapters <select id="rFrom" aria-label="From chapter"></select></label>
      <label>to <select id="rTo" aria-label="To chapter"></select></label>
    </span>
    <button id="shuffle">Shuffle</button>
    <button id="retry">Retry missed</button>
    <button id="reset">Reset</button>
    <div class="score" id="score"></div>
  </div>
  <div class="progress"><span id="prog"></span></div>
  <div id="stats" hidden></div>
  <div id="list"></div>
</main>
<script>
const SOURCES = {"QUIZ": [{"ch": 1, "title": "General Apparatus Visual/Operational Checks", "qs": [{"n": 1, "p": "Which NFPA standard specifically requires the driver/operator (D/O) to perform visual and operational checks?", "pg": "9", "o": ["NFPA 1010", "NFPA 1003", "NFPA 1021", "NFPA 1026"], "a": 0}, {"n": 2, "p": "Why is it important for a D/O to perform preventative maintenance on the apparatus?", "pg": "10", "o": ["To prevent some apparatus or equipment failures", "So the D/O can earn a degree in fire protection technology", "To increase downtime when the apparatus is in an accident", "To gain knowledge in the electrical and mechanical systems"], "a": 0}, {"n": 3, "p": "Typically, career fire departments require D/Os to perform apparatus checks on a _____ basis.", "pg": "11", "o": ["daily", "monthly", "quarterly", "annual"], "a": 0}, {"n": 4, "p": "For fire companies responding to a rescue and emergency scene, part of an essential general infection control practice is to:", "pg": "15", "o": ["isolate vectors.", "isolate biohazards.", "clean up biohazards.", "identify chemical materials."], "a": 1}, {"n": 5, "p": "If an apparatus becomes contaminated with products of combustion, personnel should wear _____ while conducting decontamination operations.", "pg": "16", "o": ["firefighter bunker gear", "their daily work uniform", "appropriate respiratory protection and PPE", "a fully encapsulated chemically protected suit"], "a": 2}, {"n": 6, "p": "After washing the exterior of an apparatus, failure to dry the vehicle thoroughly may encourage:", "pg": "18", "o": ["the brake system to fail.", "spotting and/or corrosion.", "damage to the steering system.", "damage to the pump equipment."], "a": 1}, {"n": 7, "p": "During a walk-around check, the D/Os should ensure that the cable connections for the batteries are tight and protected with:", "pg": "23", "o": ["plastic covers.", "a film of grease.", "a film of aqueous gel.", "an explosion-proof case."], "a": 1}, {"n": 8, "p": "When should fluid level checks on an apparatus be conducted?", "pg": "24", "o": ["After the apparatus has been started", "When the pressurized fluid cap is hot", "Before the apparatus has been started", "When the warning gauge gives a warning"], "a": 2}, {"n": 9, "p": "At a minimum, a thorough brake test should be performed _____ on an apparatus.", "pg": "28", "o": ["annually", "quarterly", "monthly", "weekly"], "a": 0}, {"n": 10, "p": "The purpose of diesel particulate filters (DPFs) are to trap:", "pg": "29", "o": ["all of the sediments in oil fluids.", "all fuel impurities in the system.", "micrometric particles through the air.", "particulate matter in exhaust emissions."], "a": 3}, {"n": 11, "p": "What precautions must the D/O take during an exterior inspection when the apparatus is parked with the engine running?", "pg": "30", "o": ["All present personnel have donned gear and are ready for an inspection", "All required resources for inspection and maintenance are readily available", "Chock the wheels and ensure the apparatus fluid tanks are at least three-quarters full", "Wheels are chocked according to manufacturer's recommendations, policies, and procedures"], "a": 3}]}, {"ch": 2, "title": "Apparatus Safety and Driving Emergency Vehicles", "qs": [{"n": 1, "p": "According to NFPA 1010, which certification must first be attained before becoming an aerial operator?", "pg": "55", "o": ["Fire Officer I", "Fire Fighter I", "Fire Fighter II", "Fire Inspector II"], "a": 1}, {"n": 2, "p": "Which U.S. agency establishes special requirements for licensing drivers of trucks and other large vehicles?", "pg": "55", "o": ["Department of Interior", "Commerce Department", "Department of Transportation", "Bureau of Transportation and Statistics"], "a": 2}, {"n": 3, "p": "What is a driving regulation that a D/O must adhere to?", "pg": "56", "o": ["Union codes", "Federal laws", "International laws", "Manufacturer standards"], "a": 1}, {"n": 4, "p": "Failure to follow appropriate laws and policies may:", "pg": "56", "o": ["result in criminal and/or civil charges.", "require specific AHJ policy intervention.", "indicate that the D/O does not know how to read.", "indicate that laws and policies need to be updated."], "a": 0}, {"n": 5, "p": "NFPA 1550 requires that:", "pg": "57", "o": ["D/Os in apparatus wear SCBA.", "personnel in apparatus wear seat belts.", "D/Os in apparatus wear boots and helmets.", "personnel in apparatus wear safety glasses."], "a": 1}, {"n": 6, "p": "Whether for an emergency response or routine trip, what must the D/O know first?", "pg": "66", "o": ["Which apparatus to drive", "The destination and route of travel", "How long it will take to get to the destination", "The destination and how many firefighters are going to travel"], "a": 1}, {"n": 7, "p": "Starting in 2010, apparatus equipped with selective catalytic reduction (SCR) reduced the emission of harmful _____ into the environment.", "pg": "67", "o": ["derates", "regeneration", "nitrogen oxides (NOx)", "polypropylene glycol (PPG)"], "a": 2}, {"n": 8, "p": "Which switch allows the D/O to prevent the engine from initiating an active regeneration process?", "pg": "69", "o": ["Battery switch", "Generation switch", "Diesel emission switch", "Regeneration inhibit switch"], "a": 3}, {"n": 9, "p": "All firefighters performing spotting duties during backing operations should wear reflective safety:", "pg": "71", "o": ["vests.", "boots.", "gloves.", "helmets."], "a": 0}, {"n": 10, "p": "What is a guideline to help D/Os avoid collisions?", "pg": "74", "o": ["Keep your eyes focused on one spot on the road", "Keep high beam headlights on at all times while en route to an emergency", "Maintain the appropriate distance between the apparatus and the vehicle ahead", "Maintain a low steering aim at every intersection, even if warning devices are used"], "a": 2}, {"n": 11, "p": "Fire apparatus are relatively top-heavy and therefore have:", "pg": "76", "o": ["no center of gravity.", "a low center of gravity.", "a high center of gravity.", "a displaced center of gravity."], "a": 2}, {"n": 12, "p": "When driving an apparatus downhill, shifting should be done:", "pg": "78", "o": ["while descending.", "prior to descending.", "after the apparatus has reached a speed of 10 mph (16 kph).", "after the apparatus has developed a speed greater than 5 mph (8 kph)."], "a": 1}, {"n": 13, "p": "What occurs when the throttle is at maximum and a manual transmission is in too high a gear for the speed of the vehicle?", "pg": "78", "o": ["Tail swing", "Freewheel", "Engine lugging", "Engine regeneration"], "a": 2}, {"n": 14, "p": "Emergency lights and sirens:", "pg": "99", "o": ["guarantee the D/O the right-of-way.", "do not guarantee the D/O the right-of-way.", "warn the general public of an emergency presence and guarantee the D/O the right-of-way.", "warn the general public of an emergency presence and guarantee that the public will yield to your presence on the road."], "a": 1}]}, {"ch": 3, "title": "Positioning Pumping Apparatus", "qs": [{"n": 1, "p": "When fire conditions are evident upon arrival of an incident, the D/O should place the apparatus in a position that:", "pg": "124", "o": ["has the least heat radiation.", "is downhill from the fireground.", "offers the best tactical advantage.", "provides a 360-degree view of the incident."], "a": 2}, {"n": 2, "p": "When positioning apparatus for fire attack, district familiarization and _____ will assist the D/O in making informed decisions regarding apparatus position.", "pg": "125", "o": ["weather reports", "predischarged data", "geopositioning data", "preincident planning"], "a": 3}, {"n": 3, "p": "Where must the pumper be positioned if hand lines or portable master streams are to be used?", "pg": "126", "o": ["At the backside of the structure", "In close proximity to the structure or incident scene", "Off the roadway, as far from the structure as possible", "As far from the structure or incident scene as possible"], "a": 1}, {"n": 4, "p": "Apparatus and personnel should maintain a collapse zone of at least:", "pg": "126", "o": ["three times the length of the fire apparatus.", "one and a half times the width of any structure determined likely to collapse.", "one and a half times the height of any structure determined likely to collapse.", "the hypotenuse of the right angle formed between the structure and the fire apparatus."], "a": 2}, {"n": 5, "p": "What is a D/Os responsibility when positioning to support fire department connections?", "pg": "129", "o": ["The total number of fire attack hose lines needed", "Know specific target hazards identified by the department", "The number of fire apparatus attending to the emergency site", "The location of positions for alternative static water sources for drafting operations"], "a": 1}, {"n": 6, "p": "When considering any questionable location for apparatus drafting, D/Os should conduct a _____ analysis.", "pg": "131", "o": ["fault tree", "situational", "risk/benefit", "risk/exposure"], "a": 2}, {"n": 7, "p": "What is the preferred type of hose for a hydrant connection?", "pg": "132", "o": ["Booster hose", "Hard suction hose", "Small-diameter fire hose", "Large-diameter intake hose"], "a": 3}, {"n": 8, "p": "Which on-scene role advises the planning section or IC as to the status of resource availability?", "pg": "136", "o": ["Driver/operator", "Pumper spotter", "Company officer", "Staging area manager"], "a": 3}, {"n": 9, "p": "In which hazard-control zone is the apparatus staging area most likely to be located?", "pg": "136", "o": ["Level I", "Level II", "Hot zone", "Cold zone"], "a": 3}, {"n": 10, "p": "If scene conditions allow, avoid exposing the _____ to traffic, especially if you must use the apparatus for a vehicle fire.", "pg": "137", "o": ["front end", "rear mount", "pump panel", "driver's side cab"], "a": 2}, {"n": 11, "p": "Fog reduces visibility while positioning, causing a reduction in _____ time.", "pg": "139", "o": ["brake", "release", "stoping", "perception"], "a": 3}, {"n": 12, "p": "During which type of incident response would the D/O need to know the apparatus GVWR to ensure safe operation?", "pg": "142", "o": ["Bridge", "Airport", "Railroad", "Highway"], "a": 0}, {"n": 13, "p": "When operating at storage tank fires, the apparatus should never be spotted:", "pg": "146", "o": ["outside the warm zone.", "backed into a dead-end zone.", "within 1/6 mile from the nearest tank.", "inside the dike that surrounds any tank(s)."], "a": 3}]}, {"ch": 4, "title": "Principles of Water", "qs": [{"n": 1, "p": "Water’s weight varies at different:", "pg": "162", "o": ["locations.", "pressures.", "containers.", "temperatures."], "a": 3}, {"n": 2, "p": "What characteristic makes water an excellent extinguishing agent?", "pg": "162", "o": ["Larger surface tension", "Powerful chemical inhibitor", "Greater heat-absorbing capacity", "Higher surface density than other agents"], "a": 2}, {"n": 3, "p": "The greater its surface area is exposed, water will:", "pg": "162", "o": ["incur greater friction loss.", "absorb heat more rapidly.", "gain pressure more quickly.", "slowly heat as it is absorbed."], "a": 1}, {"n": 4, "p": "Which is a disadvantage of using water as an extinguishing agent?", "pg": "163", "o": ["High density", "High latent heat of evaporation", "May be reactive with certain fuels", "Creates a barrier between the fuel source and the oxygen source"], "a": 2}, {"n": 5, "p": "Which water pressure principle states that fluid pressure is perpendicular to any surface on which it acts?", "pg": "165", "o": ["Sixth pressure principle: Shape", "Fourth pressure principle: Depth", "Third pressure principle: Intensity", "First pressure principle: Perpendicular exertion"], "a": 3}, {"n": 6, "p": "In the fire service, the height of a water supply above the discharge orifice is referred to as:", "pg": "167", "o": ["head pressure.", "direct pumping.", "velocity pressure.", "coefficient of al requirements.", "the nozzle reaction that a fire attack team will encounter."], "a": 3}]}, {"ch": 6, "title": "Theoretical Pressure Calculations", "qs": [{"n": 1, "p": "When combined, friction loss, appliance loss, and elevation loss or gains comprise:", "pg": "204", "o": ["head pressure.", "combined pressure.", "total pressure loss (TPL).", "net pump discharge pressure (NPDP)."], "a": 2}, {"n": 2, "p": "To achieve more accurate numbers when calculating friction loss, driver/operators (D/Os) can:", "pg": "206", "o": ["install a pressure reader in all hoses.", "test equipment in conditions similar to fire scenes.", "insert standardized values in the hydraulic formula.", "use electronic pressure gauges on every discharge."], "a": 1}, {"n": 3, "p": "As the fire stream flow doubles:", "pg": "206", "o": ["water head triples.", "appliance loss triples.", "turbulence quadruples.", "friction loss quadruples."], "a": 3}, {"n": 4, "p": "One accurate method for determining pressure loss in a particular hose lay involves measuring the pressure at:", "pg": "207", "o": ["the end of a particular hoseline and dividing by 3.", "both ends of the hoseline and subtracting the difference.", "the beginning of the hoseline and subtracting the net pressure.", "the first hose connection and dividing by the number of hose used."], "a": 1}, {"n": 5, "p": "Pitot tube or flowmeter, two in-line gauges, hose, and a nozzle are the equipment required for testing:", "pg": "207", "o": ["airtightness of a hose lay.", "pressure head of a water system.", "pressure loss in a particular hose lay.", "water leakage in any particular hose lay."], "a": 2}, {"n": 6, "p": "Before averaging the results of total pressure loss, D/Os must:", "pg": "208", "o": ["base test results on the hypothetical measuring data.", "conduct testing using hoses used during decontamination operations.", "test one diameter of hose of the same construction and manufacturer at a time.", "test different diameters of hose of the same ered.", "pg": "262", "o": ["flow from the nozzle", "flow from the flowmeter", "pressure from the pump", "pressure from the pressure gauge"], "a": 0}, {"n": 3, "p": "What additional information can the D/O obtain from monitoring devices?", "pg": "263", "o": ["Total water pressure after the incident", "Flow through only one specific discharge", "Flow through only two specific discharges", "Total water flow through the pump in real time"], "a": 3}, {"n": 4, "p": "Flowmeters must display flow in increments of _____ or less.", "pg": "263", "o": ["25 gpm (95 L/min)", "20 gpm (76 L/min)", "15 gpm (57 L/min)", "10 gpm (40 L/min)"], "a": 3}, {"n": 5, "p": "How can a D/O establish the correct discharge pressure to adequately supply water to the receiving pumper in a relay pumping operation?", "pg": "264", "o": ["The attack pumper(s) increases their flow, as the D/O increases the throttle on a relay pumper until the flowmeter stabilizes", "The relay pumper(s) increases their flow, as the D/O increases the throttle on the attack pumper until the flowmeter stabilizes", "The attack pumper(s) increases their flow, as the D/O increases the throttle on a relay pumper until the flowmeter reading decreases", "The relay pumper(s) increases their flow, as the D/O increases the throttle on the attack pumper until the flowmeter reading decreases"], "a": 0}, {"n": 6, "p": "Apparatus equipped with electronic pressure governors involved in relay pumping, with the exception of the attack pumper, should operate in _____ mode.", "pg": "264", "o": ["manual", "revolutions per minute (rpm)", "gallons per minute (gpm [L/min])", "pound per square inch (psi [kPa])"], "a": 1}, {"n": 7, "p": "The D/O must consider that even when a standpipe or hoseline is charged, there is no _____ through the system or hose layout until nozzles are open.", "pg": "265", "o": ["flow", "load", "resistance", "static pressure"], "a": 0}, {"n": 8, "p": "The manual version of the _____ consists of a slide or dial that can be moved to cover or reveal rates of flow, size of hose, and length of hose layout.", "pg": "265", "o": ["flowmeter", "tachometer", "scientific calculator", "hydraulic calculator"], "a": 3}, {"n": 9, "p": "Some AHJ-prescribed operating flows or pressures may come from:", "pg": "266", "o": ["NFPA 1710.", "NFPA 1900.", "ISO 18001.", "ISO 45001."], "a": 0}, {"n": 10, "p": "Fire departments will most often develop pump charts that contain information specific to:", "pg": "266", "o": ["regional locations.", "all types of apparatus nationwide.", "their jurisdiction’s equipment and common hose layout operations.", "other jurisdictions’ equipment and common hose layout operations."], "a": 2}]}, {"ch": 8, "title": "Fire Pump Characteristics", "qs": [{"n": 1, "p": "Fire pump sizes are determined by their rated capacities in gallons per minute (gpm) (liters per minute [L/min]) and in increments of:", "pg": "273", "o": ["150 gpm (600 L/min).", "250 gpm (1 000 L/min).", "350 gpm (1 400 L/min).", "450 gpm (2 000 L/min)."], "a": 1}, {"n": 2, "p": "A non-positive displacement pump:", "pg": "274", "o": ["builds velocity of water by decreasing the pressure.", "pumps a definite amount of water with each revolution.", "does not pump a definite amount of water with each revolution.", "does not build pressure by increasing the velocity of water as it leaves the pump."], "a": 2}, {"n": 3, "p": "The faster the impeller on a centrifugal pump turns:", "pg": "274", "o": ["the faster the water heats.", "the slower the water is thrown.", "the harder the water is thrown.", "the faster the water cools down."], "a": 2}, {"n": 4, "p": "A centrifugal pump with a larger impeller and a larger eye allows:", "pg": "274", "o": ["lesser water flow.", "greater water flow.", "lower water velocity.", "higher water velocity."], "a": 1}, {"n": 5, "p": "In two-stage centrifugal pumps, how many impellers are contained for each stage mounted in a single housing?", "pg": "276", "o": ["One", "Two", "Four", "Three"],  does automatic pressure regulation help ensure the safety and effectiveness of personnel operating hoselines?", "pg": "296", "o": ["Increases the volume of water", "Decreases the volume of water", "Increases the pressure in the hoselines", "Compensates for sudden changes in flow"], "a": 3}, {"n": 14, "p": "What is the primary requirement for initiating a successful drafting operation?", "pg": "299", "o": ["Creating a higher pressure in the intake hose", "Creating a lower pressure in the pump and intake hose", "Equalizing the pressure in the pump and intake hose with the atmosphere", "Preventing atmospheric pressure from entering the pump and intake hose"], "a": 1}, {"n": 15, "p": "What is the responsibility of a D/O concerning the devices that assist with extreme hot and cold conditions?", "pg": "303", "o": ["Delegate the operation of the devices to other personnel", "Request additional equipment to handle temperature extremes", "Ignore the devices and rely on standard firefighting procedures", "Know how to operate the devices and recognize the appropriate time to use them"], "a": 3}, {"n": 16, "p": "The throttle in an electronic pressure governor should be checked in the _____ modes.", "pg": "308", "o": ["rpm and intake", "pressure and rpm", "rpm and discharge", "pressure and discharge"], "a": 1}]}, {"ch": 9, "title": "Pump Operations from Pressurized Sources", "qs": [{"n": 1, "p": "What does NFPA 1900 require pumpers to have in regard to the parking brake?", "pg": "319", "o": ["A warning light that indicates if the parking brake is not set", "An override switch that allows the pump to engage without the brake being set", "A feature that prevents the pump from throttling up if the parking brake is not set", "A feature that automatically engages the emergency brake when the pump is activated"], "a": 2}, {"n": 2, "p": "What must happen before the D/O can operate the fire pump?", "pg": "320", "o": ["The hoses must be connected", "The tank-fill valve must be open", "The water supply must be turned on", "The apparatus wheels must be chocked"], "a": 3}, {"n": 3, "p": "Why must the D/O transition to an external water supply quickly and efficiently?", "pg": "323", "o": ["To prevent wasting water", "To prevent excessive noise levels", "To avoid running out of fuel for the apparatus", "To ensure a continuous water supply for the fire attack"], "a": 3}, {"n": 4, "p": "What are the two basic pressurized water supply sources that the D/O will encounter?", "pg": "324", "o": ["A water tower and a well", "A swimming pool and a lake", "A garden hose and a sprinkler system", "A fire hydrant and a relay supply from another pumper"], "a": 3}, {"n": 5, "p": "Typically, hydrants located on _____ mains have more sediment and deterioration, reducing their capacity.", "pg": "326", "o": ["dead-end", "dual direction", "dedicated system", "private service water"], "a": 0}, {"n": 6, "p": "What is the recommended frequency of fire hydrant inspection and operation according to NFPA standards?", "pg": "331", "o": ["Annually", "Quarterly", "Semi-annual", "5 years"], "a": 0}, {"n": 7, "p": "What type of weather conditions require additional precautions when operating dry-barrel hydrants?", "pg": "331", "o": ["Rainy weather", "Sunny weather", "Windy weather", "Subfreezing weather"], "a": 3}, {"n": 8, "p": "What is a forward hose lay?", "pg": "333", "o": ["A method for extinguishing a fire", "A way for firefighters to get to the fire", "A type of hose used for supplying water to a pumper", "A common way for a pumper to draw water from a hydrant"], "a": 3}, {"n": 9, "p": "What is a reverse hose lay?", "pg": "334", "o": ["A way to extinguish fires using foam", "A method for fighting fires from the air", "A way to evacuate firefighters from a burning building", "A method for laying hose from the fire to the water source"], "a": 3}, {"n": 10, "p": "The first-digit method is used for:", "pg": "338", "o": ["adding more lines to a water supply.", "measuring water pressure in metric units.", "calculating available water using psi and gpm.", "determining the type of flow needed for a fire."], "a": 2}, {"n": 11, "p": "What information does the D/O need to know before using the squaring-the-lines method?", "pg": "339", "o": ["The capacity of the water tank on the pumper", "The usual dynamic pressure of the water system", "The number of pumps required to supply water to a fire", "The static pressure of the water system before opening the pump discharges"], "a": 3}, {"n": 12, "p": "What is the squaring-the-lines method used for?", "pg": "339", "o": ["Measuring the static pressure of a water system", "Calculating the flow rate of water in a fire hydrant", "Estimating the additional water available in a water system", "Determining the volume of water initially flowed by a pumper"], "a": 2}, {"n": 13, "p": "Why should the D/O make changes in flow slowly and smoothly?", "pg": "340", "o": ["To conserve water", "To avoid water hammer", "To increase water pressure", "To make the water flow faster"], "a": 1}, {"n": 14, "p": "What is the potential consequence of water hammer?", "pg": "340", "o": ["A loss of water supply", "A steady water pressure", "A decrease in water pressure", "Damage to hydrants and other equipment"], "a": 3}]}, {"ch": 10, "title": "Pump Operations from Static Water Supply", "qs": [{"n": 1, "p": "What is the main complication of using a static source for fire fighting?", "pg": "359", "o": ["Not as reliable as municipal systems", "Contaminated with bacteria or other pollutants", "In remote areas, making it difficult for apparatus access", "Static sources are often not as clean as municipal systems"], "a": 2}, {"n": 2, "p": "The greatest height to which any amount of water may be raised through an intake hose to the pump, is known as _____ lift.", "pg": "361", "o": ["static", "maximum", "theoretical", "dependable"], "a": 1}, {"n": 3, "p": "When evaluating a potential water supply source, first determine its:", "pg": "364", ny apparatus achieves results less than _____ of its original capabilities, the D/O should follow all AHJ protocols and procedures for reporting the failure.", "pg": "503", "o": ["75%", "85%", "90%", "95%"], "a": 2}]}], "TEST": [{"ch": 1, "title": "General Apparatus Visual/Operational Checks", "qs": [{"n": 1, "p": "An inspection performed by the eye without equipment is called a(an):", "pg": "9", "o": ["visual check.", "maintenance test.", "inspection survey.", "operational check."], "a": 0}, {"n": 2, "p": "The type of inspection that verifies functionality of a vehicle’s components or systems is a(an):", "pg": "9", "o": ["visual check.", "maintenance test.", "inspection survey.", "operational check."], "a": 3}, {"n": 3, "p": "What is a primary goal of apparatus preventative maintenance?", "pg": "10", "o": ["To save money buying fire apparatus parts", "To reduce the frequency and cost of repairs", "To eliminate the cost of the apparatus parts", "To maximize downtime due to maintenance-related failures"], "a": 1}, {"n": 4, "p": "Why is the D/O integral to the inspection, maintenance, and testing of emergency vehicles?", "pg": "10", "o": ["They are certified mechanics on their apparatus", "Typically the first person to identify mechanical problems", "More knowledgeable about the vehicle's electrical systems", "The only ones who know how to extend the life of the equipment"], "a": 1}, {"n": 5, "p": "To prevent unnecessary wear due to friction, it may be necessary to perform a _____ after cleaning the apparatus.", "pg": "14", "o": ["wear test", "routine lubrication", "routine grease rinse", "check of friction points"], "a": 1}, {"n": 6, "p": "A leak that is great enough to form drops but not enough for them to fall from the item being inspected is a _____ leakage.", "pg": "14", "o": ["Class 1", "Class 2", "Class 3", "Class 4"], "a": 1}, {"n": 7, "p": "Leaking fuel lines indicate serious trouble and should be considered a:", "pg": "15", "o": ["biohazard.", "fire hazard.", "physical hazard.", "secondary hazard."], "a": 1}, {"n": 8, "p": "A Class 2 leakage of fuel lines is considered a(an):", "pg": "15", "o": ["occurring standard.", "minor vehicle event.", "out-of-service criterion.", "reason to change fuel lines."], "a": 2}, {"n": 9, "p": "D/Os have the responsibility to ensure the apparatus is free of contamination from products of combustion and:", "pg": "15", "o": ["carcinogens.", "microorganisms.", "acetylene alcohol.", "micro dust particulates."], "a": 0}, {"n": 10, "p": "How should large, loose dirt particles on the interior of an apparatus be removed?", "pg": "16", "o": ["Vaccum", "Shop air", "Shop towels", "Soapy water"], "a": 0}, {"n": 11, "p": "What is the safest practice to prevent carcinogen exposure in the fireground?", "pg": "16", "o": ["Follow your instincts", "Avoid harsh preservatives", "Avoid combustion products", "Check for mold and other toxins"], "a": 2}, {"n": 12, "p": "The clean cab concept includes carrying areas for the storage of:", "pg": "17", "o": ["contaminated PPE.", "a simple set of PPE.", "a single set of SCBA.", "alcohol cleaning kits."], "a": 0}, {"n": 13, "p": "While new paint and protective coatings are fresh on an apparatus, the exterior should be washed frequently with _____ water to harden the paint and keep it from spotting.", "pg": "17", "o": ["cold", "hard", "warm", "soapy"], "a": 0}, {"n": 14, "p": "What cleaning tool can grind grit into the glass surface when cleaning or drying the apparatus windshield?", "pg": "20", "o": ["Microfiber rag", "Silk window rag", "Cotton fiber cloth", "Dry towels or rags"], "a": 3}, {"n": 15, "p": "Vehicle batteries must be cleaned by washing them with a solution of:", "pg": "23", "o": ["acetic acid and soda.", "baking soda and water.", "caustic soda and water.", "baking powder and vinegar."], "a": 1}, {"n": 16, "p": "Because apparatus batteries can give off hydrogen gas, what preventative measure should be taken when servicing them?", "pg": "23", "o": ["Ventilate the area", "Use a water mist to dilute gas", "Keep room below 60°F (15.5°C)", "Attach a grounding strap to a terminal"], "a": 0}, {"n": 17, "p": "The apparatus transmission fluid level check should be conducted:", "pg": "24", "o": ["while the engine is running.", "after the engine has been run.", "before the engine has been run.", "before and after the engine is run."], "a": 0}, {"n": 18, "p": "When checking the oil level on an apparatus, make sure that the vehicle:", "pg": "24", "o": ["is on a level surface.", "is sitting on an incline.", "has the engine running.", "vehicle is on soft terrain."], "a": 0}, {"n": 19, "p": "To avoid an excessive load on batteries during the starting procedure, ensure that:", "pg": "25", "o": ["all electric equipment is unplugged.", "half of the electric equipment is turned OFF.", "all electrical switches are in the ON position.", "all electrical switches are in the OFF position."], "a": 3}, {"n": 20, "p": "To perform the prove-out (self-check) stage on apparatus, the D/O must:", "pg": "25", "o": ["keep the ignition and engine turned off.", "turn the ignition on and start the engine.", "turn the ignition off and release the brakes.", "turn the ignition on, but do not start the engine."], "a": 3}, {"n": 21, "p": "Which warning light illuminates when the onboard diagnostics system detects an emissions control system malfunction?", "pg": "26", "o": ["Amber Warning Lamp", "Malfunction Indicator Lamp (MIL)", "Diesel Particulate Filter Light (DPF)", "HEST Light (High Exhaust System Temperature)"], "a": 1}, {"n": 22, "p": "Which device indicates the amount of current flowing to or from the batteries?", "pg": "26", "o": ["Ammeter", "Voltmeter", "DPF indicator", "DEF indicator"], "a": 0}, {"n": 23, "p": "Most commercial and private vehicles built since 1990 are equipped with _____ systems.", "pg": "27", "o": ["anti-freezing", "anti-lock braking", "hydraulic braking", "automatic fog lamp"], "a": 1}, {"n": 24, "p": "What assists the D/O to keep the apparatus in a straight trajectory during heavy or emergency braking?", "pg": "28", "o": ["Hydraulic brakes", "Vehicle tilt switch", "Anti-lock braking system", "Automatic slack adjusters"], "a": 2}, {"n": 25, "p": "Apparatus brakes should be thoroughly tested using the methods outlined by:", "pg": "28", "o": ["NFPA 1910.", "NFPA 1002.", "a trusted apparatus mechanic.", "CDL Endorsements & Restrictions."], "a": 0}, {"n": 26, "p": "What is the function of a Selective Catalyst Reductant (SCR)?", "pg": "29", "o": ["Increases the output of the HEST filter", "Assists a braking system to avoid sliding", "Increases nitrogen oxide (NOx) emissions", "Uses DEF to help further reduce emissions"], "a": 3}, {"n": 27, "p": "What adjustment should a D/O perform during the test and maintenance of a manual shift transmission but not with an automatic transmission?", "pg": "30", "o": ["The brake pedal", "The clutch pedal", "The accelerator pedal", "The gear shift lever knob"], "a": 1}, {"n": 28, "p": "The distance that a vehicle clutch pedal must be pushed before the throw-out bearing actually contacts the clutch release fingers is known as:", "pg": "30", "o": ["free play.", "tolerance.", "safety distance.", "clutch release distance."], "a": 0}, {"n": 29, "p": "Steering wheel play should be no more than _____ degrees in either direction.", "pg": "30", "o": ["5", "10", "15", "20"], "a": 1}, {"n": 30, "p": "During an exterior inspection, when the apparatus is parked and engine running, the D/O must ensure that the _____ according to manufacturer recommendations.", "pg": "30", "o": ["engine runs", "pump engages", "wheels are chocked", "rear wheels are free to move"], "a": 2}, {"n": 31, "p": "Who establishes the standard operating procedure (SOP) a D/O should follow if they find a deficiency during a vehicle or operating check?", "pg": "31", "o": ["The D/O assigned to that apparatus", "The authority having jurisdiction (AHJ)", "The municipality that purchases the vehicles", "The D/O or firefighter that is in charge of inspections"], "a": 1}, {"n": 32, "p": "NFPA 1910 mandates tire tread depth limitations of no less than _____ on any non-steering axle at any two adjacent major tread grooves.", "pg": "32", "o": ["2/32 inches (1.6 mm) on any steering axle or 4/32 inches (3.2 mm)", "4/32 inches (3.2 mm) on any steering axle or 2/32 inches (1.6 mm)", "5/32 inches (4 mm) on any steering axle or 2/32 inches (2.3 mm)", "6/32 inches (4.7 mm) on any steering axle or 4/32 inches (3.2 mm)"], "a": 1}, {"n": 33, "p": "The maximum recommended tire pressure is imprinted on the exterior of the tires; however, the tires' actual pressure specification is up to the:", "pg": "32", "o": ["AHJ to determine from actual axle weight.", "D/O to determine from actual axle weight.", "AHJ to determine from estimated axle weight.", "D/O to determine from estimated axle weight."], "a": 0}, {"n": 34, "p": "Where is the apparatus tire size listed?", "pg": "33", "o": ["Gross Axle Weight Ratings (GAWRs) sticker near the driver’s position", "Gross Vehicle Weight Rating (GVWR) sticker near the driver’s position", "Gross Axle Weight Ratings (GAWRs) booklet in the glove compartment", "Gross Vehicle Weight Rating (GVWR) booklet in the glove compartment"], "a": 1}, {"n": 35, "p": "According to NFPA 1910, tires have a maximum age of _____ years.", "pg": "33", "o": ["two", "three", "five", "seven"], "a": 3}, {"n": 36, "p": "The maximum weight at which a vehicle can be safely operated on roadways in ideal conditions is known as:", "pg": "33", "o": ["Net Vehicle Weight Rating.", "Gross Axle Weight Ratings.", "Curb Weight Vehicle Rating.", "Gross Vehicle Weight Rating."], "a": 3}, {"n": 37, "p": "What is the curb weight of the apparatus?", "pg": "33", "o": ["The maximum weight for each axle on the apparatus with the load applied", "The weight of a fire apparatus fresh off the assembly line with tools, water, and equipment", "The maximum weight at which a vehicle can be safely operated on roadways in ideal conditions", "The weight of an empty fire apparatus fresh off the assembly line with no tools, water, equipment, or passengers"], "a": 3}, {"n": 38, "p": "Fire apparatus equipped with electric power generators may be powered by separate engines with or without their own fuel tank, or by:", "pg": "34", "o": ["480 volt AC pump controllers.", "hydraulic power take-off systems.", "an independent setup transformer.", "scene lighting power distribution equipment."], "a": 1}, {"n": 39, "p": "Fire apparatus files for inspections, maintenance requests, preventive maintenance, repairs, and testing results must be kept for:", "pg": "36", "o": ["5 years.", "10 years.", "20 years.", "the life of the vehicle."], "a": 3}, {"n": 40, "p": "In the event of a lawsuit involving a fire apparatus accident, it is possible that:", "pg": "36", "o": ["daily/weekly check records may be solicited for audit review.", "driver operator personal records may be solicited for court review.", "maintenance and inspection records will not be subpoenaed for court review.", "apparatus checks, maintenance, and inspection records may be subpoenaed for court review."], "a": 3}, {"n": 41, "p": "Proper documentation of recurrent repairs of fire apparatus can assist in deciding:", "pg": "36", "o": ["which new model of apparatus should be purchased.", "how much equipment can be added to the GVWR of the vehicle.", "how much equipment should be removed due to the GAWR of the vehicle.", "whether to purchase new apparatus instead of continued repairs on an older unit."], "a": 3}]}, {"ch": 2, "title": "Apparatus Safety and Driving Emergency Vehicles", "qs": [{"n": 1, "p": "Why is it important for D/Os to possess mathematical skills?", "pg": "54", "o": ["For developing maps and to dispatch instructions", "For deploying hard sleeve hose for drafting operations", "To complete preventative maintenance forms and repair requests", "To solve mathematical equations, such as friction loss calculations"], "a": 3}, {"n": 2, "p": "When pursuing D/O certification, a candidate must first fulfill the:", "pg": "55", "o": ["driver’s life insurance requirements.", "driver’s FBI background check requirements.", "driver’s passport requirements for their country, state/province.", "local driver's licensing requirements and the AHJ requirements of the D/O position."], "a": 3}, {"n": 3, "p": "To be designated a D/O, qualified candidates may need to:", "pg": "56", "o": ["be a new hire.", "pass written and practical testing.", "complete a probationary period as a co-pilot on an apparatus.", "successfully serve as an acting firefighter until official designation."], "a": 1}, {"n": 4, "p": "In which situation would an emergency vehicle be exempt from driving regulations such as speed limits or direction of travel?", "pg": "56", "o": ["Driving apparatus on public roads for the purpose of road testing", "Response to an emergency with active audible and visible warning devices", "Operation of apparatus to verify the functionality of components or systems", "Response to a community event with inactive audible and visible warning devices"], "a": 1}, {"n": 5, "p": "In most jurisdictions when a school bus has its red lights flashing, a fire department apparatus D/O must:", "pg": "57", "o": ["proceed and continue watching for pedestrians unaware of the apparatus.", "stop and continue slowly, watching for children unaware of the apparatus.", "stop and proceed only after the bus driver or a police officer gives a safe-to-proceed signal.", "proceed and continue at the same speed regardless of signals from the bus driver or police officers."], "a": 2}, {"n": 6, "p": "The driver and the officers in charge may be found guilty of criminal gross negligence and recklessness if a D/O:", "pg": "57", "o": ["operates the apparatus while under the influence of alcohol.", "practices defensive driving techniques while operating the apparatus.", "yields to emergency vehicles and resources during an emergency response.", "drives the apparatus above the speed limit during a nonemergency response."], "a": 0}, {"n": 7, "p": "Traffic control devices on roadways and at intersections:", "pg": "57", "o": ["allow D/Os to move faster than the flow of traffic.", "do not apply to D/Os during emergency situations.", "do not relieve the D/O from using defensive driving techniques.", "should be switched to red so that traffic stops and gives the apparatus right-of-way."], "a": 2}, {"n": 8, "p": "Some of the most common causes of D/O injuries are _____ when entering and exiting the apparatus.", "pg": "58", "o": ["slips and falls", "cuts from rungs", "crushed hands and feet", "sprains and broken bones"], "a": 0}, {"n": 9, "p": "If a D/O dismounts on the side of the apparatus exposed to traffic, they must:", "pg": "58", "o": ["use at least two spotters to tell them when it is safe to exit the apparatus.", "watch for oncoming vehicles and wait for traffic to completely stop before exiting.", "reposition the apparatus so they will be able to dismount on the side not exposed to traffic.", "watch for oncoming vehicles before opening their door, and wait for a break in traffic before exiting."], "a": 3}, {"n": 10, "p": "NFPA 1550 mandates that persons riding in an enclosed apparatus cab with seat-back protections should:", "pg": "59", "o": ["NOT wear helmets.", "wear helmets at all times.", "NOT wear helmets when the apparatus is parked.", "only wear helmets when the apparatus is in motion."], "a": 0}, {"n": 11, "p": "Firefighters riding in an apparatus must don helmets when:", "pg": "59", "o": ["responding in an open cab and open tiller.", "responding in an apparatus without seatbelts.", "taking part in an informal post-incident analysis.", "inside a closed cab with provided neck and head protection."], "a": 0}, {"n": 12, "p": "Which of the following practices is prohibited for riders in a fire apparatus before it begins to move?", "pg": "59", "o": ["Reviewing incident information", "Checking radio communications", "Preparing personal protective equipment", "Remaining unsecured without a seat belt"], "a": 3}, {"n": 13, "p": "Which situation is an exception to the required seat belt usage rule found in NFPA 1550?", "pg": "61", "o": ["The crew is wearing full personal protective equipment (PPE)", "Firefighters are providing needed medical care inside the apparatus cab", "Firefighters are responding to an incident in an apparatus with an open tiller", "The crew is carrying tools and equipment to an life-threatening emergency scene"], "a": 1}, {"n": 14, "p": "How many crewmembers should be assigned as safety observers during a hose-loading operation?", "pg": "62", "o": ["One", "Two", "Three", "Four"], "a": 0}, {"n": 15, "p": "What is one requirement mentioned by NFPA 1550 for performing hose-loading operations?", "pg": "62", "o": ["All crew members must be trained on how to perform CPR", "The D/O must drive the apparatus backward during the operation", "The apparatus should never drive backward at a speed greater than 10 mph (16 km/h)", "The safety observer should have visual and voice communication with the D/O loading the hose"], "a": 3}, {"n": 16, "p": "A D/O should drive the apparatus at a speed no greater than 5 mph (10 km/h) during _____ operations.", "pg": "62", "o": ["roll-over", "hose-loading", "defensive driving", "roll stability control"], "a": 1}, {"n": 17, "p": "When firefighters on board an apparatus encounter noise levels greater than 90 decibels (dB), they must:", "pg": "62", "o": ["use hearing protection that is approved by their jurisdiction.", "lower the volume of all active audible warning devices on the apparatus.", "inform all firefighters on board to put on their helmets to muffle the noise.", "select hearing protection for each firefighter based on its availability and price."], "a": 0}, {"n": 18, "p": "What should the D/O do to maintain situational awareness during a roadway incident?", "pg": "64", "o": ["Have rested at least 4 hours", "Wear a well-broke-in uniform", "Wear a high-visibility garment", "Have radios on maximum volume"], "a": 2}, {"n": 19, "p": "Which direction should emergency personnel walk in relation to oncoming traffic at a roadway incident?", "pg": "64", "o": ["Walk with traffic flow", "Walk parallel to traffic", "Walk facing oncoming traffic", "Walk with your back to traffic"], "a": 2}, {"n": 20, "p": "Which traffic control zone includes areas up and downstream from the incident buffer space where emergency vehicles can position?", "pg": "65", "o": ["Activity areas", "Transition areas", "Termination zone", "Advance warning zone"], "a": 0}, {"n": 21, "p": "Where can traffic downstream from the incident merge and return to normal flow/lanes in a traffic control zone?", "pg": "65", "o": ["Activity Area", "Transition Area", "Termination Zone", "Advance Warning Area"], "a": 2}, {"n": 22, "p": "What should the D/O utilize to mount the apparatus?", "pg": "66", "o": ["Seat belt", "Steering wheel", "Apparatus door handle", "Appropriate grab handles"], "a": 3}, {"n": 23, "p": "After a D/O locates the apparatus’ battery switch and turns it on, they should _____ to begin the prove-out process.", "pg": "66", "o": ["engage the DEF", "activate the ignition", "secure their seat belt", "disconnect non-auto-eject lines"], "a": 1}, {"n": 24, "p": "What should the driver/operator (D/O) do after securing their seatbelt?", "pg": "67", "o": ["Open the door", "Start the engine", "Check the parking brake", "Adjust the mirrors and steering wheel"], "a": 3}, {"n": 25, "p": "Before engaging the ignition and starting the apparatus, ensure that the parking brake is applied and the apparatus is in the _____ position.", "pg": "67", "o": ["park", "drive", "neutral", "reverse"], "a": 2}, {"n": 26, "p": "The process that reduces engine torque output or limits the vehicle speed is called:", "pg": "67", "o": ["derating.", "regeneration.", "speed control.", "reacceleration."], "a": 0}, {"n": 27, "p": "Apparatus engines manufactured in and after 2007 often come equipped with a diesel particulate filter (DPF) that traps diesel particulate matter and:", "pg": "67", "o": ["prevents its release into the atmosphere.", "regenerates it back into the diesel engine.", "reduces the emission of nitrogen oxide.", "reduces the emission of water vapor."], "a": 3}, {"n": 28, "p": "An illuminated diesel particulate filter (DPF) light on an apparatus dashboard informs the D/O that the engine requires a(an):", "pg": "68", "o": ["complete scan.", "complete manual regeneration.", "immediate active (automatic) derating.", "replacement selective catalytic reductant."], "a": 1}, {"n": 29, "p": "An apparatus equipped with Selective Catalyst Reductant (SCR) will have a tank with a light blue cap that must be filled with:", "pg": "69", "o": ["water.", "fuel oil.", "diesel starting fluid (DSF).", "diesel exhaust fluid (DEF)."], "a": 3}, {"n": 30, "p": "Keeping the _____ topped off reduces crystal formation which can impair engine performance.", "pg": "69", "o": ["engine fuel tank", "diesel exhaust fluid (DEF)", "select catalyst reductant (SCR)", "diesel particulate filtration (DPF)"], "a": 1}, {"n": 31, "p": "Shutting down an engine without a sufficient cooldown may result in:", "pg": "70", "o": ["damage to exhaust system filters.", "water film “boiling” on hot surfaces.", "damage to the turbocharger that can result in engine seizure.", "immediate decrease of engine temperature from constant coolant circulation."], "a": 2}, {"n": 32, "p": "What is a recommended general rule for backing fire apparatus?", "pg": "70", "o": ["Identify any obstructions in front of the apparatus", "If possible, position the apparatus so that backing will not be necessary", "Back the apparatus as quickly as possible to avoid outpacing the spotter", "If possible, turn off radios to facilitate verbal communication with spotters"], "a": 1}, {"n": 33, "p": "Backing a fire apparatus can be a hazardous action because of the:", "pg": "70", "o": ["vehicle’s size.", "news media on the scene.", "number of personnel on the scene.", "number of lights illuminating the scene."], "a": 0}, {"n": 34, "p": "To safely back up a fire apparatus, the driver/operator should use all means of observation at their disposal, including scanning between their direct field of vision, video screens and:", "pg": "71", "o": ["spotters.", "scene lights.", "radio communications.", "standard operating procedures."], "a": 0}, {"n": 35, "p": "Where should the spotter be positioned while backing the fire apparatus?", "pg": "71", "o": ["On the driver’s side no matter terrain conditions", "On the driver’s side unless not allowed by the terrain", "At the front of the apparatus where the D/O can easily see the spotter", "At the rear of the apparatus where the D/O can see the spotter through the camera"], "a": 1}, {"n": 36, "p": "If the D/O loses sight of the spotter or feels unsafe while backing the apparatus, the D/O should stop, set the parking brake, and:", "pg": "71", "o": ["rev the engine and turn on audible and visual warning devices.", "stay in the apparatus and contact dispatch using the apparatus radio.", "get out of the apparatus to check that everyone understands the plan.", "look for the spotters using the rear camera to ensure they are still there."], "a": 2}, {"n": 37, "p": "If conditions allow, where should the spotter be standing when a driver/operator is backing up an apparatus?", "pg": "71", "o": ["Wherever the D/O directs the spotter to stand", "In front of the apparatus where the D/O can clearly see the spotter", "Behind and slightly to the outside of the apparatus on the left (driver's) side", "Behind and slightly to the outside of the apparatus on the right (passenger's) side"], "a": 2}, {"n": 38, "p": "Backing spotters must be prepared to simultaneously stop the apparatus as well as oncoming vehicles or:", "pg": "72", "o": ["pedestrians.", "new media vehicles.", "emergency vehicles.", "other fire apparatus."], "a": 0}, {"n": 39, "p": "Which of the six hand signals used to maintain clear communication indicates that the apparatus should back straight?", "pg": "72", "o": ["Both forearms crossed into a large X", "Back and forth motion with both arms outward and bent at the elbows", "Right arm pointed towards the right with the right palm facing the driver", "Both arms outstretched with palms facing down and motioning back and forth"], "a": 1}, {"n": 40, "p": "An angle of departure is formed by level ground and a line from the point where the rear tires touch the ground to the lowest projection at the _____ of the apparatus.", "pg": "75", "o": ["rear", "right", "front", "bottom"], "a": 0}, {"n": 41, "p": "Which point of potential contact is formed by level ground and a line from the point where the front and rear tires touch the ground to the bottom of the frame at the wheelbase midpoint?", "pg": "75", "o": ["Right angle", "Breakover angle", "Angle of approach", "Angle of departure"], "a": 1}, {"n": 42, "p": "Generally, as the apparatus' wheelbase shrinks,:", "pg": "75", "o": ["stability is gained.", "maneuverability is lost.", "stability is lost but maneuverability is gained.", "maneuverability is lost but stability is gained."], "a": 2}, {"n": 43, "p": "The angle formed by level ground and a line from the point where the front and rear tires touch the ground to the bottom of the frame at the wheelbase midpoint is known as:", "pg": "75", "o": ["tail swing.", "breakover angle.", "angle of approach.", "angle of departure."], "a": 1}, {"n": 44, "p": "When turning and stabilizing emergency vehicles, such as an aerial apparatus, D/Os must be aware of the vehicle’s:", "pg": "76", "o": ["overload and weight.", "tail swing and weight.", "central vision and speed.", "center of gravity and speed."], "a": 3}, {"n": 45, "p": "The arc created by the distance between the vehicle’s rear when turning is known as:", "pg": "76", "o": ["tail swing.", "breakover angle.", "angle of approach.", "angle of departure."], "a": 0}, {"n": 46, "p": "What can a D/O do to keep apparatus weight transfer to a minimum?", "pg": "76", "o": ["Use variable speeds during a response", "Use inappropriate speeds during a response", "Steer the apparatus in a smooth, fluid motion", "Steer the apparatus with a series of multiple turns"], "a": 2}, {"n": 47, "p": "Whenever a vehicle undergoes a change in speed or direction, the vehicle's weight transfers relative to the:", "pg": "76", "o": ["wheelbase.", "apparatus dimensions.", "weight of the apparatus.", "rate and degree of change."], "a": 3}, {"n": 48, "p": "Onboard water tanks are best for the traction of the vehicle when it is:", "pg": "77", "o": ["empty.", "½ full.", "¾ full.", "full."], "a": 3}, {"n": 49, "p": "D/Os need to know the gross vehicle weight rating (GVWR) of the apparatus they operate to know:", "pg": "77", "o": ["the baffling specifications for the onboard water tanks.", "the quality of pavement that roads and bridges must have.", "which roads and bridges the apparatus can safely traverse.", "the maximum weight of the driver operator who will drive the fire apparatus."], "a": 2}, {"n": 50, "p": "A D/O who is practicing defensive driving continually evaluates upcoming road conditions for hazards and:", "pg": "77", "o": ["adjusts to these conditions and traffic.", "uses panoramic vision to assess hazards.", "rides at inappropriate speeds to control hazards.", "turns on lights and sirens until the hazard is clear."], "a": 0}, {"n": 51, "p": "Which condition poses a particular concern for liquid surge when driving a fire apparatus?", "pg": "77", "o": ["Empty tanks", "Properly baffled full tanks", "Tanks fully filled with foam concentrate", "Improperly baffled or partially filled tanks"], "a": 3}, {"n": 52, "p": "What is the primary purpose of baffles in fire apparatus water tanks?", "pg": "77", "o": ["To reduce vehicle weight", "To increase water capacity", "To improve water flow during pumping and drafting operations", "To limit lateral and front-to-back forces affecting vehicle handling"], "a": 3}, {"n": 53, "p": "What is a defensive driving tactic?", "pg": "78", "o": ["Reducing speeds in inclement weather", "Increasing speeds when it is not raining", "Driving with the understanding that other drivers may choose to take safe actions at all times", "Continually evaluating traffic conditions to adjust apparatus speed and get to the scene faster"], "a": 0}, {"n": 54, "p": "Engine lugging can occur if the driver:", "pg": "78", "o": ["activates auxiliary brakes too soon to move downhill.", "operates the engine at a very high RPM, beyond its safe operating limit.", "downshifts too late when a vehicle needs a lower gear to move up a steep grade.", "downshifts too late when a vehicle needs a lower gear to move on horizontal terrain."], "a": 2}, {"n": 55, "p": "NFPA 1900 requires every apparatus to have _____ that lists vehicle height and weight to emphasize the importance of watching for bridge and overpass limits.", "pg": "79", "o": ["an original bill of sale", "a placard in the vehicle", "specifications filed with the AHJ", "manufacturer's specifications on every tire"], "a": 1}, {"n": 56, "p": "What should the D/O do before crossing railroad tracks?", "pg": "79", "o": ["Slow the apparatus and look both ways", "Check by satellite if a train is about to pass", "Pass over the railroad track as quickly as possible", "Stop, set the parking brake, and get out of the apparatus"], "a": 0}, {"n": 57, "p": "It may take three to fifteen times greater distance for a vehicle to come to a complete stop on:", "pg": "80", "o": ["dry pavement.", "new pavement.", "deteriorated pavement.", "snow and icy pavement."], "a": 3}, {"n": 58, "p": "What is the most likely place for a collision to occur involving an emergency vehicle?", "pg": "80", "o": ["Highways", "Rural roads", "Intersections", "Heavy trafficked streets"], "a": 2}, {"n": 59, "p": "When coming to an intersection, many jurisdictions and NFPA 1550 require the D/O of an apparatus to:", "pg": "80", "o": ["slow to 5 mph (10 km/h).", "coast through the intersection.", "come to a full stop before proceeding.", "come to a half-stop before proceeding."], "a": 2}, {"n": 60, "p": "When driving the apparatus into an opposing lane of traffic through an intersection, the apparatus must proceed:", "pg": "80", "o": ["as fast as possible.", "at a greatly reduced speed.", "and turn off all emergency lights.", "using a spotter to control oncoming traffic."], "a": 1}, {"n": 61, "p": "What hazard should a D/O be particularly aware of when operating the apparatus at night?", "pg": "81", "o": ["Mechanical failure", "Poor vehicle design", "Distracting roadway advertisements", "Reflection caused by snow, fog, or rain"], "a": 3}, {"n": 62, "p": "The main goal of the Crew Resource Management (CRM) Model is to reduce line-of-duty-deaths (LLODs) by requiring that all crew members maintain:", "pg": "86", "o": ["reckless disregard.", "situational awareness.", "ambiguity in communication.", "overconfidence in their abilities."], "a": 1}, {"n": 63, "p": "What is a factor that may lead to the loss of situational awareness when information received is confusing or unclear?", "pg": "86", "o": ["Fixation", "Ambiguity", "Distraction", "Unresolved discrepancy"], "a": 1}, {"n": 64, "p": "What is a factor that may lead to the loss of situational awareness when crew members become so fixated on one detail that they ignore everything else?", "pg": "87", "o": ["Overload", "Distraction", "Unresolved discrepancy", "Lack of comprehensive hazard surveillance"], "a": 3}, {"n": 65, "p": "What type of apparatus incident generally accounts for a significant percentage of all damage repair costs?", "pg": "88", "o": ["180 degree turning", "Backing the apparatus", "Highway traffic incidents", "Not yeilding at traffic lights"], "a": 1}, {"n": 66, "p": "What is a cause of D/O mental or physical impairment?", "pg": "88", "o": ["Complacency", "Substance abuse", "Improper backing", "Lack of experience"], "a": 1}, {"n": 67, "p": "If a D/O has sufficient visual lead time, their reaction time and knowledge of apparatus stopping distance limitations can prevent:", "pg": "91", "o": ["baffling.", "a collision.", "brake damage.", "waste of driving time."], "a": 1}, {"n": 68, "p": "What is the distance traveled between what the D/O visually sees and what is perceived as a reason to stop?", "pg": "91", "o": ["Braking distance", "Perception distance", "Total stopping distance", "Driver reaction distance"], "a": 1}, {"n": 69, "p": "What is the recommended following distance according to the 2-4-12 rule for speeds below 55 mph (88 km/h)?", "pg": "92", "o": ["One-second interval", "Two-second interval", "Four-second interval", "Twelve-second interval"], "a": 1}, {"n": 70, "p": "Why is a four-second interval recommended for speeds above 55 mph (88 km/h) according to the 2-4-12 rule?", "pg": "92", "o": ["Ensures a smoother driving experience", "Prevents other vehicles from overtaking the apparatus", "Reduces the risk of encountering potholes on the road", "Allows for increased stopping distances required by higher speeds"], "a": 3}, {"n": 71, "p": "Which type of surface provides the optimal stopping environment for an apparatus in motion?", "pg": "92", "o": ["Icy", "Wet", "Paved", "Unpaved"], "a": 2}, {"n": 72, "p": "What are the common causes of skidding?", "pg": "94", "o": ["Tires and brake conditions", "Apparatus model and design", "Acceleration and locked wheel", "Weight and dimensions of the apparatus"], "a": 2}, {"n": 73, "p": "To stop a skid in a vehicle equipped with an antilock braking system (ABS), the D/O should:", "pg": "95", "o": ["intermittently pump the brake pedal.", "pump the brake pedal until the vehicle stops.", "maintain a steady pressure on the brake pedal.", "release the brakes to allow the wheels to rotate freely."], "a": 2}, {"n": 74, "p": "NFPA 1900 requires that all apparatus with a GVWR of _____ or greater be equipped with an auxiliary braking system.", "pg": "95", "o": ["66,000 lb (29 937 kg)", "56,000 lb (25 401 kg)", "46,000 lb (20 865 kg)", "36,000 lb (18 000 kg)"], "a": 3}, {"n": 75, "p": "The amount of retardation force available from any auxiliary braking system on an apparatus is a complex function of vehicle speed, engine speed, temperature, and:", "pg": "96", "o": ["ambiguity.", "tire condition.", "cooling system.", "control strategy."], "a": 3}, {"n": 76, "p": "Which auxiliary traction control system improves overall traction on slippery roads by transferring engine torque to the wheels that still have traction?", "pg": "97", "o": ["Interaxle differential lock (IDL)", "Automatic traction control (ATC)", "Transmission output retarders (TOR)", "Driver controlled differential local (DCDL)"], "a": 1}, {"n": 77, "p": "What is the speed at which an emergency vehicle may begin to outrun the effective range of its audible warning device?", "pg": "100", "o": ["Above 50 mph (80 km/h)", "Above 55 mph (90 km/h)", "Above 65 mph (105 km/h)", "Above 75 mph (120 km/h)"], "a": 0}, {"n": 78, "p": "In addition to dimming headlights and spotlights at an incident scene, D/Os must be aware that warning lights and scene floodlights may reduce the effectiveness of the:", "pg": "100", "o": ["audible warning devices.", "stability and traction controls.", "reflective trim on firefighter PPE.", "strobe light activated preemption devices."], "a": 2}, {"n": 79, "p": "A microphone on the traffic signal that receives the sound of an oncoming siren and orders the appropriate control signal is known as a(an):", "pg": "102", "o": ["apparatus routing device.", "GPS-based radio transmitter.", "traffic signal preemption device.", "emergency mode municipal switch."], "a": 2}, {"n": 80, "p": "NFPA 1010 requires that prospective D/Os be able to perform practical driving exercises with each type of:", "pg": "103", "o": ["apparatus used in their jurisdiction.", "apparatus used in their department.", "apparatus they are expected to drive.", "similar apparatus they are expected to drive no matter the model."], "a": 2}]}, {"ch": 3, "title": "Positioning Pumping Apparatus", "qs": [{"n": 1, "p": "For all response situations, what must the D/O know prior to committing to a position?", "pg": "124", "o": ["Who owns the compromised facility", "To understand the scene conditions", "Location of the nearest medical facility", "How long the apparatus will be on scene"], "a": 1}, {"n": 2, "p": "The D/O of the first-arriving apparatus must observe conditions and determine the best apparatus position based on:", "pg": "124", "o": ["initial overhaul and salvage policy.", "initial attack strategy and department policy.", "rehabilitation and decontamination procedures.", "primary water supply available and secondary water sources for drafting."], "a": 1}, {"n": 3, "p": "If the first arriving apparatus is at an incident where no fire is evident, the D/O should:", "pg": "124", "o": ["pull the apparatus past the front of the structure.", "pull the apparatus halfway into an exit route position.", "position the apparatus in front of the nearest fire hydrant.", "position the apparatus at least one block away from the structure."], "a": 0}, {"n": 4, "p": "What will assist the D/O in making informed decisions regarding fire apparatus positioning?", "pg": "125", "o": ["Vast knowledge of geolocalization", "Understanding of community demographics", "Preincident planning and district familiarization", "Contingency plan and budget limitation knowledge"], "a": 2}, {"n": 5, "p": "If there is an indication of a rescue situation, where should the fire apparatus be positioned?", "pg": "125", "o": ["In a place for most efficient deployment of all first responders", "In a place for most efficient deployment of all necessary equipment", "In a place that provides immediate access to a freeway that leads to hospitals", "In a place flat enough for a helicopter to land and help with victims' transportation"], "a": 1}, {"n": 6, "p": "When a D/O is positioning for exposure protection, consider the apparatus as a:", "pg": "125", "o": ["fixed exposure.", "potential exposure.", "static water supply.", "conductor of electricity."], "a": 1}, {"n": 7, "p": "If a confirmed fire is located in an area of limited access, the first-arriving apparatus pumper should consider:", "pg": "126", "o": ["laying a supply line.", "laying at least three attack lines.", "the deployment of portable water tanks.", "immediate activation of at least two elevated fire streams."], "a": 0}, {"n": 8, "p": "Only after a proper size-up confirms the location and extent of the fire can a pumper’s onboard tank be considered for:", "pg": "126", "o": ["water supply.", "relay operation.", "overhaul operations.", "decontamination operations."], "a": 0}, {"n": 9, "p": "To maximize efficiency in the deployment of hoselines, if possible the D/O should position the fire apparatus on/at the:", "pg": "126", "o": ["furthest fire hydrant from the fire scene.", "backside of the structure to attack from the rear.", "same side of the street so attack lines do not cross the road.", "opposite side of the street to remain safe from heat exposure."], "a": 2}, {"n": 10, "p": "If a structure is fewer than five floors tall, the placement of the attack pumper of an \"inside/outside\" method is:", "pg": "128", "o": ["to the side and outboard of the pumper.", "on the side of the street closest to the structure.", "spread far right of the aerial device on the same street.", "the opposite side of the street than the aerial apparatus."], "a": 1}, {"n": 11, "p": "If a structure is five or more floors tall, the attack pumper should be positioned _____ of the aerial.", "pg": "128", "o": ["in front", "at the rear", "on the outside", "on the sideboard"], "a": 2}, {"n": 12, "p": "When placing aerial apparatus alongside pumpers, D/Os need to consider the space needed for the spread of the:", "pg": "128", "o": ["aerial ladder and the aerial platform.", "portable lighting system and traffic cones.", "hoseline deployment system and the equipment compartment door.", "stabilizing system of the aerial apparatus and placement of its ground ladders."], "a": 3}, {"n": 13, "p": "Why must the pumper be positioned as close as possible to the aerial device when supporting aerial apparatus elevated waterways?", "pg": "129", "o": ["For better layout hose organization", "To minimize supply-line friction loss", "For more efficient use of available resources", "To save space so that other apparatus could be accommodated"], "a": 1}, {"n": 14, "p": "To efficiently supply an FDC, it is the D/Os responsibility to know the:", "pg": "129", "o": ["number of active responders on scene.", "number of apparatus dispatched to the incident.", "location of positions for FDCs, and their alternative supply.", "alternative aerial supply positions and location of hose streams."], "a": 2}, {"n": 15, "p": "For a quick and effective positioning of the apparatus to support decon activities, a D/O must follow:", "pg": "130", "o": ["AHJ protocols and procedures.", "common sense and experience.", "manufacturer recommendations.", "other fire departments' best practices."], "a": 0}, {"n": 16, "p": "What scene condition may require that a D/O position the apparatus at an incident location suitable for a showering area using a monitor appliance or similar device?", "pg": "130", "o": ["Responder rescue", "Mass rehabilitation", "Victim decontamination", "Apparatus decontamination"], "a": 2}, {"n": 17, "p": "When choosing drafting locations, preference should be given to hose locations that are accessible from a hard surface and that require the:", "pg": "131", "o": ["minimum length of hard intake hose or lift.", "maximum length of hard intake hose or lift.", "responders to don appropriate protective clothing.", "responders to don protective respiratory equipment."], "a": 0}, {"n": 18, "p": "What type of hydrant consists of an intake hose connection on the shore of a static water supply and a length of pipe extended into the water with a strainer on the end?", "pg": "132", "o": ["Dry", "Wet", "Yard", "Industrial"], "a": 0}, {"n": 19, "p": "The procedures for many fire departments require that the D/Os place _____ valves on the small-diameter discharges of dry barrel hydrants before connecting to the large-diameter discharge.", "pg": "132", "o": ["gate", "deluge", "siamese", "reductor"], "a": 0}, {"n": 20, "p": "To properly position the apparatus during a hydrant operation, D/Os must know the position of the _____ on their vehicle.", "pg": "132", "o": ["dump valve", "tank to pump valve", "pump to tank valve", "intake hose connection"], "a": 3}, {"n": 21, "p": "Why should a D/O need to ensure a hydrant is fully dressed?", "pg": "133", "o": ["To demonstrate that apparatus equipment is being used correctly", "To demonstrate the hydrant is appropriate for the apparatus’ GVWR", "To obtain the highest pressure outcome needed to equip the apparatus", "To obtain the maximum gallons-per-minute (gpm) output for the apparatus"], "a": 3}, {"n": 22, "p": "When a pumper has _____, the D/O must stop close to the curb with the pump intake a few feet short of being in line with the hydrant.", "pg": "133", "o": ["a mid-line intake", "hard suction hose", "side intake connectors", "a dual intake connection"], "a": 2}, {"n": 23, "p": "How are pumpers generally positioned during a dual-pumping operation?", "pg": "134", "o": ["Parked bumper-to-bumper", "In close proximity to one another", "In close proximity and parallel to one another", "At least 1½ apparatus lengths away from one another"], "a": 1}, {"n": 24, "p": "During duel pumping operations, if the supply line running between the apparatus is too long, the friction loss may cause:", "pg": "134", "o": ["high residual pressure and cavitation in the first pumper.", "low residual pressure and cavitation in the second pumper.", "low intake pressure in the large-diamete
